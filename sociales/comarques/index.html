// actualització automàtica en obrir la pàgina (motor/eines/actualitza.js): si el que es veu és una còpia vella, es recarrega sol
window.BN_ACT={arrel:"../../"};
// ===== ACTUALITZACIÓ AUTOMÀTICA (motor/eines/actualitza.js · el mateix codi a la portada i als mons; tot.py el copia a index.html) =====
// Cada pàgina porta escrita la versió amb què es va generar (VER: la hi posa motor/tot.py). En obrir la pàgina es pregunta
// al servidor quina versió hi ha publicada (versio.json, sense passar per cap memòria cau). Si no coincideixen, el que es veu
// és una còpia vella (memòria cau del navegador o del service worker). Llavors: s'esborren les còpies guardades de l'app
// (memòria cau «bn-…»), es demana al service worker que s'actualitzi i es torna a carregar la pàgina, UN sol cop per versió.
// MAI s'esborra el progrés, el nom ni el PIN (són a localStorage i no es toquen). Sense connexió, o obrint el fitxer a
// l'ordinador (file://), no fa res.
// En tornar a l'app després de més de 10 minuts amagada: a la portada recarrega sola; dins d'un món, com que el nen pot
// estar a mig test, només surt un avís amb un botó per actualitzar quan vulgui.
(function(){
 const C=window.BN_ACT||{},ARREL=C.arrel||"./",VER="db1ba349ce",KR="bn_act_recarrega",DEU=6e5;
 if(location.protocol==="file:"||VER.indexOf("__")===0||!window.fetch)return;
 let fet=0,amagat=0;
 const quan=f=>document.body?f():document.addEventListener("DOMContentLoaded",f);
 // esborra la memòria cau de l'app i fa que el service worker es descarregui de nou (màxim 3 s)
 const neteja=()=>Promise.race([Promise.all([
   window.caches?caches.keys().then(ks=>Promise.all(ks.filter(k=>k.indexOf("bn-")===0).map(k=>caches.delete(k)))).catch(()=>{}):0,
   navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.update().catch(()=>{})))).catch(()=>{}):0]),
  new Promise(r=>setTimeout(r,3000))]);
 function avis(txt,boto){quan(()=>{let a=document.getElementById("bnAct");
  if(!a){a=document.createElement("div");a.id="bnAct";a.setAttribute("role","status");
   a.style.cssText="position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:10px 14px;border-radius:14px;background:#0b1033f2;border:2px solid #facc15;color:#fff;font:800 14px/1.3 Nunito,system-ui,sans-serif;box-shadow:0 8px 24px #0009";
   document.body.appendChild(a)}
  a.innerHTML="";const t=document.createElement("span");t.textContent=txt;a.appendChild(t);
  if(boto){const b=document.createElement("button");b.type="button";b.textContent="Actualitza";
   b.style.cssText="font:900 13px Nunito,system-ui,sans-serif;color:#1e1b4b;background:#facc15;border:0;border-radius:999px;padding:8px 12px;cursor:pointer";
   b.onclick=()=>recarrega(boto,true);a.appendChild(b)}})}
 // l'adreça sense el «v=…» (la resta de paràmetres, com ?demo, es queden tal qual)
 const senseV=q=>q.replace(/([?&])v=[^&]*(&|$)/,(m,a,b)=>b?a:"").replace(/^\?$/,"");
 function recarrega(v,aMa){
  // una sola vegada per versió (si el servidor encara no serveix la nova, no entra en bucle); amb el botó, sempre
  if(!aMa){if(new RegExp("[?&]v="+v+"(&|$)").test(location.search))return;try{if(sessionStorage.getItem(KR)===v)return;sessionStorage.setItem(KR,v)}catch(e){}}
  avis("🔄 Versió nova de Bona Nota! Actualitzant…");
  const q=senseV(location.search);neteja().then(()=>location.replace(location.pathname+q+(q?"&":"?")+"v="+v+location.hash))}
 // un cop és la versió bona, treu el «?v=…» de l'adreça
 function netejaAdreca(){try{const q=senseV(location.search);if(q!==location.search)history.replaceState(history.state,"",location.pathname+q+location.hash)}catch(e){}}
 function comprova(auto){fet=Date.now();
  fetch(ARREL+"versio.json?t="+fet,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(!d||!d.v)return;
   if(d.v===VER){netejaAdreca();return}
   if(auto)recarrega(d.v);else avis("✨ Hi ha una versió nova de Bona Nota.",d.v)}).catch(()=>{})}
 comprova(true);
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){amagat=Date.now();return}
  if(amagat&&Date.now()-amagat>DEU&&Date.now()-fet>DEU)comprova(!!C.tornaAuto)});
 window.bnActualitza=()=>comprova(true); // per provar-ho a mà des de la consola
})();

<style>

// només pointerup, touchend, click i keydown. Per això hi ha UN sol AudioContext per pàgina (bnSo.context()) i es
// desbloqueja al primer d'aquests gestos: resume() + un buffer buit d'1 mostra (el truc d'iOS). Si el mòbil el posa en
// pausa («suspended» o «interrupted»: una trucada, canviar d'app…), es torna a engegar en tornar a la pàgina o al toc següent.
// IPHONE EN SILENCI (n2429, comprovat amb prova-so.html en un iPhone): amb el mòbil en silenci, Web Audio calla del tot encara
// que el context estigui «running», i navigator.audioSession no hi fa res. Un element <audio> sí que sona, i mentre n'hi ha un
// sonant, Web Audio també. Per això, a l'iPhone/iPad, al primer toc s'engega un <audio> de silenci en bucle (fet aquí mateix,

   if(mut.paused){const p=mut.play();if(p&&p.catch)p.catch(()=>arma())}}catch(e){}}

const BUIDES_N=new Set([...BUIDES].map(normT));
const obNet=t=>normT(String(t).replace(/<[^>]+>/g," ")).replace(/[^a-z0-9 ]/g," ");
const obParaules=t=>obNet(t).split(/\s+/).filter(Boolean);
const obArrels=t=>new Set(obParaules(t).filter(w=>w.length>=4).map(w=>w.slice(0,5)));
function ideaDetectada(punt,text,enunciat){const t=obArrels(text),e=obArrels(enunciat||"");
 // mates: si el punt clau porta nombres de 2 xifres o més (1.001, 144, 72…) que no surten a l'enunciat, val si el text els porta tots
 const nums=x=>(normT(String(x).replace(/<[^>]+>/g,"")).match(/\d+(?:[.,]\d{3})*/g)||[]).map(n=>n.replace(/[.,]/g,""));
 const en=new Set(nums(enunciat||"")),np=[...new Set(nums(punt).filter(n=>n.length>=2&&!en.has(n)))];if(np.length){const nt=new Set(nums(text));if(np.every(n=>nt.has(n)))return true}
 const totes=[...new Set(obParaules(punt).filter(w=>w.length>=5&&!BUIDES_N.has(w)).map(w=>w.slice(0,5)))];
 let claus=totes.filter(w=>!e.has(w));if(!claus.length)claus=totes;if(!claus.length)return false;
 return claus.filter(w=>t.has(w)).length>=Math.max(1,Math.ceil(claus.length*OB_IDEA))}
// quina part del text a són seqüències de 4 paraules que també són a b (0 a 1)
const obQuatre=t=>{const w=obParaules(t),s=new Set();for(let i=0;i+3<w.length;i++)s.add(w.slice(i,i+4).join(" "));return s};
function obCopia(a,b){const x=obQuatre(a),y=obQuatre(b);if(!x.size)return 0;let n=0;x.forEach(s=>{if(y.has(s))n++});return n/x.size}
// vocabulari del món: per distingir paraules reals de tecles a l'atzar (es calcula un sol cop)
let OB_VOCAB=null;function obVocab(){if(!OB_VOCAB){OB_VOCAB=obArrels(JSON.stringify([T,OB]));BUIDES_N.forEach(w=>OB_VOCAB.add(w.slice(0,5)))}return OB_VOCAB}
// torna null si el text és acceptable, o el motiu pel qual no ho és
function validaOberta(text,o){const w=obParaules(text);if(w.length<OB_MIN)return "curt";if(new Set(w).size<OB_DIF)return "repetit";
 const rar=w.filter(x=>/^[a-z]{3,}$/.test(x)&&(!/[aeiouy]/.test(x)||/(.)\1\1/.test(x)||/asdf|qwer|zxcv|hjkl/.test(x)));if(rar.length*100/w.length>30)return "sense";
 const g=w.filter(x=>x.length>=4&&/^[a-z]+$/.test(x)),v=obVocab(),k=g.filter(x=>v.has(x.slice(0,5))).length;if(g.length&&(!k||k*100/g.length<OB_CONEGUDES))return "sense";
 if(obCopia(text,o.q)>=OB_COPIA)return "enunciat";
 if(obCopia(text,o.m)>=OB_COPIA||obCopia(text,o.p.join(". "))>=OB_COPIA)return "copia";
 return null}
const OB_MOTIU={curt:`✏️ Escriu una mica més: com a mínim ${OB_MIN} paraules.`,repetit:"✏️ Has repetit les mateixes paraules. Explica-ho amb frases.",sense:"✏️ Això no semblen paraules. Explica-ho de veritat.",enunciat:"✏️ Això és l'enunciat de la pregunta. Respon-la amb les teves paraules.",copia:"✏️ Aquest text és una còpia de la resposta. Escriu-ho amb les teves paraules."};
// a les caselles de resposta no s'hi pot enganxar ni arrossegar text; torna una funció que diu quantes vegades s'ha intentat
function obProtegeix(ta,av){let n=0;const nega=e=>{e.preventDefault();n++;if(av)av.innerHTML=`<div class="fb ko">✏️ Aquí no es pot enganxar: escriu-ho amb les teves paraules.</div>`};ta.addEventListener("paste",nega);ta.addEventListener("drop",nega);return ()=>n}
// si ja ha vist la resposta model fa poc, torna fins a quin dia no puntua aquella pregunta
const obBloc=n=>{const d=(S.obv||{})[n];return d&&d>avui()?d:null};
// ✍️ triple combo (issue #14): obertes bones seguides el mateix dia i al mateix món. Bona = puntua, com a mínim el 60 % de les idees
// i explicada amb frases (obFrases). ×3 +3 ⭐, ×6 +5 ⭐ (i torna a 0), fins a OB_COMBO_MAX al dia. Si no arriba al 60 %, la ratxa torna a 0.
const OB_COMBO_PC=60,OB_COMBO_PREMIS={3:3,6:5},OB_COMBO_MAX=8,OB_PARAULES_IDEA=4;
const OB_CONNECTORS=new Set("es son perque que quan per aixo llavors tambe pero i o te tenen hi ha com amb fa fan si no porque cuando entonces tambien y tiene tienen hay como con hace hacen por para".split(" ").map(normT));
// frases i no una llista de paraules: prou paraules per idea (els números compten) i algun connector o el signe =
function obFrases(text,det){const w=obParaules(text);if(w.length<OB_PARAULES_IDEA*Math.max(1,det))return false;return w.some(x=>OB_CONNECTORS.has(x))||/=/.test(text)}
// estat: "bona" fa avançar la ratxa, "fluixa" la posa a 0 i "filtre" (bona però sense frases) no la toca; torna les ⭐ pagades
function obRatxa(estat){const e=diaEst();if(estat==="fluixa"){e.oc=0;desa();return 0}if(estat!=="bona")return 0;
 const oc=(e.oc||0)+1,pr=OB_COMBO_PREMIS[oc]||0,pag=Math.max(0,Math.min(pr,OB_COMBO_MAX-(e.ocp||0)));
 if(pag){e.ocp=(e.ocp||0)+pag;const f=FONT;FONT=["triple"];suma(pag);FONT=f}
 const ret=oc===2?["DOBLE ✍️✍️","una més i és triple!"]:oc===3?["TRIPLE COMBO ✍️✍️✍️",pag?`+${pag} ⭐`:"avui ja no dona ⭐"]:oc===6?["MEGA COMBO ✍️",pag?`+${pag} ⭐`:"avui ja no dona ⭐"]:null;
 if(ret)retolMissio(ret[0],ret[1],500);
 e.oc=oc>=6?0:oc;desa();return pag}


// ====================== PIN I PROGRÉS AL NÚVOL ======================
// Cada nom pot tenir un PIN (4 xifres + 1 lletra; els antics eren de 4 xifres). Amb el PIN, el progrés de cada món es guarda a Supabase
// i es pot recuperar en un altre dispositiu. Sense PIN tot funciona igual, però només en aquest dispositiu.
const SB_RPC=BN_LOG.url.replace("/bn_log","/rpc/");
function rpc(f,body,keep){return fetch(SB_RPC+f,{method:"POST",keepalive:!!keep,headers:{"apikey":BN_LOG.key,"Content-Type":"application/json"},body:JSON.stringify(body)})
 .then(async r=>{const t=await r.text();if(!r.ok){const m=/massa intents/.test(t)?"bloc":/pin incorrecte/.test(t)?"pin":/pin no valid/.test(t)?"pinfmt":/nom no permes/.test(t)?"nom":"xarxa";throw m}return t?JSON.parse(t):null})}
// PIN = 4 xifres + 1 lletra al final (ex. 4587R). Els PIN antics de 4 xifres encara serveixen per entrar,
// però en entrar es demana l'«actualització de seguretat» (pantallaNouPin).
const PIN_NOU=/^\d{4}[A-Z]$/,PIN_VELL=/^\d{4}$/,PIN_EX="4587R";
// neteja el que s'escriu: primer 4 xifres, després 1 lletra, sempre en MAJÚSCULES (encara que el teclat no ho estigui)
function netPin(v){let o="";for(const c of String(v).toUpperCase()){if(o.length<4){if(/\d/.test(c))o+=c}else if(/[A-Z]/.test(c)){o+=c;break}}return o}
const ATR_PIN=`class="pin-in" maxlength="5" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"`;
const pinVell=n=>PIN_VELL.test(pinDe(n)||"");

function pins(){try{return JSON.parse(localStorage.getItem("bn_pins")||"{}")||{}}catch(e){return {}}}
function pinDe(n){return pins()[(n||"").trim().toLowerCase()]||null}
function desaPin(n,p){const x=pins();x[n.trim().toLowerCase()]=p;try{localStorage.setItem("bn_pins",JSON.stringify(x))}catch(e){}}
// NUV_LLEST: ja s'ha baixat i fusionat el núvol en aquesta sessió. Fins llavors no es puja res: un aparell amb el progrés vell
// (p. ex. 71 ⭐ quan el núvol en té 366) el desaria per sobre amb l'hora d'ara (n2522, docs/TRAMPES.md)
let NUV_T=null,NUV_OK=null,NUV_LLEST=false;
function nuvolProg(){if(!S.nom||!pinDe(S.nom)||/^file:/.test(location.protocol))return;clearTimeout(NUV_T);NUV_T=setTimeout(()=>nuvolPuja(),8000)}
function nuvolPuja(keep,reintent){const p=pinDe(S.nom);if(!S.nom||!p||/^file:/.test(location.protocol))return Promise.resolve();clearTimeout(NUV_T);
 // encara no s'ha baixat el núvol: primer es baixa i es fusiona (si falla, no es puja res). En tancar la pàgina no hi ha temps: no es puja
 if(!NUV_LLEST){if(keep)return Promise.resolve();const n=S.nom;return nuvolBaixa(n,p).then(()=>{if(S.nom!==n)return;NUV_LLEST=true;return nuvolPuja()}).catch(()=>{})}
 return rpc("bn_progres_desa",{p_nom:S.nom,p_pin:p,p_assig:ASSIG.id,p_estat:S,p_mod:S.mod||Date.now()},keep).then(x=>{
  // -2 = el núvol té més estrelles que aquest aparell (un altre hi ha avançat): no s'ha desat; es baixa, es fusiona i es torna a pujar, un sol cop
  if(x===-2){if(reintent||keep)return;return nuvolBaixa(S.nom,p).then(nou=>{if(nou&&document.querySelector(".hero"))vista("inici");return nuvolPuja(false,true)})}
  // -1 = l'admin ha esborrat el progrés i aquest dispositiu encara no ho sabia: no s'ha desat; es baixa el núvol, que buida el d'aquí
  if(x===-1)return nuvolBaixa(S.nom,p).then(nou=>{if(nou&&document.querySelector(".hero"))vista("inici")});NUV_OK=Date.now()}).catch(()=>{})}

// FUSIONA dos progressos (dispositiu i núvol) sense perdre mai res: números → el més alt, llistes → la més llarga
// (dies: unió), sí/no → sí si algun és sí, textos → del més recent. Així un dispositiu nou (buit) no esborra el progrés d'un altre.
function fusiona(a,b){const nouA=(a&&a.mod||0)>=(b&&b.mod||0);
 const f=(x,y,k)=>{if(x===undefined||x===null)return y;if(y===undefined||y===null)return x;
  if(k==="est"&&typeof x==="object"&&typeof y==="object"&&x.d!==y.d)return String(x.d||"")>String(y.d||"")?x:y; // comptadors d'un altre dia: es queda el del dia més nou
  if(k==="dies"&&Array.isArray(x)&&Array.isArray(y))return [...new Set([...x,...y])].sort();
  if(Array.isArray(x)||Array.isArray(y))return (Array.isArray(x)?x:[]).length>=(Array.isArray(y)?y:[]).length?x:y;
  if(typeof x==="number"&&typeof y==="number")return Math.max(x,y);
  if(typeof x==="boolean"||typeof y==="boolean")return !!(x||y);
  if(typeof x==="object"&&typeof y==="object"){const o={};new Set([...Object.keys(x),...Object.keys(y)]).forEach(kk=>o[kk]=f(x[kk],y[kk],kk));return o}
  return nouA?x:y};
 const r=f(a||{},b||{},"");r.nom=(a&&a.nom)||(b&&b.nom)||"";r.mod=Math.max(a&&a.mod||0,b&&b.mod||0);return Object.assign(BUIT(),r)}
// REINICI des de l'admin (supabase/bn_admin_reinicia.sql): el núvol torna «reinici» (ms de l'últim esborrat d'aquest món o de tots).
// Si és més nou que el que coneix aquest dispositiu (S.reinici), PRIMER es buida aquí el progrés d'aquest món (es queden el nom i l'id)
// i només després es fusiona amb el núvol. Si no, fusiona() (que agafa sempre el més alt) faria tornar el progrés esborrat.
function aplicaReinici(r){const ri=+(r&&r.reinici)||0;if(ri<=(+S.reinici||0))return false;
 const n=S.nom,id=S.id;S=BUIT();S.nom=n;if(id)S.id=id;S.reinici=ri;S.mod=Date.now();guarda();return true}
// fusiona el que torna bn_progres_llegeix: reinici → progrés desat al núvol → registre reconstruït
function fusionaNuvol(r){const n=S.nom,reini=aplicaReinici(r);
 if(r&&r.estat)S=fusiona(S,Object.assign({},r.estat,{mod:r.mod}));
 if(r&&r.log)S=fusiona(S,Object.assign({},r.log,{mod:0})); // el registre reconstrueix estrelles, temps, temes i jocs encara que es perdi el dispositiu
 S.nom=n;return reini}
// baixa el progrés del núvol i el fusiona amb el d'aquest dispositiu
function nuvolBaixa(nom,pin){return rpc("bn_progres_llegeix",{p_nom:nom,p_pin:pin,p_assig:ASSIG.id}).then(r=>{
 if(!r)return false;const abans=JSON.stringify([S.punts,S.temes,S.ob,S.jocs,S.temps]);
 const reini=fusionaNuvol(r);if(!reini&&!r.estat&&!r.log)return false;
 S.mod=Date.now();guarda();pintaCap();
 return reini||JSON.stringify([S.punts,S.temes,S.ob,S.jocs,S.temps])!==abans})}

// ====================== ACCESSIBILITAT I DRECERES DE TECLAT ======================
document.addEventListener("keydown",e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const tg=e.target,enCamp=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
 // 1) Elements amb role="button" i tabindex="0" (tiles, xips, targetes, files de taula…)
 if(!enCamp&&(e.key==="Enter"||e.key===" ")&&tg&&tg.getAttribute&&tg.getAttribute("role")==="button"&&tg.tagName!=="BUTTON"){
  e.preventDefault();tg.click();return;
 }
 // 2) Tancar popups / pantalles superposades amb Escape o Enter/Espai a .arc
 if(e.key==="Escape"){
  const pop=document.getElementById("popEst");if(pop){e.preventDefault();tancaEstrelles();const bt=document.getElementById("punts");if(bt)bt.focus();return}
  const arc=document.querySelector(".arc");if(arc){e.preventDefault();arc.click();return}
  const desc=document.getElementById("dSalta");if(desc){e.preventDefault();desc.click();return}
 }
 const arc=document.querySelector(".arc");
 if(arc&&(e.key==="Enter"||e.key===" ")){e.preventDefault();arc.click();return}
 if(enCamp)return;
 // 3) Si la pissarra està oberta o hi ha el taller de mates amb el seu propi teclat, no interferir
 const pis=document.getElementById("pisCapa");if(pis&&pis.classList.contains("on"))return;
 if(document.querySelector(".mx-tec"))return;
 // 4) Targetes (flashcards): Espai / ↑ / ↓ gira; ← / → passa targeta
 const fl=document.querySelector("#zona .flash");
 if(fl){
  if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();fl.click();return}
  if(e.key==="ArrowLeft"){const b=document.getElementById("fcAnt");if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(e.key==="ArrowRight"){const b=document.getElementById("fcSeg");if(b&&!b.disabled){e.preventDefault();b.click()}return}
 }
 // 5) Tests, Exàmens i Repàs: 1/2/3 o A/B/C selecciona opció; Enter o → avança; P demana pista
 const k=e.key.toUpperCase();
 const idx={"1":0,"2":1,"3":2,"A":0,"B":1,"C":2}[k];
 if(idx!==undefined){
  const germs=[...document.querySelectorAll(".opt.germ:not(:disabled)")];
  if(germs[idx]){e.preventDefault();germs[idx].click();return}
  const opts=[...document.querySelectorAll(".opt:not(.germ):not(:disabled):not(.fora)")];
  if(opts[idx]){e.preventDefault();opts[idx].click();return}
 }
 if(k==="P"){
  const bp=document.getElementById("pista");if(bp&&bp.offsetParent!==null){e.preventDefault();bp.click();return}
 }
 if(e.key==="Enter"||e.key==="ArrowRight"){
  const sg=document.getElementById("seg")||document.getElementById("exSeg")||document.getElementById("jgSeg");
  if(sg&&!sg.disabled){e.preventDefault();sg.click();return}
 }
 if(e.key==="ArrowLeft"){
  const ant=document.getElementById("exAnt");
  if(ant&&!ant.disabled){e.preventDefault();ant.click();return}
 }
});
