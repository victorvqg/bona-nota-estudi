<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Socials — Tema 3: El clima · 1r ESO | Bona Nota</title>
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#1e3a8a">
<link rel="apple-touch-icon" href="../../icones/icona-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bona Nota">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
 --fosc:#1f2d3d;--blau:#3b82f6;--blau2:#2563eb;--verd:#16a34a;--verd-cl:#dcfce7;--verm:#dc2626;--verm-cl:#fee2e2;
 --groc:#f59e0b;--groc-cl:#fef3c7;--lila:#7c3aed;--fons:#eef2f8;--card:#fff;--txt:#1e293b;--suau:#64748b;--vora:#e2e8f0;
 --r:18px;--om:0 1px 2px #0f172a0d,0 6px 18px #0f172a12;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,Arial,sans-serif;background:var(--fons);color:var(--txt);font-size:16.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
/* capçalera */
header{background:linear-gradient(120deg,var(--g1,#1e3a8a),var(--g2,#2563eb) 55%,var(--g3,#0ea5e9));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 14px #1e3a8a40}
.hd{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .tt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.logo .tt small{font-size:13px;font-weight:700;opacity:.85}
@media(max-width:520px){.logo{font-size:16px}.logo #hola{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
.benv .tema{margin:4px 0 0;font-weight:900;color:var(--blau2)}
.pill{background:#ffffff26;border:1px solid #ffffff40;padding:5px 12px;border-radius:999px;font-weight:800;white-space:nowrap}
nav{max-width:960px;margin:0 auto;padding:0 10px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;color:#dbeafe;padding:7px 13px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap;font-size:15px}
nav button.on{background:#fff;color:var(--blau2)}
nav a.surt{display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-weight:900;font-size:15px;padding:5px 12px;border-radius:999px;border:2px solid #ffffff66;white-space:nowrap;margin-right:4px}
nav a.surt:hover,nav a.surt:focus-visible{background:#ffffff26;border-color:#fff;outline:none}
.surt-gran{display:block;text-align:center;margin-top:16px;color:var(--suau);font-weight:800;text-decoration:none}
.surt-gran:hover{color:var(--blau2)}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
/* elements bàsics */
h2.sec{font-size:21px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
.box{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--om);margin-bottom:14px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--blau);color:#fff;box-shadow:0 3px 0 var(--blau2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blau2)}
.btn.sec{background:#fff;color:var(--fosc);box-shadow:0 0 0 2px var(--vora) inset,0 3px 0 var(--vora)}
.btn.verd{background:var(--verd);box-shadow:0 3px 0 #15803d}
.btn.verm{background:var(--verm);box-shadow:0 3px 0 #991b1b}
.btn:disabled{opacity:.45;cursor:default}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.prog{color:var(--suau);font-size:14.5px;font-weight:700}
/* hero */
.hero{background:linear-gradient(135deg,#fff,#eff6ff);border-radius:22px;padding:20px 22px;box-shadow:var(--om);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .av{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.hero h1{margin:0;font-size:24px}
.hero p{margin:2px 0 0;color:var(--suau)}
.hero .stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.mini{background:#fff;border:2px solid var(--vora);border-radius:14px;padding:6px 12px;text-align:center;min-width:78px}
.mini b{display:block;font-size:20px;line-height:1.2}
.mini small{color:var(--suau);font-weight:700;font-size:12px}
.continua{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--groc-cl);border:2px solid #fcd34d;border-radius:16px;padding:12px 16px;cursor:pointer}
.continua b{flex:1}
/* graella de temes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--om);transition:transform .15s,box-shadow .15s;position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0f172a1f}
.tile .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
.tile b{font-size:16.5px;line-height:1.25}
.tile small{color:var(--suau);font-weight:600}
.tile .peu{margin-top:auto;display:flex;align-items:center;gap:8px}
.barra{flex:1;height:8px;background:#eef2f7;border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#22c55e,#16a34a)}
.pc{font-size:13px;font-weight:800;color:var(--suau);min-width:34px;text-align:right}
.segell{position:absolute;top:12px;right:12px;font-size:20px}
.num{position:absolute;top:14px;right:14px;font-size:12px;font-weight:900;color:#94a3b8}
.etq{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#4338ca}
.etq.ap{background:#ecfdf5;color:#047857}
/* pantalla tema */
.cap-tema{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.cap-tema .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.cap-tema h2{margin:0;font-size:22px;line-height:1.2}
.passos{display:flex;gap:8px;margin:12px 0 16px}
.passos button{flex:1;border:0;background:#fff;border-radius:14px;padding:10px 6px;font-weight:800;cursor:pointer;color:var(--suau);box-shadow:var(--om);font-size:15px}
.passos button.on{background:var(--fosc);color:#fff}
.passos button.fet::after{content:" ✓";color:#22c55e}
.idea{background:var(--verd-cl);border:2px solid #86efac;border-radius:14px;padding:12px 16px;font-weight:800}
.idea small{display:block;font-size:11.5px;letter-spacing:.6px;color:#15803d;font-weight:900}
.truc{background:var(--groc-cl);border:2px solid #fcd34d;border-radius:14px;padding:12px 16px;margin-top:12px}
.compte{background:var(--verm-cl);border-left:6px solid var(--verm);border-radius:0 14px 14px 0;padding:10px 14px;margin-top:12px}
ul.pts{padding-left:0;list-style:none;margin:14px 0 0}
ul.pts li{position:relative;padding:8px 0 8px 30px;border-bottom:1px dashed var(--vora)}
ul.pts li:last-child{border-bottom:0}
ul.pts li::before{content:"";position:absolute;left:6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--blau)}
/* targetes */
.flash{perspective:1000px;height:240px;cursor:pointer;margin:12px auto;max-width:540px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flash.gir .in{transform:rotateY(180deg)}
.flash .cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;font-weight:800;box-shadow:0 10px 26px #0f172a22}
.flash .davant{background:#fff;border:3px solid #bfdbfe}
.flash .darrere{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;transform:rotateY(180deg);font-weight:700;font-size:18.5px}
.flash .cara small{position:absolute;bottom:12px;font-size:12.5px;font-weight:700;opacity:.6}
.punts-fc{display:flex;justify-content:center;gap:6px;margin-top:4px}
.punts-fc i{width:9px;height:9px;border-radius:50%;background:#cbd5e1}
.punts-fc i.on{background:var(--blau);transform:scale(1.3)}
/* test */
.pregunta{font-size:19px;font-weight:800;margin:8px 0 12px;line-height:1.35}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--vora);background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16.5px;cursor:pointer;transition:border-color .12s,background .12s;color:var(--txt)}
.opt .ll{width:30px;height:30px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;color:var(--suau)}
.opt:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}
.opt.ok{background:var(--verd-cl);border-color:#22c55e}.opt.ok .ll{background:#22c55e;color:#fff}
.opt.ko{background:var(--verm-cl);border-color:#ef4444}.opt.ko .ll{background:#ef4444;color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:#eff6ff;border:2px solid #bfdbfe}
.fb.ok{background:var(--verd-cl);border-color:#86efac}.fb.ko{background:#fff7ed;border-color:#fdba74}
.barra-test{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.barra-test i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .3s}
.gran{font-size:56px;text-align:center;line-height:1}
.valor{display:flex;justify-content:center;gap:12px;margin-top:10px}
.valor button{border:2px solid var(--vora);background:#fff;border-radius:16px;padding:10px 14px;font-size:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.valor button small{font-size:12.5px;font-weight:800;color:var(--suau)}
.valor button.on{border-color:var(--blau);background:#eff6ff}
/* jocs */
.chip{display:inline-block;border:2px solid #cbd5e1;border-radius:12px;padding:9px 14px;margin:5px;cursor:pointer;background:#fff;font-weight:800;user-select:none;transition:.12s}
.chip:hover{border-color:#93c5fd}
.chip.sel{background:var(--fosc);border-color:var(--fosc);color:#fff}
.chip.ok{background:var(--verd);border-color:var(--verd);color:#fff;cursor:default}
.chip.ko{animation:tremola .35s;border-color:#ef4444}
@keyframes tremola{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pila{display:flex;flex-direction:column-reverse;gap:5px;margin:12px 0}
.pila div{border-radius:12px;padding:10px 14px;font-weight:800;animation:apareix .3s}
@keyframes apareix{from{opacity:0;transform:translateY(8px)}}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.mh{display:none}table.an{font-size:14px}.col2{grid-template-columns:1fr}.hero .stats{margin-left:0}}
.cub{border:3px dashed #cbd5e1;border-radius:16px;min-height:110px;padding:10px;cursor:pointer;background:#f8fafc}
.cub:hover{border-color:#93c5fd;background:#f0f7ff}
.cub h4{margin:0 0 8px}
textarea{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--vora);resize:vertical;background:#fcfdff}
textarea:focus,input:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 4px #bfdbfe66}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer;padding:8px 10px;border-radius:10px;background:#fff;border:2px solid var(--vora)}
label.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--verd)}
details summary{cursor:pointer;font-weight:800;color:var(--blau2)}
/* benvinguda */
.benv{max-width:460px;margin:30px auto;text-align:center}
.benv .gran{font-size:70px}
.benv input{width:100%;font:inherit;font-size:20px;font-weight:800;text-align:center;padding:14px;border-radius:16px;border:3px solid var(--vora);margin:14px 0}
/* analítica */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--om)}
.kpi small{color:var(--suau);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:26px;line-height:1.2;margin-top:2px}
.kpi span{font-size:13px;color:var(--suau);font-weight:700}
table.an{width:100%;border-collapse:collapse;font-size:15px}
table.an th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--suau);padding:8px 6px;border-bottom:2px solid var(--vora)}
table.an td{padding:9px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.semaf{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.valoracio{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:2px solid #c7d2fe;border-radius:18px;padding:16px 18px}
.valoracio h3{margin:0 0 6px}
.llista-err li{margin:6px 0}
.modal{position:fixed;inset:0;background:#0f172a80;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{max-width:420px;text-align:center}
.peu-pag{text-align:center;color:#94a3b8;font-size:13px;margin:26px 0 8px}
.confeti{position:fixed;top:-20px;font-size:22px;z-index:60;pointer-events:none;animation:cau 1.8s linear forwards}
@keyframes cau{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

.perfils{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.perfil{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--vora);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;font-family:inherit;font-size:16px;color:var(--txt)}
.perfil:hover{border-color:#93c5fd;background:#f8fbff}.perfil.on{border-color:var(--blau)}
.perfil small{display:block;color:var(--suau);font-weight:700}
.av2{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;text-transform:uppercase}
/* arcade */
.arc{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#1e1b4b,#020617 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;animation:arcIn .25s ease-out;overflow:hidden}
@keyframes arcIn{from{opacity:0;transform:scale(1.15)}}
.arc canvas{position:absolute;inset:0;width:100%;height:100%}
.arc .flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.arc .t1{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(22px,7vw,46px);color:#facc15;text-shadow:4px 4px 0 #b91c1c,0 0 24px #facc15aa;text-align:center;line-height:1.35;animation:bota .6s cubic-bezier(.3,1.6,.5,1) both,pampalluga 1s steps(2) .6s infinite}
@keyframes bota{from{transform:translateY(-120px) scale(.4)}}
@keyframes pampalluga{50%{color:#fde68a}}
.arc .t2{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.4vw,18px);color:#a5f3fc;margin-top:22px;text-align:center;line-height:1.8}
.arc .t3{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(28px,9vw,54px);color:#fff;margin-top:14px;text-shadow:0 0 18px #38bdf8}
.arc .estr{position:relative;font-size:clamp(34px,10vw,56px);margin-top:10px;letter-spacing:6px}
.arc .estr span{display:inline-block;animation:estr .45s cubic-bezier(.3,1.8,.5,1) both;filter:drop-shadow(0 0 10px #facc15)}
@keyframes estr{from{transform:scale(0) rotate(-180deg)}}
.arc .t4{position:relative;font-family:'Press Start 2P',monospace;font-size:11px;color:#94a3b8;margin-top:26px;animation:pampalluga2 1.2s steps(2) infinite}
@keyframes pampalluga2{50%{opacity:0}}
.arc .rec{position:relative;font-family:'Press Start 2P',monospace;font-size:12px;color:#020617;background:#4ade80;padding:8px 12px;margin-top:16px;transform:rotate(-3deg);animation:bota .5s .9s both}
.nivell{margin-top:14px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#f5f3ff,#eef2ff);border:2px solid #c4b5fd;border-radius:16px;padding:12px 16px;cursor:pointer}
.nivell .nic{font-size:38px;line-height:1;flex:none}
.nivell b{display:block;font-size:17px}
.nivell small{color:var(--suau);font-weight:700}
.nivell .barra{margin:6px 0 4px;height:10px}
.nivell .barra i{background:linear-gradient(90deg,#a78bfa,#7c3aed)}
.rangs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rang{border:2px solid var(--vora);border-radius:14px;padding:10px 8px;text-align:center;background:#fff}
.rang span{display:block;font-size:30px;line-height:1.1}
.rang b{display:block;font-size:14px}
.rang small{color:var(--suau);font-weight:700;font-size:12px}
.rang.bloc{opacity:.45;filter:grayscale(1)}
.rang.ara{border-color:#7c3aed;background:#f5f3ff;box-shadow:0 0 0 3px #ddd6fe}
.arc.niv{background:radial-gradient(circle at 50% 40%,#3b0764,#020617 75%)}
.arc.niv .t1{color:#e9d5ff;text-shadow:4px 4px 0 #7c3aed,0 0 24px #c084fcaa}
.arc.niv .nic{position:relative;font-size:clamp(64px,20vw,110px);margin-top:12px;animation:estr .6s cubic-bezier(.3,1.8,.5,1) .3s both;filter:drop-shadow(0 0 18px #c084fc)}
.vol{display:flex;align-items:center;gap:4px;background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:2px 10px 2px 4px;flex:none}
.so-btn{background:none;border:0;color:#fff;font-size:17px;cursor:pointer;padding:3px 4px;line-height:1}
.vol input{width:76px;accent-color:#fff;cursor:pointer;margin:0}
.vol b{font-size:13px;min-width:9px;text-align:center}
@media(max-width:520px){.vol input{width:54px}.vol{padding-right:7px}}
body.tremola main{animation:tremola .4s}
.arc.ko{background:radial-gradient(circle at 50% 40%,#3b0a0a,#0b0202 75%)}
.arc.ko .t1{color:#f87171;text-shadow:4px 4px 0 #450a0a,0 0 20px #ef444466;animation:cau1 .7s cubic-bezier(.5,1.8,.5,1) both,parpelleja 1.4s steps(2) .8s infinite}
@keyframes cau1{from{transform:translateY(-140px) rotate(-8deg);opacity:0}}
@keyframes parpelleja{50%{opacity:.55}}
.arc.ko .t3{color:#fca5a5;text-shadow:none}
.arc.ko .cor{position:relative;font-size:clamp(44px,13vw,70px);margin-top:8px;animation:trenca 1.1s ease-in .4s both}
@keyframes trenca{0%{transform:scale(0)}35%{transform:scale(1.2)}55%{transform:scale(1) rotate(0)}70%{transform:rotate(-12deg)}85%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.arc.ko .t2{color:#fde68a}
.pluja{position:absolute;top:-30px;width:3px;height:22px;background:linear-gradient(#94a3b800,#94a3b8aa);animation:plou linear infinite}
@keyframes plou{to{transform:translateY(110vh)}}
/* estrelles: d'on venen + animació arcade */
.vola{position:fixed;z-index:90;pointer-events:none;font-family:'Press Start 2P',monospace;font-size:15px;color:#facc15;text-shadow:2px 2px 0 #92400e,0 0 12px #fde047;white-space:nowrap;transition:transform .75s cubic-bezier(.5,-.4,.6,1),opacity .75s ease-in;will-change:transform}
.vola.puja{animation:vpop .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes vpop{from{transform:scale(.2)}}
.espurna{position:fixed;z-index:89;pointer-events:none;width:6px;height:6px;background:#facc15;box-shadow:0 0 6px #fde047;transition:transform .5s ease-out,opacity .5s ease-out}
#punts.boing{animation:boing .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{30%{transform:scale(1.35) rotate(-6deg);background:#facc15;color:#422006}}

 compte:"1 L/m² i 1 mm de pluja són el mateix.",
 fc:[["Quins són els 5 elements del clima?","Temperatura, precipitació, humitat, pressió i vent."],["Quins són els 3 factors del clima?","Latitud, altitud i distància al mar."],["Amb què es mesura la humitat?","Amb l'higròmetre (en %)."],["Amb què es mesura la pluja?","Amb el pluviòmetre (L/m² o mm)."],["Quants graus baixa la temperatura cada 1 000 m?","Uns 6 °C."],["Quantes zones climàtiques hi ha?","5: una càlida, dues temperades i dues fredes."]],
 q:[["A la platja fa 21 °C. Al cim de 2 000 m farà més o menys…", ["9 °C", "15 °C", "27 °C"], 0, "Perds uns 6 °C cada 1 000 m: 21 − 12 = 9 °C."], ["Amb quin aparell es mesura la humitat?", ["Higròmetre (en %)", "Baròmetre", "Anemòmetre"], 0, "Amb l'higròmetre, que la dona en %."], ["Com més a prop de l'equador…", ["menys calor fa", "més calor fa", "més fred fa"], 1, "La latitud mana: a prop de l'equador fa més calor."], ["El vapor d'aigua es refreda i fa núvols. Com es diu?", ["Evaporació", "Precipitació", "Condensació"], 2, "És la condensació: el vapor es refreda i forma els núvols."], ["Quins són els tres factors del clima?", ["Latitud, altitud i distància al mar", "Temperatura, pressió i vent", "Latitud, humitat i distància al mar"], 0, "Són LAD: Latitud, Altitud i Distància al mar. La temperatura, la pressió i la humitat són elements."], ["Un pluviòmetre mesura…", ["la humitat, en %", "la pluja, en mm", "la pressió, en hPa"], 1, "El pluviòmetre mesura la pluja, en mm o L/m²."], ["Han caigut 10 L/m² de pluja. Quants mm són?", ["10 mm, és el mateix", "1 mm", "100 mm"], 0, "1 L/m² i 1 mm de pluja són el mateix, així que són 10 mm."], ["Comptant els dos hemisferis, quantes zones climàtiques té la Terra?", ["2 zones", "4 zones", "5 zones climàtiques"], 2, "Són 5: una càlida, dues temperades i dues fredes. Compte: són 3 tipus de zona (càlida, temperada i freda), però la temperada i la freda surten repetides, una a cada hemisferi."]]},

{id:"pressio",ic:"💨",col:"#16A085",titol:"La pressió i el vent",font:"Llibre · secció 4B",
 idea:"L'aire calent puja i fa baixes pressions (pluja); l'aire fred baixa i fa altes pressions (sol). El vent va de les altes a les baixes pressions.",
 pts:["<b>Pressió</b>: força que fa l'aire. Baròmetre, hectopascals (hPa). Al nivell del mar: <b>1 013 hPa</b>.","Com més amunt, <b>menys pressió</b>.","Aire <b>calent</b> → puja → <b>baixes pressions (D, borrasca)</b> → núvols i pluja.","Aire <b>fred</b> → baixa → <b>altes pressions (A, anticicló)</b> → cel clar.","<b>Vent</b>: aire en moviment, de les <b>A</b> cap a les <b>D</b>. Velocitat: anemòmetre (km/h). Direcció: penell.","Tipus: <b>planetaris</b> (alisis), <b>estacionals</b> (monsons), <b>locals</b> (tramuntana, garbí)."],
 truc:"<b>Calent → Cap amunt → Cau aigua</b> (tres C = borrasca). El vent és com un globus que es desinfla: surt d'on està apretat.",
 compte:"Tots els aparells acaben en -metre menys el <b>penell</b>, que només assenyala d'on ve el vent.",
 fc:[["Amb què es mesura la pressió?","Amb el baròmetre, en hPa."],["Quina és la pressió normal al nivell del mar?","1 013 hPa."],["L'aire calent fa altes o baixes pressions?","Baixes pressions (borrasca)."],["D'on cap a on bufa el vent?","De les altes pressions cap a les baixes."],["Amb què es mesura la velocitat del vent?","Amb l'anemòmetre (km/h)."],["Digues un vent local de Catalunya","La tramuntana o el garbí."]],
 q:[["Una borrasca porta…", ["cel clar i sec", "núvols i pluja", "vent del nord"], 1, "Les baixes pressions (borrasca) porten temps inestable: núvols i pluja."], ["El vent bufa…", ["de les altes a les baixes pressions", "de les baixes a les altes", "sempre del nord cap al sud"], 0, "Sempre va de les A cap a les D, com l'aire que surt d'un globus."], ["Quin aparell indica la direcció del vent?", ["El pluviòmetre", "El termòmetre", "El penell"], 2, "El penell: és l'únic que no acaba en -metre i assenyala d'on ve el vent."], ["Els alisis són vents…", ["locals", "estacionals", "planetaris"], 2, "Els alisis són planetaris; els monsons, estacionals, i la tramuntana, local."], ["Quina és la pressió normal al nivell del mar?", ["1 013 hPa (hectopascals)", "1 310 hPa", "913 hPa"], 0, "Al nivell del mar, la pressió normal és de 1 013 hPa."], ["L'aire calent puja i fa…", ["altes pressions (anticicló)", "baixes pressions (borrasca)", "vent de tramuntana"], 1, "Calent → cap amunt → cau aigua: baixes pressions, borrasca."], ["Com més amunt pugem, la pressió…", ["puja molt", "baixa", "es queda igual"], 1, "Com més amunt, menys aire a sobre i, per tant, menys pressió."], ["Amb quin aparell es mesura la velocitat del vent?", ["Anemòmetre (en km/h)", "Pluviòmetre", "Penell"], 0, "Amb l'anemòmetre, en km/h; el penell només indica la direcció."]]},

{id:"mapes",ic:"🗺️",col:"#2980B9",titol:"Els mapes del temps",font:"Llibre · secció 5",
 idea:"Un mapa del temps mostra anticiclons (A), depressions (D) i fronts. Amb això es pot predir el temps.",
 pts:["<b>Isòbares</b>: línies que uneixen punts amb la mateixa pressió.","<b>Anticicló (A)</b>: pressió alta al centre, gira com les agulles del rellotge, temps estable.","<b>Depressió (D)</b>: pressió baixa al centre, gira al revés, temps inestable.","<b>Front</b>: xoc de dues masses d'aire. Sempre porta precipitacions.","<b>Front fred</b>: triangles blaus. <b>Front càlid</b>: semicercles vermells. <b>Oclús</b>: barrejats, lila.","Isòbares <b>molt juntes</b> = vent <b>fort</b>.","La fletxa del vent indica <b>d'on ve</b> el vent."],
 truc:"<b>A</b>nticicló = <b>A</b>gulles del rellotge i <b>A</b>ssolellat. <b>D</b>epressió = <b>D</b>iluvi. El fred té punxes (caramells de gel); el càlid, rodones (sol).",
 compte:"«Vent del nord» vol dir que <b>ve</b> del nord, no que hi va.",
 fc:[["Què és una isòbara?","Una línia que uneix punts amb la mateixa pressió."],["Com es dibuixa un front fred?","Amb triangles blaus."],["Com es dibuixa un front càlid?","Amb semicercles vermells."],["Quin temps fa amb un anticicló?","Estable, sense pluja."],["Què vol dir que les isòbares estiguin molt juntes?","Que bufa vent fort."],["Què és un front oclús?","La unió d'un front fred i un de càlid."]],
 q:[["Si veus una «A» al mapa, quin temps farà?", ["Temps estable i assolellat", "Pluja i tempesta", "Núvols i ruixats"], 0, "Una A és un anticicló: temps estable i assolellat."], ["Els triangles blaus són…", ["un front càlid", "un anticicló", "un front fred"], 2, "El front fred té punxes blaves, com caramells de gel."], ["On bufarà més fort el vent?", ["On les isòbares estan separades", "On les isòbares estan juntes", "On no hi ha isòbares"], 1, "Isòbares molt juntes vol dir vent fort."], ["A l'hemisferi nord, una depressió gira…", ["com les agulles del rellotge", "al revés de les agulles", "sempre cap al nord"], 1, "La depressió gira al revés de les agulles; l'anticicló, com les agulles."], ["Què és una isòbara?", ["Una línia que uneix punts amb la mateixa pressió", "Una línia amb la mateixa temperatura", "Una línia que marca un front fred"], 0, "Iso- vol dir «igual»: la isòbara uneix punts amb la mateixa pressió."], ["Com es dibuixa un front càlid?", ["Amb triangles blaus", "Amb semicercles lila i blaus", "Amb semicercles vermells"], 2, "El càlid té rodones vermelles, com el sol. Els triangles blaus són del fred."], ["Al mapa, un «vent del nord» vol dir que el vent…", ["va cap al nord", "ve del nord", "gira cap al nord"], 1, "El nom del vent diu d'on ve, no cap on va."], ["Un front sempre porta…", ["precipitacions (pluja o neu)", "cel clar", "altes pressions"], 0, "Un front és el xoc de dues masses d'aire i sempre porta precipitacions."]]},

{id:"canvi",ic:"🔥",col:"#C0392B",titol:"Efecte d'hivernacle i canvi climàtic",font:"Llibre · seccions 6 i 7",
 idea:"L'efecte d'hivernacle és natural (gràcies a ell la Terra té 14 °C), però hem llançat massa CO₂ i el planeta s'escalfa.",
 pts:["El Sol escalfa el sòl; un 30 % de l'energia es reflecteix.","Els <b>gasos d'efecte d'hivernacle</b> (CO₂, metà, gasos fluorats) atrapen part de la calor.","Sense ell, la Terra seria gelada: de mitjana tenim <b>14 °C</b>.","El <b>CO₂</b> surt de cremar <b>petroli i carbó</b> (indústria, transport, calefaccions), dels incendis i de talar boscos.","Més gasos → s'escapa menys calor → <b>escalfament global</b> → <b>canvi climàtic</b>.","Conseqüències: inundacions, desertificació, glaceres que es fonen, huracans.","Cimeres: <b>Kyoto 1997</b>, <b>París 2015</b> (2 °C), <b>Madrid 2019</b>, <b>Glasgow 2021</b> (1,5 °C). <b>ODS 13</b>: Acció pel clima."],
 truc:"L'efecte d'hivernacle és una <b>manta</b>: una va bé, cinc et fan suar. Gasos: «<b>C</b>om <b>M</b>és <b>F</b>um» (CO₂, Metà, Fluorats). Cimeres: «<b>Ki-Pa-Ma-Gla</b>».",
 compte:"L'ozó NO és un gas d'efecte d'hivernacle del llibre: ozó = capa protectora; hivernacle = CO₂, metà i fluorats.",
 fc:[["Quina temperatura mitjana té la Terra gràcies a l'efecte d'hivernacle?","14 °C."],["Quin és el principal gas que emetem?","El diòxid de carboni (CO₂)."],["D'on surt el CO₂?","De cremar petroli i carbó (indústria, transport, calefaccions)."],["Què es va acordar a París (2015)?","Que la temperatura no pugi més de 2 °C."],["I a Glasgow (2021)?","Quedar per sota d'1,5 °C."],["Què és l'ODS 13?","Acció pel clima."]],
 q:[["Quin d'aquests és un gas d'efecte d'hivernacle?", ["Ozó", "Metà", "Nitrogen"], 1, "El metà, amb el CO₂ i els gasos fluorats. L'ozó és la capa protectora."], ["L'efecte d'hivernacle natural és…", ["necessari", "sempre dolent", "un invent humà"], 0, "És necessari: gràcies a ell la Terra té 14 °C de mitjana."], ["Quina cimera va ser la primera?", ["París", "Glasgow", "Kyoto (1997)"], 2, "Kyoto, el 1997. Recorda «Ki-Pa-Ma-Gla»."], ["Talar boscos fa que…", ["hi hagi menys CO₂", "no canviï res", "hi hagi més CO₂"], 2, "Talar boscos és una de les causes de l'augment de CO₂."], ["Quina temperatura mitjana té la Terra gràcies a l'efecte d'hivernacle?", ["Uns 14 °C", "4 °C", "24 °C"], 0, "Uns 14 °C; sense aquesta «manta», la Terra seria gelada."], ["Què es va acordar a la cimera de París (2015)?", ["Que la temperatura no pugi més d'1,5 °C", "Que la temperatura no pugi més de 2 °C", "Prohibir els cotxes de gasolina"], 1, "A París es va fixar el límit de 2 °C; l'1,5 °C és de Glasgow (2021)."], ["D'on surt la major part del CO₂ que emetem?", ["De la capa d'ozó", "De la respiració dels arbres", "De cremar petroli i carbó"], 2, "Surt de cremar petroli i carbó: indústria, transport i calefaccions."], ["Quin és l'ODS que parla de l'acció pel clima?", ["ODS 3", "ODS 13", "ODS 15"], 1, "L'ODS 13 és «Acció pel clima»."]]},

{id:"relleu",ic:"🏔️",col:"#7F8C8D",titol:"El relleu de l'Anoia",font:"Apunts · geografia",
 idea:"El relleu és el resultat de forces internes (aixequen) i externes (desgasten). La conca d'Òdena és un «bol» excavat; la Tossa és una muntanya resistent.",
 pts:["<b>Relleu</b>: conjunt de formes de l'escorça de la Terra.","<b>Forces internes</b>: les plaques tectòniques es mouen i aixequen serralades.","<b>Forces externes</b>: aigua, vent, pluja i gel desgasten les roques: <b>erosió</b>.","<b>Conca d'Òdena</b>: depressió (zona més baixa) excavada en roques toves (<b>argiles i guixos</b>). Igualada és al fons.","<b>Tossa de Montbui</b> (~620 m): roques <b>calcàries</b> dures que no s'han desgastat: <b>relleu residual</b>."],
 truc:"La conca és un <b>bol de sopa</b>; la Tossa és un <b>escut</b> de roca dura.",
 compte:"Forces <b>internes</b> = de dins (aixequen). <b>Externes</b> = de fora (desgasten).",
 fc:[["Què és el relleu?","El conjunt de formes de l'escorça de la Terra."],["Què és l'erosió?","El desgast de les roques per l'aigua, el vent, la pluja i el gel."],["Què és una conca o depressió?","Una zona més baixa que el terreny del voltant."],["De quines roques era la conca d'Òdena?","De roques toves: argiles i guixos."],["Per què la Tossa no s'ha desgastat?","Perquè té roques calcàries dures."],["Com es diu un relleu que resisteix l'erosió?","Relleu residual (turó testimoni)."]],
 q:[["Les plaques tectòniques són una força…", ["externa", "interna", "marina"], 1, "Venen de l'interior del planeta i aixequen serralades: són forces internes."], ["La conca d'Òdena es va formar per…", ["l'erosió de roques toves", "l'aixecament de plaques", "l'impacte d'un meteorit"], 0, "L'aigua va desgastar les argiles i els guixos, i va excavar el «bol»."], ["La Tossa de Montbui té roques…", ["calcàries dures", "argiles i guixos tous", "toves i fàcils de desgastar"], 0, "Les calcàries són molt resistents; per això la Tossa ha quedat alta."], ["El vent i la pluja són forces…", ["internes", "tectòniques", "externes (desgasten)"], 2, "Són forces externes: desgasten les roques des de fora."], ["Com es diu el desgast de les roques per l'aigua, el vent i el gel?", ["Relleu", "Tectònica", "Erosió"], 2, "És l'erosió, la feina de les forces externes."], ["Què és una conca o depressió?", ["Una zona plana dalt d'una muntanya", "Una zona més baixa que el voltant", "Un riu que desemboca en un altre"], 1, "Una depressió és una zona més baixa que el terreny del voltant, com un bol."], ["Com es diu un relleu que ha resistit l'erosió, com la Tossa?", ["Depressió", "Relleu residual", "Relleu volcànic"], 1, "És un relleu residual (turó testimoni): les roques dures no s'han desgastat."], ["Què és el relleu?", ["El desgast de les roques per l'aigua i el vent", "El moviment de les plaques de l'interior", "El conjunt de formes de l'escorça terrestre"], 2, "El relleu és el conjunt de formes de l'escorça; el desgast és l'erosió."]]},

{id:"riu",ic:"💧",col:"#1ABC9C",titol:"El riu Anoia",font:"Apunts · geografia",
 idea:"El riu Anoia recull l'aigua de la conca i és un afluent del Llobregat, amb un cabal mediterrani irregular.",
 pts:["<b>Hidrografia</b>: estudia l'aigua de la superfície (rius, llacs, mars).","<b>Conca hidrogràfica</b>: territori on l'aigua de pluja va a parar a un mateix riu. La separen les <b>divisòries d'aigües</b>.","L'Anoia neix a la Segarra (per sobre de Calaf).","<b>Cabal</b>: aigua que passa per un punt en un segon. A l'Anoia és <b>irregular</b>.","<b>Estiatge</b>: a l'estiu baixa gairebé sec. <b>Riuades</b>: crescudes fortes a la tardor.","És <b>afluent del Llobregat</b>: s'hi uneix a Martorell."],
 truc:"Un <b>afluent</b> és un riu que «aflueix» a un altre més gran, no al mar.",
 compte:"Conca d'Òdena (relleu, un bol) ≠ conca hidrogràfica (tot el territori que porta aigua a un riu).",
 fc:[["Què és una conca hidrogràfica?","El territori on l'aigua de pluja va a parar a un mateix riu."],["Què és el cabal?","La quantitat d'aigua que passa per un punt del riu en un segon."],["Què és l'estiatge?","Quan el riu baixa gairebé sec, a l'estiu."],["On neix el riu Anoia?","A la Segarra, per sobre de Calaf."],["El riu Anoia desemboca al mar?","No, és afluent del Llobregat (a Martorell)."],["Què separa dues conques hidrogràfiques?","Les divisòries d'aigües (les carenes)."]],
 q:[["El riu Anoia s'uneix al riu…", ["Ebre", "Llobregat", "Ter"], 1, "S'uneix al Llobregat, a Martorell."], ["El cabal de l'Anoia és…", ["molt regular", "sempre gran", "irregular"], 2, "És un cabal mediterrani i irregular: estiatge a l'estiu i riuades a la tardor."], ["A l'estiu el riu baixa gairebé sec. Com es diu?", ["Estiatge", "Riuada", "Desembocadura"], 0, "És l'estiatge: a l'estiu el riu porta molt poca aigua."], ["Un riu que desemboca en un altre riu és…", ["un afluent", "un delta", "un estiatge"], 0, "Un afluent «aflueix» a un riu més gran, no al mar."], ["On neix el riu Anoia?", ["A la Segarra, per sobre de Calaf", "A Martorell", "Al fons de la conca d'Òdena"], 0, "Neix a la Segarra, per sobre de Calaf. A Martorell és on s'acaba."], ["Què és el cabal d'un riu?", ["La llargada del riu des que neix fins al final", "L'aigua que passa per un punt en un segon", "L'amplada del riu en un punt"], 1, "El cabal és la quantitat d'aigua que passa per un punt en un segon."], ["Què separa dues conques hidrogràfiques?", ["Els afluents", "Les divisòries d'aigües", "Les desembocadures"], 1, "Les divisòries d'aigües (les carenes) fan de frontera entre conques."], ["En quina època fa riuades el riu Anoia?", ["A la primavera", "A l'estiu", "A la tardor"], 2, "Les crescudes fortes arriben a la tardor; a l'estiu hi ha estiatge."]]},

{id:"climaig",ic:"🌫️",col:"#5D6D7E",titol:"El clima d'Igualada",font:"Apunts · geografia",
 idea:"Igualada té un clima mediterrani continentalitzat: hiverns freds amb boira i estius molt calorosos.",
 pts:["La <b>Serralada Prelitoral</b> fa de paret i no deixa entrar la brisa humida del mar: <b>continentalitat</b>.","<b>Inversió tèrmica</b>: l'aire fred pesa més i baixa al fons de la conca; fa més fred a Igualada que a dalt de la Tossa.","Es forma la <b>boira de fondalada</b> i hi ha <b>glaçades</b>.","Hivern: fred i humit, sota 0 °C. Estiu: molt calorós i sec, fins a uns 38 °C.","És el factor «distància al mar» del llibre, reforçat per les muntanyes."],
 truc:"«L'aire fred pesa més i rellisca avall, com l'aigua en un bol».",
 compte:"Normalment, com més amunt més fred. Amb la <b>inversió tèrmica</b> passa al revés: fa més fred a baix.",
 fc:[["Quin clima té Igualada?","Mediterrani continentalitzat."],["Què fa la Serralada Prelitoral?","Fa de barrera i no deixa entrar la brisa del mar."],["Què és la inversió tèrmica?","Quan fa més fred a baix (a la conca) que a dalt (a la Tossa)."],["Per què passa?","Perquè l'aire fred pesa més i baixa al fons de la conca."],["Quina boira es forma?","La boira de fondalada."],["Com són els estius a Igualada?","Molt calorosos i secs (fins a uns 38 °C)."]],
 q:[["A Igualada, a l'hivern, fa més fred…", ["a dalt de la Tossa de Montbui", "al fons de la conca", "igual a tot arreu"], 1, "Per la inversió tèrmica, l'aire fred baixa al fons de la conca."], ["La continentalitat vol dir…", ["temperatures suaus tot l'any", "hiverns freds i estius calorosos", "molta pluja a l'hivern"], 1, "Lluny de la influència del mar hi ha molt contrast: hiverns freds i estius calorosos."], ["L'aire fred…", ["pesa més i baixa", "pesa menys i puja", "no pesa res"], 0, "Pesa més i rellisca avall, com l'aigua en un bol."], ["Quines muntanyes separen Igualada del mar?", ["El Pirineu, al nord", "La Serralada Prelitoral", "Les muntanyes de la Segarra"], 1, "La Serralada Prelitoral fa de paret i no deixa entrar la brisa humida del mar."], ["Quin clima té Igualada?", ["Mediterrani de costa, suau", "Mediterrani continentalitzat", "De muntanya, amb neu tot l'any"], 1, "Mediterrani continentalitzat: hiverns freds amb boira i estius molt calorosos."], ["Quina boira es forma al fons de la conca?", ["Boira marina de la costa", "Boira de muntanya", "Boira de fondalada"], 2, "La boira de fondalada, perquè l'aire fred s'acumula a baix."], ["Com és l'estiu a Igualada?", ["Fresc i amb molta pluja", "Suau gràcies a la brisa del mar", "Molt calorós i sec"], 2, "Molt calorós i sec, fins a uns 38 °C."], ["Què és la inversió tèrmica?", ["Quan fa més fred a baix que a dalt", "Quan fa més calor a baix", "Quan fa el mateix a tot arreu"], 0, "Normalment, com més amunt més fred; amb la inversió tèrmica passa al revés."]]},

{id:"paisatge",ic:"🌲",col:"#229954",titol:"Els paisatges de l'Anoia",font:"Apunts · geografia",
 idea:"El paisatge natural d'alzines i pins s'ha convertit en paisatge humanitzat: camps de secà i el barri industrial del Rec.",
 pts:["<b>Paisatge</b>: part del territori que podem observar (relleu + clima + aigua + éssers vius).","<b>Paisatge natural</b>: sense transformació humana. A l'Anoia: <b>alzines</b>, <b>pins blancs</b>, romaní i farigola.","<b>Paisatge humanitzat</b>: modificat per l'ésser humà.","<b>Agrícola</b>: conreus de <b>secà</b> (només aigua de pluja): cereals, vinya, oliveres.","<b>Urbà i industrial</b>: el <b>Rec</b>, un canal artificial de fa gairebé mil anys per a adoberies i fàbriques (Cal Boyer, Cal Granotes)."],
 truc:"<b>Secà</b> = sec, sense regar, només pluja.",
 compte:"Un bosc plantat per fer fusta ja és paisatge humanitzat, encara que sigui verd.",

function svgClimo(){
 const W=440,H=262,x0=40,x1=400,y0=222,y1=22,bw=(x1-x0)/12,yp=v=>y0-(v/120)*(y0-y1),yt=v=>y0-(v/30)*(y0-y1);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:480px">`;
 for(let g=0;g<=6;g++){const y=y0-g*(y0-y1)/6;s+=`<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="#e2e8f0"/><text x="${x0-6}" y="${y+4}" font-size="11" text-anchor="end" fill="#dc2626">${g*5}</text><text x="${x1+6}" y="${y+4}" font-size="11" fill="#2563eb">${g*20}</text>`}
 P.forEach((v,i)=>{s+=`<rect x="${x0+i*bw+4}" y="${yp(v)}" width="${bw-8}" height="${y0-yp(v)}" rx="3" fill="#60a5fa"/><text x="${x0+i*bw+bw/2}" y="${y0+16}" font-size="12" text-anchor="middle" fill="#334155">${MES[i]}</text>`});
 s+=`<polyline fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round" points="${Tm.map((v,i)=>`${x0+i*bw+bw/2},${yt(v)}`).join(" ")}"/>`;
 Tm.forEach((v,i)=>s+=`<circle cx="${x0+i*bw+bw/2}" cy="${yt(v)}" r="3.5" fill="#fff" stroke="#dc2626" stroke-width="2"/>`);
 return s+`<text x="${x0-30}" y="13" font-size="11" fill="#dc2626">°C</text><text x="${x1+2}" y="13" font-size="11" fill="#2563eb">mm</text><text x="${W/2}" y="${H-3}" font-size="12" text-anchor="middle" font-weight="700" fill="#334155">Climograma de Girona (valors aproximats)</text></svg>`;
}

}
function seguentPendent(){return T.findIndex(t=>{const m=millor(t.id);return m===null||m<APROVA})}

// ====================== TEST ======================
function test(ordre,k,bones,clau,pool,cb){
 calla();

  z.innerHTML=`<div class="box" style="text-align:center"><div class="gran">${pc>=90?"🏆":pc>=70?"🌟":pc>=50?"👍":"📚"}</div><h2 style="margin:8px 0 2px">${bones} de ${ordre.length} · ${msg}</h2>
  <p class="prog" style="margin-top:14px">Com t'ha anat aquest tema?</p>
  <div class="valor">${[["😕","Costa"],["🙂","Bé"],["😃","Fàcil"]].map(([em,tx],i)=>`<button class="${e.valoracio===i?'on':''}" onclick="valora(${i},this)">${em}<small>${tx}</small></button>`).join("")}</div>
  ${teSeg&&aprova?`<p id="compte" class="prog" style="margin-top:16px">Passem a <b>${T[idx+1].ic} ${T[idx+1].titol}</b> en <span id="seg-s">8</span> s…</p>`:""}
  ${!teSeg&&aprova?`<p>🎉 Has acabat tots els temes! Prova les preguntes obertes o l'examen sorpresa.</p>`:""}
  ${!aprova?`<p>Repassa la fitxa i torna-hi: amb un ${APROVA} % o més passaràs al tema següent. Les preguntes canvien cada vegada!</p>${repPendents().length?`<p><button class="btn verd" onclick="aturaSeg();repas()">🔁 Repassa els errors ara</button></p>`:""}`:""}
  <div class="fila">${teSeg&&aprova?`<button class="btn verd" onclick="aturaSeg();obre(${idx+1})">Tema següent →</button>`:""}<button class="btn ${teSeg&&aprova?'sec':''}" onclick="aturaSeg();pest='test';pintaTema()">Torna-hi</button><button class="btn sec" onclick="aturaSeg();pest='fitxa';pintaTema()">Repassa la fitxa</button></div></div>`;
  if(teSeg&&aprova){let s=8;temp=setInterval(()=>{s--;const el=document.getElementById("seg-s");if(!el){aturaSeg();return}el.textContent=s;if(s<=0){aturaSeg();obre(idx+1)}},1000)}
  return;
 }
 const q=llista[ordre[k]];
 const ops=barreja(q[1].map((o,i)=>[o,i]));
 z.innerHTML=`<div class="box"><div class="prog">Pregunta ${k+1} de ${ordre.length} · encertades ${bones}${q.tema?` · ${q.tema}`:""}</div><div class="barra-test"><i style="width:${k*100/ordre.length}%"></i></div>
 ${potEscoltar()?`<div class="escolta-fila" style="margin:4px 0 -4px">${btEscolta(q[0]+". "+ops.map(([o],j)=>"ABC"[j]+": "+o).join(". "),"")}</div>`:""}<div class="pregunta">${q[0]}</div><div>${ops.map(([o,i],j)=>`<button class="opt" data-i="${i}"><span class="ll">${"ABC"[j]}</span><span>${o}</span></button>`).join("")}</div><div id="fb"></div></div>`;
 z.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
  const ok=+b.dataset.i===q[2];
  z.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(+x.dataset.i===q[2])x.classList.add("ok")});
  const tidR=q.tid||(esTema?tema.id:null);if(tidR)repAnota(tidR,q[0],ok);
  if(ok){const nova=REPAS?0:estPregunta((tidR||clau)+"|"+q[0]);suma(nova);if(!nova&&!REPAS)document.querySelector(".opt.ok")?.insertAdjacentHTML("beforeend",`<small style="margin-left:auto;color:#64748b;font-weight:700">ja encertada avui · sense ⭐</small>`);so("ok");ratxa(true)}else{ratxa(false);so("ko");b.classList.add("ko");if(tidR){const e=ET(tidR);e.fallades[q[0]]=(e.fallades[q[0]]||0)+1;desa()}}
  document.getElementById("fb").innerHTML=`<div class="fb ${ok?'ok':'ko'}">${ok?"✅ <b>Molt bé!</b>":"💡 <b>Gairebé!</b>"} ${q[3]}</div><div class="fila"><button class="btn" id="seg">${k<ordre.length-1?"Següent →":"Veure resultat"}</button></div>`;
  document.getElementById("seg").onclick=()=>test(ordre,k+1,bones+(ok?1:0),clau,pool,cb);
 });

// ====================== ESCOLTA (lectura en veu alta) ======================
// Fa servir la veu del mateix aparell. Català per defecte; castellà si l'assignatura és de castellà (ASSIG.veu).
const VEU_LANG=ASSIG.veu||(/castell|spanish|espa/i.test(ASSIG.id+ASSIG.nom)?"es-ES":"ca-ES");
let VEUS=[],PARLANT=null;
function triaVeu(){if(!("speechSynthesis" in window))return null;VEUS=speechSynthesis.getVoices();const l=VEU_LANG.slice(0,2);
 return VEUS.find(v=>v.lang.replace("_","-").toLowerCase()===VEU_LANG.toLowerCase())||VEUS.find(v=>v.lang.toLowerCase().startsWith(l))||(l==="ca"?VEUS.find(v=>v.lang.toLowerCase().startsWith("es")):null)||null}
if("speechSynthesis" in window)speechSynthesis.onvoiceschanged=()=>{VEUS=speechSynthesis.getVoices()};
const potEscoltar=()=>"speechSynthesis" in window;
function netText(h){const d=document.createElement("div");d.innerHTML=String(h).replace(/<br\s*\/?>/gi,". ").replace(/<\/li>/gi,". ");return d.textContent.replace(/[★⚠✅💡🔁🧠]/g,"").replace(/\s+/g," ").trim()}
function calla(){if(potEscoltar())speechSynthesis.cancel();document.querySelectorAll(".escolta.parla").forEach(b=>{b.classList.remove("parla");b.firstChild.textContent="🔊"});PARLANT=null}
function escolta(btn,text){if(!potEscoltar())return;if(PARLANT===btn){calla();return}calla();
 const u=new SpeechSynthesisUtterance(netText(text)),v=triaVeu();if(v)u.voice=v;u.lang=v?v.lang:VEU_LANG;u.rate=.92;u.pitch=1.05;
 u.onend=u.onerror=()=>{if(PARLANT===btn)calla()};PARLANT=btn;btn.classList.add("parla");btn.firstChild.textContent="⏹";speechSynthesis.speak(u);registraEscolta()}
let ESC_N=0;function registraEscolta(){ESC_N++}
// botó: <button class="escolta" data-t="clau">; el text es guarda a ESCT[clau]
const ESCT={};let ESCI=0;
function btEscolta(text,etq){if(!potEscoltar())return "";const k="e"+(++ESCI);ESCT[k]=text;return `<button class="escolta" type="button" onclick="event.stopPropagation();escolta(this,ESCT['${k}'])" aria-label="Escolta-ho en veu alta"><span>🔊</span>${etq===""?"":`<span>${etq||"Escolta"}</span>`}</button>`}

// ====================== ESTRELLES JUSTES ======================
// Una pregunta encertada dona ⭐ només la primera vegada de cada dia; cada joc, només la primera partida del dia.
// Millorar el rècord d'un tema dona +2 ⭐. Les obertes, només per les idees que es detecten al text.
function diaEst(){if(!S.est||S.est.d!==avui())S.est={d:avui(),q:{},j:{},o:{}};return S.est}
function estPregunta(k){const e=diaEst();if(e.q[k])return 0;e.q[k]=1;return 1}
let JOCSTAR=1;
const NOM_MAL=/(^|[^a-z])(puta|puto|putes|putos|merda|mierda|cabron|cabro|polla|cony|cono|collons|cojones|gilipolles|gilipollas|imbecil|idiota|subnormal|maricon|marica|mongol|mongolo|joputa|zorra|guarra|pene|penis|culo|cul|caca|pipi|pedo|pet|tonto|tonta|burro|fuck|shit|bitch|dick|ass|nazi|hitler|porno|porn|sexo|sex|teta|tetes|tetas|xixa|chocho|verga|follar|folla)([^a-z]|$)|fill ?de ?puta|hijo ?de ?puta|me cago|em cago/;
const normT=t=>t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/·/g,".");
function nomProhibit(n){const x=normT(n.trim());return !/^[a-z0-9 ._'-]+$/.test(x)||NOM_MAL.test(x)}
// idees detectades al text d'una oberta: alguna paraula important (5+ lletres) del punt clau, comparant els 5 primers caràcters
const BUIDES=new Set("aquest aquesta aquests aquestes perque quan com amb sense sobre entre també molt mes menys tots totes cada altre altres seva seves seus quan durant despres abans pero porque cuando sobre entre tambien mucho todos todas otra otro otras otros".split(" "));
function ideaDetectada(punt,text){const t=normT(text).replace(/[^a-z0-9 ]/g," "),paus=new Set(t.split(/\s+/).filter(w=>w.length>=4).map(w=>w.slice(0,5)));
 const claus=normT(punt.replace(/<[^>]+>/g,"")).replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>=5&&!BUIDES.has(w));
 return claus.some(w=>paus.has(w.slice(0,5)))}

// ====================== REPÀS ESPAIAT DELS ERRORS ======================
// Cada pregunta fallada entra a la capsa 0 (es pot repassar avui mateix).
// Al repàs: encert → capsa 1 (torna d'aquí a 3 dies) → capsa 2 (d'aquí a 7) → après i surt. Error → capsa 0, torna demà.
const APROVA=70,NTEST=6,REP_DIES=[0,3,7];
let REPAS=false;
function diaMes(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function repAnota(tid,txt,ok){S.rep=S.rep||{};const k=tid+"|"+txt,r=S.rep[k];
 if(!ok){S.rep[k]={tid,q:txt,c:0,prox:REPAS?diaMes(1):avui()};desa();return}
 if(!REPAS||!r)return;
 const c=r.c+1;if(c>=REP_DIES.length){delete S.rep[k];S.apresos=(S.apresos||0)+1}else S.rep[k]={...r,c,prox:diaMes(REP_DIES[c])};desa()}
function repTots(){return Object.values(S.rep||{}).filter(r=>T.some(t=>t.id===r.tid&&t.q.some(q=>q[0]===r.q)))}
function repPendents(){const d=avui();return repTots().filter(r=>r.prox<=d)}
function repProper(){const f=repTots().map(r=>r.prox).sort();return f[0]||null}
function repas(){
 const pend=barreja(repPendents()).slice(0,10);aturaSeg();COMBO=0;FONT=["repas"];window.scrollTo(0,0);marcaNav("inici");

 const pool=pend.map(r=>{const t=T.find(x=>x.id===r.tid),q=t.q.find(x=>x[0]===r.q).slice();q.tema=t.titol;q.tid=t.id;q.capsa=r.c;return q});
 REPAS=true;

 test(pool.map((x,i)=>i),0,0,"repas",pool,(pc,b,n)=>{REPAS=false;registra("joc",{joc:"repas",titol:"Repàs dels errors",pc});arcade(pc,b,n,false);
  const queden=repPendents().length,pr=repProper();

 <h2 class="sec">🏁 Com vas</h2><div id="cvA">${cartaComVas()}</div>
 <h2 class="sec">⭐ D'on surten les estrelles</h2>${cartaEstrelles(true).replace('class="estrelles"','class="estrelles" style="margin:0 0 6px;cursor:default"')}
 <h2 class="sec">🏅 Nivells</h2><div class="box">${cartaNivell().replace('class="nivell"','class="nivell" style="margin:0 0 12px"')}<div class="rangs">${NIVELLS.map(([min,nom,ic],i)=>{const n=nivell(S.punts).n;return `<div class="rang ${i+1<n?'':i+1===n?'ara':'bloc'}"><span>${ic}</span><b>${i+1}. ${nom}</b><small>${min} ⭐</small></div>`}).join("")}</div><p class="prog" style="margin:10px 0 0">Cada encert als tests, als jocs i a les preguntes obertes suma ⭐, i les ⭐ fan pujar de nivell.</p></div>
 <h2 class="sec">📖 Tema per tema</h2><div class="box" style="overflow-x:auto"><table class="an"><tr><th>Tema</th><th>Fitxa</th><th class="mh">Targetes</th><th>Tests</th><th>Millor</th><th class="mh">Últim</th><th>Ell diu</th></tr>
 ${T.map((t,i)=>{const e=S.temes[t.id],m=millor(t.id),ul=e&&e.intents.length?e.intents[e.intents.length-1].pc:null;return `<tr style="cursor:pointer" onclick="obre(${i})"><td><span class="semaf" style="background:${color(m)}"></span>${t.ic} ${t.titol}</td><td>${e&&e.fitxa?"✅":"—"}</td><td class="mh">${e?`${Math.min(e.fc,t.fc.length)}/${t.fc.length}`:"—"}</td><td>${e?e.intents.length:0}</td><td><b>${m===null?"—":m+"%"}</b></td><td class="mh">${ul===null?"—":ul+"%"}</td><td>${e&&e.valoracio!==null?val[e.valoracio]:"—"}</td></tr>`}).join("")}
 </table><p class="prog" style="margin:8px 0 0"><span class="semaf" style="background:#22c55e"></span>80% o més · <span class="semaf" style="background:#f59e0b"></span>50-79% · <span class="semaf" style="background:#ef4444"></span>menys del 50% · <span class="semaf" style="background:#cbd5e1"></span>sense fer</p></div>
 <h2 class="sec">❌ Preguntes que més falla</h2><div class="box"><p class="prog" style="margin:0 0 8px">🔁 Al repàs: <b>${repTots().length}</b> preguntes pendents (${repPendents().length} per avui) · 🏅 apreses del tot: <b>${S.apresos||0}</b></p>${errs.length?`<ol class="llista-err">${errs.slice(0,8).map(([q,c,t])=>`<li>${q} <span class="etq">${t.ic} ${t.titol}</span> <b>×${c}</b></li>`).join("")}</ol>`:`<p class="prog" style="margin:0">Encara cap error registrat. 👌</p>`}</div>
 <h2 class="sec">✍️ Preguntes obertes</h2><div class="box">${obN?`<table class="an"><tr><th>Pregunta</th><th>Tema</th><th>Idees</th></tr>${OB.map((o,n)=>n in S.ob?`<tr style="cursor:pointer" onclick="obertes(${n})"><td>${o.q.length>80?o.q.slice(0,78)+"…":o.q}</td><td>${o.t}</td><td><span class="semaf" style="background:${color(S.ob[n])}"></span><b>${S.ob[n]}%</b></td></tr>`:"").join("")}</table>`:`<p class="prog" style="margin:0">Encara no n'ha fet cap.</p>`}</div>
 <h2 class="sec">🎮 Jocs i examen</h2><div class="box"><table class="an"><tr><th>Joc</th><th>Vegades</th><th>Millor</th><th>Últim</th></tr>${JOCS.map(([id,ic,t])=>{const r=S.jocs[id]||[];return `<tr><td>${ic} ${t}</td><td>${r.length}</td><td>${r.length?Math.max(...r)+"%":"—"}</td><td>${r.length?r[r.length-1]+"%":"—"}</td></tr>`}).join("")}</table></div>
 <p class="prog" style="text-align:center">Cada nom té el seu progrés, guardat en aquest navegador i aquest aparell. Data: ${new Date().toLocaleDateString("ca-ES")}.</p>
 <div class="fila">${btSuau()}<button class="btn sec" onclick="benvinguda()">👥 Canviar d'usuari</button><button class="btn verm" onclick="demanaReset()">🗑️ Esborrar el progrés</button></div>`;
}
function demanaReset(){
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="box"><div class="gran">⚠️</div><h3>Esborrar tot el progrés de ${S.nom}?</h3><p class="prog">Només s'esborra el progrés de ${S.nom}; els altres noms no es toquen. No es pot desfer.</p><div class="fila"><button class="btn sec" id="no">No, deixa-ho</button><button class="btn verm" id="si">Sí, esborra-ho</button></div></div>`;
 document.body.appendChild(m);
 m.querySelector("#no").onclick=()=>m.remove();
 m.querySelector("#si").onclick=()=>{delete PER[S.nom];S=BUIT();try{localStorage.setItem(CL+"perfils",JSON.stringify(PER));localStorage.removeItem(CL+"actiu")}catch(e){}m.remove();pintaCap();benvinguda()};
}

aplicaSuau();if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("../../sw.js").catch(()=>{});
pintaCap();pintaSo();vista("inici");
</script>
</body>
</html>
