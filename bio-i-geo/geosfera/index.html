// ===== ACTUALITZACIÓ AUTOMÀTICA (motor/eines/actualitza.js · el mateix codi a la portada i als mons; tot.py el copia a index.html) =====
// Cada pàgina porta escrita la versió amb què es va generar (VER: la hi posa motor/tot.py). En obrir la pàgina es pregunta
// al servidor quina versió hi ha publicada (versio.json, sense passar per cap memòria cau). Si no coincideixen, el que es veu
// és una còpia vella (memòria cau del navegador o del service worker). Llavors: s'esborren les còpies guardades de l'app
// (memòria cau «bn-…»), es demana al service worker que s'actualitzi i es torna a carregar la pàgina, UN sol cop per versió.
// MAI s'esborra el progrés, el nom ni el PIN (són a localStorage i no es toquen). Sense connexió, o obrint el fitxer a
// l'ordinador (file://), no fa res.
// En tornar a l'app després de més de 10 minuts amagada: a la portada recarrega sola; dins d'un món, com que el nen pot
// estar a mig test, només surt un avís amb un botó per actualitzar quan vulgui.
(function(){
 const C=window.BN_ACT||{},ARREL=C.arrel||"./",VER="5495ce47af",KR="bn_act_recarrega",DEU=6e5;
 if(location.protocol==="file:"||VER.indexOf("__")===0||!window.fetch)return;
 let fet=0,amagat=0;
 const quan=f=>document.body?f():document.addEventListener("DOMContentLoaded",f);
 // esborra la memòria cau de l'app i fa que el service worker es descarregui de nou (màxim 3 s)
 const neteja=()=>Promise.race([Promise.all([
   window.caches?caches.keys().then(ks=>Promise.all(ks.filter(k=>k.indexOf("bn-")===0).map(k=>caches.delete(k)))).catch(()=>{}):0,
   navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.update().catch(()=>{})))).catch(()=>{}):0]),
  new Promise(r=>setTimeout(r,3000))]);
 function avis(txt,boto){quan(()=>{let a=document.getElementById("bnAct");
  if(!a){a=document.createElement("div");a.id="bnAct";a.setAttribute("role","status");
   a.style.cssText="position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:10px 14px;border-radius:14px;background:#0b1033f2;border:2px solid #facc15;color:#fff;font:800 14px/1.3 Nunito,system-ui,sans-serif;box-shadow:0 8px 24px #0009";
   document.body.appendChild(a)}
  a.innerHTML="";const t=document.createElement("span");t.textContent=txt;a.appendChild(t);
  if(boto){const b=document.createElement("button");b.type="button";b.textContent="Actualitza";
   b.style.cssText="font:900 13px Nunito,system-ui,sans-serif;color:#1e1b4b;background:#facc15;border:0;border-radius:999px;padding:8px 12px;cursor:pointer";
   b.onclick=()=>recarrega(boto,true);a.appendChild(b)}})}
 // l'adreça sense el «v=…» (la resta de paràmetres, com ?demo, es queden tal qual)
 const senseV=q=>q.replace(/([?&])v=[^&]*(&|$)/,(m,a,b)=>b?a:"").replace(/^\?$/,"");
 function recarrega(v,aMa){
  // una sola vegada per versió (si el servidor encara no serveix la nova, no entra en bucle); amb el botó, sempre
  if(!aMa){if(new RegExp("[?&]v="+v+"(&|$)").test(location.search))return;try{if(sessionStorage.getItem(KR)===v)return;sessionStorage.setItem(KR,v)}catch(e){}}
  avis("🔄 Versió nova de Bona Nota! Actualitzant…");
  const q=senseV(location.search);neteja().then(()=>location.replace(location.pathname+q+(q?"&":"?")+"v="+v+location.hash))}
 // un cop és la versió bona, treu el «?v=…» de l'adreça
 function netejaAdreca(){try{const q=senseV(location.search);if(q!==location.search)history.replaceState(history.state,"",location.pathname+q+location.hash)}catch(e){}}
 function comprova(auto){fet=Date.now();
  fetch(ARREL+"versio.json?t="+fet,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(!d||!d.v)return;
   if(d.v===VER){netejaAdreca();return}
   if(auto)recarrega(d.v);else avis("✨ Hi ha una versió nova de Bona Nota.",d.v)}).catch(()=>{})}
 comprova(true);
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){amagat=Date.now();return}
  if(amagat&&Date.now()-amagat>DEU&&Date.now()-fet>DEU)comprova(!!C.tornaAuto)});
 window.bnActualitza=()=>comprova(true); // per provar-ho a mà des de la consola
})();

/* targetes */
.flash{perspective:1000px;height:240px;cursor:pointer;margin:12px auto;max-width:540px}

.m-feli .mbE{transform-box:fill-box;transform-origin:100% 100%;animation:mBrac .35s ease-in-out infinite alternate}
.m-feli .mbD{animation:mBrac2 .35s ease-in-out infinite alternate}

/* entrada de pantalles: el contingut nou apareix suau i esglaonat */
#app>*,#zona>*{animation:vEntra .34s cubic-bezier(.2,.9,.3,1) both}
#app>*:nth-child(2),#zona>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3),#zona>*:nth-child(3){animation-delay:.08s}
#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(5){animation-delay:.16s}#app>*:nth-child(n+6){animation-delay:.2s}
@keyframes vEntra{from{opacity:0;transform:translateY(10px)}}
.grid>.tile{animation:vEntra .4s cubic-bezier(.2,.9,.3,1) both}
.grid>.tile:nth-child(2){animation-delay:.04s}.grid>.tile:nth-child(3){animation-delay:.08s}.grid>.tile:nth-child(4){animation-delay:.12s}.grid>.tile:nth-child(5){animation-delay:.16s}.grid>.tile:nth-child(n+6){animation-delay:.2s}
.tile .ic{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.tile:hover .ic{transform:scale(1.12) rotate(-8deg)}
.tile:active{transform:scale(.97)}
.continua{transition:transform .2s,box-shadow .2s}.continua:hover{transform:translateY(-2px);box-shadow:0 8px 20px #f59e0b33}
.continua>span:first-child,.nivell .nic{display:inline-block;animation:icFlota 3s ease-in-out infinite}
@keyframes icFlota{50%{transform:translateY(-4px) rotate(4deg)}}

.barra i,.barra-test i{transition:width .6s cubic-bezier(.3,1.2,.5,1)}
.barra i{animation:creix .9s cubic-bezier(.3,1.2,.5,1) both;transform-origin:left}
/* respostes del test */
.opt{transition:border-color .15s,background .15s,transform .12s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.ok{animation:optOk .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes optOk{40%{transform:scale(1.03)}}
.opt.ok .ll{animation:llOk .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes llOk{40%{transform:scale(1.35) rotate(-10deg)}}
.opt.ko{animation:tremola .35s}
.fb{animation:vEntra .3s ease-out both}
.chip{transition:transform .12s,background .15s,border-color .15s,color .15s}
.chip:active{transform:scale(.94)}.chip.ok{animation:optOk .45s cubic-bezier(.3,1.8,.5,1)}
.flash:active .in{transform:scale(.98)}.flash.gir:active .in{transform:rotateY(180deg) scale(.98)}
.punts-fc i{transition:transform .25s,background .25s}
.btn{transition:transform .08s,filter .15s}.btn:hover:not(:disabled){filter:brightness(1.06)}
.kpi{animation:vEntra .4s cubic-bezier(.2,.9,.3,1) both}

svg .fgB{transform-box:fill-box;transform-origin:50% 100%;animation:fgCreix .7s cubic-bezier(.3,1.3,.5,1) both}
@keyframes fgCreix{from{transform:scaleY(0)}}
svg .fgL{stroke-dasharray:900;stroke-dashoffset:900;animation:fgLinia 1.2s ease-out .4s forwards}
@keyframes fgLinia{to{stroke-dashoffset:0}}
svg .fgP{animation:vEntra .3s ease-out both}

body.suau #app>*,body.suau #zona>*,body.suau .grid>.tile,body.suau .kpi,body.suau .masc *,body.suau .masc-benv,body.suau .arc .masc-arc,body.suau .continua>span:first-child,body.suau .nivell .nic,body.suau .hero .av,body.suau .opt.ok,body.suau .opt.ok .ll,body.suau .mus-btn.on .ico,body.suau svg .fgB,body.suau .boss,body.suau .boss *,body.suau .boss-festa,body.suau .boss-festa *{animation:none!important}
body.suau .boss-hp i{transition:none!important}body.suau .boss-esp{display:none!important}
body.suau svg .fgL{animation:none!important;stroke-dashoffset:0}

   "El mantell té dues parts: el <b>superior</b> i l'<b>inferior</b>.",

  truc:"L'astenosfera és com una plastilina molt dura: sembla sòlida, però flueix molt a poc a poc.",
  compte:"L'escorça oceànica és la prima (5-10 km); la continental, la gruixuda (25-70 km). No ho giris!",

     ["Com és el mantell?",["Líquid com l'aigua","Sòlid, però una mica plàstic","Gasós i molt calent"],1,"El mantell és sòlid, però té una certa plasticitat."],

     ["Quina capa és la responsable del camp magnètic terrestre?",["El nucli extern","L'escorça","El mantell inferior"],0,"El nucli extern, de ferro i níquel líquids, crea el camp magnètic: per això la brúixola apunta al nord."],
     ["Quina és la capa més densa de la Terra?",["El mantell","L'escorça oceànica","El nucli intern"],2,"El nucli intern és sòlid, metàl·lic i el més dens de tots."],
     ["La discontinuïtat de Gutenberg separa…",["l'escorça del mantell","el mantell del nucli","el nucli extern de l'intern"],1,"Gutenberg és a 2.900 km, entre el mantell i el nucli."],
     ["Quin és l'ordre de les discontinuïtats, de fora cap a dins?",["Gutenberg, Mohorovicic i Lehmann","Mohorovicic, Gutenberg i Lehmann","Lehmann, Gutenberg i Mohorovicic"],1,"«Mai Guanyo la Loteria»: Mohorovicic, Gutenberg, Lehmann."],
     ["La discontinuïtat de Lehmann separa…",["el nucli extern del nucli intern","l'escorça del mantell","el mantell del nucli extern"],0,"Lehmann és la frontera entre el nucli extern (líquid) i l'intern (sòlid)."],
     ["A quina profunditat hi ha el centre de la Terra?",["A 2.900 km","A 6.371 km","A 70 km"],1,"El centre és a 6.371 km. A 2.900 km acaba el mantell."],
     ["De quins metalls és el nucli?",["De ferro i níquel","De ferro i magnesi","D'oxigen i silici"],0,"El nucli és de ferro i níquel. Ferro, magnesi i silici són del mantell."]]},
 {id:"origen",ic:"☄️",col:"#b91c1c",titol:"Com es van formar les capes",font:"Esquema · full 1 · secció 1.3 · diapositiva 8",
  idea:"Les capes es van formar al final de la formació de la Terra: la Terra es va fondre, els materials densos van baixar i, en refredar-se, es va fer l'escorça.",
  pts:["<b>Planetesimals</b>: trossos de roca i metall que, xocant entre ells, van formar els planetes (com boles de neu que s'enganxen).",
   "① <b>Xocs</b>: els xocs dels planetesimals van escalfar tant la Terra que les roques es van fondre. El planeta era un cos <b>incandescent</b>.",
   "② <b>Separació</b>: els materials <b>més densos</b>, rics en <b>ferro i níquel</b>, van baixar i van fer el <b>nucli</b>. Els menys densos van pujar cap a la superfície.",
   "③ <b>Refredament</b>: quan la Terra es va refredar, es va formar l'<b>escorça</b>, sòlida i poc densa, a sobre del mantell.",
   "Resultat: <b>tres capes de densitat creixent</b> cap a dins."],
  truc:"Xoca → separa → refreda. Com una sopa de pedres fosa: el que pesa més s'enfonsa al fons de l'olla.",
  compte:"Les capes es van separar quan la Terra estava fosa, no quan ja era freda.",
  fc:[["Què són els planetesimals?","Trossos de roca i metall que, xocant, van formar els planetes."],["Què va fondre la Terra?","La calor dels xocs dels planetesimals."],["Per què el nucli és de ferro i níquel?","Perquè són els materials més densos i es van enfonsar."],["Què van fer els materials menys densos?","Van pujar cap a la superfície."],["Quan es va formar l'escorça?","Quan la Terra es va refredar."],["Els 3 passos de l'origen de les capes?","Xocs, separació i refredament."]],
  q:[["Què són els planetesimals?",["Trossos de roca i metall que van formar els planetes","Els petits satèl·lits que giren al voltant de la Terra","Les ones que viatgen per dins de la Terra"],0,"Xocant entre ells, els planetesimals van formar els planetes, com boles de neu que s'enganxen."],
     ["Per què es va fondre la Terra al principi?",["Pels xocs dels planetesimals","Perquè el Sol era molt més a prop","Per la calor dels volcans de l'escorça"],0,"Els xocs dels planetesimals van escalfar tant la Terra que les roques es van fondre."],
     ["Per què el nucli és de ferro i níquel?",["Perquè són els materials més lleugers i van pujar","Perquè són els més densos i es van enfonsar","Perquè es van formar quan la Terra ja era freda"],1,"Quan la Terra estava fosa, el més pesat va baixar cap al centre."],
     ["Què van fer els materials menys densos quan la Terra estava fosa?",["Es van enfonsar fins al centre","Van pujar cap a la superfície","Es van convertir en ferro"],1,"Els menys densos van migrar cap a la superfície."],
     ["Quan es va formar l'escorça?",["Quan la Terra es va refredar","Abans que xoquessin els planetesimals","Quan es va formar el nucli intern"],0,"L'escorça, sòlida i poc densa, es va formar a sobre quan la Terra es va refredar."],
     ["Quin és l'ordre correcte de la formació de les capes?",["Separació → xocs → refredament","Xocs → separació → refredament","Refredament → xocs → separació"],1,"Primer els xocs fonen la Terra, després es separen els materials i al final es refreda."],
     ["Després de formar-se, com va quedar la Terra?",["Amb tres capes de densitat creixent cap a dins","Amb una sola capa de roca ben barrejada","Amb tres capes de la mateixa densitat"],0,"Va quedar dividida en tres capes, cada una més densa que la de sobre."],
     ["Com era la Terra després dels xocs dels planetesimals?",["Un cos incandescent i fos","Un planeta glaçat i cobert de neu","Un planeta ja dividit en tres capes"],0,"Els xocs la van escalfar tant que era un cos incandescent, amb les roques foses."]]},
 {id:"metodes",ic:"⛏️",col:"#4338ca",titol:"Com estudiem l'interior",font:"Esquema · full 1 · secció 2 · diapositives 9 i 10",
  idea:"Per conèixer l'interior de la Terra fem servir mètodes directes (agafant mostres) i mètodes indirectes (mesurant des de la superfície).",
  pts:["<b>Mètodes directes</b>: estudien mostres de <b>perforacions i sondejos</b>. Són <b>molt fiables</b>, però només arriben als primers quilòmetres.",
   "Exemples: la perforació de <b>Kola</b> (Rússia), els <b>pous de petroli</b> (fins a 7 km), les <b>mines</b> (fins a 3 km) i els <b>pous d'aigua</b>.",
   "<b>Mètodes indirectes</b>: mesuren des de la superfície. N'hi ha 4: <b>gravimètrics, geomagnètics, geotèrmics i sísmics</b>. Arriben fins al centre (6.371 km).",
   "El més usat és el <b>mètode sísmic</b>: estudia les <b>ones sísmiques</b> dels terratrèmols o d'explosions. Les ones canvien de velocitat segons el material que travessen.",
   "<b>Ones sísmiques</b>: vibracions que viatgen per dins de la Terra (com les ones d'una pedra tirada a l'aigua).",
   "⚠ La diapositiva diu que Kola s'està perforant ara i fa 13 km; fins on sabem, va arribar a uns 12 km i es va aturar fa anys: pregunta-ho al profe."],
  truc:"Directe = toco la roca. Indirecte = escolto la Terra.",
  compte:"Els pous de petroli i les mines són mètodes directes: molt fiables, però poc profunds.",
  fc:[["Què és un mètode directe?","Estudiar mostres de perforacions i sondejos."],["Avantatge dels mètodes directes?","Són molt fiables."],["Inconvenient dels mètodes directes?","Només arriben a pocs quilòmetres."],["Els 4 mètodes indirectes?","Gravimètrics, geomagnètics, geotèrmics i sísmics."],["El mètode indirecte més usat?","El sísmic."],["En què es basa el mètode sísmic?","Les ones canvien de velocitat segons el material que travessen."]],
  q:[["Quin és el mètode més utilitzat per estudiar l'interior de la Terra?",["Les perforacions petrolíferes","El mètode sísmic","Les mostres de les mines"],1,"El sísmic és el mètode indirecte més usat; les perforacions i les mines són directes i poc profundes."],
     ["Una mina de 3 km de fondària és un mètode…",["directe","indirecte","sísmic"],0,"Agafes mostres de la roca mateixa: és un mètode directe."],
     ["Què tenen de bo els mètodes directes?",["Arriben fins al centre de la Terra","Són molt fiables","Es poden fer des de casa"],1,"Són molt fiables perquè estudies la roca de veritat, però arriben a poca profunditat."],
     ["Quin problema tenen els mètodes directes?",["Que no són gens fiables","Que només arriben a pocs quilòmetres","Que necessiten un terratrèmol"],1,"Només arriben als primers quilòmetres, i el centre és a 6.371 km."],
     ["En què es basa el mètode sísmic?",["En les ones, que canvien de velocitat segons el material","En les mostres de roca que s'extreuen de les perforacions profundes","En la temperatura de l'aigua dels pous"],0,"Les ones sísmiques canvien de velocitat segons el material que travessen."],
     ["Què són les ones sísmiques?",["Vibracions que viatgen per dins de la Terra","Onades molt grans del mar, provocades pel vent fort","Raigs de llum que surten dels volcans"],0,"Són vibracions que viatgen per dins de la Terra, com les ones d'una pedra tirada a l'aigua."],
     ["Quin d'aquests NO és un mètode indirecte?",["El mètode gravimètric","Un pou de petroli","El mètode geotèrmic"],1,"Un pou de petroli treu mostres de roca: és un mètode directe."],
     ["Fins on arriben a estudiar els mètodes indirectes?",["Fins al centre de la Terra","Només fins a 3 km","Només fins a 7 km"],0,"Els indirectes mesuren des de la superfície i arriben fins al centre (6.371 km)."]]},
 {id:"roques",ic:"🏔️",col:"#7c2d12",titol:"Els tres tipus de roques",font:"Esquema · full 2 · secció 3 · diapositiva 12",
  idea:"L'escorça és feta de roques, i les roques, de minerals. Hi ha tres grans tipus de roques: magmàtiques, metamòrfiques i sedimentàries.",
  pts:["<b>Roca</b>: barreja natural de grans d'un o de diversos <b>minerals</b> (el granit d'una vorera).",
   "<b>Magmàtiques</b>: es formen quan el <b>magma es refreda</b>, en un volcà o a dins la Terra. Ex.: la pedra fosca d'una zona de volcans, com la Garrotxa.",
   "<b>Metamòrfiques</b>: roques que es <b>transformen sense fondre's</b> per molta <b>pressió i calor</b>, enterrades molt endins. «Meta» vol dir canvi.",
   "<b>Sedimentàries</b>: es formen quan els <b>sediments es compacten i perden aigua</b>, durant milions d'anys. Ex.: Montserrat, fet de còdols de riu enganxats.",
   "<b>Magma</b>: roca fosa de l'interior de la Terra. Quan surt per un volcà es diu <b>lava</b>.",
   "<b>Sediments</b>: trossets de roca que l'aigua o el vent deixen en un lloc (la sorra de la platja)."],
  truc:"Les tres M-M-S: Magmàtiques (magma que es refreda), Metamòrfiques (meta = canvi) i Sedimentàries (sediments compactats).",
  compte:"La metamòrfica es fa SENSE fondre's. Si la roca es fon, ja és magma.",
  fc:[["Què és una roca?","Una barreja natural de grans d'un o de diversos minerals."],["Com es forma una roca magmàtica?","Quan el magma es refreda."],["Com es forma una roca metamòrfica?","Per molta pressió i calor, sense fondre's."],["Com es forma una roca sedimentària?","Quan els sediments es compacten i perden aigua."],["Què vol dir «meta»?","Canvi."],["Un exemple de roca sedimentària a Catalunya?","Montserrat (còdols de riu enganxats)."]],
  q:[["Com es forma una roca magmàtica?",["Quan el magma es refreda","Quan els sediments es compacten","Per pressió i calor, sense fondre's"],0,"El magma es refreda, en un volcà o a dins la Terra, i es fa roca magmàtica."],
     ["Les roques metamòrfiques es formen…",["quan una roca es fon del tot","per molta pressió i calor, sense fondre's","quan la sorra de la platja s'asseca al sol de l'estiu"],1,"Es transformen sense fondre's. Si la roca es fon, es converteix en magma."],
     ["Montserrat està fet de còdols de riu enganxats. Quin tipus de roca és?",["Sedimentària","Magmàtica","Metamòrfica"],0,"Són sediments (còdols) que es van compactar: roca sedimentària."],
     ["La pedra fosca de la zona volcànica de la Garrotxa és una roca…",["sedimentària","magmàtica","metamòrfica"],1,"Ve del magma dels volcans, que es va refredar: és magmàtica."],
     ["Què vol dir «meta» a la paraula «metamòrfica»?",["Pedra","Canvi","Foc"],1,"«Meta» vol dir canvi: les metamòrfiques són roques canviades."],
     ["Què és una roca?",["Una barreja natural de grans de minerals","Un sol mineral, sempre pur, brillant i amb cares planes","Un tros de lava encara calenta"],0,"La roca és la barreja; el mineral, l'ingredient."],
     ["Què és el magma?",["Roca fosa de l'interior de la Terra","La sorra i els còdols que porten els rius fins al mar","Un mineral molt dur"],0,"El magma és roca fosa; quan surt per un volcà es diu lava."],
     ["Quina frase és correcta?",["Una roca i un mineral són exactament el mateix","Si una roca es fon, es converteix en magma","Les roques sedimentàries surten dels volcans"],1,"Si una roca s'escalfa tant que es fon, torna a ser magma."]]},
 {id:"cicle",ic:"♻️",col:"#dc2626",titol:"El cicle de les roques",font:"Esquema · full 2 · secció 4 · diapositiva 13",
  idea:"Les roques es van transformant d'un tipus a l'altre sense parar, en un cicle, com el cicle de l'aigua.",
  pts:["<b>Refredament</b>: el magma es refreda → <b>roca magmàtica</b>.",
   "<b>Erosió</b>: la pluja, el gel, el vent i les ones trenquen les roques → <b>sediments</b>, que els rius porten al mar.",
   "<b>Consolidació</b>: els sediments es compacten i perden aigua durant milions d'anys → <b>roca sedimentària</b>.",
   "<b>Metamorfisme</b>: una roca enterrada molt endins, amb pressió i calor → <b>roca metamòrfica</b>.",
   "<b>Fusió</b>: si s'escalfa tant que es fon → <b>magma</b>, i el cicle torna a començar.",
   "Qualsevol roca que surt a la superfície (aixecada en una muntanya) torna a patir l'erosió."],
  truc:"«Recorda El Cicle Molt Fàcil» = Refredament, Erosió, Consolidació, Metamorfisme, Fusió.",
  compte:"No confonguis el metamorfisme (es transforma sense fondre's) amb la fusió (es fon i fa magma).",
  fc:[["Què fa el refredament?","Converteix el magma en roca magmàtica."],["Què fa l'erosió?","Trenca les roques i en fa sediments."],["Què fa la consolidació?","Converteix els sediments en roca sedimentària."],["Què fa el metamorfisme?","Converteix una roca en metamòrfica amb pressió i calor."],["Què fa la fusió?","Fon la roca i la torna magma."],["El truc del cicle?","«Recorda El Cicle Molt Fàcil»."]],
  q:[["El magma es refreda i es converteix en…",["roca magmàtica","roca sedimentària","sediments"],0,"El refredament del magma fa roques magmàtiques."],
     ["Com es diu el procés en què els sediments es compacten i perden aigua?",["Fusió","Consolidació","Erosió"],1,"La consolidació converteix els sediments en roca sedimentària."],
     ["La pluja, el gel, el vent i les ones trenquen les roques. Com es diu aquest procés?",["Erosió","Metamorfisme","Refredament"],0,"L'erosió trenca les roques i en fa sediments."],
     ["Què passa si una roca s'escalfa tant que es fon?",["Es converteix en magma","Es converteix en sediments","Es fa roca sedimentària"],0,"La fusió torna la roca a magma i el cicle torna a començar."],
     ["Una roca enterrada molt endins rep molta pressió i calor, però no es fon. Què li passa?",["Fusió","Metamorfisme","Consolidació"],1,"Es transforma sense fondre's: és el metamorfisme."],
     ["Després de l'erosió, on van a parar els materials?",["Als rius i al mar, com a sediments","A l'interior de la Terra, fins al nucli extern","A dins del magma d'un volcà"],0,"Els rius porten els materials erosionats al mar, on es dipositen com a sediments."],
     ["A què s'assembla el cicle de les roques?",["Al cicle de l'aigua: no s'atura mai","A un camí que comença i s'acaba en un sol lloc","A una cosa que només passa un cop"],0,"Com el cicle de l'aigua, les transformacions de les roques no s'aturen mai."],
     ["Quin és l'ordre del truc, començant pel magma?",["Refredament, erosió, consolidació, metamorfisme, fusió","Erosió, fusió, refredament, consolidació, metamorfisme","Fusió, metamorfisme, consolidació, erosió, refredament"],0,"«Recorda El Cicle Molt Fàcil»: Refredament, Erosió, Consolidació, Metamorfisme, Fusió."]]},
 {id:"minerals",ic:"💎",col:"#7c3aed",titol:"Què és un mineral",font:"Esquema · full 2 · secció 5 · diapositiva 14",
  idea:"Un mineral és un sòlid natural i inorgànic, de composició química definida i amb els àtoms ordenats.",
  pts:["<b>Sòlid natural</b>: no són minerals els líquids, els gasos ni les coses fabricades per les persones.",
   "<b>Inorgànic</b>: no són minerals les substàncies fetes pels éssers vius ni les que en formen part.",
   "<b>Composició química definida</b>: no són minerals les substàncies amb una proporció variable d'elements.",
   "<b>Àtoms ordenats</b>: si els àtoms estan desordenats, és un <b>mineraloide</b>.",
   "Ha de complir <b>les 4 condicions</b>. El quars, per exemple, sí que és un mineral.",
   "<b>Roca ≠ mineral</b>: el mineral és l'ingredient; la roca, la barreja."],
  truc:"Un mineral diu «NO SID»: Natural, Ordenat, Sòlid, Inorgànic i composició Definida.",
  compte:"Una perla és dura i brillant, però NO és un mineral: la fabrica un ésser viu (l'ostra).",
  fc:[["Què és un mineral?","Un sòlid natural i inorgànic, de composició definida i amb els àtoms ordenats."],["Què és un mineraloide?","Un sòlid amb els àtoms desordenats."],["L'aigua líquida és un mineral?","No: no és sòlida."],["Una perla és un mineral?","No: la fa un ésser viu (no és inorgànica)."],["Un got de vidre és un mineral?","No: és fabricat i té els àtoms desordenats."],["Roca o mineral: quin és la barreja?","La roca."]],
  q:[["Quina d'aquestes coses és un mineral?",["Un cristall de quars de la muntanya","Una perla que ha fabricat una ostra","Un got de vidre"],0,"El quars compleix les 4 condicions. La perla la fa un ésser viu i el vidre és fabricat."],
     ["Per què l'aigua líquida d'un riu NO és un mineral?",["Perquè és líquida i un mineral ha de ser sòlid","Perquè no és natural","Perquè té els àtoms ordenats"],0,"Un mineral ha de ser sòlid, i l'aigua del riu és líquida."],
     ["Per què una perla NO és un mineral?",["Perquè és massa petita i brillant per ser-ho","Perquè la fabrica un ésser viu","Perquè és líquida"],1,"La fa l'ostra, un ésser viu, i un mineral ha de ser inorgànic."],
     ["Un got de vidre fet en una fàbrica, és un mineral?",["Sí, perquè és sòlid, dur i el pots trobar a tot arreu","No, perquè l'ha fabricat una persona","Sí, perquè té els àtoms ordenats"],1,"No és natural: l'ha fet una persona. A més, el vidre té els àtoms desordenats."],
     ["Com es diu un sòlid que té els àtoms desordenats?",["Mineraloide","Mineral","Cristall"],0,"Si té els àtoms desordenats no és mineral: és un mineraloide."],
     ["Quina diferència hi ha entre una roca i un mineral?",["Són exactament el mateix","La roca és una barreja de minerals","El mineral és una barreja de roques"],1,"El mineral és l'ingredient; la roca, la barreja."],
     ["Quantes condicions ha de complir una substància per ser un mineral?",["Només una","Les quatre","Només dues"],1,"Sòlid natural, inorgànic, composició definida i àtoms ordenats: les quatre."],
     ["Què vol dir que un mineral és inorgànic?",["Que no l'ha fet cap ésser viu","Que és de color fosc i no fa gens de brillantor","Que té cares planes"],0,"Inorgànic: no l'ha fet cap ésser viu ni en forma part."]]},
 {id:"propietats",ic:"🔍",col:"#0891b2",titol:"Les propietats dels minerals",font:"Esquema · full 2 · secció 5.1 · diapositives 15 a 17",
  idea:"Cada mineral té unes propietats pròpies que serveixen per identificar-lo: forma, color, ratlla, exfoliació, brillantor i duresa.",
  pts:["<b>Forma</b>: formes geomètriques amb cares (<b>cristalls</b>), per l'ordre dels àtoms. La galena fa <b>cubs</b>; el quars, <b>prismes hexagonals</b>.",
   "<b>Color</b>: els colors que reflecteix amb llum blanca. La <b>malaquita</b> és verda; la <b>turquesa</b>, blava.",
   "<b>Ratlla</b>: el color de la <b>pols fina</b>. No canvia encara que tingui impureses. El talc pot ser de molts colors, però la seva ratlla sempre és <b>blanca</b>.",
   "<b>Exfoliació</b>: trencar-se en làmines o formes amb cares planes. La <b>mica</b> fa làmines; la pirita i la galena, cubs.",
   "<b>Brillantor</b> (esclat): com reflecteix la llum. <b>Metàl·lica</b> (com un metall), <b>vítria</b> (com un vidre), <b>adamantina</b> (com purpurina) o de <b>cera</b> (greixosa).",
   "<b>Duresa</b>: la resistència a ser ratllat. Es mesura amb l'escala de Mohs (tema següent)."],
  truc:"El color enganya, la ratlla no: per identificar un mineral, mira el color de la seva pols.",
  compte:"Ratlla ≠ duresa: la ratlla és el color de la pols; la duresa és el que costa ratllar-lo.",
  fc:[["Què és la ratlla?","El color de la pols fina d'un mineral."],["Què és l'exfoliació?","Trencar-se en làmines o formes amb cares planes."],["Què és la brillantor?","Com reflecteix la llum la superfície del mineral."],["Quina forma fa la galena?","Cubs."],["De quin color és la malaquita?","Verda."],["De quin color és la ratlla del talc?","Sempre blanca."],["Quins 4 tipus de brillantor hi ha?","Metàl·lica, vítria, adamantina i de cera."]],
  q:[["Què és la ratlla d'un mineral?",["El color de la pols","La resistència a ser ratllat","La forma dels seus cristalls"],0,"La ratlla és el color de la pols fina, la que deixa si el frecs contra una rajola."],
     ["Per què la ratlla serveix més que el color per identificar un mineral?",["Perquè no canvia encara que hi hagi impureses","Perquè sempre és negra, sigui quin sigui el mineral que proves","Perquè es veu de més lluny"],0,"El color pot canviar amb les impureses; la ratlla, no."],
     ["La mica es trenca en làmines primes. Quina propietat és?",["La duresa","L'exfoliació","La ratlla"],1,"L'exfoliació és trencar-se en làmines o formes amb cares planes."],
     ["Quina forma tenen els cristalls de la galena?",["Prismes hexagonals","Cubs","Làmines primes"],1,"La galena fa cubs; els prismes hexagonals són del quars."],
     ["Un mineral que reflecteix la llum com un metall té una brillantor…",["vítria","metàl·lica","adamantina"],1,"Metàl·lica: com la superfície d'un metall. La vítria s'assembla a un vidre."],
     ["El talc pot ser verd, blanc, negre o rosat. De quin color és la seva ratlla?",["Sempre blanca","Del mateix color que el mineral","Sempre negra"],0,"La ratlla del talc sempre és blanca, sigui del color que sigui el mineral."],
     ["Per què alguns minerals fan cristalls amb cares geomètriques?",["Per l'ordre dels seus àtoms","Perquè els tallen i els polim a les joieries","Per la calor del Sol"],0,"Els àtoms ordenats fan formes geomètriques amb cares: els cristalls."],
     ["Quin mineral té un color característic verd?",["La turquesa","La malaquita","La pirita daurada"],1,"La malaquita és verda; la turquesa, blava."]]},
 {id:"mohs",ic:"💪",col:"#0e7490",titol:"La duresa i l'escala de Mohs",font:"Esquema · full 2 · secció 5.1 · diapositiva 18",
  idea:"La duresa és la resistència d'un mineral a ser ratllat. Es mesura amb l'escala de Mohs, de l'1 (talc) al 10 (diamant): el més dur ratlla el més tou.",
  pts:["L'<b>escala de Mohs</b> compara amb 10 minerals de referència, de l'1 al 10.",
   "1 <b>talc</b> · 2 <b>guix</b> · 3 <b>calcita</b> · 4 <b>fluorita</b> · 5 <b>apatita</b>.",
   "6 <b>ortosa</b> · 7 <b>quars</b> · 8 <b>topazi</b> · 9 <b>corindó</b> · 10 <b>diamant</b>.",
   "El mineral <b>més dur ratlla</b> els que tenen <b>menys duresa</b>. El diamant ho ratlla tot; el talc no ratlla res.",
   "Fem de geòlegs: si un mineral ratlla la fluorita (4) però l'apatita (5) el ratlla a ell, la seva duresa és <b>entre 4 i 5</b>."],
  truc:"«Tinc Gana, Cal Fer Arròs O Quiche, Truita, Croquetes i Dolços» = Talc, Guix, Calcita, Fluorita, Apatita, Ortosa, Quars, Topazi, Corindó, Diamant.",
  compte:"«A ratlla B» vol dir que A és més dur que B. Si un mineral ratlla la fluorita, és MÉS dur que 4, no més tou!",
  fc:[["Què és la duresa?","La resistència d'un mineral a ser ratllat."],["El mineral més tou de l'escala?","El talc (1)."],["El mineral més dur de l'escala?","El diamant (10)."],["Quina duresa té el quars?","7."],["Quina duresa té la fluorita?","4."],["Qui ratlla qui?","El més dur ratlla el més tou."]],
  q:[["Quin és el mineral més dur de l'escala de Mohs?",["El quars","El diamant","El corindó"],1,"El diamant (10) ho ratlla tot."],
     ["Quin és el mineral més tou de l'escala de Mohs?",["El guix","El talc","La calcita"],1,"El talc (1) és el més tou: no ratlla cap altre mineral de l'escala."],
     ["Quina duresa té el quars?",["5","7","9"],1,"El quars té duresa 7: «… O Quiche…» és el setè del truc."],
     ["Un mineral ratlla la fluorita (4), però l'apatita (5) el ratlla a ell. Quina duresa té?",["Entre 4 i 5","Menys de 4","Més de 5"],0,"Ratlla la fluorita: més dur que 4. L'apatita el ratlla: més tou que 5."],
     ["El quars (7) i un mineral de duresa 4,5: qui ratlla qui?",["El mineral ratlla el quars","El quars ratlla el mineral","No es ratllen entre ells"],1,"El més dur ratlla el més tou: el quars (7) ratlla el mineral (4,5)."],
     ["Què vol dir la duresa d'un mineral?",["La resistència a ser ratllat","El seu pes","Com es trenca en làmines"],0,"La duresa és el que costa ratllar-lo; trencar-se en làmines és l'exfoliació."],
     ["Quin mineral va just després de la fluorita (4) a l'escala?",["La calcita","L'apatita","L'ortosa"],1,"Fluorita 4, apatita 5: «… Fer Arròs…»."],
     ["Quin mineral té duresa 1 i no pot ratllar cap altre mineral de l'escala?",["El talc","El guix","El diamant"],0,"El talc és l'1, el més tou de tots."],
     ["El diamant pot ratllar el corindó?",["Sí, perquè és més dur","No, perquè és més tou","No, tenen la mateixa duresa"],0,"El diamant (10) és més dur que el corindó (9), i el més dur ratlla el més tou."]]},
 {id:"litosfera",ic:"🧩",col:"#ea580c",titol:"La litosfera i les plaques",font:"Esquema · full 3 · seccions 6 i 7 · diapositives 19 i 20",
  idea:"La litosfera és l'escorça més la part de dalt del mantell. No és contínua: està trencada en plaques que es mouen molt a poc a poc.",
  pts:["<b>Litosfera</b> = <b>escorça + part superior del mantell</b>. És rígida. «Lito» vol dir pedra.",
   "No és una capa contínua: està trencada en <b>plaques litosfèriques o tectòniques</b> (com les peces d'un trencaclosques).",
   "Les plaques suren sobre l'<b>astenosfera</b>, que flueix molt a poc a poc.",
   "Les vores de les plaques coincideixen amb grans relleus: <b>dorsals oceàniques</b>, <b>fosses oceàniques</b> i <b>grans serralades</b>.",
   "<b>Geodinàmica interna</b>: els processos que neixen a dins la Terra i canvien el relleu. El motor és la <b>calor interna</b> del nucli i del mantell.",
   "Calor interna → les plaques es mouen → a les vores hi ha volcans, terratrèmols i serralades → el relleu canvia."],
  truc:"Un ou dur picat contra la taula: la closca queda sencera però feta trossos. Cada tros és una placa!",
  compte:"Litosfera (rígida, a dalt) no és astenosfera (flueix, a sota).",
  fc:[["Què és la litosfera?","L'escorça més la part de dalt del mantell."],["Què vol dir «lito»?","Pedra."],["Què és una placa tectònica?","Cada tros en què està trencada la litosfera."],["Sobre què suren les plaques?","Sobre l'astenosfera."],["On són les vores de les plaques?","A les dorsals oceàniques, les fosses oceàniques i les grans serralades."],["Quin és el motor de la geodinàmica interna?","La calor interna del nucli i del mantell."]],
  q:[["Què forma la litosfera?",["L'escorça i la part de dalt del mantell","Només l'escorça continental, sense el fons del mar","El mantell i el nucli extern"],0,"Litosfera = escorça + part superior del mantell."],
     ["Com està la litosfera?",["Trencada en plaques","Feta d'una sola peça","Fosa com la lava"],0,"Està partida en plaques litosfèriques o tectòniques, com un trencaclosques."],
     ["Sobre quina zona suren les plaques tectòniques?",["Sobre el nucli intern","Sobre l'astenosfera","Sobre la hidrosfera"],1,"L'astenosfera flueix molt a poc a poc i les plaques s'hi poden moure."],
     ["On coincideixen les vores de les plaques?",["Amb dorsals, fosses oceàniques i grans serralades","Amb els rius més llargs i els llacs més grans del món","Amb les ciutats més grans"],0,"Les vores coincideixen amb relleus molt notables: dorsals, fosses i serralades."],
     ["Què vol dir «lito»?",["Aigua","Pedra","Foc"],1,"«Lito» vol dir pedra: la litosfera és la closca de pedra de la Terra."],
     ["Quin és el motor de la geodinàmica interna?",["La calor interna del nucli i del mantell","L'energia del Sol","El vent i la pluja"],0,"La força de dins funciona gràcies a la calor interna de la Terra."],
     ["Com es mouen les plaques tectòniques?",["Molt a poc a poc","Molt de pressa, com un cotxe","No es mouen mai"],0,"Les plaques no estan quietes: es mouen molt lentament."],
     ["Quina frase és correcta?",["La litosfera flueix i l'astenosfera és rígida","La litosfera és rígida i l'astenosfera flueix","Litosfera i astenosfera són la mateixa capa"],1,"La litosfera (a dalt) és rígida; l'astenosfera (a sota) flueix."]]},
 {id:"limits",ic:"↔️",col:"#c2410c",titol:"Els límits entre plaques",font:"Esquema · full 3 · secció 7.1 · diapositiva 21",
  idea:"Hi ha tres tipus de límits entre plaques: constructius (es crea escorça), destructius (es destrueix) i passius (llisquen de costat).",
  pts:["<b>Constructiu</b> (dorsals oceàniques): les plaques <b>se separen</b> i es forma <b>escorça oceànica nova</b>.",
   "<b>Destructiu</b> (zones de subducció): una placa <b>llisca per sota</b> de l'altra i es <b>destrueix</b>. Es formen serralades i fosses.",
   "<b>Passiu</b> (falles de transformació): les plaques <b>llisquen de costat</b>. No es crea ni es destrueix escorça.",
   "<b>Dorsal oceànica</b>: serralada al fons del mar on dues plaques se separen (una cremallera que s'obre).",
   "<b>Subducció</b>: quan una placa s'enfonsa per sota d'una altra (una catifa que es fica sota una altra).",
   "<b>Falla</b>: trencament de les roques on els dos costats es mouen (una esquerda en una paret)."],
  truc:"C-D-P: Constructiu Crea, Destructiu Destrueix, Passiu Passa de costat.",
  compte:"En un límit passiu les plaques es freguen, però no es crea ni es destrueix escorça: no és destructiu!",
  fc:[["Límit constructiu?","Les plaques se separen i es crea escorça (dorsal oceànica)."],["Límit destructiu?","Una placa s'enfonsa sota l'altra (subducció)."],["Límit passiu?","Les plaques llisquen de costat (falla de transformació)."],["Què és la subducció?","Quan una placa s'enfonsa per sota d'una altra."],["Què és una dorsal oceànica?","Una serralada al fons del mar on dues plaques se separen."],["El truc dels límits?","C-D-P: Crea, Destrueix, Passa de costat."]],
  q:[["En quin límit es crea escorça oceànica nova?",["Constructiu","Destructiu","Passiu"],0,"Al límit constructiu (dorsal) les plaques se separen i es crea escorça nova."],
     ["En una zona de subducció, una placa llisca per sota de l'altra. Quin límit és?",["Passiu","Constructiu","Destructiu"],2,"La placa que baixa es destrueix: límit destructiu."],
     ["Dues plaques llisquen de costat en una falla de transformació. Quin límit és?",["Passiu","Destructiu","Constructiu"],0,"Llisquen de costat: límit passiu."],
     ["On hi ha els límits constructius?",["A les dorsals oceàniques","A les zones de subducció","A les falles de transformació"],0,"Les dorsals oceàniques són límits constructius."],
     ["Què és la subducció?",["Quan una placa s'enfonsa per sota d'una altra","Quan dues plaques se separen al fons del mar i surt magma","Quan una placa llisca de costat"],0,"Com una catifa que es fica sota una altra."],
     ["En un límit passiu, què passa amb l'escorça?",["Es crea escorça nova","Es destrueix escorça","No es crea ni es destrueix"],2,"Al límit passiu les plaques només llisquen de costat."],
     ["Què és una dorsal oceànica?",["Una serralada al fons del mar on les plaques se separen","Una fossa molt fonda on una placa s'enfonsa sota una altra","Una platja molt llarga"],0,"És com una cremallera que s'obre: hi surt escorça nova."],
     ["En quin tipus de límit es poden formar serralades i fosses?",["Constructiu","Destructiu","Passiu"],1,"Als límits destructius (subducció) es formen serralades i fosses."]]},
 {id:"manifest",ic:"🌋",col:"#b91c1c",titol:"Volcans, terratrèmols i serralades",font:"Esquema · full 3 · secció 7.2 · diapositiva 22",
  idea:"La força de dins es nota de tres maneres: volcans, terratrèmols i la formació de serralades (orogènesi).",
  pts:["<b>Volcans</b>: el <b>magma</b> aconsegueix sortir a la superfície a través de l'escorça. Quan surt, es diu <b>lava</b>.",
   "<b>Terratrèmols</b> (sismes): les roques de dins acumulen <b>tensió</b> i es <b>trenquen de cop</b>, sobretot a les <b>falles</b>. Com un regle que dobles fins que peta.",
   "<b>Orogènesi</b>: el <b>xoc de plaques</b> aixeca <b>serralades</b> o plega les roques fent <b>plecs</b>. Ex.: els <b>Pirineus</b> i l'<b>Himàlaia</b>.",
   "Tot passa sobretot a les <b>vores de les plaques</b>."],
  truc:"V-T-O: «La Terra Vomita, Tremola i fa Orografia» (Volcans, Terratrèmols, Orogènesi).",
  compte:"El terratrèmol no és una erupció: és un trencament de roques, sense magma.",
  fc:[["Què és un volcà?","El lloc per on el magma surt a la superfície."],["Com es diu el magma quan surt?","Lava."],["Què provoca un terratrèmol?","Roques que acumulen tensió i es trenquen de cop."],["Què és l'orogènesi?","La formació de serralades pel xoc de plaques."],["Dos exemples d'orogènesi?","Els Pirineus i l'Himàlaia."],["El truc V-T-O?","«La Terra Vomita, Tremola i fa Orografia»."]],
  q:[["Com es diu el magma quan surt a la superfície?",["Lava","Sediment","Escorça"],0,"Quan el magma surt per un volcà, es diu lava."],
     ["Per què hi ha terratrèmols?",["Perquè les roques acumulen tensió i es trenquen de cop","Perquè la pluja i el vent desgasten les muntanyes fins que cauen","Perquè plou molt"],0,"Com un regle que dobles fins que peta."],
     ["Què és l'orogènesi?",["La formació de serralades pel xoc de plaques","L'erupció d'un volcà quan el magma surt a fora i es refreda","El desgast de les roques pel vent"],0,"El xoc de plaques aixeca serralades o plega les roques."],
     ["Els Pirineus es van formar per…",["el xoc de plaques (orogènesi)","l'erosió d'un riu","un terratrèmol molt fort"],0,"Els Pirineus i l'Himàlaia són exemples d'orogènesi."],
     ["On passen sobretot els volcans i els terratrèmols?",["A les vores de les plaques","Al bell mig de les plaques, lluny de les vores","Al nucli de la Terra"],0,"Les vores de les plaques són on més es nota la força de dins."],
     ["Un terratrèmol és el mateix que una erupció volcànica?",["Sí, perquè en tots dos casos surt lava per una esquerda","No, és un trencament de roques sense magma","Sí, però més petit"],1,"El terratrèmol és un trencament de roques; a l'erupció surt magma."],
     ["On es trenquen sobretot les roques en un terratrèmol?",["A les falles","A les dorsals","Als rius"],0,"Les roques es trenquen sobretot a les falles."],
     ["Quines són les tres manifestacions de la geodinàmica interna?",["Volcans, terratrèmols i orogènesi","Meteorització, erosió, transport i sedimentació","Pluja, vent i gel"],0,"V-T-O: Volcans, Terratrèmols i Orogènesi."]]},
 {id:"agents",ic:"🌊",col:"#0369a1",titol:"Els agents externs i les quatre fases",font:"Esquema · full 4 · seccions 8 i 8.1 · diapositives 23 i 24",
  idea:"La geodinàmica externa és com els agents de fora modifiquen, modelen i destrueixen el relleu, en quatre fases: meteorització, erosió, transport i sedimentació.",
  pts:["<b>Geodinàmica externa</b>: com els <b>agents externs</b> modifiquen, modelen i destrueixen el relleu de la superfície.",
   "Els agents externs: l'<b>aigua</b>, el <b>vent</b>, la <b>gravetat</b> i els <b>éssers vius</b>.",
   "L'aigua actua de 5 maneres: <b>fluvial</b> (rius), <b>marina</b>, <b>glacial</b> (gel), <b>subterrània</b> i <b>pluvial</b> (pluja).",
   "Les 4 fases, en ordre: ① <b>meteorització</b> → ② <b>erosió</b> → ③ <b>transport</b> → ④ <b>sedimentació</b>.",
   "El Sol evapora l'aigua, i la pluja torna a començar la feina.",
   "La força de dins (interna) <b>aixeca</b> el relleu; la força de fora (externa) el <b>desgasta</b> i el modela."],
  truc:"Agents: «A-V-G-E» = Aigua, Vent, Gravetat, Éssers vius. Fases: «Mai Em Toca Seure» = Meteorització, Erosió, Transport, Sedimentació.",
  compte:"Primer va la meteorització i després l'erosió: no les giris!",
  fc:[["Què és la geodinàmica externa?","Com els agents externs modifiquen, modelen i destrueixen el relleu."],["Els 4 agents externs?","Aigua, vent, gravetat i éssers vius."],["Les 5 formes de l'aigua?","Fluvial, marina, glacial, subterrània i pluvial."],["Les 4 fases en ordre?","Meteorització, erosió, transport i sedimentació."],["El truc de les fases?","«Mai Em Toca Seure»."],["Interna o externa: quina aixeca el relleu?","La interna."]],
  q:[["Quins són els agents externs?",["Aigua, vent, gravetat i éssers vius","Volcans, terratrèmols, plaques i serralades","Magma, lava i calor interna"],0,"«A-V-G-E»: Aigua, Vent, Gravetat i Éssers vius."],
     ["Quin és l'ordre de les quatre fases de la geodinàmica externa?",["Erosió, meteorització, sedimentació i transport","Meteorització, erosió, transport i sedimentació","Transport, erosió, meteorització i sedimentació"],1,"«Mai Em Toca Seure»: Meteorització, Erosió, Transport, Sedimentació."],
     ["L'aigua glacial és l'aigua…",["dels rius","en forma de gel","de sota terra, subterrània"],1,"Glacial vol dir de gel (les glaceres)."],
     ["Què fa la geodinàmica externa amb el relleu?",["El desgasta i el modela","L'aixeca i fa serralades","Fa sortir el magma"],0,"La força de fora desgasta el relleu; la de dins l'aixeca."],
     ["Quina fase va just després de la meteorització?",["L'erosió","El transport","La sedimentació"],0,"Primer la roca es trenca al seu lloc (meteorització) i després els agents n'arrenquen els trossos (erosió)."],
     ["Quin d'aquests NO és un agent extern?",["El vent","Els éssers vius de la superfície","La calor del nucli"],2,"La calor del nucli és el motor de la força de dins, no de la de fora."],
     ["L'aigua que circula per sota de terra és l'aigua…",["pluvial","subterrània","marina"],1,"Subterrània vol dir de sota terra."],
     ["Quina és l'última fase de la geodinàmica externa?",["La sedimentació","L'erosió","La meteorització"],0,"Al final, els materials es dipositen: és la sedimentació."]]},
 {id:"meteo",ic:"🧊",col:"#0284c7",titol:"La meteorització",font:"Esquema · full 4 · secció 8.2 · diapositiva 25",
  idea:"La meteorització és quan la roca es trenca o s'altera al mateix lloc on és (in situ), sense moure's. N'hi ha de tres tipus: física, química i biològica.",
  pts:["<b>Meteorització</b>: alteració, trencament o descomposició de les roques <b>in situ</b> (al mateix lloc), pel contacte amb l'aire, l'aigua i els éssers vius.",
   "<b>Física (mecànica)</b>: la roca es trenca però <b>no canvia de composició</b>. Ex.: el <b>gel</b> que s'expandeix dins una esquerda; els <b>canvis de temperatura</b>.",
   "<b>Química</b>: els minerals <b>canvien</b> per reaccions amb l'aigua. Ex.: l'<b>oxidació</b> (com el rovell) i la <b>dissolució</b>.",
   "<b>Biològica</b>: la provoquen els <b>éssers vius</b>. Ex.: les <b>arrels</b> d'un arbre que aixequen la vorera, o els animals.",
   "<b>In situ</b> = al mateix lloc on és."],
  truc:"Física trenca, química canvia, biològica té arrels.",
  compte:"El gel dins una esquerda és meteorització FÍSICA, encara que hi hagi aigua: trenca la roca però no en canvia la composició.",
  fc:[["Què és la meteorització?","La roca es trenca o s'altera al mateix lloc, sense moure's."],["Què vol dir «in situ»?","Al mateix lloc on és."],["Meteorització física?","La roca es trenca sense canviar de composició (gel, temperatura)."],["Meteorització química?","Els minerals canvien per reaccions amb l'aigua (oxidació, dissolució)."],["Meteorització biològica?","La provoquen els éssers vius (arrels, animals)."],["El gel que trenca una roca: quin tipus és?","Física."]],
  q:[["Què vol dir que la meteorització passa «in situ»?",["Que la roca es queda al mateix lloc","Que la roca viatja pel riu","Que passa a dins del nucli"],0,"In situ = al mateix lloc on és: la roca no es mou."],
     ["L'arrel d'un pi esquerda una roca. Quina meteorització és?",["Física","Química","Biològica"],2,"La provoca un ésser viu: és biològica."],
     ["L'aigua del gel s'expandeix dins una esquerda i la roca peta. Quina meteorització és?",["Química, perquè hi ha aigua","Física (mecànica)","Biològica"],1,"El gel trenca la roca però no en canvia la composició: és física."],
     ["L'aigua de pluja dissol a poc a poc una roca. Quina meteorització és?",["Física","Química","Biològica"],1,"La dissolució canvia els minerals: és química."],
     ["En la meteorització física, la roca…",["es trenca però no canvia de composició","canvia de composició per culpa de les reaccions amb l'aigua","es fon i es converteix en magma"],0,"Física trenca; química canvia."],
     ["L'oxidació d'una roca (com el rovell) és una meteorització…",["química","física","biològica"],0,"L'oxidació és una reacció química amb l'aigua."],
     ["Quina diferència hi ha entre la meteorització i l'erosió?",["A la meteorització la roca no es mou; a l'erosió els trossos marxen","A l'erosió la roca es queda quieta i a la meteorització se'n va molt lluny","Són exactament el mateix procés"],0,"Meteorització: la roca es queda al seu lloc. Erosió: els trossos comencen a marxar."],
     ["Els canvis forts de temperatura entre el dia i la nit trenquen una roca. Quina meteorització és?",["Química","Física","Biològica"],1,"La roca es trenca sense canviar de composició: és física."]]},
 {id:"transport",ic:"🏞️",col:"#0f766e",titol:"Erosió, transport i sedimentació",font:"Esquema · full 4 · seccions 8.3 a 8.5 · diapositives 26 a 28",
  idea:"L'erosió arrenca els trossos de roca, el transport els porta cap avall i la sedimentació els diposita a les conques, on poden fer roques sedimentàries.",
  pts:["<b>Erosió</b>: els agents externs desgasten les roques i comencen a endur-se'n els trossos cap a la conca sedimentària.",
   "Què fa que un agent erosioni més o menys: la <b>intensitat de l'agent</b>, la <b>forma del relleu</b>, el <b>tipus de roca</b> i la <b>vegetació</b>. Cada agent deixa les seves formes erosives.",

 {t:"L'escorça i el mantell",q:"Compara l'escorça oceànica i la continental. Després explica què és l'astenosfera i per què és important.",p:["Oceànica: prima i jove (5-10 km)","Continental: gruixuda (25-70 km)","Astenosfera: zona del mantell superior on la roca flueix molt a poc a poc","Permet que les plaques es moguin"],

 {t:"Com es van formar les capes",q:"Explica en tres passos com es van formar les capes de la Terra.",p:["Els xocs dels planetesimals van escalfar i fondre la Terra","Els materials més densos (ferro i níquel) van baixar i van fer el nucli","Els menys densos van pujar cap a la superfície","En refredar-se es va formar l'escorça"],

 {t:"Com estudiem l'interior",q:"Compara els mètodes directes i els indirectes per estudiar l'interior de la Terra: com funcionen, un exemple de cada i un avantatge o un inconvenient.",p:["Directes: mostres de perforacions i sondejos","Exemple directe: pou de petroli, mina o Kola","Directes: molt fiables però poc profunds","Indirectes: mesuren des de la superfície; el més usat és el sísmic","Indirectes: arriben fins al centre"],

 {t:"Els tres tipus de roques",q:"Explica com es forma cada un dels tres tipus de roques i posa un exemple d'algun d'ells.",p:["Magmàtiques: el magma es refreda","Metamòrfiques: pressió i calor sense fondre's","Sedimentàries: sediments que es compacten i perden aigua","Un exemple (Garrotxa, Montserrat…)"],

 {t:"El cicle de les roques",q:"Explica el cicle de les roques amb els seus cinc processos, començant pel magma.",p:["Refredament: el magma fa roca magmàtica","Erosió: les roques es trenquen i fan sediments","Consolidació: els sediments fan roca sedimentària","Metamorfisme: amb pressió i calor fa roca metamòrfica","Fusió: la roca es fon i torna a ser magma"],

 {t:"Què és un mineral",q:"Digues si són minerals un cristall de quars, l'aigua d'un riu, una perla i un got de vidre, i explica per què fent servir les quatre condicions d'un mineral.",p:["Quars: sí, compleix les 4 condicions","Aigua: no, perquè no és sòlida","Perla: no, perquè la fa un ésser viu (no és inorgànica)","Vidre: no, perquè és fabricat (o té els àtoms desordenats)"],

 {t:"Les propietats dels minerals",q:"Explica la diferència entre la ratlla i la duresa d'un mineral, i per què la ratlla serveix més que el color per identificar-lo.",p:["Ratlla: el color de la pols fina","Duresa: la resistència a ser ratllat (escala de Mohs)","El color pot canviar amb les impureses","La ratlla no canvia (el talc sempre fa ratlla blanca)"],

 {t:"La duresa i l'escala de Mohs",q:"Tens un mineral que ratlla la fluorita, però l'apatita el ratlla a ell. Entre quins números de l'escala de Mohs és la seva duresa? Si hi passes un tros de quars, el ratllarà? Explica-ho.",p:["Fluorita = 4 i apatita = 5","La seva duresa és entre 4 i 5","El quars té duresa 7","El quars el ratllarà, perquè el més dur ratlla el més tou"],

 {t:"La litosfera i les plaques",q:"Explica què és la litosfera, com està i on són les vores de les plaques.",p:["L'escorça més la part de dalt del mantell","Està trencada en plaques tectòniques","Les plaques suren sobre l'astenosfera i es mouen a poc a poc","Les vores coincideixen amb dorsals, fosses oceàniques i grans serralades"],

 {t:"Els límits entre plaques",q:"Explica els tres tipus de límits entre plaques: on són i què passa a cadascun.",p:["Constructiu: a les dorsals, les plaques se separen i es crea escorça","Destructiu: a la subducció, una placa s'enfonsa i es destrueix","Passiu: a les falles de transformació, llisquen de costat","Al passiu no es crea ni es destrueix escorça"],

 {t:"Volcans, terratrèmols i serralades",q:"Explica com es formen els volcans, els terratrèmols i les serralades, i posa un exemple de serralada.",p:["Volcà: el magma surt a la superfície (lava)","Terratrèmol: les roques acumulen tensió i es trenquen de cop","Orogènesi: el xoc de plaques aixeca serralades","Exemple: els Pirineus o l'Himàlaia"],

 {t:"Els agents externs i les quatre fases",q:"Explica què és la geodinàmica interna i què és la geodinàmica externa, d'on surt la força de cadascuna, què fan amb el relleu i un exemple de cada una.",p:["Interna: processos de dins la Terra, moguts per la calor interna del nucli i el mantell","Externa: acció dels agents externs (aigua, vent, gravetat, éssers vius)","La interna aixeca el relleu i l'externa el desgasta i el modela","Un exemple de cada (volcà, Pirineus… / riu, dunes, delta…)"],

 {t:"La meteorització",q:"Explica què és la meteorització i els seus tres tipus, amb un exemple de cadascun.",p:["La roca es trenca o s'altera al mateix lloc (in situ)","Física: es trenca sense canviar de composició (el gel)","Química: els minerals canvien per reaccions amb l'aigua (oxidació, dissolució)","Biològica: la provoquen els éssers vius (les arrels)"],

 const cx=240,cy=272,R=[232,220,132,70],col=["#a8a29e","#f97316","#fbbf24","#fde047"],brd=["#57534e","#c2410c","#b45309","#a16207"];
 const semi=(r,f,b)=>`<path d="M${cx-r} ${cy}A${r} ${r} 0 0 1 ${cx+r} ${cy}Z" fill="${f}" stroke="${b}" stroke-width="1.5"/>`;
 const pt=(r,a)=>[cx+r*Math.cos(a*Math.PI/180),cy-r*Math.sin(a*Math.PI/180)].map(v=>v.toFixed(1));
 let s=`<svg viewBox="0 0 480 300" width="100%" style="max-width:480px" xmlns="http://www.w3.org/2000/svg" font-family="Nunito,Arial">`;

 s+=`<line x1="0" y1="${cy}" x2="480" y2="${cy}" stroke="#57534e" stroke-width="2"/>`;
 // lletres de les capes (a l'esquerra): A fora, amb línia
 const lletra=(l,r,a,fora)=>{const [x,y]=pt(r,a);if(!fora)return `<circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#1c1917" stroke-width="2"/><text x="${x}" y="${(+y+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="900">${l}</text>`;
  const [x2,y2]=pt(r+30,a);return `<line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#1c1917" stroke-width="1.5"/><circle cx="${x2}" cy="${y2}" r="13" fill="#fff" stroke="#1c1917" stroke-width="2"/><text x="${x2}" y="${(+y2+5).toFixed(1)}" text-anchor="middle" font-size="15" font-weight="900">${l}</text>`};
 s+=lletra("A",226,140,true)+lletra("B",176,140)+lletra("C",101,140)+lletra("D",34,140);
 // números de les discontinuïtats (a la dreta), amb línia cap a fora
 const num=(n,r,a)=>{const [x,y]=pt(r,a),[x2,y2]=pt(250,a);return `<circle cx="${x}" cy="${y}" r="3.5" fill="#1c1917"/><line x1="${x}" y1="${y}" x2="${x2}" y2="${y2}" stroke="#1c1917" stroke-width="1.5" stroke-dasharray="4,3"/><circle cx="${x2}" cy="${y2}" r="12" fill="#1c1917"/><text x="${x2}" y="${(+y2+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="900" fill="#fff">${n}</text>`};
 s+=num(1,220,58)+num(2,132,40)+num(3,70,22);

// ===== SO ALS MÒBILS (motor/eines/so-mobil.js · el mateix codi als mons i a la portada; tot.py el copia a index.html) =====
// Els navegadors només deixen engegar el so dins d'un gest de l'usuari, i en pantalles tàctils «pointerdown» NO compta:
// només pointerup, touchend, click i keydown. Per això hi ha UN sol AudioContext per pàgina (bnSo.context()) i es
// desbloqueja al primer d'aquests gestos: resume() + un buffer buit d'1 mostra (el truc d'iOS). Si el mòbil el posa en
// pausa («suspended» o «interrupted»: una trucada, canviar d'app…), es torna a engegar en tornar a la pàgina o al toc següent.
// IPHONE EN SILENCI (n2429, comprovat amb prova-so.html en un iPhone): amb el mòbil en silenci, Web Audio calla del tot encara
// que el context estigui «running», i navigator.audioSession no hi fa res. Un element <audio> sí que sona, i mentre n'hi ha un
// sonant, Web Audio també. Per això, a l'iPhone/iPad, al primer toc s'engega un <audio> de silenci en bucle (fet aquí mateix,
// sense fitxers) i s'atura quan la pàgina no es veu o quan el so de l'app està apagat (bnSo.sessio(false)).

   try{ctx.addEventListener("statechange",()=>{if(ctx.state!=="running"&&ctx.state!=="closed")arma()})}catch(e){}}
  return ctx}
 // mig segon de silenci en WAV (8 kHz, mono): l'<audio> que fa que l'iPhone deixi sonar Web Audio en mode silenci
 function silenci(){const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}

 function engegaMut(){if(!calMut())return;try{
   if(!mut){mut=new Audio(silenci());mut.loop=true;mut.preload="auto";mut.setAttribute("playsinline","");mut.setAttribute("x-webkit-airplay","deny");mut.disableRemotePlayback=true}
   if(mut.paused){const p=mut.play();if(p&&p.catch)p.catch(()=>arma())}}catch(e){}}

  if(c){if(c.state!=="running")resum(c);try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0)}catch(e){}}

  if((!c||c.state==="running")&&mutOk)desarma();else if(c&&c.state!=="running"){try{c.resume().then(()=>{if(c.state==="running"&&(!calMut()||(mut&&!mut.paused)))desarma()},()=>{})}catch(e){}}}

  quanSigui(f){if(tocat)f();else pendents.push(f)}, // f s'executa dins del primer gest (o ara mateix, si ja n'hi ha hagut un)
  // so de l'app engegat o apagat: a l'iPhone, engegat = que soni encara que el mòbil estigui en silenci; apagat = res de fons
  sessio(on){volOn=!!on;try{if(navigator.audioSession)navigator.audioSession.type=on?"playback":"auto"}catch(e){}

document.addEventListener("keydown",e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const tg=e.target,enCamp=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
 // 1) Elements amb role="button" i tabindex="0" (tiles, xips, targetes, files de taula…)
 if(!enCamp&&(e.key==="Enter"||e.key===" ")&&tg&&tg.getAttribute&&tg.getAttribute("role")==="button"&&tg.tagName!=="BUTTON"){
  e.preventDefault();tg.click();return;
 }
 // 2) Tancar popups / pantalles superposades amb Escape o Enter/Espai a .arc
 if(e.key==="Escape"){
  const pt=document.getElementById("popTastWrap");if(pt){e.preventDefault();tancaConvidaPin();return}
  const pop=document.getElementById("popEst");if(pop){e.preventDefault();tancaEstrelles();const bt=document.getElementById("punts");if(bt)bt.focus();return}
  const arc=document.querySelector(".arc");if(arc){e.preventDefault();arc.click();return}
  const nitAc=document.getElementById("btNitAcabo");if(nitAc){e.preventDefault();nitAc.click();return}
  const desc=document.getElementById("dSalta");if(desc){e.preventDefault();desc.click();return}
 }
 const arc=document.querySelector(".arc");
 if(arc&&(e.key==="Enter"||e.key===" ")){e.preventDefault();arc.click();return}
 if(enCamp||document.querySelector(".descans"))return;
 // 3) Si hi ha el taller de mates amb el seu propi teclat, no interferir
 if(document.querySelector(".mx-tec"))return;
 // 4) Targetes (flashcards): Espai / ↑ / ↓ gira; ← / → passa targeta
 const fl=document.querySelector("#zona .flash");
 if(fl){
  if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();fl.click();return}
  if(e.key==="ArrowLeft"){const b=document.getElementById("fcAnt");if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(e.key==="ArrowRight"){const b=document.getElementById("fcSeg");if(b&&!b.disabled){e.preventDefault();b.click()}return}
 }
 // 5) Tests, Exàmens i Repàs: 1/2/3 o A/B/C selecciona opció; Enter o → avança; P demana pista
 const k=e.key.toUpperCase();
 const idx={"1":0,"2":1,"3":2,"A":0,"B":1,"C":2}[k];
 if(idx!==undefined){
  const germs=[...document.querySelectorAll(".opt.germ:not(:disabled)")];
  if(germs[idx]){e.preventDefault();germs[idx].click();return}
  const opts=[...document.querySelectorAll(".opt:not(.germ):not(:disabled):not(.fora)")];
  if(opts[idx]){e.preventDefault();opts[idx].click();return}
 }
 if(k==="P"){
  const bp=document.getElementById("pista");if(bp&&bp.offsetParent!==null){e.preventDefault();bp.click();return}
 }
 if((e.key==="Enter"&&!(tg&&tg.tagName==="BUTTON"&&tg.id!=="seg"&&tg.id!=="exSeg"&&tg.id!=="jgSeg"))||e.key==="ArrowRight"){
  const sg=document.getElementById("seg")||document.getElementById("exSeg")||document.getElementById("jgSeg");
  if(sg&&!sg.disabled){e.preventDefault();sg.click();return}
 }
 if(e.key==="ArrowLeft"){
  const ant=document.getElementById("exAnt");
  if(ant&&!ant.disabled){e.preventDefault();ant.click();return}
 }
});
