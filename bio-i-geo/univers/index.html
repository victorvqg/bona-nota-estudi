<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biologia i Geologia — Bloc 1: Univers, Terra i cèl·lula · 1r ESO | Bona Nota</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
 --fosc:#1f2d3d;--blau:#3b82f6;--blau2:#2563eb;--verd:#16a34a;--verd-cl:#dcfce7;--verm:#dc2626;--verm-cl:#fee2e2;
 --groc:#f59e0b;--groc-cl:#fef3c7;--lila:#7c3aed;--fons:#eef2f8;--card:#fff;--txt:#1e293b;--suau:#64748b;--vora:#e2e8f0;
 --r:18px;--om:0 1px 2px #0f172a0d,0 6px 18px #0f172a12;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,Arial,sans-serif;background:var(--fons);color:var(--txt);font-size:16.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
/* capçalera */
header{background:linear-gradient(120deg,var(--g1,#1e3a8a),var(--g2,#2563eb) 55%,var(--g3,#0ea5e9));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 14px #1e3a8a40}
.hd{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .tt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.logo .tt small{font-size:13px;font-weight:700;opacity:.85}
@media(max-width:520px){.logo{font-size:16px}.logo #hola{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
.benv .tema{margin:4px 0 0;font-weight:900;color:var(--blau2)}
.pill{background:#ffffff26;border:1px solid #ffffff40;padding:5px 12px;border-radius:999px;font-weight:800;white-space:nowrap}
nav{max-width:960px;margin:0 auto;padding:0 10px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;color:#dbeafe;padding:7px 13px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap;font-size:15px}
nav button.on{background:#fff;color:var(--blau2)}
nav a.surt{display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-weight:900;font-size:15px;padding:5px 12px;border-radius:999px;border:2px solid #ffffff66;white-space:nowrap;margin-right:4px}
nav a.surt:hover,nav a.surt:focus-visible{background:#ffffff26;border-color:#fff;outline:none}
.surt-gran{display:block;text-align:center;margin-top:16px;color:var(--suau);font-weight:800;text-decoration:none}
.surt-gran:hover{color:var(--blau2)}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
/* elements bàsics */
h2.sec{font-size:21px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
.box{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--om);margin-bottom:14px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--blau);color:#fff;box-shadow:0 3px 0 var(--blau2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blau2)}
.btn.sec{background:#fff;color:var(--fosc);box-shadow:0 0 0 2px var(--vora) inset,0 3px 0 var(--vora)}
.btn.verd{background:var(--verd);box-shadow:0 3px 0 #15803d}
.btn.verm{background:var(--verm);box-shadow:0 3px 0 #991b1b}
.btn:disabled{opacity:.45;cursor:default}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.prog{color:var(--suau);font-size:14.5px;font-weight:700}
/* hero */
.hero{background:linear-gradient(135deg,#fff,#eff6ff);border-radius:22px;padding:20px 22px;box-shadow:var(--om);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .av{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.hero h1{margin:0;font-size:24px}
.hero p{margin:2px 0 0;color:var(--suau)}
.hero .stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.mini{background:#fff;border:2px solid var(--vora);border-radius:14px;padding:6px 12px;text-align:center;min-width:78px}
.mini b{display:block;font-size:20px;line-height:1.2}
.mini small{color:var(--suau);font-weight:700;font-size:12px}
.continua{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--groc-cl);border:2px solid #fcd34d;border-radius:16px;padding:12px 16px;cursor:pointer}
.continua b{flex:1}
/* graella de temes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--om);transition:transform .15s,box-shadow .15s;position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0f172a1f}
.tile .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
.tile b{font-size:16.5px;line-height:1.25}
.tile small{color:var(--suau);font-weight:600}
.tile .peu{margin-top:auto;display:flex;align-items:center;gap:8px}
.barra{flex:1;height:8px;background:#eef2f7;border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#22c55e,#16a34a)}
.pc{font-size:13px;font-weight:800;color:var(--suau);min-width:34px;text-align:right}
.segell{position:absolute;top:12px;right:12px;font-size:20px}
.num{position:absolute;top:14px;right:14px;font-size:12px;font-weight:900;color:#94a3b8}
.etq{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#4338ca}
.etq.ap{background:#ecfdf5;color:#047857}
/* pantalla tema */
.cap-tema{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.cap-tema .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.cap-tema h2{margin:0;font-size:22px;line-height:1.2}
.passos{display:flex;gap:8px;margin:12px 0 16px}
.passos button{flex:1;border:0;background:#fff;border-radius:14px;padding:10px 6px;font-weight:800;cursor:pointer;color:var(--suau);box-shadow:var(--om);font-size:15px}
.passos button.on{background:var(--fosc);color:#fff}
.passos button.fet::after{content:" ✓";color:#22c55e}
.idea{background:var(--verd-cl);border:2px solid #86efac;border-radius:14px;padding:12px 16px;font-weight:800}
.idea small{display:block;font-size:11.5px;letter-spacing:.6px;color:#15803d;font-weight:900}
.truc{background:var(--groc-cl);border:2px solid #fcd34d;border-radius:14px;padding:12px 16px;margin-top:12px}
.compte{background:var(--verm-cl);border-left:6px solid var(--verm);border-radius:0 14px 14px 0;padding:10px 14px;margin-top:12px}
ul.pts{padding-left:0;list-style:none;margin:14px 0 0}
ul.pts li{position:relative;padding:8px 0 8px 30px;border-bottom:1px dashed var(--vora)}
ul.pts li:last-child{border-bottom:0}
ul.pts li::before{content:"";position:absolute;left:6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--blau)}
/* targetes */
.flash{perspective:1000px;height:240px;cursor:pointer;margin:12px auto;max-width:540px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flash.gir .in{transform:rotateY(180deg)}
.flash .cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;font-weight:800;box-shadow:0 10px 26px #0f172a22}
.flash .davant{background:#fff;border:3px solid #bfdbfe}
.flash .darrere{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;transform:rotateY(180deg);font-weight:700;font-size:18.5px}
.flash .cara small{position:absolute;bottom:12px;font-size:12.5px;font-weight:700;opacity:.6}
.punts-fc{display:flex;justify-content:center;gap:6px;margin-top:4px}
.punts-fc i{width:9px;height:9px;border-radius:50%;background:#cbd5e1}
.punts-fc i.on{background:var(--blau);transform:scale(1.3)}
/* test */
.pregunta{font-size:19px;font-weight:800;margin:8px 0 12px;line-height:1.35}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--vora);background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16.5px;cursor:pointer;transition:border-color .12s,background .12s;color:var(--txt)}
.opt .ll{width:30px;height:30px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;color:var(--suau)}
.opt:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}
.opt.ok{background:var(--verd-cl);border-color:#22c55e}.opt.ok .ll{background:#22c55e;color:#fff}
.opt.ko{background:var(--verm-cl);border-color:#ef4444}.opt.ko .ll{background:#ef4444;color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:#eff6ff;border:2px solid #bfdbfe}
.fb.ok{background:var(--verd-cl);border-color:#86efac}.fb.ko{background:#fff7ed;border-color:#fdba74}
.barra-test{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.barra-test i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .3s}
.gran{font-size:56px;text-align:center;line-height:1}
.valor{display:flex;justify-content:center;gap:12px;margin-top:10px}
.valor button{border:2px solid var(--vora);background:#fff;border-radius:16px;padding:10px 14px;font-size:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.valor button small{font-size:12.5px;font-weight:800;color:var(--suau)}
.valor button.on{border-color:var(--blau);background:#eff6ff}
/* jocs */
.chip{display:inline-block;border:2px solid #cbd5e1;border-radius:12px;padding:9px 14px;margin:5px;cursor:pointer;background:#fff;font-weight:800;user-select:none;transition:.12s}
.chip:hover{border-color:#93c5fd}
.chip.sel{background:var(--fosc);border-color:var(--fosc);color:#fff}
.chip.ok{background:var(--verd);border-color:var(--verd);color:#fff;cursor:default}
.chip.ko{animation:tremola .35s;border-color:#ef4444}
@keyframes tremola{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pila{display:flex;flex-direction:column-reverse;gap:5px;margin:12px 0}
.pila div{border-radius:12px;padding:10px 14px;font-weight:800;animation:apareix .3s}
@keyframes apareix{from{opacity:0;transform:translateY(8px)}}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.mh{display:none}table.an{font-size:14px}.col2{grid-template-columns:1fr}.hero .stats{margin-left:0}}
.cub{border:3px dashed #cbd5e1;border-radius:16px;min-height:110px;padding:10px;cursor:pointer;background:#f8fafc}
.cub:hover{border-color:#93c5fd;background:#f0f7ff}
.cub h4{margin:0 0 8px}
textarea{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--vora);resize:vertical;background:#fcfdff}
textarea:focus,input:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 4px #bfdbfe66}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer;padding:8px 10px;border-radius:10px;background:#fff;border:2px solid var(--vora)}
label.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--verd)}
details summary{cursor:pointer;font-weight:800;color:var(--blau2)}
/* benvinguda */
.benv{max-width:460px;margin:30px auto;text-align:center}
.benv .gran{font-size:70px}
.benv input{width:100%;font:inherit;font-size:20px;font-weight:800;text-align:center;padding:14px;border-radius:16px;border:3px solid var(--vora);margin:14px 0}
/* analítica */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--om)}
.kpi small{color:var(--suau);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:26px;line-height:1.2;margin-top:2px}
.kpi span{font-size:13px;color:var(--suau);font-weight:700}
table.an{width:100%;border-collapse:collapse;font-size:15px}
table.an th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--suau);padding:8px 6px;border-bottom:2px solid var(--vora)}
table.an td{padding:9px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.semaf{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.valoracio{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:2px solid #c7d2fe;border-radius:18px;padding:16px 18px}
.valoracio h3{margin:0 0 6px}
.llista-err li{margin:6px 0}
.modal{position:fixed;inset:0;background:#0f172a80;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{max-width:420px;text-align:center}
.peu-pag{text-align:center;color:#94a3b8;font-size:13px;margin:26px 0 8px}
.confeti{position:fixed;top:-20px;font-size:22px;z-index:60;pointer-events:none;animation:cau 1.8s linear forwards}
@keyframes cau{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

.perfils{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.perfil{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--vora);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;font-family:inherit;font-size:16px;color:var(--txt)}
.perfil:hover{border-color:#93c5fd;background:#f8fbff}.perfil.on{border-color:var(--blau)}
.perfil small{display:block;color:var(--suau);font-weight:700}
.av2{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;text-transform:uppercase}
/* arcade */
.arc{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#1e1b4b,#020617 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;animation:arcIn .25s ease-out;overflow:hidden}
@keyframes arcIn{from{opacity:0;transform:scale(1.15)}}
.arc canvas{position:absolute;inset:0;width:100%;height:100%}
.arc .flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.arc .t1{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(22px,7vw,46px);color:#facc15;text-shadow:4px 4px 0 #b91c1c,0 0 24px #facc15aa;text-align:center;line-height:1.35;animation:bota .6s cubic-bezier(.3,1.6,.5,1) both,pampalluga 1s steps(2) .6s infinite}
@keyframes bota{from{transform:translateY(-120px) scale(.4)}}
@keyframes pampalluga{50%{color:#fde68a}}
.arc .t2{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.4vw,18px);color:#a5f3fc;margin-top:22px;text-align:center;line-height:1.8}
.arc .t3{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(28px,9vw,54px);color:#fff;margin-top:14px;text-shadow:0 0 18px #38bdf8}
.arc .estr{position:relative;font-size:clamp(34px,10vw,56px);margin-top:10px;letter-spacing:6px}
.arc .estr span{display:inline-block;animation:estr .45s cubic-bezier(.3,1.8,.5,1) both;filter:drop-shadow(0 0 10px #facc15)}
@keyframes estr{from{transform:scale(0) rotate(-180deg)}}
.arc .t4{position:relative;font-family:'Press Start 2P',monospace;font-size:11px;color:#94a3b8;margin-top:26px;animation:pampalluga2 1.2s steps(2) infinite}
@keyframes pampalluga2{50%{opacity:0}}
.arc .rec{position:relative;font-family:'Press Start 2P',monospace;font-size:12px;color:#020617;background:#4ade80;padding:8px 12px;margin-top:16px;transform:rotate(-3deg);animation:bota .5s .9s both}
.nivell{margin-top:14px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#f5f3ff,#eef2ff);border:2px solid #c4b5fd;border-radius:16px;padding:12px 16px;cursor:pointer}
.nivell .nic{font-size:38px;line-height:1;flex:none}
.nivell b{display:block;font-size:17px}
.nivell small{color:var(--suau);font-weight:700}
.nivell .barra{margin:6px 0 4px;height:10px}
.nivell .barra i{background:linear-gradient(90deg,#a78bfa,#7c3aed)}
.rangs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rang{border:2px solid var(--vora);border-radius:14px;padding:10px 8px;text-align:center;background:#fff}
.rang span{display:block;font-size:30px;line-height:1.1}
.rang b{display:block;font-size:14px}
.rang small{color:var(--suau);font-weight:700;font-size:12px}
.rang.bloc{opacity:.45;filter:grayscale(1)}
.rang.ara{border-color:#7c3aed;background:#f5f3ff;box-shadow:0 0 0 3px #ddd6fe}
.arc.niv{background:radial-gradient(circle at 50% 40%,#3b0764,#020617 75%)}
.arc.niv .t1{color:#e9d5ff;text-shadow:4px 4px 0 #7c3aed,0 0 24px #c084fcaa}
.arc.niv .nic{position:relative;font-size:clamp(64px,20vw,110px);margin-top:12px;animation:estr .6s cubic-bezier(.3,1.8,.5,1) .3s both;filter:drop-shadow(0 0 18px #c084fc)}
.vol{display:flex;align-items:center;gap:4px;background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:2px 10px 2px 4px;flex:none}
.so-btn{background:none;border:0;color:#fff;font-size:17px;cursor:pointer;padding:3px 4px;line-height:1}
.vol input{width:76px;accent-color:#fff;cursor:pointer;margin:0}
.vol b{font-size:13px;min-width:9px;text-align:center}
@media(max-width:520px){.vol input{width:54px}.vol{padding-right:7px}}
body.tremola main{animation:tremola .4s}
.arc.ko{background:radial-gradient(circle at 50% 40%,#3b0a0a,#0b0202 75%)}
.arc.ko .t1{color:#f87171;text-shadow:4px 4px 0 #450a0a,0 0 20px #ef444466;animation:cau1 .7s cubic-bezier(.5,1.8,.5,1) both,parpelleja 1.4s steps(2) .8s infinite}
@keyframes cau1{from{transform:translateY(-140px) rotate(-8deg);opacity:0}}
@keyframes parpelleja{50%{opacity:.55}}
.arc.ko .t3{color:#fca5a5;text-shadow:none}
.arc.ko .cor{position:relative;font-size:clamp(44px,13vw,70px);margin-top:8px;animation:trenca 1.1s ease-in .4s both}
@keyframes trenca{0%{transform:scale(0)}35%{transform:scale(1.2)}55%{transform:scale(1) rotate(0)}70%{transform:rotate(-12deg)}85%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.arc.ko .t2{color:#fde68a}
.pluja{position:absolute;top:-30px;width:3px;height:22px;background:linear-gradient(#94a3b800,#94a3b8aa);animation:plou linear infinite}
@keyframes plou{to{transform:translateY(110vh)}}
/* estrelles: d'on venen + animació arcade */
.vola{position:fixed;z-index:90;pointer-events:none;font-family:'Press Start 2P',monospace;font-size:15px;color:#facc15;text-shadow:2px 2px 0 #92400e,0 0 12px #fde047;white-space:nowrap;transition:transform .75s cubic-bezier(.5,-.4,.6,1),opacity .75s ease-in;will-change:transform}
.vola.puja{animation:vpop .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes vpop{from{transform:scale(.2)}}
.espurna{position:fixed;z-index:89;pointer-events:none;width:6px;height:6px;background:#facc15;box-shadow:0 0 6px #fde047;transition:transform .5s ease-out,opacity .5s ease-out}
#punts.boing{animation:boing .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{30%{transform:scale(1.35) rotate(-6deg);background:#facc15;color:#422006}}

 {id:"cossos",ic:"☄️",col:"#db2777",titol:"Els cossos celestes",font:"Resum · secció 6",
  idea:"A l'espai hi ha estrelles, planetes, satèl·lits, asteroides, cometes i meteoroides, i cadascun és diferent.",
  pts:["<b>Estrella</b>: té llum pròpia. N'hi ha de mides molt diverses.","<b>Planeta</b>: gira al voltant d'una estrella i no té llum pròpia: reflecteix la que rep. Condicions: ① forma esfèrica, ② orbitar una estrella, ③ ser el principal de la seva òrbita.",
   "<b>Planeta nan</b>: no compleix la 3a condició. Exemple: Plutó (planeta nan des del 2006).","<b>Satèl·lit natural</b>: gira al voltant d'un planeta. Exemple: la Lluna.",
   "<b>Asteroide</b>: fet sobretot de roca i metalls.","<b>Cometa</b>: gel, pols i roca, amb una òrbita molt allargada.","<b>Meteoroide</b>: trosset petit de roca o metall. Quan crema a l'atmosfera veiem una «estrella fugaç»."],
  truc:"Cometa = conglaçat (gel). Asteroide = amb roca i metall. Satèl·lit = saltador al voltant d'un planeta, com la Lluna amb la Terra.",
  compte:"Satèl·lit ≠ planeta: el satèl·lit gira al voltant d'un planeta; el planeta, al voltant d'una estrella.",
  fc:[["Per què brillen els planetes si no tenen llum pròpia?","Perquè reflecteixen la llum que reben."],["Les 3 condicions per ser planeta?","Forma esfèrica, orbitar una estrella i ser el principal de la seva òrbita."],["Quina condició no compleix Plutó?","La 3a: no és el principal de la seva òrbita."],["De què és un cometa?","Gel, pols i roca."],["De què és un asteroide?","Sobretot de roca i metalls."],["Què veiem quan un meteoroide crema a l'atmosfera?","Una «estrella fugaç»."]],
  q:[["La Lluna és…",["Un planeta","Un satèl·lit natural","Un asteroide"],1,"Gira al voltant d'un planeta, la Terra."],
     ["De què està fet un cometa?",["De roca i metalls","De gel, pols i roca","De gas que crema"],1,"Roca i metalls és un asteroide."],
     ["Per què Plutó és un planeta nan?",["Perquè no és rodó","Perquè no és el principal de la seva òrbita","Perquè no gira al voltant del Sol"],1,"És rodó i gira al voltant del Sol, però comparteix l'òrbita amb molts cossos."],
     ["Per què veiem brillar els planetes?",["Perquè tenen llum pròpia","Perquè reflecteixen la llum que reben","Perquè són estrelles petites"],1,"Només les estrelles tenen llum pròpia."],
     ["Una «estrella fugaç» és…",["Un meteoroide que crema a l'atmosfera","Una estrella que cau","Un cometa"],0,"Són trossets petits de roca o metall."]]},
 {id:"sistema",ic:"☀️",col:"#f59e0b",titol:"El sistema solar",font:"Resum · secció 7",
  idea:"Al centre hi ha el Sol; al seu voltant, 4 planetes interiors petits i rocosos, 4 exteriors gegants i dos cinturons de cossos petits.",
  pts:["<b>El Sol</b>: uns 4.600 milions d'anys i uns 5.500 °C a la superfície. Ens dona llum i calor.",
   "<b>Interiors</b>: Mercuri, Venus, Terra i Mart. Petits, sòlids, de roca, a prop del Sol, pocs satèl·lits, giren lentament i sense anells.",
   "<b>Exteriors</b>: Júpiter, Saturn, Urà i Neptú. Són els gegants (afegit per Bona Nota: gasosos, lluny del Sol, molts satèl·lits i anells).",
   "<b>Cinturó d'asteroides</b>: entre Mart i Júpiter. Molts asteroides rocosos.","<b>Cinturó de Kuiper</b>: més enllà de Neptú. Cossos de roca i gel; hi ha Plutó i d'allà venen alguns cometes.",
   "⚠ Als apunts, el nom de l'objecte més gran del cinturó d'asteroides es llegeix malament (probablement Ceres): pregunta-ho al profe."],
  truc:"«Mi Vella Tia Mari, Jugant Sempre Unes Nines» → Mercuri, Venus, Terra, Mart | Júpiter, Saturn, Urà, Neptú. La coma és el cinturó d'asteroides!",
  compte:"El cinturó d'asteroides és entre Mart i Júpiter; el de Kuiper, més enllà de Neptú. No els barregis!",
  fc:[["Planetes interiors?","Mercuri, Venus, Terra i Mart."],["Planetes exteriors?","Júpiter, Saturn, Urà i Neptú."],["On és el cinturó d'asteroides?","Entre Mart i Júpiter."],["On és el cinturó de Kuiper?","Més enllà de Neptú."],["Quin planeta nan hi ha al cinturó de Kuiper?","Plutó."],["Quants anys té el Sol?","Uns 4.600 milions d'anys."]],
  q:[["Quin planeta és interior?",["Júpiter","Mart","Saturn"],1,"Interiors: Mercuri, Venus, Terra i Mart."],
     ["On és el cinturó d'asteroides?",["Entre Mart i Júpiter","Més enllà de Neptú","Entre la Terra i Mart"],0,"Més enllà de Neptú hi ha el de Kuiper."],
     ["Com són els planetes interiors?",["Petits i de roca","Gegants","Tenen molts anells"],0,"Petits, sòlids, de roca i sense anells."],
     ["Quin planeta nan hi ha al cinturó de Kuiper?",["Plutó","La Lluna","Mart"],0,"Plutó és al cinturó de Kuiper."],
     ["Quina temperatura té la superfície del Sol, aproximadament?",["Uns 5.500 °C","Uns 100 °C","Uns 550 °C"],0,"Uns 5.500 °C."]]},
 {id:"geosfera",ic:"🥚",col:"#b45309",titol:"Les capes de la Terra",font:"Apunts · secció 2",
  idea:"La geosfera és la part sòlida i rocosa de la Terra, i té tres capes: escorça, mantell i nucli.",
  pts:["Com més endins, més <b>densitat</b> i més <b>temperatura</b>.","<b>Escorça</b> (la closca de l'ou): la més externa i la més prima. Continental (granits i pissarres) i oceànica (més fina, de basalt).",
   "<b>Mantell</b> (la clara): la més gruixuda. De <b>peridotita</b>. Mantell superior (amb zones pastoses) i inferior (sòlid).",
   "<b>Nucli</b> (el rovell): el més profund i calent, de <b>ferro i níquel</b>. Nucli extern líquid i nucli intern sòlid per la pressió.",
   "Entre capes hi ha <b>discontinuïtats</b>. La de <b>Mohorovicic</b> (Moho) separa l'escorça del mantell."],
  truc:"L'ou dur: closca = escorça, clara = mantell, rovell = nucli.",
  compte:"La capa més gruixuda és el mantell; la més prima, l'escorça. I el nucli intern és sòlid, no líquid!",
  fc:[["Les tres capes de la Terra?","Escorça, mantell i nucli."],["La capa més prima?","L'escorça."],["La capa més gruixuda?","El mantell."],["De què és el nucli?","De ferro i níquel."],["Què separa la Moho?","L'escorça del mantell."],["Escorça oceànica: de quina roca?","De basalt."]],
  q:[["Quina és la capa més gruixuda?",["L'escorça","El mantell","El nucli"],1,"L'escorça és la més prima."],
     ["De què està fet el nucli?",["De ferro i níquel","De peridotita","De granit"],0,"La peridotita és del mantell."],
     ["Com és el nucli intern?",["Líquid","Sòlid","Gasós"],1,"És sòlid per la pressió gegantina, tot i que és molt calent."],
     ["Què passa com més endins anem?",["Fa més fred","Pugen la densitat i la temperatura","No canvia res"],1,"Com més profund, més calor i més densitat."],
     ["La discontinuïtat de Mohorovicic separa…",["L'escorça del mantell","El mantell del nucli","El nucli extern de l'intern"],0,"La Moho és entre escorça i mantell."]]},
 {id:"teoria",ic:"🔬",col:"#0891b2",titol:"La teoria cel·lular",font:"Apunts · secció 3",
  idea:"Tots els éssers vius estem formats per cèl·lules.",
  pts:["① La cèl·lula és la <b>unitat estructural</b>: tots els éssers vius estan fets d'una o més cèl·lules.","② És la <b>unitat funcional</b>: fa les funcions vitals (nutrició, relació i reproducció).",
   "③ Tota cèl·lula ve de la divisió d'una altra <b>cèl·lula preexistent</b>.","Totes les cèl·lules tenen: <b>membrana plasmàtica</b> (la porta de la frontera), <b>citoplasma</b> (líquid on floten els orgànuls) i <b>material genètic (ADN)</b> (el llibre d'instruccions)."],
  truc:"Les 3 parts de tota cèl·lula: la porta (membrana), la sala (citoplasma) i el llibre d'instruccions (ADN).",
  compte:"Les funcions vitals són tres: nutrició, relació i reproducció.",
  fc:[["De què estan fets tots els éssers vius?","De cèl·lules."],["Les 3 funcions vitals?","Nutrició, relació i reproducció."],["D'on ve una cèl·lula?","De la divisió d'una altra cèl·lula."],["Què fa la membrana plasmàtica?","Regula què entra i què surt de la cèl·lula."],["Què és l'ADN?","El llibre d'instruccions de la cèl·lula."]],
  q:[["Quina part regula les substàncies que entren i surten?",["La membrana plasmàtica","El citoplasma","L'ADN"],0,"És la «porta de la frontera»."],
     ["D'on prové tota cèl·lula?",["De la divisió d'una altra cèl·lula","De l'aigua","Del no-res"],0,"Tercera idea de la teoria cel·lular."],
     ["Quines són les funcions vitals?",["Nutrició, relació i reproducció","Menjar, dormir i jugar","Respirar, córrer i créixer"],0,"Les fa la cèl·lula, unitat funcional."],
     ["Què és el material genètic (ADN)?",["El llibre d'instruccions de la cèl·lula","Un orgànul que fa energia","La paret de la cèl·lula"],0,"Diu com s'ha de construir i funcionar."]]},
 {id:"animalveg",ic:"🌿",col:"#65a30d",titol:"Cèl·lula animal i vegetal",font:"Apunts · secció 4",
  idea:"Les cèl·lules eucariotes (amb nucli) poden ser animals o vegetals, i tenen diferències clares.",
  pts:["<b>Forma</b>: animal irregular i arrodonida; vegetal regular i prismàtica.","<b>Paret cel·lular de cel·lulosa</b>: només la vegetal (li dona rigidesa).",
   "<b>Cloroplasts</b>: només la vegetal (fotosíntesi amb la clorofil·la).","<b>Vàcuols</b>: animal molt petits (vesícules); vegetal un de gegant.",
   "<b>Centrosoma</b>: només l'animal.","<b>Nucli</b>: animal al centre; vegetal desplaçat cap a un costat pel vàcuol. Algunes cèl·lules animals es desplacen; les vegetals no."],
  truc:"La cèl·lula vegetal porta armadura (paret), panells solars (cloroplasts) i una gran cisterna (vàcuol).",
  compte:"El centrosoma és de l'animal, no de la vegetal.",
  fc:[["Qui té paret cel·lular?","La cèl·lula vegetal."],["Qui té cloroplasts?","La cèl·lula vegetal."],["Qui té centrosoma?","La cèl·lula animal."],["Com és el vàcuol de la vegetal?","Gegant."],["On és el nucli de la vegetal?","Desplaçat cap a un costat."]],
  q:[["Quina cèl·lula té cloroplasts?",["L'animal","La vegetal","Totes dues"],1,"Fan la fotosíntesi."],
     ["Quina cèl·lula té centrosoma?",["L'animal","La vegetal","Cap"],0,"La vegetal no en té."],
     ["Per què el nucli de la cèl·lula vegetal és a un costat?",["Perquè l'empeny el vàcuol gegant","Perquè té centrosoma","Perquè es desplaça"],0,"El gran vàcuol empeny la resta d'elements."],
     ["Què dona rigidesa a la cèl·lula vegetal?",["La paret cel·lular de cel·lulosa","El citoplasma","Els mitocondris"],0,"És a fora de la membrana."],
     ["Quines cèl·lules es poden desplaçar, com els glòbuls blancs?",["Algunes animals","Les vegetals","Cap"],0,"Les vegetals no es desplacen."]]},
 {id:"organuls",ic:"🛠️",col:"#9333ea",titol:"Els orgànuls",font:"Apunts · secció 5",
  idea:"Els orgànuls són els petits tallers de la cèl·lula, i cadascun té una feina.",
  pts:["<b>Mitocondris</b>: les centrals d'energia. Obtenen energia de l'oxigen i el menjar.","<b>Aparell de Golgi</b>: el servei de correus. Envia substàncies a fora dins de bossetes.",
   "<b>Ribosomes</b>: els obrers que fabriquen proteïnes.","<b>Cloroplasts</b>: només a les plantes. Capten el sol per fabricar aliment."],

  compte:"Els mitocondris són a totes dues cèl·lules; els cloroplasts, només a les vegetals.",
  fc:[["Les centrals d'energia?","Els mitocondris."],["El servei de correus?","L'aparell de Golgi."],["Qui fabrica proteïnes?","Els ribosomes."],["Qui capta el sol per fer aliment?","Els cloroplasts."]],
  q:[["Quin orgànul obté energia de l'oxigen i el menjar?",["El mitocondri","El ribosoma","L'aparell de Golgi"],0,"És la central d'energia."],
     ["Quin orgànul fabrica proteïnes?",["Els ribosomes","Els cloroplasts","Els mitocondris"],0,"Són els petits obrers."],
     ["L'aparell de Golgi…",["Envia substàncies a fora dins de bossetes","Fa la fotosíntesi","Guarda l'ADN"],0,"És el servei de correus."],
     ["Els cloroplasts són…",["Només a les cèl·lules vegetals","A totes les cèl·lules","Només a les animals"],0,"Capten el sol per fabricar aliment."]]}

const OB=[
 {t:"Què és la ciència",q:"Explica què és la ciència i digues 4 dels seus 6 objectius.",p:["Activitat humana","Vol entendre la realitat","Fa servir el mètode científic","Diu almenys 4 objectius (descriure, explicar, predir, ampliar, generalitzar i unificar, reconèixer els límits)"],
  m:"La ciència és una activitat humana que vol entendre la realitat que ens envolta fent servir el mètode científic. Els seus objectius són descriure fenòmens, explicar la realitat, predir el que passarà i ampliar els coneixements."},
 {t:"Característiques del mètode",q:"Explica què vol dir que el mètode científic sigui falsable i provisional. Posa l'exemple del model geocèntric.",p:["Falsable: un experiment nou pot demostrar que és incorrecte","Provisional: pot canviar amb dades millors","El model geocèntric deia que la Terra era el centre","Va canviar quan van arribar millors observacions"],
  m:"Falsable vol dir que un experiment nou pot demostrar que una idea és incorrecta. Provisional vol dir que la idea pot canviar si tenim dades millors. Per exemple, el model geocèntric deia que la Terra era el centre de tot, però quan van arribar millors observacions es va veure que no era així i es va canviar."},
 {t:"Característiques del mètode",q:"Escriu les 5 característiques del mètode científic i explica cadascuna amb una frase.",p:["Empíric: es basa en dades","Racional: objectiu, fa servir la raó","Reproduïble: altres ho poden repetir","Falsable: es pot demostrar que és fals","Provisional: pot canviar"],
  m:"És empíric perquè es basa en dades i observacions. És racional perquè fa servir la raó i no els gustos. És reproduïble perquè altres persones poden repetir l'experiment. És falsable perquè un experiment nou pot demostrar que és incorrecte. I és provisional perquè pot canviar amb dades millors."},
 {t:"Els passos del mètode",q:"La Laia veu que el gel es fon més de pressa a la cuina que al balcó. Pensa: «Si fa més calor, el gel es fondrà més de pressa». Posa un glaçó al radiador i un altre al balcó. El del radiador es fon en 20 minuts i el del balcó en 45. Dedueix que la calor fa fondre el gel més ràpid. Escriu l'observació, la hipòtesi, l'experiment, el resultat i la conclusió.",
  p:["Observació: el gel es fon més de pressa a la cuina","Hipòtesi: si fa més calor, es fondrà més de pressa","Experiment: dos glaçons, un al radiador i un al balcó","Resultat: 20 minuts i 45 minuts","Conclusió: la calor fa fondre el gel més ràpid"],
  m:"L'observació és que el gel es fon més de pressa a la cuina que al balcó. La hipòtesi és «si fa més calor, el gel es fondrà més de pressa». L'experiment és posar un glaçó al radiador i un altre al balcó. El resultat és que el del radiador es fon en 20 minuts i el del balcó en 45. La conclusió és que la calor fa que el gel es fongui més ràpid."},
 {t:"Els passos del mètode",q:"Explica la diferència entre una observació i una hipòtesi, i entre un resultat i una conclusió. Posa un exemple de l'experiment de les plantes per a cadascuna.",p:["Observació = el que veus (unes plantes creixen més que d'altres)","Hipòtesi = explicació per comprovar (si reben més llum, creixeran més)","Resultat = les dades (la planta amb llum ha crescut més)","Conclusió = el que en dedueixes (la llum ajuda a créixer)"],
  m:"L'observació és el que veus, per exemple que unes plantes creixen més que d'altres. La hipòtesi és la teva explicació per comprovar: si reben més llum, creixeran més. El resultat són les dades: la planta amb llum ha crescut més. La conclusió és el que en dedueixes: la llum ajuda a créixer."},
 {t:"L'Univers i l'any llum",q:"Explica què és el model geocèntric, qui el va crear i fins quan es va fer servir. Després explica què és un any llum i per a què serveix.",p:["Model geocèntric: la Terra al centre i tot gira al seu voltant","El va crear Ptolemeu (antiga Grècia)","Es va fer servir del segle II al XVI","Any llum: distància que fa la llum en un any (uns 10 bilions de km)","Serveix per mesurar distàncies dins i entre galàxies"],
  m:"El model geocèntric deia que la Terra era el centre de l'Univers i que tot girava al seu voltant. El va crear Ptolemeu a l'antiga Grècia i es va fer servir del segle II al XVI. Un any llum és la distància que recorre la llum en un any, uns 10 bilions de km, i serveix per mesurar distàncies dins i entre galàxies."},
 {t:"Les galàxies i la Via Làctia",q:"Explica què és una galàxia i quines tres formes poden tenir. Després explica com és la Via Làctia.",p:["Agrupació d'estrelles, cossos celestes, gas i pols que giren junts","El·líptica (ou), espiral (braços) i irregular (sense forma)","La Via Làctia és la nostra galàxia, amb unes 300.000 milions d'estrelles","Té forma d'espiral i el Sol és una de les seves estrelles"],
  m:"Una galàxia és una agrupació enorme d'estrelles, altres cossos celestes, gas i pols que giren junts. Poden ser el·líptiques, en forma d'ou; espirals, amb braços corbats; o irregulars, sense forma. La nostra és la Via Làctia: té unes 300.000 milions d'estrelles, forma d'espiral, i el Sol és una d'aquestes estrelles."},
 {t:"Els cossos celestes",q:"Escriu les 3 condicions per ser planeta. Explica per què Plutó és un planeta nan. Després explica en què es diferencia un satèl·lit d'un planeta i posa un exemple de cadascun.",p:["Forma esfèrica","Orbita una estrella","És el principal de la seva òrbita","Plutó no compleix la 3a","Satèl·lit gira al voltant d'un planeta (Lluna); planeta al voltant d'una estrella (Terra)"],
  m:"Per ser planeta has de ser rodó, girar al voltant d'una estrella i ser el principal de la teva òrbita. Plutó és rodó i gira al voltant del Sol, però no és el principal de la seva òrbita, i per això és un planeta nan. Un satèl·lit gira al voltant d'un planeta, com la Lluna; un planeta gira al voltant d'una estrella, com la Terra."},
 {t:"Els cossos celestes",q:"Explica en què es diferencien un asteroide, un cometa i un meteoroide.",p:["Asteroide: roca i metalls","Cometa: gel, pols i roca","Cometa: òrbita molt allargada","Meteoroide: trosset petit; quan crema veiem una estrella fugaç"],
  m:"Un asteroide està fet sobretot de roca i metalls. Un cometa està fet de gel, pols i roca i té una òrbita molt allargada. Un meteoroide és un trosset petit de roca o metall, i quan crema a l'atmosfera veiem una estrella fugaç."},
 {t:"El sistema solar",q:"Escriu els 8 planetes en ordre, separa'ls en interiors i exteriors, i digues on són el cinturó d'asteroides i el cinturó de Kuiper.",p:["Ordre: Mercuri, Venus, Terra, Mart, Júpiter, Saturn, Urà, Neptú","Interiors: Mercuri, Venus, Terra, Mart","Exteriors: Júpiter, Saturn, Urà, Neptú","Cinturó d'asteroides entre Mart i Júpiter","Cinturó de Kuiper més enllà de Neptú"],
  m:"Els planetes són Mercuri, Venus, Terra, Mart, Júpiter, Saturn, Urà i Neptú. Els interiors són Mercuri, Venus, Terra i Mart, i els exteriors Júpiter, Saturn, Urà i Neptú. El cinturó d'asteroides és entre Mart i Júpiter, i el de Kuiper més enllà de Neptú."},
 {t:"Les capes de la Terra",q:"Explica les tres capes de la Terra fent servir la comparació de l'ou dur. Digues de què està fet el mantell i de què està fet el nucli.",p:["Escorça = closca, la més prima","Mantell = clara, la més gruixuda","Nucli = rovell, el més profund i calent","Mantell de peridotita","Nucli de ferro i níquel"],
  m:"La Terra és com un ou dur. L'escorça és la closca: la capa de fora i la més prima. El mantell és la clara: la capa més gruixuda, feta de peridotita. El nucli és el rovell: la part més profunda i calenta, feta de ferro i níquel."},
 {t:"La teoria cel·lular",q:"Explica les tres idees de la teoria cel·lular i les tres parts que tenen totes les cèl·lules.",p:["Unitat estructural: tots els éssers vius estan fets de cèl·lules","Unitat funcional: fa la nutrició, la relació i la reproducció","Tota cèl·lula ve d'una altra cèl·lula","Membrana plasmàtica, citoplasma i ADN"],
  m:"La teoria cel·lular diu que tots els éssers vius estan fets de cèl·lules, que la cèl·lula fa les funcions vitals (nutrició, relació i reproducció) i que tota cèl·lula ve de la divisió d'una altra. Totes les cèl·lules tenen membrana plasmàtica, citoplasma i material genètic (ADN)."},
 {t:"Cèl·lula animal i vegetal",q:"Escriu quatre diferències entre la cèl·lula animal i la cèl·lula vegetal.",p:["Paret cel·lular: només la vegetal","Cloroplasts: només la vegetal","Vàcuol gegant a la vegetal, petits a l'animal","Centrosoma: només l'animal (o forma, o posició del nucli)"],
  m:"La cèl·lula vegetal té paret cel·lular i cloroplasts, i l'animal no. La vegetal té un vàcuol gegant i l'animal en té de molt petits. L'animal té centrosoma i la vegetal no."}
];

 app.innerHTML=`<h2 class="sec">🏆 Examen sorpresa</h2><div id="zona"></div>`;
 test(ordre,0,0,"examen",pool,(pc,b,n)=>{S.examens.push({d:avui(),pc});resultatJoc("examen")(pc,b,n)});
}

// ====================== REPÀS ESPAIAT DELS ERRORS ======================
// Cada pregunta fallada entra a la capsa 0 (es pot repassar avui mateix).
// Al repàs: encert → capsa 1 (torna d'aquí a 3 dies) → capsa 2 (d'aquí a 7) → après i surt. Error → capsa 0, torna demà.
const APROVA=70,NTEST=6,REP_DIES=[0,3,7];
let REPAS=false;
function diaMes(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function repAnota(tid,txt,ok){S.rep=S.rep||{};const k=tid+"|"+txt,r=S.rep[k];
 if(!ok){S.rep[k]={tid,q:txt,c:0,prox:REPAS?diaMes(1):avui()};desa();return}
 if(!REPAS||!r)return;
 const c=r.c+1;if(c>=REP_DIES.length){delete S.rep[k];S.apresos=(S.apresos||0)+1}else S.rep[k]={...r,c,prox:diaMes(REP_DIES[c])};desa()}
function repTots(){return Object.values(S.rep||{}).filter(r=>T.some(t=>t.id===r.tid&&t.q.some(q=>q[0]===r.q)))}
function repPendents(){const d=avui();return repTots().filter(r=>r.prox<=d)}
function repProper(){const f=repTots().map(r=>r.prox).sort();return f[0]||null}
function repas(){
 const pend=barreja(repPendents()).slice(0,10);aturaSeg();COMBO=0;FONT=["repas"];window.scrollTo(0,0);marcaNav("inici");
 if(!pend.length){const pr=repProper();app.innerHTML=`<h2 class="sec">🔁 Repassa els teus errors</h2><div class="box" style="text-align:center"><div class="gran">🧠</div><h3>Avui no tens cap error per repassar!</h3><p class="prog">${pr?`El proper repàs és el <b>${new Date(pr).toLocaleDateString("ca-ES",{weekday:"long",day:"numeric",month:"long"})}</b>.`:"Quan fallis una pregunta, la trobaràs aquí per tornar-la a practicar."}</p><div class="fila"><button class="btn" onclick="vista('inici')">Torna a l'inici</button></div></div>`;return}
 const pool=pend.map(r=>{const t=T.find(x=>x.id===r.tid),q=t.q.find(x=>x[0]===r.q).slice();q.tema=t.titol;q.tid=t.id;q.capsa=r.c;return q});
 REPAS=true;
 app.innerHTML=`<h2 class="sec">🔁 Repassa els teus errors</h2><p class="prog" style="margin-top:-6px">Preguntes que vas fallar. Si l'encertes, tornarà d'aquí a uns dies; si l'encertes 3 vegades, ja l'has après! 🧠</p><div id="zona"></div>`;
 test(pool.map((x,i)=>i),0,0,"repas",pool,(pc,b,n)=>{REPAS=false;registra("joc",{joc:"repas",titol:"Repàs dels errors",pc});arcade(pc,b,n,false);
  const queden=repPendents().length,pr=repProper();
  document.getElementById("zona").innerHTML=`<div class="box" style="text-align:center"><div class="gran">${pc>=APROVA?"🧠":"💪"}</div><h2>${b} de ${n} recordades</h2><p>${b?`Molt bé! Les que has encertat tornaran d'aquí a uns dies per assegurar-nos que no se t'obliden.`:""} ${n-b?`Les que has fallat tornaran <b>demà</b>.`:""}</p>${S.apresos?`<p class="prog">Preguntes apreses per sempre: <b>${S.apresos}</b> 🏅</p>`:""}<div class="fila">${queden?`<button class="btn" onclick="repas()">Repassa'n ${queden} més</button>`:""}<button class="btn sec" onclick="vista('inici')">Torna a l'inici</button></div></div>`});
}
function cartaRepas(){const n=repPendents().length,tot=repTots().length;if(!tot)return "";
 return `<div class="continua" style="background:#ecfdf5;border-color:#6ee7b7" onclick="repas()"><span style="font-size:28px">🔁</span><b>${n?`Tens <span style="color:#047857">${n} pregunta${n>1?"s":""}</span> per repassar avui`:`Errors al dia! Proper repàs: ${new Date(repProper()).toLocaleDateString("ca-ES",{day:"numeric",month:"short"})}`}</b><span class="btn ${n?"verd":"sec"}">${n?"Repassa →":"Mira"}</span></div>`}

// ====================== JOCS GENÈRICS ======================
// tipus: ordena · parelles · classifica · figura · custom (funció pròpia definida a les dades)
function fiJoc(j,n,errors){const pc=Math.max(0,Math.round(100*n/(n+errors)));const r=S.jocs[j.id]||[],ant=r.length?Math.max(...r):null;desaJoc(j.id,pc);arcade(pc,n,n+errors,ant!==null&&pc>ant);
 document.getElementById("zona").innerHTML=`<div class="fb ok">🎉 Fet${errors?` (amb ${errors} error${errors>1?"s":""})`:" sense cap error"}! ${j.final||""}</div><div class="fila"><button class="btn" onclick="joc('${j.id}')">Torna-hi</button><button class="btn sec" onclick="vista('jocs')">Altres jocs</button></div>`}
function sacseja(el){so("ko");el.classList.remove("ko");void el.offsetWidth;el.classList.add("ko")}
function jocOrdena(j){
 let pos=0,errors=0;const it=j.items;
 app.innerHTML=`<h2 class="sec">${j.enunciat||j.titol}</h2><div class="box">${j.instr}<div id="xips" style="margin-top:10px"></div><div class="pila" id="pila">${j.base?`<div style="background:#bbf7d0">${j.base}</div>`:""}</div><div id="zona"></div></div>`;
 const x=document.getElementById("xips");
 barreja(it.map((c,i)=>i)).forEach(i=>{const s=document.createElement("span");s.className="chip";s.textContent=it[i][0];
  s.onclick=()=>{if(s.classList.contains("ok"))return;
   if(i===pos){s.classList.add("ok");const d=document.createElement("div");d.style.background=it[i][2]||"#eef2ff";d.innerHTML=`${i+1} · ${it[i][0]}${it[i][1]?` <small style="font-weight:600;color:#475569">— ${it[i][1]}</small>`:""}`;document.getElementById("pila").appendChild(d);pos++;suma(1);so("ok");if(pos===it.length)fiJoc(j,it.length,errors)}
   else{errors++;sacseja(s)}};x.appendChild(s)});
}
function jocFigura(j){
 const svg=typeof window[j.figura]==="function"?window[j.figura]():j.figura;
 app.innerHTML=`<h2 class="sec">${j.enunciat||j.titol}</h2><div class="box" style="text-align:center">${svg}</div><div id="zona"></div>`;
 test(j.q.map((x,i)=>i),0,0,j.id,j.q,resultatJoc(j.id));
}
function jocParelles(j){
 const PAR=j.pars;let sel=null,fet=0,errors=0;
 app.innerHTML=`<h2 class="sec">${j.enunciat||j.titol}</h2><div class="box">${j.instr}<div class="col2" style="margin-top:12px"><div id="esq"></div><div id="dre"></div></div><div id="zona"></div></div>`;
 const E=document.getElementById("esq"),D=document.getElementById("dre");
 barreja(PAR.map((p,i)=>i)).forEach(i=>{const s=document.createElement("div");s.className="chip";s.style.display="block";s.textContent=PAR[i][0];s.dataset.i=i;s.onclick=()=>{if(s.classList.contains("ok"))return;E.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));s.classList.add("sel");sel=s};E.appendChild(s)});
 barreja(PAR.map((p,i)=>i)).forEach(i=>{const s=document.createElement("div");s.className="chip";s.style.display="block";s.textContent=PAR[i][1];
  s.onclick=()=>{if(!sel||s.classList.contains("ok"))return;
   if(+sel.dataset.i===i){sel.classList.remove("sel");sel.classList.add("ok");s.classList.add("ok");sel=null;fet++;suma(1);so("ok");if(fet===PAR.length)fiJoc(j,PAR.length,errors)}
   else{errors++;sacseja(s)}};D.appendChild(s)});
}
function jocClassifica(j){
 const F=j.items;let sel=null,fet=0,errors=0;
 app.innerHTML=`<h2 class="sec">${j.enunciat||j.titol}</h2><div class="box">${j.instr}<div id="fr" style="margin:10px 0"></div><div class="col2">${j.caixes.map(([k,t])=>`<div class="cub" data-k="${k}"><h4>${t}</h4></div>`).join("")}</div><div id="zona"></div></div>`;
 const fr=document.getElementById("fr");
 barreja(F).forEach(f=>{const s=document.createElement("span");s.className="chip";s.textContent=f[0];s.dataset.k=f[1];s.onclick=()=>{fr.querySelectorAll(".chip").forEach(c=>c.classList.remove("sel"));s.classList.add("sel");sel=s};fr.appendChild(s)});
 app.querySelectorAll(".cub").forEach(c=>c.onclick=()=>{
  if(!sel)return;
  if(sel.dataset.k===c.dataset.k){sel.classList.remove("sel");sel.classList.add("ok");sel.onclick=null;c.appendChild(sel);sel=null;fet++;suma(1);so("ok");if(fet===F.length)fiJoc(j,F.length,errors)}
  else{errors++;sacseja(sel)}});
}

// ====================== PREGUNTES OBERTES ======================
function primeraOberta(){const i=OB.findIndex((o,n)=>!(n in S.ob));return i<0?0:i}
function obertes(n){
 FONT=["obertes"];window.scrollTo(0,0);marcaNav("obertes");
 const o=OB[n],fet=S.ob[n];
 app.innerHTML=`<h2 class="sec">✍️ Preguntes obertes d'examen</h2><div class="prog">Pregunta ${n+1} de ${OB.length} · ${o.t}${fet!==undefined?` · última vegada: ${fet}%`:""}</div><div class="barra-test"><i style="width:${Object.keys(S.ob).length*100/OB.length}%"></i></div>
 <div class="box" style="margin-top:10px"><div class="pregunta">${o.q}</div>
 <textarea id="resp" rows="7" placeholder="Escriu aquí la teva resposta amb les teves paraules…"></textarea>
 <div class="fila"><button class="btn" id="veu">Comprova la meva resposta</button></div><div id="corr"></div></div>
 <div class="fila"><button class="btn sec" ${n==0?'disabled':''} onclick="obertes(${n-1})">← Anterior</button><button class="btn sec" ${n==OB.length-1?'disabled':''} onclick="obertes(${n+1})">Següent →</button></div>`;
 document.getElementById("veu").onclick=()=>{
  const txt=document.getElementById("resp").value.trim();
  if(txt.length<15){document.getElementById("corr").innerHTML=`<div class="fb ko">✏️ Escriu una mica més abans de comprovar-ho.</div>`;return}
  document.getElementById("veu").disabled=true;document.getElementById("resp").readOnly=true;
  document.getElementById("corr").innerHTML=`<div class="fb"><b>Marca les idees que has posat a la teva resposta:</b>${o.p.map(x=>`<label class="chk"><input type="checkbox" class="pk"><span>${x}</span></label>`).join("")}
  <details style="margin-top:10px"><summary>👀 Veure la resposta model</summary><p>${o.m}</p></details>
  <div class="fila"><button class="btn verd" id="nota">Ja he marcat: quina nota trec?</button></div><div id="res"></div></div>`;
  document.getElementById("nota").onclick=()=>{
   const k=[...document.querySelectorAll(".pk")].filter(c=>c.checked).length,tot=o.p.length,pc=Math.round(k*100/tot);
   document.getElementById("nota").disabled=true;S.ob[n]=pc;suma(k);registra("oberta",{n,tema:o.t,pc});if(pc>=80)confeti();setTimeout(mostraNivell,pc>=80?1600:300);
   const msg=pc>=80?"Resposta completa! 🌟":pc>=50?"Bé, però et falten idees: mira la resposta model 📖":"Repassa la fitxa del tema i torna-hi 💪";
   document.getElementById("res").innerHTML=`<p style="text-align:center"><b>${k} de ${tot} idees</b> · a l'examen valdria uns <b>${(k*1.5/tot).toFixed(2).replace(".",",")} de 1,5 punts</b>.<br>${msg}</p>${n<OB.length-1?`<div class="fila"><button class="btn" onclick="obertes(${n+1})">Següent pregunta →</button></div>`:`<p style="text-align:center">🎉 Has fet totes les preguntes obertes!</p>`}`;
  };
 };
}

// ====================== ANALÍTICA ======================
function resumGlobal(){
 let int=0,suma_=0;T.forEach(t=>{const e=S.temes[t.id];if(e&&e.intents.length){int+=e.intents.length;suma_+=e.intents.reduce((a,b)=>a+b.pc,0)}});
 return {intents:int,encert:int?Math.round(suma_/int):null};
}
function color(pc){return pc===null?"#cbd5e1":pc>=80?"#22c55e":pc>=50?"#f59e0b":"#ef4444"}
function analitica(){setTimeout(()=>carregaComp(()=>{const c=document.getElementById("cvA");if(c)c.innerHTML=cartaComVas()}),0);
 const g=resumGlobal(),aprov=T.filter(t=>(millor(t.id)??0)>=APROVA);
 const fetsT=T.filter(t=>millor(t.id)!==null);
 const forts=T.filter(t=>(millor(t.id)??0)>=80),febles=fetsT.filter(t=>millor(t.id)<60),pend=T.filter(t=>millor(t.id)===null);
 const obN=Object.keys(S.ob).length,obM=obN?Math.round(Object.values(S.ob).reduce((a,b)=>a+b,0)/obN):null;
 const exU=S.examens.length?S.examens[S.examens.length-1].pc:null;
 // errors més repetits
 const errs=[];T.forEach(t=>{const e=S.temes[t.id];if(e)Object.entries(e.fallades).forEach(([q,c])=>errs.push([q,c,t]))});errs.sort((a,b)=>b[1]-a[1]);
 const val=["😕 Costa","🙂 Bé","😃 Fàcil"];
 // valoració global
 let nivTxt,txt;
 if(!fetsT.length){nivTxt="🚀 Tot just comencem";txt=`${S.nom} encara no ha fet cap test. El millor és començar pel primer tema: fitxa → targetes → test.`}
 else{
  const e=g.encert;
  nivTxt=e>=85?"🌟 Excel·lent":e>=70?"👏 Molt bé":e>=50?"👍 Va bé, cal repassar":"💪 Cal reforçar";
  txt=`${S.nom} ha treballat ${fetsT.length} de ${T.length} temes amb un ${e}% d'encerts de mitjana als tests.`;
  if(forts.length)txt+=` Domina sobretot: ${forts.map(t=>t.titol.toLowerCase()).join(", ")}.`;
  if(febles.length)txt+=` On més li costa: ${febles.map(t=>t.titol.toLowerCase()).join(", ")}.`;
  if(obN)txt+=` A les preguntes obertes recull de mitjana el ${obM}% de les idees clau${obM<60?", i és on més cal practicar explicar-se amb les seves paraules":""}.`;
  if(exU!==null)txt+=` A l'últim examen sorpresa va treure un ${exU}%.`;
 }
 const reco=[];
 if(pend.length)reco.push(`Començar els temes pendents: <b>${pend.slice(0,3).map(t=>t.titol).join("</b>, <b>")}</b>${pend.length>3?"…":""}.`);
 febles.forEach(t=>reco.push(`Tornar a llegir la fitxa de <b>${t.titol}</b> i repetir el test.`));
 if(errs.length)reco.push(`Repassar les preguntes que més falla (llista de sota): les pot fer en veu alta amb papa o mama.`);
 if(fetsT.length>=4&&obN<4)reco.push(`Fer més <b>preguntes obertes</b>: a l'examen valen 3 punts.`);
 if(aprov.length===T.length&&exU===null)reco.push(`Fer l'<b>examen sorpresa</b> per comprovar-ho tot barrejat.`);
 if(!reco.length)reco.push("Mantenir el ritme: un examen sorpresa cada dos o tres dies abans de l'examen.");
 app.innerHTML=`<h2 class="sec">📊 Com va ${S.nom}</h2>
 <div class="kpis">
  <div class="kpi"><small>Temes aprovats</small><b>${aprov.length}/${T.length}</b><span>${pend.length} sense fer</span></div>
  <div class="kpi"><small>Encert als tests</small><b style="color:${color(g.encert)}">${g.encert===null?"—":g.encert+"%"}</b><span>${g.intents} tests fets</span></div>
  <div class="kpi"><small>Preguntes obertes</small><b>${obN}/${OB.length}</b><span>${obM===null?"cap encara":obM+"% d'idees"}</span></div>
  <div class="kpi"><small>Temps d'estudi</small><b>${fmtT(S.temps)}</b><span>${S.dies.length} dia${S.dies.length==1?"":"s"}</span></div>
  <div class="kpi"><small>Nivell</small><b>${nivell(S.punts).ic} ${nivell(S.punts).n}</b><span>${nivell(S.punts).nom}</span></div>
  <div class="kpi"><small>Estrelles</small><b>⭐ ${S.punts}</b><span>${S.examens.length} examen${S.examens.length==1?"":"s"} sorpresa</span></div>
 </div>
 <div class="valoracio" style="margin-top:14px"><h3>${nivTxt}</h3><p style="margin:0">${txt}</p><p style="margin:10px 0 4px"><b>Què li recomano ara:</b></p><ul style="margin:0;padding-left:20px">${reco.map(r=>`<li>${r}</li>`).join("")}</ul></div>
 <h2 class="sec">🏁 Com vas</h2><div id="cvA">${cartaComVas()}</div>
 <h2 class="sec">⭐ D'on surten les estrelles</h2>${cartaEstrelles(true).replace('class="estrelles"','class="estrelles" style="margin:0 0 6px;cursor:default"')}
 <h2 class="sec">🏅 Nivells</h2><div class="box">${cartaNivell().replace('class="nivell"','class="nivell" style="margin:0 0 12px"')}<div class="rangs">${NIVELLS.map(([min,nom,ic],i)=>{const n=nivell(S.punts).n;return `<div class="rang ${i+1<n?'':i+1===n?'ara':'bloc'}"><span>${ic}</span><b>${i+1}. ${nom}</b><small>${min} ⭐</small></div>`}).join("")}</div><p class="prog" style="margin:10px 0 0">Cada encert als tests, als jocs i a les preguntes obertes suma ⭐, i les ⭐ fan pujar de nivell.</p></div>
 <h2 class="sec">📖 Tema per tema</h2><div class="box" style="overflow-x:auto"><table class="an"><tr><th>Tema</th><th>Fitxa</th><th class="mh">Targetes</th><th>Tests</th><th>Millor</th><th class="mh">Últim</th><th>Ell diu</th></tr>
 ${T.map((t,i)=>{const e=S.temes[t.id],m=millor(t.id),ul=e&&e.intents.length?e.intents[e.intents.length-1].pc:null;return `<tr style="cursor:pointer" onclick="obre(${i})"><td><span class="semaf" style="background:${color(m)}"></span>${t.ic} ${t.titol}</td><td>${e&&e.fitxa?"✅":"—"}</td><td class="mh">${e?`${Math.min(e.fc,t.fc.length)}/${t.fc.length}`:"—"}</td><td>${e?e.intents.length:0}</td><td><b>${m===null?"—":m+"%"}</b></td><td class="mh">${ul===null?"—":ul+"%"}</td><td>${e&&e.valoracio!==null?val[e.valoracio]:"—"}</td></tr>`}).join("")}
 </table><p class="prog" style="margin:8px 0 0"><span class="semaf" style="background:#22c55e"></span>80% o més · <span class="semaf" style="background:#f59e0b"></span>50-79% · <span class="semaf" style="background:#ef4444"></span>menys del 50% · <span class="semaf" style="background:#cbd5e1"></span>sense fer</p></div>
 <h2 class="sec">❌ Preguntes que més falla</h2><div class="box"><p class="prog" style="margin:0 0 8px">🔁 Al repàs: <b>${repTots().length}</b> preguntes pendents (${repPendents().length} per avui) · 🏅 apreses del tot: <b>${S.apresos||0}</b></p>${errs.length?`<ol class="llista-err">${errs.slice(0,8).map(([q,c,t])=>`<li>${q} <span class="etq">${t.ic} ${t.titol}</span> <b>×${c}</b></li>`).join("")}</ol>`:`<p class="prog" style="margin:0">Encara cap error registrat. 👌</p>`}</div>
 <h2 class="sec">✍️ Preguntes obertes</h2><div class="box">${obN?`<table class="an"><tr><th>Pregunta</th><th>Tema</th><th>Idees</th></tr>${OB.map((o,n)=>n in S.ob?`<tr style="cursor:pointer" onclick="obertes(${n})"><td>${o.q.length>80?o.q.slice(0,78)+"…":o.q}</td><td>${o.t}</td><td><span class="semaf" style="background:${color(S.ob[n])}"></span><b>${S.ob[n]}%</b></td></tr>`:"").join("")}</table>`:`<p class="prog" style="margin:0">Encara no n'ha fet cap.</p>`}</div>
 <h2 class="sec">🎮 Jocs i examen</h2><div class="box"><table class="an"><tr><th>Joc</th><th>Vegades</th><th>Millor</th><th>Últim</th></tr>${JOCS.map(([id,ic,t])=>{const r=S.jocs[id]||[];return `<tr><td>${ic} ${t}</td><td>${r.length}</td><td>${r.length?Math.max(...r)+"%":"—"}</td><td>${r.length?r[r.length-1]+"%":"—"}</td></tr>`}).join("")}</table></div>
 <p class="prog" style="text-align:center">Cada nom té el seu progrés, guardat en aquest navegador i aquest aparell. Data: ${new Date().toLocaleDateString("ca-ES")}.</p>
 <div class="fila"><button class="btn sec" onclick="benvinguda()">👥 Canviar d'usuari</button><button class="btn verm" onclick="demanaReset()">🗑️ Esborrar el progrés</button></div>`;
}
function demanaReset(){
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="box"><div class="gran">⚠️</div><h3>Esborrar tot el progrés de ${S.nom}?</h3><p class="prog">Només s'esborra el progrés de ${S.nom}; els altres noms no es toquen. No es pot desfer.</p><div class="fila"><button class="btn sec" id="no">No, deixa-ho</button><button class="btn verm" id="si">Sí, esborra-ho</button></div></div>`;
 document.body.appendChild(m);
 m.querySelector("#no").onclick=()=>m.remove();
 m.querySelector("#si").onclick=()=>{delete PER[S.nom];S=BUIT();try{localStorage.setItem(CL+"perfils",JSON.stringify(PER));localStorage.removeItem(CL+"actiu")}catch(e){}m.remove();pintaCap();benvinguda()};
}

pintaCap();pintaSo();vista("inici");
</script>
