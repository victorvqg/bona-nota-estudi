<script>
window.BN_ACT={arrel:"../",tornaAuto:true};
/* ACTUALITZA:inici (copiat de motor/eines/actualitza.js per motor/tot.py, no editar a mà) */
// ===== ACTUALITZACIÓ AUTOMÀTICA (motor/eines/actualitza.js · el mateix codi a la portada i als mons; tot.py el copia a index.html) =====
// Cada pàgina porta escrita la versió amb què es va generar (VER: la hi posa motor/tot.py). En obrir la pàgina es pregunta
// al servidor quina versió hi ha publicada (versio.json, sense passar per cap memòria cau). Si no coincideixen, el que es veu
// és una còpia vella (memòria cau del navegador o del service worker). Llavors: s'esborren les còpies guardades de l'app
// (memòria cau «bn-…»), es demana al service worker que s'actualitzi i es torna a carregar la pàgina, UN sol cop per versió.
// MAI s'esborra el progrés, el nom ni el PIN (són a localStorage i no es toquen). Sense connexió, o obrint el fitxer a
// l'ordinador (file://), no fa res.
// En tornar a l'app després de més de 10 minuts amagada: a la portada recarrega sola; dins d'un món, com que el nen pot
// estar a mig test, només surt un avís amb un botó per actualitzar quan vulgui.
(function(){
 const C=window.BN_ACT||{},ARREL=C.arrel||"./",VER="3d463ef623",KR="bn_act_recarrega",DEU=6e5;
 if(location.protocol==="file:"||VER.indexOf("__")===0||!window.fetch)return;
 let fet=0,amagat=0;
 const quan=f=>document.body?f():document.addEventListener("DOMContentLoaded",f);
 // esborra la memòria cau de l'app i fa que el service worker es descarregui de nou (màxim 3 s)
 const neteja=()=>Promise.race([Promise.all([
   window.caches?caches.keys().then(ks=>Promise.all(ks.filter(k=>k.indexOf("bn-")===0).map(k=>caches.delete(k)))).catch(()=>{}):0,
   navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.update().catch(()=>{})))).catch(()=>{}):0]),
  new Promise(r=>setTimeout(r,3000))]);
 function avis(txt,boto){quan(()=>{let a=document.getElementById("bnAct");
  if(!a){a=document.createElement("div");a.id="bnAct";a.setAttribute("role","status");
   a.style.cssText="position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:10px 14px;border-radius:14px;background:#0b1033f2;border:2px solid #facc15;color:#fff;font:800 14px/1.3 Nunito,system-ui,sans-serif;box-shadow:0 8px 24px #0009";
   document.body.appendChild(a)}
  a.innerHTML="";const t=document.createElement("span");t.textContent=txt;a.appendChild(t);
  if(boto){const b=document.createElement("button");b.type="button";b.textContent="Actualitza";
   b.style.cssText="font:900 13px Nunito,system-ui,sans-serif;color:#1e1b4b;background:#facc15;border:0;border-radius:999px;padding:8px 12px;cursor:pointer";
   b.onclick=()=>recarrega(boto,true);a.appendChild(b)}})}
 // l'adreça sense el «v=…» (la resta de paràmetres, com ?demo, es queden tal qual)
 const senseV=q=>q.replace(/([?&])v=[^&]*(&|$)/,(m,a,b)=>b?a:"").replace(/^\?$/,"");
 function recarrega(v,aMa){
  // una sola vegada per versió (si el servidor encara no serveix la nova, no entra en bucle); amb el botó, sempre
  if(!aMa){if(new RegExp("[?&]v="+v+"(&|$)").test(location.search))return;try{if(sessionStorage.getItem(KR)===v)return;sessionStorage.setItem(KR,v)}catch(e){}}
  avis("🔄 Versió nova de Bona Nota! Actualitzant…");
  const q=senseV(location.search);neteja().then(()=>location.replace(location.pathname+q+(q?"&":"?")+"v="+v+location.hash))}
 // un cop és la versió bona, treu el «?v=…» de l'adreça
 function netejaAdreca(){try{const q=senseV(location.search);if(q!==location.search)history.replaceState(history.state,"",location.pathname+q+location.hash)}catch(e){}}
 function comprova(auto){fet=Date.now();
  fetch(ARREL+"versio.json?t="+fet,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(!d||!d.v)return;
   if(d.v===VER){netejaAdreca();return}
   if(auto)recarrega(d.v);else avis("✨ Hi ha una versió nova de Bona Nota.",d.v)}).catch(()=>{})}
 comprova(true);
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){amagat=Date.now();return}
  if(amagat&&Date.now()-amagat>DEU&&Date.now()-fet>DEU)comprova(!!C.tornaAuto)});
 window.bnActualitza=()=>comprova(true); // per provar-ho a mà des de la consola
})();
/* ACTUALITZA:fi */
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
 --groc:#facc15;--vermell:#b91c1c;--fons:#0b1033;--txt:#e2e8f0;--cian:#22d3ee;
 --r1:#34d399;--r2:#38bdf8;--r3:#a855f7;--r4:#facc15;--r5:#f472b6;--rg:#fb923c;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:clip}
body{font-family:Nunito,system-ui,Arial,sans-serif;color:var(--txt);background:radial-gradient(1200px 700px at 50% -10%,#3b2a8c 0%,#1a1660 35%,var(--fons) 70%) fixed,var(--fons)}
button{font:inherit;color:inherit;background:#1e1b4b;border:1.5px solid #ffffff26;border-radius:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
:is(button,a,[tabindex="0"]):focus-visible{outline:3px solid var(--cian);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.salta{position:fixed;top:-60px;left:14px;z-index:200;background:var(--groc);color:#1e1b4b;font-weight:900;font-size:15px;padding:10px 18px;border-radius:12px;text-decoration:none;box-shadow:0 4px 0 var(--vermell);transition:transform .15s}
.salta:focus{transform:translateY(74px)}
.spr{display:inline-block;width:1.15em;height:auto;vertical-align:-.2em;shape-rendering:crispEdges;image-rendering:pixelated}
.amagat-f{display:none!important}
.fora-vista,.fora-vista *,.fora-vista::before,.fora-vista::after{animation-play-state:paused!important}

/* ---- Fons (estàtic + estrelles amb només opacity/transform) ---- */
.cel{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cel i{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.6;animation:pampalluga 3.4s ease-in-out infinite}
@keyframes pampalluga{0%,100%{opacity:.18;transform:scale(.7)}50%{opacity:.95;transform:scale(1.15)}}
.terra{position:fixed;left:0;right:0;bottom:0;height:26vh;z-index:0;pointer-events:none;
 background-image:linear-gradient(#a855f738 1px,transparent 1px),linear-gradient(90deg,#a855f738 1px,transparent 1px);background-size:48px 48px;
 mask-image:linear-gradient(to top,#000 12%,transparent 92%);-webkit-mask-image:linear-gradient(to top,#000 12%,transparent 92%)}

/* ---- Capçalera ---- */
.cap{position:relative;z-index:1;text-align:center;padding:12px 12px 4px}
h1{font-family:'Press Start 2P',monospace;font-size:clamp(16px,4.8vw,32px);line-height:1.3;margin:4px 0 0;color:var(--groc);text-shadow:3px 3px 0 var(--vermell),0 0 22px #facc1566;letter-spacing:1px}
.qui{margin:6px 0 0;font-weight:900;font-size:14.5px;color:#e0e7ff;min-height:1.2em}
.qui em{font-style:normal;color:var(--groc)}
.qui small{color:#a5b4fc;font-weight:800}

/* ---- Layout principal (mòbil primer: heroi dalt, carrusel mig, 6 pestanyes baix) ---- */
main{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:8px 12px 136px}
.columna{display:flex;flex-direction:column;gap:10px}
.tries{display:flex;flex-direction:column;gap:10px;margin-top:12px;min-width:0}

/* ---- Carta d'Heroi (sense raresa sobre el nen: només nivell + nom) ---- */
.fitxa{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:14px;border-radius:22px;background:radial-gradient(circle at 50% 24%,#312e81ee,#0f172af5 72%);border:3px solid var(--groc);box-shadow:0 12px 34px #000a}
.fitxa[data-comp="estel"]{border-color:#facc15;background:radial-gradient(circle at 50% 20%,#713f12cc,#1e1b4bf2 70%)}
.fitxa[data-comp="boss"]{border-color:#ef4444;background:radial-gradient(circle at 50% 20%,#7f1d1dcc,#1e1b4bf2 70%)}
.fitxa[data-comp="lab"]{border-color:#38bdf8;background:radial-gradient(circle at 50% 20%,#0c4a6ecc,#0f172af2 70%)}
.fitxa[data-comp="remuntada"]{border-color:#22c55e;background:radial-gradient(circle at 50% 20%,#14532dcc,#0f172af2 70%)}
.fitxa[data-comp="corona"]{border-color:#facc15;background:radial-gradient(circle at 50% 20%,#581c87dd,#1e1b4bf4 70%)}
.heroi-cap{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:900;color:#e0e7ff;padding-bottom:6px;border-bottom:1px solid #ffffff1a}
.heroi-niv{display:inline-flex;align-items:center;gap:6px;color:#fef08a}
.heroi-est{background:#0b1033aa;border:1.5px solid #facc1566;color:#fde047;padding:3px 10px;border-radius:99px;font-size:12.5px}

/* Avatar gegant: UNA SOLA REGLA per .gran-caixa i .gran (>150px a 390 i 1280, múltiples de 16px) */
.gran-caixa{position:relative;flex:none;width:160px;height:160px;margin:10px auto 12px}
.gran-caixa::after{content:"";position:absolute;left:50%;bottom:-12px;transform:translateX(-50%);width:84%;height:14px;border-radius:50%;background:radial-gradient(ellipse,rgba(250,204,21,.42),rgba(139,92,246,.18) 58%,transparent 78%);pointer-events:none;z-index:0}
.gran{position:absolute;inset:0;width:100%;height:100%;z-index:2;border-radius:50%;background:var(--av,#312e81);border:4px solid #fff;box-shadow:0 0 0 3px #1d1631,0 10px 24px #000b;padding:0;transform-origin:50% 100%;animation:respira 3.2s ease-in-out infinite}
.gran.salta{animation:salta .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes respira{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes salta{0%{transform:scaleX(1.06) scaleY(.92)}38%{transform:translateY(-16px) scaleX(.95) scaleY(1.06)}75%{transform:translateY(0) scaleX(1.04) scaleY(.96)}100%{transform:none}}
.av-cl{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#1d16311a 0 25%,transparent 0 50%) 0 0/16px 16px,var(--av,#312e81)}
.gran .av-cl .spr{width:128px;height:128px;display:block;vertical-align:0}

/* Marcs d'avatar i aures compartides (.gran, .av-mini, .prev-av) */
[data-marc="bronze"]{box-shadow:0 0 0 4px #d97706,0 0 0 7px #78350f!important}
[data-marc="plata"]{box-shadow:0 0 0 4px #e2e8f0,0 0 0 7px #64748b!important}
[data-marc="or"]{box-shadow:0 0 0 4px #fef08a,0 0 0 8px #ca8a04,0 0 22px #facc15aa!important}
[data-marc="neo"]{box-shadow:0 0 0 4px #67e8f9,0 0 0 8px #0891b2,0 0 24px #22d3eecc!important}
[data-marc="foc"]{box-shadow:0 0 0 4px #fdba74,0 0 0 8px #dc2626,0 0 24px #f97316cc!important}
[data-marc="diamant"]{box-shadow:0 0 0 4px #e0f2fe,0 0 0 8px #38bdf8,0 0 26px #7dd3fccc!important}
[data-marc="prisma"]{box-shadow:0 0 0 4px #f472b6,0 0 0 7px #a855f7,0 0 0 10px #22d3ee88,0 0 28px #facc15aa!important}
[data-comp="estel"]:not([data-marc]):not(.fitxa){box-shadow:0 0 0 3px #fef08a,0 0 18px #facc1599}
[data-comp="boss"]:not([data-marc]):not(.fitxa){box-shadow:0 0 0 3px #fca5a5,0 0 18px #f97316aa}
[data-comp="lab"]:not([data-marc]):not(.fitxa){box-shadow:0 0 0 3px #bae6fd,0 0 18px #38bdf899}
[data-comp="remuntada"]:not([data-marc]):not(.fitxa){box-shadow:0 0 0 3px #bbf7d0,0 0 18px #22c55e99}
[data-comp="corona"]:not([data-marc]):not(.fitxa){box-shadow:0 0 0 3px #fde047,0 0 0 6px #a855f7aa,0 0 20px #facc15aa}

/* Efecte SVG del complement (només transform/opacity) */
.comp-fx{position:absolute;inset:-14px;pointer-events:none;z-index:4;display:flex;align-items:center;justify-content:center}
.comp-fx svg{width:100%;height:100%;overflow:visible}
.comp-fx .fx-rot,.prev-fx .fx-rot{transform-origin:100px 100px;animation:fxRot 10s linear infinite}
.comp-fx .fx-rot2,.prev-fx .fx-rot2{transform-origin:100px 100px;animation:fxRot 14s linear infinite reverse}
.comp-fx .fx-pul,.prev-fx .fx-pul{transform-origin:100px 100px;animation:fxPul 1.8s ease-in-out infinite}
.comp-fx .fx-top,.prev-fx .fx-top{transform-origin:100px 24px;animation:fxTop 2.2s ease-in-out infinite}
@keyframes fxRot{to{transform:rotate(360deg)}}
@keyframes fxPul{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.07);opacity:1}}
@keyframes fxTop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* Insígnia flotant sobre l'avatar (múltiples de 16px: 64px / 48px) */
.insig{position:absolute;right:-8px;bottom:-8px;z-index:5;width:64px;height:64px;border-radius:16px;background:#1d1631;border:3px solid var(--groc);box-shadow:0 0 0 3px #1d1631,0 6px 14px #000a;display:grid;place-items:center}
.insig .spr{width:48px;height:48px;vertical-align:0}
.insig.buit{border-style:dashed;border-color:#94a3b8;color:#94a3b8;font-family:'Press Start 2P',monospace;font-size:18px}
.insig.flip{animation:flipIn .38s ease-out}
@keyframes flipIn{0%{transform:scale(.72);opacity:.3}60%{transform:scale(1.1);opacity:1}100%{transform:scale(1)}}

/* Cinta d'emprovador (bloquejat) */
.prova-cinta{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;border-radius:12px;background:#451a03ee;border:2px solid #f59e0b;color:#fef3c7;font-size:12px;font-weight:900;text-align:left}
.prova-cinta[hidden]{display:none}
.prova-cinta button{flex:none;padding:6px 10px;min-height:44px;border-radius:10px;background:#facc15;color:#1e1b4b;border:0;font-size:11.5px;font-weight:900}

/* Textos de la fitxa */
.fitxa-txt{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px}
.fitxa-nom{font-weight:900;font-size:24px;color:#fff;line-height:1.1}
.fitxa-nom small{font-size:13px;color:#c7d2fe;font-weight:800;margin-left:4px}
.fitxa-badges{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.fitxa-titol{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:#ffffff18;border:1.5px solid #a5b4fc88;color:#e0e7ff;font-size:12px;font-weight:900}
.fitxa-titol:empty{display:none}
.fitxa-comp{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-family:'Press Start 2P',monospace;font-size:8.5px;color:#fff;background:var(--cc,#f59e0b);border:1.5px solid #ffffffaa}
.fitxa-comp[hidden]{display:none}
.fitxa-sk-lin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:2px}
.fitxa-sk{font-family:'Press Start 2P',monospace;font-size:12px;color:var(--groc);text-shadow:2px 2px 0 var(--vermell)}
.fitxa-sk.buit{font-family:Nunito,sans-serif;font-size:13.5px;font-weight:800;color:#f0abfc;text-shadow:none}
.fitxa-est{font-weight:900;font-size:12.5px;color:var(--cian)}

/* Mini-vista «Així et veuen» (mateix dibuix bnAvatarHtml que rànquing/podi/mons) */
.mini-vista{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#070a2acc;border:1.5px solid #ffffff1c;text-align:left}
.mini-vista .mv-lbl{font-size:10.5px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em}
.mini-vista .mv-nom{font-size:13px;font-weight:900;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.av-mini{position:relative;flex:none;width:48px;height:48px;border-radius:50%;display:inline-block;background:var(--av,#312e81);border:2px solid #fff}
.av-mini .av-cl .spr{width:32px;height:32px;display:block;vertical-align:0}
.av-mini .av-sk{position:absolute;right:-4px;bottom:-4px;width:22px;height:22px;border-radius:6px;background:#1d1631;border:1.5px solid var(--groc);display:grid;place-items:center}
.av-mini .av-sk .spr{width:16px;height:16px;vertical-align:0}
.av-mini .av-cmp{position:absolute;top:-6px;right:-4px;font-size:13px;line-height:1}

/* Franja PRÒXIM PREMI clicable */
.prox-bt{width:100%;display:flex;flex-direction:column;gap:5px;padding:9px 11px;border-radius:14px;background:linear-gradient(135deg,#1e1b4bee,#0f172aee);border:1.5px solid #facc1577;text-align:left;min-height:44px;transition:transform .14s}
.prox-bt:hover{transform:translateY(-1px);border-color:var(--groc)}
.prox-top{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:900;color:#fef08a}
.prox-top small{color:#cbd5e1;font-weight:800}
.prog-bar{width:100%;height:7px;border-radius:99px;background:#ffffff1c;overflow:hidden}
.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#facc15);border-radius:99px}

/* Accions */
.accions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bt-sorpresa{font-weight:900;font-size:14px;color:#082f49;background:var(--cian);border:0;border-radius:14px;padding:10px 12px;min-height:46px;box-shadow:0 4px 0 #0e7490}
.bt-sorpresa:active{transform:translateY(2px)}
.bt-torna{font-family:'Press Start 2P',monospace;font-size:9.5px;color:#fecaca;background:#1e1b4bcc;border:2px solid #b91c1c99;border-radius:14px;padding:10px 8px;text-align:center;text-decoration:none;min-height:46px;display:grid;place-items:center}
.bt-desa{font-family:'Press Start 2P',monospace;font-size:11.5px;line-height:1.3;color:#1e1b4b;background:var(--groc);border:0;border-radius:14px;padding:12px 14px;min-height:50px;box-shadow:0 4px 0 var(--vermell);text-decoration:none;display:grid;place-items:center}
.bt-desa[aria-disabled="true"]{opacity:.45;box-shadow:none;cursor:default}
.bt-desa.ok{background:#22c55e;color:#052e16;box-shadow:0 4px 0 #166534}
.avis{margin:0;min-height:1em;text-align:center;font-weight:800;font-size:13px;color:#fde68a}
.avis:empty{display:none}
.avis a{color:var(--cian)}

/* Al mòbil (<900px): DESA flota damunt les 6 pestanyes NOMÉS quan hi ha canvis o acabat de guardar */
@media(max-width:899px){
 .bt-desa{position:fixed;left:12px;right:12px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:11;box-shadow:0 4px 0 var(--vermell),0 10px 26px #000c}
 .bt-desa[aria-disabled="true"]:not(.ok){display:none}
 .armari-tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:#070a2af8;border-top:2px solid #facc1566;border-radius:0}
 .arm-tab{flex-direction:column;gap:2px;padding:6px 2px;min-height:52px;font-size:10.5px;border-radius:10px}
 .arm-tab .at-ic{font-size:17px;line-height:1}
 .arm-tab .at-cnt{display:none}
}

/* ---- Dock de 6 pestanyes (sempre 6 columnes dins la pantalla, zero retalls) ---- */
.armari-tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.arm-tab{position:relative;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 6px;min-height:46px;border-radius:14px;border:2px solid #ffffff22;background:#0f172ae6;color:#cbd5e1;font-weight:900;font-size:12.5px;white-space:nowrap;overflow:hidden;transition:transform .14s}
.arm-tab:hover{border-color:#a5b4fc;color:#fff;transform:translateY(-1px)}
.arm-tab[aria-selected="true"]{background:linear-gradient(135deg,#facc15,#f59e0b);color:#1e1b4b;border-color:#fef08a;box-shadow:0 3px 0 #b45309}
.arm-tab .at-cnt{font-size:10.5px;padding:2px 5px;border-radius:99px;background:#0000002e}
.arm-tab[aria-selected="true"] .at-cnt{background:#1e1b4b22;color:#1e1b4b}
.arm-tab.complerta{border-color:#facc1599}
.arm-tab .at-segell{position:absolute;top:2px;left:4px;font-size:10px;line-height:1;color:#facc15}
.arm-tab[aria-selected="true"] .at-segell{color:#1e1b4b}
.arm-tab .at-nou{position:absolute;top:3px;right:4px;width:8px;height:8px;border-radius:50%;background:#ef4444;border:1.5px solid #fff}

/* ---- Capçalera compacta del Passe de Cartes (1 sola barra neta) ---- */
.deck-cap{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:#0f172ad9;border:1.5px solid #ffffff20}
.deck-tit{display:flex;align-items:center;gap:8px;margin:0;font-family:'Press Start 2P',monospace;font-size:11px;color:#f0abfc}
.deck-tit small{font-family:Nunito,sans-serif;font-size:12.5px;font-weight:800;color:#a5b4fc}
.filt-grp{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.filt-bt{padding:7px 10px;min-height:44px;border-radius:99px;border:1.5px solid #ffffff2a;background:#1e1b4bcc;color:#e2e8f0;font-weight:800;font-size:12px}
.filt-bt[aria-pressed="true"]{background:var(--groc);color:#1e1b4b;border-color:#fef08a}
.bt-regal{padding:7px 12px;min-height:44px;border-radius:99px;border:2px solid #fef08a;background:linear-gradient(135deg,#facc15,#f97316);color:#1e1b4b;font-weight:900;font-size:12px}

/* ---- Carrusel «Passe de Cartes» (3-4 cartes escriptori, ~1.6 mòbil, scroll-snap, focus central) ---- */
.panell-tab{display:none}
.panell-tab.on{display:block;animation:tabIn .18s ease-out}
@keyframes tabIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.passe-wrap{position:relative;padding:8px 0 4px}
.passe{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 44px 18px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.passe::-webkit-scrollbar{display:none}
.passe-fl{position:absolute;top:50%;z-index:4;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:2px solid #fef08a;background:#1e1b4bee;color:var(--groc);font-family:'Press Start 2P',monospace;font-size:13px;display:grid;place-items:center;box-shadow:0 4px 14px #000a}
.passe-fl.esq{left:2px}.passe-fl.dre{right:2px}
.passe-fl:active{transform:translateY(calc(-50% + 2px))}
.passe-peu{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 0;font-size:13px;font-weight:900;color:#cbd5e1}

/* ---- Carta Col·leccionable (sense rotateY ni 3D · només transform i opacity) ---- */
.carta{position:relative;flex:0 0 212px;min-height:278px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;padding:12px 11px;border-radius:20px;border:2.5px solid var(--rc,#64748b);background:linear-gradient(170deg,#1e1b4bf2,#0b1033f7 68%);color:#f8fafc;opacity:.74;transform:scale(.95);transition:transform .2s,opacity .2s;overflow:hidden}
.carta.focus{opacity:1;transform:scale(1.04);z-index:2;box-shadow:0 12px 30px #000a,0 0 22px color-mix(in srgb,var(--rc,#facc15) 45%,transparent)}
.carta.on{opacity:1;border-color:var(--groc);box-shadow:0 0 0 2px var(--groc),0 10px 26px #000a}
.carta.lock{border-style:dashed}
.carta.lock .carta-escena{opacity:.78}
/* Brillantor hologràfica NOMÉS a la carta en focus o equipada (només transform) */
.carta.focus::before,.carta.on::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.16) 50%,transparent 70%);transform:translateX(-110%);animation:sheen 3.2s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-110%)}100%{transform:translateX(120%)}}

/* Rareses declarades (5 nivells + GESTA · nom + gemmes, mai només color) */
.carta[data-rar="1"]{--rc:var(--r1)}
.carta[data-rar="2"]{--rc:var(--r2)}
.carta[data-rar="3"]{--rc:var(--r3)}
.carta[data-rar="4"]{--rc:var(--r4)}
.carta[data-rar="5"]{--rc:var(--r5)}
.carta[data-rar="gesta"]{--rc:var(--rg)}
.carta-top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:4px;font-size:10px;font-weight:900}
.rar-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:99px;background:#070a2acc;border:1px solid var(--rc);color:var(--rc);letter-spacing:.02em;white-space:nowrap}
.estat-pill{padding:3px 7px;border-radius:99px;font-size:10px;font-weight:900;background:#ffffff16;color:#e2e8f0;white-space:nowrap}
.carta.on .estat-pill{background:var(--groc);color:#1e1b4b}
.carta .nou-tag{background:linear-gradient(135deg,#facc15,#f97316);color:#1e1b4b;font-family:'Press Start 2P',monospace;font-size:7px;padding:3px 6px;border-radius:99px}

/* Escenari de la carta (múltiples de 16px: 96px / 80px sprites) */
.carta-escena{position:relative;width:112px;height:112px;margin:4px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,color-mix(in srgb,var(--rc,#6366f1) 38%,#1e1b4b),#070a2a)}
.carta-escena .av-cl .spr{width:96px;height:96px;display:block;vertical-align:0}
.carta-escena .prev-av{position:relative;width:96px;height:96px;border-radius:50%;background:var(--av,#312e81);border:3px solid #fff}
.carta-escena .prev-av .av-cl .spr{width:80px;height:80px}
.carta-escena .prev-fx{position:absolute;inset:-10px;pointer-events:none}
.carta-escena .prev-fx svg{width:100%;height:100%;overflow:visible}
.carta:not(.focus):not(.on) .prev-fx *{animation:none!important}
.carta-titol-placa{width:100%;min-height:92px;padding:12px 8px;border-radius:16px;background:radial-gradient(circle at 50% 25%,color-mix(in srgb,var(--rc,#6366f1) 32%,#1e1b4b),#070a2aee);border:1.5px solid color-mix(in srgb,var(--rc,#6366f1) 60%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.carta-titol-placa span{font-size:32px;line-height:1}
.carta-nom{font-size:15px;font-weight:900;color:#fff;line-height:1.2}
.carta-sub{font-size:11.5px;color:#cbd5e1;line-height:1.25;min-height:28px}
.carta-prog{width:100%;display:flex;flex-direction:column;gap:4px}
.carta-prog small{font-size:11px;font-weight:800;color:#fde68a}
/* Botó d'acció només visible a la carta en focus */
.carta-acc{margin-top:auto;width:100%;padding:8px 10px;min-height:44px;border-radius:12px;font-weight:900;font-size:12px;border:0;background:var(--groc);color:#1e1b4b;opacity:0;pointer-events:none;transition:opacity .15s}
.carta.focus .carta-acc{opacity:1;pointer-events:auto}
.carta.lock .carta-acc{background:#334155;color:#fef08a;border:1.5px solid #facc1566}
.carta.on .carta-acc{background:#22c55e;color:#052e16}

/* Carta Trofeu (col·lecció completa en filtre 🔒) */
.carta-trofeu{width:100%;max-width:420px;margin:14px auto;padding:24px 18px;border-radius:22px;background:radial-gradient(circle at 50% 15%,#713f12aa,#1e1b4bf2 68%);border:2.5px solid var(--groc);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.carta-trofeu .tr-ic{font-size:48px;line-height:1}
.carta-trofeu h3{margin:0;font-family:'Press Start 2P',monospace;font-size:13px;color:var(--groc);line-height:1.5}
.carta-trofeu p{margin:0;font-size:13.5px;color:#e0e7ff;font-weight:800}
.carta-trofeu button{padding:11px 16px;min-height:44px;border-radius:12px;background:var(--groc);color:#1e1b4b;border:0;font-weight:900;font-size:13px}

/* ---- 10 Cartes de Classe (Insígnies · 5 rangs en escala + 3 mostres de color) ---- */
.classe-carta{flex:0 0 218px;min-height:242px;cursor:pointer}
.classe-carta.oberta{border-color:var(--cian);opacity:1;transform:scale(1.04)}
.classe-minis{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;margin:4px 0}
.classe-minis .cm-it{width:34px;height:34px;border-radius:9px;background:#070a2acc;border:1.5px solid #ffffff22;display:grid;place-items:center}
.classe-minis .cm-it.ok{border-color:#22c55e88}
.classe-minis .cm-it.on{border-color:var(--groc);background:#facc1528}
.classe-minis .cm-it.lock .spr{opacity:.35;filter:grayscale(1)}
.classe-minis .cm-it .spr{width:24px;height:24px;vertical-align:0}

/* Escala oberta de la classe activa (5 rangs + 3 mostres d'estil) */
.classe-detall{margin-top:8px;padding:14px 12px;border-radius:20px;background:#0f172ae8;border:2px solid #38bdf866}
.cd-cap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.cd-cap h3{margin:0;font-size:15px;font-weight:900;color:#fff}
.estils{display:flex;gap:6px;flex-wrap:wrap}
.est{padding:7px 12px;min-height:44px;border-radius:99px;background:#1e1b4b;border:2px solid #ffffff2a;color:#e0e7ff;font-weight:900;font-size:12.5px}
.est.on{background:var(--groc);color:#1e1b4b;border-color:#fef08a}
.est.lock{opacity:.58;border-style:dashed}
.classe-bloc{display:none}
.classe-bloc.oberta{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px}
.sk{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;padding:12px 8px;min-height:142px;border-radius:16px;border:2px solid var(--rc,#ffffff24);background:#0b1033dd;color:#f8fafc;transition:transform .14s}
.sk[data-rar="1"]{--rc:var(--r1)}.sk[data-rar="2"]{--rc:var(--r2)}.sk[data-rar="3"]{--rc:var(--r3)}.sk[data-rar="4"]{--rc:var(--r4)}.sk[data-rar="5"]{--rc:var(--r5)}
.sk:hover{transform:translateY(-2px)}
.sk.on{border-color:var(--groc);background:#facc1522;box-shadow:0 0 0 2px var(--groc)}
.sk.lock{opacity:.68;border-style:dashed}
.sk.lock .spr{opacity:.42;filter:grayscale(.85)}
.sk .spr{width:48px;height:48px;vertical-align:0;pointer-events:none}
.sk b{font-size:12.5px;line-height:1.15}
.sk small{font-size:10.5px;color:#cbd5e1}
.sk .sk-seg{padding:2px 6px;border-radius:99px;background:#facc1528;color:#fde047;font-size:10px;font-weight:900}

/* ---- Camí de Nivells (sense temporades ni dates · fites clicables) ---- */
.cami-carta{flex:0 0 218px;min-height:248px;justify-content:flex-start}
.cami-carta.actual{border-color:var(--groc);opacity:1;transform:scale(1.04)}
.cami-carta.ok{border-color:#22c55e88}
.cami-premis{width:100%;display:flex;flex-direction:column;gap:5px;margin-top:4px}
.cami-chip{width:100%;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 9px;min-height:44px;border-radius:10px;background:#1e1b4bcc;border:1px solid #ffffff28;color:#f8fafc;font-size:11.5px;font-weight:800;text-align:left}
.cami-chip:hover{border-color:var(--groc);background:#facc1522}

/* ---- Simulador ?demo=1 (fosc, discret, zero botons blancs per defecte) ---- */
.demo-sim-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:14px;background:#070a2acc;border:1.5px solid #facc1544;font-size:11.5px;font-weight:800;color:#fde047}
.demo-sim-bar[hidden]{display:none}
.demo-sim-bar button{padding:6px 10px;min-height:44px;border-radius:99px;border:1.5px solid #facc1555;background:#1e1b4b;color:#fef08a;font-size:11.5px;font-weight:800}
.demo-sim-bar button.on{background:var(--groc);color:#1e1b4b;border-color:#fef08a}

/* ---- Modal Cofre d'Estrena (sense backdrop-filter) ---- */
.regal-ov{position:fixed;inset:0;z-index:40;background:#040615e8;display:flex;align-items:center;justify-content:center;padding:18px}
.regal-ov[hidden]{display:none}
.regal-box{max-width:460px;width:100%;border-radius:24px;padding:22px 18px;text-align:center;background:radial-gradient(circle at 50% 10%,#4c1d95,#1e1b4b 58%,#0b1033);border:3px solid var(--groc);box-shadow:0 24px 60px #000c;color:#fff}
.regal-ic{font-size:56px;line-height:1;margin-bottom:8px;animation:regalBota 1.2s ease-in-out infinite}
@keyframes regalBota{50%{transform:translateY(-8px) scale(1.06)}}
.regal-box h2{margin:0;font-family:'Press Start 2P',monospace;font-size:14px;color:#fde047;line-height:1.5}
.regal-box p{margin:8px 0 14px;font-size:14px;color:#e0e7ff;font-weight:700}
.regal-llista{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px;margin:14px 0}
.regal-it{background:#ffffff14;border:2px solid #facc1588;border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.regal-it b{font-size:12.5px;color:#fef08a}
.regal-it small{font-size:11px;color:#cbd5e1}
.regal-acc{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.regal-bt{font-family:'Press Start 2P',monospace;font-size:11px;color:#1e1b4b;background:var(--groc);border:0;border-radius:14px;padding:13px 16px;min-height:46px;box-shadow:0 4px 0 #b45309}
.regal-sec{font-weight:800;font-size:13px;color:#e2e8f0;background:#1e1b4b;border:1.5px solid #ffffff33;border-radius:12px;padding:11px 16px;min-height:46px}

/* ---- Toast, pluja, sense nen, peu ---- */
.toast{position:fixed;left:50%;top:42%;z-index:30;transform:translate(-50%,-50%);font-family:'Press Start 2P',monospace;font-size:clamp(14px,4.5vw,26px);color:var(--groc);text-shadow:3px 3px 0 var(--vermell);pointer-events:none;animation:toastIn .35s ease-out both,toastOut .3s 1.3s ease-in forwards}
@keyframes toastIn{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes toastOut{to{transform:translate(-50%,-66%) scale(1.06);opacity:0}}
.pluja{position:fixed;inset:0;z-index:25;pointer-events:none;overflow:hidden}
.pluja i{position:absolute;top:-30px;width:var(--m);height:var(--m);animation:cau var(--d) linear var(--r) forwards}
.pluja i .spr{width:100%;vertical-align:0}
@keyframes cau{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:1}100%{transform:translateY(105vh) rotate(360deg);opacity:0}}
.sense{position:relative;z-index:1;max-width:440px;margin:28px auto;background:#1e1b4bee;border:2px solid var(--groc);border-radius:20px;padding:22px 18px;text-align:center;font-weight:800;font-size:16px;line-height:1.5}
.sense .gran-caixa{margin:0 auto 14px}
.sense .en-bt{display:inline-block;margin-top:12px;font-family:'Press Start 2P',monospace;font-size:12.5px;color:#1e1b4b;background:var(--groc);border-radius:14px;padding:14px 18px;text-decoration:none;box-shadow:0 4px 0 var(--vermell)}
footer{position:relative;z-index:1;text-align:center;padding:8px 16px 86px;font-size:12px;color:#94a3b8;font-weight:700}

/* ---- Escriptori (≥900px): dos blocs (Carta d'Heroi 390px + Passe de Cartes ample) ---- */
@media(min-width:900px){
 main{display:grid;grid-template-columns:390px minmax(0,1fr);gap:24px;align-items:start;padding:10px 22px 24px}
 .columna{position:sticky;top:14px}
 .gran-caixa{width:192px;height:192px}
 .gran .av-cl .spr{width:160px;height:160px}
 .tries{margin-top:0}
 .accions{grid-template-columns:1fr 1.45fr}
 .bt-torna{grid-column:1/-1}
 .carta{flex:0 0 186px;min-height:272px}
 .passe{padding:16px 52px 20px}
 footer{padding-bottom:20px}
}

/* ---- Mode suau i prefers-reduced-motion: 0 animacions i 0 transicions ---- */
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
body.suau *,body.suau *::before,body.suau *::after{animation:none!important;transition:none!important}
</style>

// ====================== ORDENACIÓ I PROGRÉS ======================
function ordenaPeces(llista,esEq,esOk,reqFn){
 return [...llista].sort((a,b)=>{
  const ea=esEq(a)?0:esOk(a)?1:2,eb=esEq(b)?0:esOk(b)?1:2;
  if(ea!==eb)return ea-eb;
  return (reqFn(a)||0)-(reqFn(b)||0);
 });
}
function tresMesProperes(llista,esOk,reqFn){
 const blq=llista.filter(x=>!esOk(x)&&reqFn(x)>0).sort((a,b)=>reqFn(a)-reqFn(b));
 return new Set(blq.slice(0,3));
}
function progGestaHtml(item){
 if(!item.g)return "";
 const val=Math.min(item.g.max,FITES[item.g.k]||0),pc=Math.round(val*100/item.g.max);
 return `<div class="carta-prog"><small>🏅 ${val}/${item.g.max} · ${esc(item.g.on)}</small><div class="prog-bar"><i style="width:${pc}%"></i></div></div>`;
}
function progEstHtml(req){
 const falt=Math.max(1,req-FITES.tot),pc=Math.min(99,Math.round(FITES.tot*100/Math.max(1,req)));
 return `<div class="carta-prog"><small>🔒 Et falten ${falt} ⭐ (${FITES.tot}/${req} ⭐)</small><div class="prog-bar"><i style="width:${pc}%"></i></div></div>`;
}
function calculaProximPremi(){
 const cands=[];
 AV_CAT.forEach(a=>{if(!avObert(a.id)&&a.req>0)cands.push({t:"animals",id:a.id,nom:"Animal: "+a.nom,ic:"🐾",req:a.req})});
 MARC_CAT.forEach(m=>{if(!marcObert(m.id)&&m.req>0)cands.push({t:"marcs",id:m.id,nom:"Marc "+m.nom,ic:m.ic,req:m.req})});
 TITOL_CAT.forEach(t=>{if(!titolObert(t.id)&&t.req>0)cands.push({t:"titols",id:t.id,nom:"Títol «"+t.nom+"»",ic:t.ic,req:t.req})});
 COMP_CAT.forEach(c=>{if(!compObert(c.id)&&c.req>0)cands.push({t:"comps",id:c.id,nom:"Complement "+c.nom,ic:c.ic,req:c.req})});
 Object.keys(BN_SKILLS).forEach(id=>{if(!skObert(id)&&skReq(id)>0)cands.push({t:"insignies",id,nom:"Insígnia "+nomSk(id),ic:"⚔️",req:skReq(id)})});
 cands.sort((a,b)=>a.req-b.req);
 return cands[0]||null;
}

// ====================== FOCUS DEL CARRUSEL ======================
function centraCarta(track,el,suau){
 if(!track||!el)return;
 const x=el.offsetLeft-(track.clientWidth-el.offsetWidth)/2;
 track.scrollTo({left:Math.max(0,x),behavior:suau&&!SUAU?"smooth":"auto"});
}
function actualitzaFocus(track){
 if(!track)return;
 const cartes=[...track.querySelectorAll(".carta:not(.amagat-f)")];
 if(!cartes.length)return;
 const mid=track.scrollLeft+track.clientWidth/2;
 let best=cartes[0],minD=1e9;
 cartes.forEach(c=>{const d=Math.abs(c.offsetLeft+c.offsetWidth/2-mid);if(d<minD){minD=d;best=c}});
 cartes.forEach(c=>c.classList.toggle("focus",c===best));
}
function lligaCarrusel(track){
 if(!track||track.dataset.lligat)return;track.dataset.lligat="1";
 let raf=0;
 track.addEventListener("scroll",()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;actualitzaFocus(track)})},{passive:true});
 const wrap=track.closest(".passe-wrap");
 if(wrap)wrap.querySelectorAll(".passe-fl").forEach(fl=>fl.onclick=()=>{
  const cartes=[...track.querySelectorAll(".carta:not(.amagat-f)")];if(!cartes.length)return;
  const idx=Math.max(0,cartes.findIndex(c=>c.classList.contains("focus")));
  const dir=+fl.dataset.dir||1,nxt=cartes[Math.max(0,Math.min(cartes.length-1,idx+dir))];
  if(nxt){centraCarta(track,nxt,true);actualitzaFocus(track);soClinc()}
 });
}

function teclat(e){
 if(!$("regalModal").hidden)return;
 const b=e.target.closest("[role=radio]");
 if(b){
  const g=b.closest("[role=radiogroup]"),tots=[...g.querySelectorAll("[role=radio]:not(.amagat-f)")],i=tots.indexOf(b);
  let j=null;
  if(e.key==="ArrowRight")j=i+1;else if(e.key==="ArrowLeft")j=i-1;else if(e.key==="Home")j=0;else if(e.key==="End")j=tots.length-1;
  if(j===null||!tots.length)return;e.preventDefault();
  j=(j+tots.length)%tots.length;const n=tots[j];
  const attr=["data-an","data-sk","data-marc","data-titol","data-comp","data-v"].find(a=>n.hasAttribute(a));
  const val=attr?n.getAttribute(attr):null;
  soClinc();n.click();
  const nou=attr?g.querySelector(`[${attr}="${val}"]`):n;
  if(nou){nou.focus({preventScroll:true});if(g.classList.contains("passe")){centraCarta(g,nou,true);actualitzaFocus(g)}}
  return;
 }
 if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
  const track=document.querySelector(".panell-tab.on .passe");if(!track)return;
  const cartes=[...track.querySelectorAll(".carta:not(.amagat-f)")];if(!cartes.length)return;
  e.preventDefault();
  const idx=Math.max(0,cartes.findIndex(c=>c.classList.contains("focus")));
  const dir=e.key==="ArrowRight"?1:-1,nxt=cartes[Math.max(0,Math.min(cartes.length-1,idx+dir))];
  if(nxt){centraCarta(track,nxt,true);actualitzaFocus(track);soClinc()}
 }
}
