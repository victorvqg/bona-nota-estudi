# Bona Nota · revisió automàtica a cada canvi
# 1) Torna a generar tots els mons i la portada (motor/tot.py) i comprova que el que hi ha pujat coincideix:
#    si algú ha editat una pàgina generada a mà, o s'ha oblidat de regenerar, falla i diu quins fitxers.
# 2) Passa la prova automàtica de cada món (tests, jocs, examen, repàs, obertes) en mode estricte, i la de la pàgina de perfil:
#    mínim 8 preguntes per tema i la resposta correcta no pot ser massa sovint la més llarga (ni massa poc).
# 3) Passa les proves del xat de la colla: el SQL (supabase/bn_xat.sql dins d'un Postgres de prova, PGlite), la portada i l'admin.
name: Revisa Bona Nota
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  revisa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Instal·la Playwright (Chromium) i PGlite (Postgres de prova per al SQL del xat)
        run: |
          npm install --no-save playwright@1 @electric-sql/pglite@0.5
          npx playwright install --with-deps chromium
      - name: Regenera mons i portada
        run: cd motor && python3 tot.py
      - name: Les pàgines pujades coincideixen amb el motor
        run: |
          if ! git diff --quiet; then
            echo "::error::Hi ha pàgines que no coincideixen amb el motor + dades. Executa 'python3 motor/tot.py' i torna a pujar. Fitxers:"
            git diff --stat
            exit 1
          fi
      - name: Prova dels generadors del Taller de mates (càlculs, errors típics, Troba l'error)
        run: cd motor && node prova-generadors.js
      - name: Prova del núvol d'un món (aparell vell, sense connexió, -2; amb Supabase simulat)
        run: node motor/prova-nuvol.js
      - name: Prova de la pàgina de perfil (perfil/, amb Supabase simulat)
        run: node motor/prova-perfil.js
      - name: Prova dels orígens d'estrelles del tauler (admin/, funcions pures)
        run: node motor/prova-admin-fonts.js
      - name: Prova del xat a la base de dades (supabase/bn_xat.sql dins de PGlite)
        run: node motor/prova-xat-sql.js
      - name: Prova del xat de la colla a la portada (amb Supabase simulat)
        run: node motor/prova-xat.js
      - name: Prova de la pestanya Xat de l'admin (amb Supabase simulat)
        run: node motor/prova-admin-xat.js
      - name: Prova de la fitxa al núvol i les altes a la base de dades (supabase/bn_admin_fitxa.sql dins de PGlite)
        run: node motor/prova-admin-fitxa-sql.js
      - name: Prova de la fitxa al núvol i les altes a l'admin (amb Supabase simulat)
        run: node motor/prova-admin-fitxa.js
      - name: Prova del benestar a la base de dades (supabase/bn_admin_benestar.sql dins de PGlite)
        run: node motor/prova-admin-benestar-sql.js
      - name: Prova de l'apartat Benestar del tauler (amb Supabase simulat)
        run: node motor/prova-admin-benestar.js
      - name: Prova automàtica de cada món
        run: |
          cd motor
          for c in $(python3 -c "import json;print(' '.join(m['carpeta'] for m in json.load(open('mons.json'))))"); do
            echo "::group::$c"
            ESTRICTE=1 node prova.js "$PWD/../$c/index.html"
            echo "::endgroup::"
          done
