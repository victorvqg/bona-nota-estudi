<svg class="ilu" viewBox="0 0 200 130" aria-hidden="true"><style>.en-m{animation:enPuja 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}.en-s{animation:enFlota 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.en-s2{animation-delay:-1.3s}.en-s3{animation-delay:-2.6s}.en-g{animation:enSalt 3s cubic-bezier(.3,0,.5,1) infinite}@keyframes enPuja{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}@keyframes enFlota{50%{transform:translateY(-6px) rotate(10deg)}}@keyframes enSalt{0%,100%{transform:translateX(0)}50%{transform:translateX(-36px)}}@media(prefers-reduced-motion:reduce){.ilu *{animation:none!important}}</style>
