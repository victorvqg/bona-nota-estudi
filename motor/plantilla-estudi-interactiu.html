<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
 --fosc:#1f2d3d;--blau:#3b82f6;--blau2:#2563eb;--verd:#16a34a;--verd-cl:#dcfce7;--verm:#dc2626;--verm-cl:#fee2e2;
 --groc:#f59e0b;--groc-cl:#fef3c7;--lila:#7c3aed;--fons:#eef2f8;--card:#fff;--txt:#1e293b;--suau:#64748b;--vora:#e2e8f0;
 --r:18px;--om:0 1px 2px #0f172a0d,0 6px 18px #0f172a12;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,Arial,sans-serif;background:var(--fons);color:var(--txt);font-size:16.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.salta{position:fixed;top:-60px;left:14px;z-index:200;background:#facc15;color:#1e1b4b;font-weight:900;font-size:15px;padding:10px 18px;border-radius:12px;text-decoration:none;box-shadow:0 4px 0 #b91c1c;transition:top .15s}
.salta:focus{top:10px;outline:3px solid #22d3ee;outline-offset:2px}
nav button:focus-visible,.so-btn:focus-visible,.logo:focus-visible,#punts:focus-visible{outline:3px solid #facc15;outline-offset:2px}
.btn:focus-visible,.opt:focus-visible,.passos button:focus-visible,.tile:focus-visible,.continua:focus-visible,.nivell:focus-visible,.estrelles[tabindex="0"]:focus-visible,.flash:focus-visible,.chip:focus-visible,.cub:focus-visible,.escolta:focus-visible,.valor button:focus-visible,.perfil:focus-visible,table.an tr[tabindex="0"]:focus-visible,.tema-nav button:focus-visible,.pop-tanca:focus-visible,.mi:focus-visible,.boss-carta:focus-visible{outline:3px solid var(--blau2);outline-offset:3px}
.tema-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tema-nav .tn-btn{border:1.5px solid var(--vora);background:#fff;color:var(--fosc);border-radius:999px;padding:5px 12px;font-weight:800;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;transition:border-color .15s,background .15s}
.tema-nav .tn-btn:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}
.tema-nav .tn-btn:disabled{opacity:.4;cursor:default}
.drecera-info{text-align:center;color:var(--suau);font-size:12.5px;font-weight:700;margin-top:10px}
.drecera-info kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-family:inherit;font-size:11.5px;font-weight:800;color:var(--fosc)}
@media(max-width:600px){.drecera-info{display:none}}
.pausa-seg{border:1.5px solid var(--vora);background:#fff;color:var(--fosc);border-radius:999px;padding:3px 10px;font-weight:800;font-size:12.5px;cursor:pointer;margin-left:8px;vertical-align:middle}
.pausa-seg:hover{border-color:#93c5fd;background:#f8fbff}
/* capçalera */
header{background:linear-gradient(120deg,var(--g1,#1e3a8a),var(--g2,#2563eb) 55%,var(--g3,#0ea5e9));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 14px #1e3a8a40}
.hd{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .tt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.logo .tt small{font-size:13px;font-weight:700;opacity:.85}
@media(max-width:520px){.logo{font-size:16px}.logo #hola{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
.benv .tema{margin:4px 0 0;font-weight:900;color:var(--blau2)}
.pill{background:#ffffff26;border:1px solid #ffffff40;padding:5px 12px;border-radius:999px;font-weight:800;white-space:nowrap}
nav{max-width:960px;margin:0 auto;padding:0 10px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;color:#dbeafe;padding:7px 13px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap;font-size:15px}
nav button.on{background:#fff;color:var(--blau2)}
nav a.surt{display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-weight:900;font-size:15px;padding:5px 12px;border-radius:999px;border:2px solid #ffffff66;white-space:nowrap;margin-right:4px}
nav a.surt:hover,nav a.surt:focus-visible{background:#ffffff26;border-color:#fff;outline:none}
.surt-gran{display:block;text-align:center;margin-top:16px;color:var(--suau);font-weight:800;text-decoration:none}
.surt-gran:hover{color:var(--blau2)}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
/* elements bàsics */
h2.sec .ico{color:var(--g2,#2563eb);width:24px;height:24px}
h2.sec{font-size:21px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
.box{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--om);margin-bottom:14px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--blau);color:#fff;box-shadow:0 3px 0 var(--blau2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blau2)}
.btn.sec{background:#fff;color:var(--fosc);box-shadow:0 0 0 2px var(--vora) inset,0 3px 0 var(--vora)}
.btn.verd{background:var(--verd);box-shadow:0 3px 0 #15803d}
.btn:disabled{opacity:.45;cursor:default}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.prog{color:var(--suau);font-size:14.5px;font-weight:700}
/* hero */
.hero{background:linear-gradient(135deg,#fff,#eff6ff);border-radius:22px;padding:20px 22px;box-shadow:var(--om);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .av{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
/* salutació amb el perfil arcade del nen (sprites.js + localStorage.bn_aspectes, que omple la portada): tocar-lo porta a /perfil/ */
.hero a.av{position:relative;text-decoration:none;background:var(--av,#312e81);border:3px solid #fff;box-shadow:0 0 0 2px #1d1631,0 6px 16px #6366f155;overflow:visible}
.hero .av .av-cl{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#1d16311a 0 25%,transparent 0 50%) 0 0/12px 12px,var(--av,#312e81)}
.hero .av .av-cl svg{display:block;width:84%;height:auto;shape-rendering:crispEdges}
.hero .av .av-sk{position:absolute;right:-9px;bottom:-7px;width:30px;height:30px;border-radius:9px;background:#1d1631;border:2px solid #facc15;display:grid;place-items:center;box-shadow:0 2px 6px #0006}
.hero .av .av-sk svg{width:22px;height:auto;display:block;shape-rendering:crispEdges}
.hero .asp{margin:2px 0 0;font-weight:900;font-size:13.5px;color:#4338ca}
.hero .asp a{color:inherit;text-decoration:none;border-bottom:1.5px dotted #a5b4fc}
.hero h1{margin:0;font-size:24px}
.hero p{margin:2px 0 0;color:var(--suau)}
.hero .stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.mini{background:#fff;border:2px solid var(--vora);border-radius:14px;padding:6px 12px;text-align:center;min-width:78px}
.mini b{display:block;font-size:20px;line-height:1.2}
.mini small{color:var(--suau);font-weight:700;font-size:12px}
.continua{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--groc-cl);border:2px solid #fcd34d;border-radius:16px;padding:12px 16px;cursor:pointer}
.continua b{flex:1}
/* graella de temes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--om);transition:transform .15s,box-shadow .15s;position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0f172a1f}
.tile .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
.tile b{font-size:16.5px;line-height:1.25}
.tile small{color:var(--suau);font-weight:600}
.tile .peu{margin-top:auto;display:flex;align-items:center;gap:8px}
.barra{flex:1;height:8px;background:#eef2f7;border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#22c55e,#16a34a)}
.pc{font-size:13px;font-weight:800;color:var(--suau);min-width:34px;text-align:right}
.segell{position:absolute;top:12px;right:12px;font-size:20px}
.num{position:absolute;top:14px;right:14px;font-size:12px;font-weight:900;color:#94a3b8}
.etq{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#4338ca}
.etq.ap{background:#ecfdf5;color:#047857}
/* pantalla tema */
.cap-tema{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.cap-tema .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.cap-tema h2{margin:0;font-size:22px;line-height:1.2}
.passos{display:flex;gap:8px;margin:12px 0 16px}
.passos button{flex:1;border:0;background:#fff;border-radius:14px;padding:10px 6px;font-weight:800;cursor:pointer;color:var(--suau);box-shadow:var(--om);font-size:15px}
.passos button.on{background:var(--fosc);color:#fff}
.passos button.fet::after{content:" ✓";color:#22c55e}
.idea{background:var(--verd-cl);border:2px solid #86efac;border-radius:14px;padding:12px 16px;font-weight:800}
.idea small{display:block;font-size:11.5px;letter-spacing:.6px;color:#15803d;font-weight:900}
.truc{background:var(--groc-cl);border:2px solid #fcd34d;border-radius:14px;padding:12px 16px;margin-top:12px}
.compte{background:var(--verm-cl);border-left:6px solid var(--verm);border-radius:0 14px 14px 0;padding:10px 14px;margin-top:12px}
ul.pts{padding-left:0;list-style:none;margin:14px 0 0}
ul.pts li{position:relative;padding:8px 0 8px 30px;border-bottom:1px dashed var(--vora)}
ul.pts li:last-child{border-bottom:0}
ul.pts li::before{content:"";position:absolute;left:6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--blau)}
/* targetes */
.flash{perspective:1000px;height:240px;cursor:pointer;margin:12px auto;max-width:540px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flash.gir .in{transform:rotateY(180deg)}
.flash .cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;font-weight:800;box-shadow:0 10px 26px #0f172a22}
.flash .davant{background:#fff;border:3px solid #bfdbfe}
.flash .darrere{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;transform:rotateY(180deg);font-weight:700;font-size:18.5px}
.flash .cara small{position:absolute;bottom:12px;font-size:12.5px;font-weight:700;opacity:.6}
.punts-fc{display:flex;justify-content:center;gap:6px;margin-top:4px}
.punts-fc i{width:9px;height:9px;border-radius:50%;background:#cbd5e1}
.punts-fc i.on{background:var(--blau);transform:scale(1.3)}
/* test */
.pregunta{font-size:19px;font-weight:800;margin:8px 0 12px;line-height:1.35}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--vora);background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16.5px;cursor:pointer;transition:border-color .12s,background .12s;color:var(--txt)}
.opt .ll{width:30px;height:30px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;color:var(--suau)}
.opt:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}
.opt.ok{background:var(--verd-cl);border-color:#22c55e}.opt.ok .ll{background:#22c55e;color:#fff}
.opt.ko{background:var(--verm-cl);border-color:#ef4444}.opt.ko .ll{background:#ef4444;color:#fff}
.opt:disabled{cursor:default}
/* Bona Nota 2.0 · 💡 pista als tests, 🛡️ escut del combo i repàs d'errors de les eines */
.pista-fila{display:flex;justify-content:flex-end;margin-top:4px}
.pista-fila .btn,.escut .btn{padding:6px 12px;font-size:14px}
.opt.fora{opacity:.38;text-decoration:line-through;border-style:dashed}
.fb.pista{background:var(--groc-cl);border-color:#fcd34d}
.escut{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.escut small{color:var(--suau);font-weight:700;font-size:13px}
.escut.obert{display:block;padding:12px 14px;border-radius:14px;border:2px dashed #86efac;background:#f0fdf4}
.escut.obert .pregunta{font-size:17px;margin:6px 0 4px}
.rep-llista{display:inline-block;text-align:left;margin:4px auto 6px;padding-left:22px;font-weight:700;line-height:1.6}
.rep-apr{font-weight:800;color:#047857}
/* 🎯 missions del dia */
.missions{margin-top:14px;background:#fff;border:2px solid #c7d2fe;border-radius:16px;padding:12px 14px}
.mi-cap{display:flex;justify-content:space-between;align-items:baseline;gap:4px 10px;flex-wrap:wrap}
.mi-cap b{font-size:16.5px}.mi-cap small{color:var(--suau);font-weight:700;font-size:13px}
.mi{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;color:var(--txt);background:#f8fafc;border:2px solid var(--vora);border-radius:12px;padding:9px 12px 11px;margin-top:7px;cursor:pointer}
.mi:hover{border-color:#93c5fd}
.mi-ic{font-size:22px;flex:none}.mi-t{flex:1;font-weight:800;font-size:15px;line-height:1.25}.mi-p{font-weight:900;font-size:13.5px;color:var(--suau);flex:none}
.mi-b{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#60a5fa,#2563eb);border-radius:0 4px 4px 0;transition:width .4s}
.mi.fet{background:var(--verd-cl);border-color:#86efac}.mi.fet .mi-p{color:#15803d}.mi.fet .mi-t{color:#166534}.mi.fet .mi-b{background:#22c55e}
.combo.missio{color:#4ade80;text-shadow:3px 3px 0 #14532d,0 0 18px #86efac}
/* 👾 boss del món */
.boss-carta{display:flex;align-items:center;gap:12px;margin:14px 0 4px;padding:12px 14px;border-radius:16px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1e1b4b,#4c1d95 60%,#831843);border:3px solid #a78bfa;box-shadow:0 0 18px #a78bfa55}
.boss-carta.tancat{cursor:default;filter:saturate(.35);border-color:#64748b;box-shadow:none}
.boss-carta .boss-mini{width:52px;height:52px;flex:none}
.bc-t{flex:1;min-width:0}.bc-t b{display:block;font-family:'Press Start 2P',monospace;font-size:12px;line-height:1.6;color:#fde047}.bc-t small{display:block;font-weight:700;font-size:13.5px;color:#e9d5ff;margin-top:2px}
.bc-b{display:block;height:7px;margin-top:7px;background:#ffffff26;border-radius:5px;overflow:hidden}.bc-b i{display:block;height:100%;background:#a78bfa;border-radius:5px}
.boss{background:radial-gradient(circle at 50% 20%,#312e81,#0f172a 70%);border-radius:20px;padding:14px;margin:4px 0 10px;border:3px solid #a78bfa;color:#e2e8f0}
.boss-cap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.boss-nom{font-family:'Press Start 2P',monospace;font-size:11px;color:#fde047;line-height:1.6;flex:1 1 140px}
.boss-hp{position:relative;flex:2 1 180px;height:20px;background:#00000066;border:2px solid #fca5a5;border-radius:8px;overflow:hidden}
.boss-hp i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#dc2626,#f97316,#facc15);transition:width .6s cubic-bezier(.2,1,.3,1)}
.boss-hp span{position:relative;display:block;text-align:center;font-family:'Press Start 2P',monospace;font-size:9px;line-height:16px;color:#fff;text-shadow:1px 1px 0 #000}
.boss-esc{display:flex;align-items:center;justify-content:space-between;margin:8px 0 2px}
.boss-spr-w{position:relative;width:96px;height:96px}.boss-spr{width:100%;height:100%;image-rendering:pixelated;filter:drop-shadow(0 6px 0 #0006)}
.boss-spr-w .boss-spr{animation:bossFlota 2.4s ease-in-out infinite}
@keyframes bossFlota{50%{transform:translateY(-6px)}}
.boss-spr-w.cop .boss-spr{animation:bossCop .45s}
@keyframes bossCop{0%,100%{transform:none;filter:none}20%{transform:translateX(-8px) rotate(-6deg);filter:brightness(3)}50%{transform:translateX(6px) rotate(4deg)}75%{transform:translateX(-3px)}}
.boss-dmg{position:absolute;left:62%;top:0;font-family:'Press Start 2P',monospace;font-size:16px;color:#fde047;text-shadow:2px 2px 0 #b91c1c;animation:bossDmg 1s forwards;pointer-events:none}
@keyframes bossDmg{to{transform:translateY(-40px);opacity:0}}
.boss-cors{font-size:26px;letter-spacing:2px}.boss-cors.tremola{animation:bossCop .45s}
body.boss-mal{box-shadow:inset 0 0 0 6px #ef4444}
.boss-ronda{font-family:'Press Start 2P',monospace;font-size:9px;color:#a5b4fc;text-align:right;margin-bottom:8px}
.boss-box{color:var(--txt)}.boss-fig{text-align:center;margin-bottom:8px}.boss-fig svg{max-width:100%;height:auto}
.bo-ord{display:flex;flex-direction:column;gap:6px;margin-top:8px}.bo-ord .opt{flex-direction:column;align-items:flex-start;margin:0}.bo-ord .opt small{font-weight:600;color:var(--suau)}
.bo-fet{text-align:right;font-weight:800;color:var(--suau);margin-top:4px}
.boss-intro{text-align:center;padding:10px 4px}.boss-intro h2{font-family:'Press Start 2P',monospace;font-size:15px;line-height:1.6;color:#fde047;text-shadow:2px 2px 0 #7c2d12;margin:8px 0}
.boss-intro p{font-weight:700;font-size:16px;margin:6px 0}.boss-intro p.petit{font-size:14px;color:#c7d2fe}
.boss-intro .boss-spr.gran{width:150px;height:150px;animation:bossFlota 2.4s ease-in-out infinite}
.boss-intro .boss-spr.ko{animation:none;transform:rotate(90deg) translateX(20px);filter:grayscale(.7) drop-shadow(0 6px 0 #0006)}
.boss-intro .boss-spr.riu{animation:bossFlota .8s ease-in-out infinite}
.btn.gran{font-size:18px;padding:14px 26px;margin-top:10px}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:#eff6ff;border:2px solid #bfdbfe}
.fb.ok{background:var(--verd-cl);border-color:#86efac}.fb.ko{background:#fff7ed;border-color:#fdba74}
.barra-test{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.barra-test i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .3s}
.gran{font-size:56px;text-align:center;line-height:1}
.valor{display:flex;justify-content:center;gap:12px;margin-top:10px}
.valor button{border:2px solid var(--vora);background:#fff;border-radius:16px;padding:10px 14px;font-size:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.valor button small{font-size:12.5px;font-weight:800;color:var(--suau)}
.valor button.on{border-color:var(--blau);background:#eff6ff}
/* jocs */
.chip{display:inline-block;border:2px solid #cbd5e1;border-radius:12px;padding:9px 14px;margin:5px;cursor:pointer;background:#fff;font-weight:800;user-select:none;transition:.12s}
.chip:hover{border-color:#93c5fd}
.chip.sel{background:var(--fosc);border-color:var(--fosc);color:#fff}
.chip.ok{background:var(--verd);border-color:var(--verd);color:#fff;cursor:default}

// ====================== SO I EFECTES ARCADE ======================
// Motor d'àudio v2: tot es sintetitza en directe (no hi ha fitxers de so).
// Cadena: veus → bus d'efectes (SB) o de música (MB) → volum general (MG) → compressor → altaveus.
// Una part de cada bus passa per una reverberació suau (sala petita) i un eco curt, perquè soni més ple i menys "pitet".
// volum dels sons 0-5 (0 = silenci)
//@inclou eines/so-mobil.js
let AC=null,MG=null,SB=null,MB=null,REV=null,ECO=null,VOL=3,VOLant=3;
try{const v=localStorage.getItem("bn_vol");if(v!==null)VOL=Math.max(0,Math.min(5,+v||0));else if(localStorage.getItem("bn_so")==="0")VOL=0}catch(e){}
bnSo.sessio(VOL>0); // a l'iPhone, que soni encara que el mòbil estigui en silenci (si el so de l'app està engegat)
const GVOL=[0,.12,.27,.45,.7,1];
function impuls(seg,caiguda){const n=AC.sampleRate*seg|0,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,caiguda)}return b}
let SOROLL=null;function soroll(){if(!SOROLL){const n=AC.sampleRate|0;SOROLL=AC.createBuffer(1,n,AC.sampleRate);const d=SOROLL.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}return SOROLL}
function guany(v){const g=AC.createGain();g.gain.value=v;return g}
function audio(){if(!AC){AC=bnSo.context();if(!AC)throw new Error("sense Web Audio"); // context compartit, desbloquejat al primer toc (so-mobil.js)
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.22;
  MG=guany(GVOL[VOL]);MG.connect(comp).connect(AC.destination);
  REV=AC.createConvolver();REV.buffer=impuls(1.8,3);REV.connect(guany(.9)).connect(MG);
  ECO=AC.createDelay(1);ECO.delayTime.value=.21;const fb=guany(.3),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;ECO.connect(lp).connect(fb).connect(ECO);lp.connect(guany(.5)).connect(MG);
  SB=guany(1);SB.connect(MG);SB.connect(guany(.22)).connect(REV);SB.connect(guany(.12)).connect(ECO);
  MB=guany(0);MB.connect(MG);MB.connect(guany(.35)).connect(REV);MB.connect(guany(.2)).connect(ECO);}
 if(AC.state!=="running"&&AC.state!=="closed")try{AC.resume().catch(()=>{})}catch(e){}return AC}
function pintaSo(){const b=document.getElementById("so"),r=document.getElementById("volum"),n=document.getElementById("volN");if(b)b.innerHTML=icSo(VOL);if(r)r.value=VOL;if(n)n.textContent=VOL;pintaMus()}
function posaVol(v){VOL=v;if(v)VOLant=v;try{localStorage.setItem("bn_vol",v)}catch(e){}bnSo.sessio(v>0);if(MG)MG.gain.setTargetAtTime(GVOL[v],AC.currentTime,.05);pintaSo();if(v){audio();so("clic")}}
function canviaSo(){posaVol(VOL?0:(VOLant||3))}
// una veu: oscil·lador amb envolupant (atac ràpid, caiguda exponencial), filtre opcional, lliscament de to i vibrato
function veu(f,t0,d,o={}){const{tipus="triangle",vol=.12,atac=.006,dest=SB,filtre=0,q=1,cap=0,vib=0,det=0}=o;
 const t=AC.currentTime+t0,os=AC.createOscillator(),g=AC.createGain();os.type=tipus;os.frequency.setValueAtTime(f,t);if(det)os.detune.value=det;
 if(cap)os.frequency.exponentialRampToValueAtTime(Math.max(20,cap),t+d);
 if(vib){const l=AC.createOscillator(),lg=guany(vib);l.frequency.value=5.5;l.connect(lg).connect(os.frequency);l.start(t+Math.min(.15,d/3));l.stop(t+d+.05)}
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atac);g.gain.setTargetAtTime(0,t+atac,d/4.5);
 let sortida=g;if(filtre){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.Q.value=q;fl.frequency.setValueAtTime(filtre*3,t);fl.frequency.exponentialRampToValueAtTime(filtre,t+Math.min(.25,d));g.connect(fl);sortida=fl}
 os.connect(g);sortida.connect(dest);os.start(t);os.stop(t+d+.3)}
// compatibilitat amb el codi antic (nota = una veu simple)
function nota(f,t0,d,tipus="square",vol=.12,dest){veu(f,t0,d,{tipus,vol:vol*.8,dest:dest||SB,filtre:tipus==="square"||tipus==="sawtooth"?3200:0})}
// timbres
const pluck=(f,t0,d,v=.1,dest)=>{veu(f,t0,d,{tipus:"triangle",vol:v,dest});veu(f,t0,d*.6,{tipus:"square",vol:v*.35,filtre:2400,dest,det:6})};
const campana=(f,t0,d,v=.08,dest)=>{veu(f,t0,d,{tipus:"sine",vol:v,dest});veu(f*2,t0,d*.45,{tipus:"sine",vol:v*.35,dest});veu(f*3.01,t0,d*.2,{tipus:"sine",vol:v*.12,dest})};
const metall=(f,t0,d,v=.07,dest)=>{veu(f,t0,d,{tipus:"sawtooth",vol:v,filtre:1800,q:2,dest,vib:d>.4?f*.012:0});veu(f,t0,d,{tipus:"square",vol:v*.5,filtre:1400,det:-8,dest})};
function sorollet(t0,d,o={}){const{vol=.08,tipus="bandpass",f0=800,f1=3000,q=1.2,dest=SB}=o;const t=AC.currentTime+t0,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=soroll();fl.type=tipus;fl.Q.value=q;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(fl).connect(g).connect(dest);s.start(t);s.stop(t+d+.05)}
const cop=(t0,v=.18,dest)=>{veu(150,t0,.22,{tipus:"sine",vol:v,cap:45,dest})};
function so(t){if(!VOL)return;try{audio();
 if(t==="ok"){campana(1319,0,.35,.08);campana(1976,.09,.5,.08);pluck(1319,0,.1,.04);sorollet(.09,.12,{vol:.025,tipus:"highpass",f0:6000,f1:9000})}
 else if(t==="ko"){veu(311,0,.22,{tipus:"triangle",vol:.12,cap:233});veu(233,.17,.38,{tipus:"triangle",vol:.12,cap:156});veu(156,.17,.38,{tipus:"square",vol:.03,filtre:600})}
 else if(t==="win"){[523,659,784,1047].forEach((f,i)=>pluck(f,i*.1,.22,.09));cop(0,.12);cop(.4,.16);
  [262,330,392,523].forEach(f=>veu(f,.42,1.3,{tipus:"triangle",vol:.06,atac:.02}));[1047,1319,1568].forEach((f,i)=>campana(f,.42+i*.04,1.2,.05));
  sorollet(.42,.6,{vol:.04,tipus:"highpass",f0:5000,f1:9000})}
 else if(t==="super"){[523,659,784,1047,1319,1568].forEach((f,i)=>pluck(f,i*.07,.18,.08));cop(0,.12);cop(.45,.18);
  [[523,659,784],[587,740,880],[659,831,988]].forEach((c,k)=>c.forEach(f=>pluck(f,.45+k*.16,k<2?.14:1.1,.06)));
  [1319,1661,1976,2637].forEach((f,i)=>campana(f,.8+i*.05,1.4,.045));sorollet(.8,.9,{vol:.05,tipus:"highpass",f0:4000,f1:10000})}
 else if(t==="clic"){veu(1500,0,.05,{tipus:"sine",vol:.09,cap:700});sorollet(0,.025,{vol:.02,tipus:"highpass",f0:4000,f1:6000})}
 else if(t==="gir"){sorollet(0,.2,{vol:.12,f0:500,f1:3500,q:2});veu(660,.02,.12,{tipus:"sine",vol:.06,cap:990})}
 else if(t==="trist"){[392,370,349].forEach((f,i)=>metall(f,i*.4,.36,.07));metall(330,1.2,1.3,.08);veu(330,1.2,1.3,{tipus:"triangle",vol:.05,cap:247,vib:6})}
 else if(t==="coin"){pluck(988,0,.07,.07);campana(1319,.07,.45,.08)}
 else if(t==="superestrella"){// campanetes que pugen, fanfara de 4 notes i acord llarg brillant
  [1568,1760,1976,2349,2637,3136].forEach((f,i)=>campana(f,i*.06,.5,.05));
  [[392,.45,.14],[523,.6,.14],[659,.75,.14],[784,.9,.6]].forEach(([f,t0,d])=>{metall(f,t0,d,.06);pluck(f*2,t0,d,.05)});cop(.9,.2);
  [131,196,262,330].forEach(f=>veu(f,.9,1.8,{tipus:"triangle",vol:.06,atac:.03}));
  [1047,1319,1568,2093].forEach((f,i)=>campana(f,1.45+i*.03,1.8,.045));
  [0,1,2,3,4,5,6,7].forEach(i=>campana([2093,2637,3136,3520][i%4],1.9+i*.11,.3,.03));sorollet(1.45,1.4,{vol:.04,tipus:"highpass",f0:5000,f1:11000})}
 else if(t==="nivell"){[392,523,659,784,1047].forEach((f,i)=>pluck(f,i*.09,.2,.08));[523,659,784,1047].forEach(f=>campana(f,.5,1.2,.04));cop(.5,.15)}
}catch(e){}}

// ---- MÚSICA DE FONS (opcional, apagada per defecte) ----
// Música tranquil·la per estudiar, generada en directe: acords suaus, baix, arpegi de campanetes i un ritme molt fluix.
// Cada món té la seva tonalitat i el seu tempo (surten de l'id). S'abaixa sola quan parla la veu (🔊 Escolta) o surt una pantalla arcade.
let MUS=false,MUSt=null,MUSpas=0,MUSseg=0,MUSduck=1;
try{MUS=localStorage.getItem("bn_musica")==="1"}catch(e){}
const MUSPROG=[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17],[0,4,7,14],[9,12,16,21],[2,5,9,12],[7,11,14,19]]; // I · vi · IV · V · I · vi · ii · V
const musHash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const MUSCFG=(()=>{const h=musHash(typeof ASSIG!=="undefined"?ASSIG.id:"bn");return{arrel:[60,62,65,57,58,63][h%6],tempo:84+h%5*4}})();
const mf=n=>440*Math.pow(2,(n-69)/12);
function musPas(t){// un pas = una corxera
 const p=MUSpas,compas=(p>>3)%8,b=p%8,ac=MUSPROG[compas],r=MUSCFG.arrel,dur=60/MUSCFG.tempo/2,o=t-AC.currentTime;
 if(b===0)ac.forEach((n,i)=>veu(mf(r+n-12),o,dur*8.2,{tipus:i%2?"sine":"triangle",vol:.028,atac:.25,dest:MB}));
 if(b===0||b===3||b===6)veu(mf(r+ac[0]-24),o,dur*(b===6?2:3),{tipus:"triangle",vol:b===0?.09:.06,atac:.01,filtre:500,dest:MB});
 const pat=[0,2,1,3,2,1,3,2],seed=(musHash(compas*13+b+(p>>6))%10);
 if(seed<7)campana(mf(r+ac[pat[b]]+12),o,dur*3,b%2?.018:.026,MB);
 if(b%2===1)sorollet(o,.05,{vol:.012,tipus:"highpass",f0:7000,f1:9000,dest:MB});
 if(b===0||b===4)veu(110,o,.16,{tipus:"sine",vol:.05,cap:42,dest:MB});
 MUSpas++}
function musBucle(){if(!AC||document.hidden)return;const dur=60/MUSCFG.tempo/2;if(MUSseg<AC.currentTime)MUSseg=AC.currentTime+.08;while(MUSseg<AC.currentTime+.25){musPas(MUSseg);MUSseg+=dur}}
function musVol(){if(MB)MB.gain.setTargetAtTime(MUS&&!document.hidden?.5*MUSduck:0,AC.currentTime,.4)}
function musEngega(){if(!MUS)return;audio();if(!MUSt){MUSseg=0;MUSt=setInterval(musBucle,60);musBucle()}musVol()}
function musAtura(){if(MUSt){clearInterval(MUSt);MUSt=null}if(MB)musVol()}
function canviaMusica(){MUS=!MUS;try{localStorage.setItem("bn_musica",MUS?"1":"0")}catch(e){}if(MUS){musEngega();if(!VOL)posaVol(VOLant||3)}else musAtura();pintaMus()}
function pintaMus(){const b=document.getElementById("mus");if(b){b.innerHTML=ICO.musica;b.classList.toggle("on",MUS);b.title=MUS?"Música de fons: engegada (toca per apagar-la)":"Música de fons: apagada (toca per engegar-la)";b.setAttribute("aria-pressed",MUS)}}
function abaixaMus(on){MUSduck=on?.25:1;if(AC)musVol()}
let MUSarc=null;function abaixaMusUnMoment(seg){abaixaMus(true);clearTimeout(MUSarc);MUSarc=setTimeout(()=>abaixaMus(!!PARLANT),seg*1000)}
document.addEventListener("visibilitychange",()=>{if(!AC)return;if(document.hidden)musVol();else if(MUS)musVol()});
// el navegador no deixa sonar res fins que es toca la pantalla: si la música estava engegada, comença al primer toc
// (dins del mateix gest que desbloqueja l'àudio: pointerup / touchend / click / tecla, no pointerdown)
if(MUS)bnSo.quanSigui(musEngega);
function focs(cv){const c=cv.getContext("2d");let W,H;const mida=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};mida();
 const P=[],cols=["#facc15","#f472b6","#38bdf8","#4ade80","#fb923c","#a78bfa","#fff"];
 const esclat=(x,y)=>{const col=cols[Math.random()*cols.length|0];for(let i=0;i<46;i++){const a=Math.PI*2*i/46,v=2+Math.random()*4.5;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,v:1,col,m:3+Math.random()*3})}};
 let fr=0,viu=true;const pas=()=>{if(!viu)return;fr++;c.fillStyle="#02061733";c.fillRect(0,0,W,H);
  if(fr%18===1&&fr<200)esclat(W*(.15+Math.random()*.7),H*(.15+Math.random()*.45));
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.985;p.v-=.012;if(p.v<=0){P.splice(i,1);continue}c.globalAlpha=p.v;c.fillStyle=p.col;c.fillRect(p.x|0,p.y|0,p.m,p.m)}

 if(!NUV_LLEST){if(keep)return Promise.resolve();const n=S.nom;return nuvolBaixa(n,p).then(()=>{if(S.nom!==n)return;NUV_LLEST=true;return nuvolPuja()}).catch(()=>{})}
 return rpc("bn_progres_desa",{p_nom:S.nom,p_pin:p,p_assig:ASSIG.id,p_estat:S,p_mod:S.mod||Date.now()},keep).then(x=>{
  // -2 = el núvol té més estrelles que aquest aparell (un altre hi ha avançat): no s'ha desat; es baixa, es fusiona i es torna a pujar, un sol cop
  if(x===-2){if(reintent||keep)return;return nuvolBaixa(S.nom,p).then(nou=>{if(nou&&document.querySelector(".hero"))vista("inici");return nuvolPuja(false,true)})}
  // -1 = l'admin ha esborrat el progrés i aquest dispositiu encara no ho sabia: no s'ha desat; es baixa el núvol, que buida el d'aquí
  if(x===-1)return nuvolBaixa(S.nom,p).then(nou=>{if(nou&&document.querySelector(".hero"))vista("inici")});NUV_OK=Date.now()}).catch(()=>{})}
addEventListener("pagehide",()=>{if(NUV_T)nuvolPuja(true)});
// FUSIONA dos progressos (dispositiu i núvol) sense perdre mai res: números → el més alt, llistes → la més llarga
// (dies: unió), sí/no → sí si algun és sí, textos → del més recent. Així un dispositiu nou (buit) no esborra el progrés d'un altre.
function fusiona(a,b){const nouA=(a&&a.mod||0)>=(b&&b.mod||0);
 const f=(x,y,k)=>{if(x===undefined||x===null)return y;if(y===undefined||y===null)return x;
  if(k==="dies"&&Array.isArray(x)&&Array.isArray(y))return [...new Set([...x,...y])].sort();
  if(Array.isArray(x)||Array.isArray(y))return (Array.isArray(x)?x:[]).length>=(Array.isArray(y)?y:[]).length?x:y;
  if(typeof x==="number"&&typeof y==="number")return Math.max(x,y);
  if(typeof x==="boolean"||typeof y==="boolean")return !!(x||y);
  if(typeof x==="object"&&typeof y==="object"){const o={};new Set([...Object.keys(x),...Object.keys(y)]).forEach(kk=>o[kk]=f(x[kk],y[kk],kk));return o}
  return nouA?x:y};
 const r=f(a||{},b||{},"");r.nom=(a&&a.nom)||(b&&b.nom)||"";r.mod=Math.max(a&&a.mod||0,b&&b.mod||0);return Object.assign(BUIT(),r)}
// REINICI des de l'admin (supabase/bn_admin_reinicia.sql): el núvol torna «reinici» (ms de l'últim esborrat d'aquest món o de tots).
// Si és més nou que el que coneix aquest dispositiu (S.reinici), PRIMER es buida aquí el progrés d'aquest món (es queden el nom i l'id)
// i només després es fusiona amb el núvol. Si no, fusiona() (que agafa sempre el més alt) faria tornar el progrés esborrat.
function aplicaReinici(r){const ri=+(r&&r.reinici)||0;if(ri<=(+S.reinici||0))return false;
 const n=S.nom,id=S.id;S=BUIT();S.nom=n;if(id)S.id=id;S.reinici=ri;S.mod=Date.now();guarda();return true}
// fusiona el que torna bn_progres_llegeix: reinici → progrés desat al núvol → registre reconstruït
function fusionaNuvol(r){const n=S.nom,reini=aplicaReinici(r);
 if(r&&r.estat)S=fusiona(S,Object.assign({},r.estat,{mod:r.mod}));
 if(r&&r.log)S=fusiona(S,Object.assign({},r.log,{mod:0})); // el registre reconstrueix estrelles, temps, temes i jocs encara que es perdi el dispositiu
 S.nom=n;return reini}
// baixa el progrés del núvol i el fusiona amb el d'aquest dispositiu
function nuvolBaixa(nom,pin){return rpc("bn_progres_llegeix",{p_nom:nom,p_pin:pin,p_assig:ASSIG.id}).then(r=>{
 if(!r)return false;const abans=JSON.stringify([S.punts,S.temes,S.ob,S.jocs,S.temps]);
 const reini=fusionaNuvol(r);if(!reini&&!r.estat&&!r.log)return false;
 S.mod=Date.now();guarda();pintaCap();
 return reini||JSON.stringify([S.punts,S.temes,S.ob,S.jocs,S.temps])!==abans})}

// ====================== ACCESSIBILITAT I DRECERES DE TECLAT ======================
document.addEventListener("keydown",e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const tg=e.target,enCamp=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
 // 1) Elements amb role="button" i tabindex="0" (tiles, xips, targetes, files de taula…)
 if(!enCamp&&(e.key==="Enter"||e.key===" ")&&tg&&tg.getAttribute&&tg.getAttribute("role")==="button"&&tg.tagName!=="BUTTON"){
  e.preventDefault();tg.click();return;
 }
 // 2) Tancar popups / pantalles superposades amb Escape o Enter/Espai a .arc
 if(e.key==="Escape"){
  const pop=document.getElementById("popEst");if(pop){e.preventDefault();tancaEstrelles();const bt=document.getElementById("punts");if(bt)bt.focus();return}
  const arc=document.querySelector(".arc");if(arc){e.preventDefault();arc.click();return}
  const desc=document.getElementById("dSalta");if(desc){e.preventDefault();desc.click();return}
 }
 const arc=document.querySelector(".arc");
 if(arc&&(e.key==="Enter"||e.key===" ")){e.preventDefault();arc.click();return}
 if(enCamp)return;
 // 3) Si la pissarra està oberta o hi ha el taller de mates amb el seu propi teclat, no interferir
 const pis=document.getElementById("pisCapa");if(pis&&pis.classList.contains("on"))return;
 if(document.querySelector(".mx-tec"))return;
 // 4) Targetes (flashcards): Espai / ↑ / ↓ gira; ← / → passa targeta
 const fl=document.querySelector("#zona .flash");
 if(fl){
  if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();fl.click();return}
  if(e.key==="ArrowLeft"){const b=document.getElementById("fcAnt");if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(e.key==="ArrowRight"){const b=document.getElementById("fcSeg");if(b&&!b.disabled){e.preventDefault();b.click()}return}
 }
 // 5) Tests, Exàmens i Repàs: 1/2/3 o A/B/C selecciona opció; Enter o → avança; P demana pista
 const k=e.key.toUpperCase();
 const idx={"1":0,"2":1,"3":2,"A":0,"B":1,"C":2}[k];
 if(idx!==undefined){
  const germs=[...document.querySelectorAll(".opt.germ:not(:disabled)")];
  if(germs[idx]){e.preventDefault();germs[idx].click();return}
  const opts=[...document.querySelectorAll(".opt:not(.germ):not(:disabled):not(.fora)")];
  if(opts[idx]){e.preventDefault();opts[idx].click();return}
 }
 if(k==="P"){
  const bp=document.getElementById("pista");if(bp&&bp.offsetParent!==null){e.preventDefault();bp.click();return}
 }
 if(e.key==="Enter"||e.key==="ArrowRight"){
  const sg=document.getElementById("seg")||document.getElementById("exSeg")||document.getElementById("jgSeg");
  if(sg&&!sg.disabled){e.preventDefault();sg.click();return}
 }
 if(e.key==="ArrowLeft"){
  const ant=document.getElementById("exAnt");
  if(ant&&!ant.disabled){e.preventDefault();ant.click();return}
 }
});
