<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITOL}}</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
 --fosc:#1f2d3d;--blau:#3b82f6;--blau2:#2563eb;--verd:#16a34a;--verd-cl:#dcfce7;--verm:#dc2626;--verm-cl:#fee2e2;
 --groc:#f59e0b;--groc-cl:#fef3c7;--lila:#7c3aed;--fons:#eef2f8;--card:#fff;--txt:#1e293b;--suau:#64748b;--vora:#e2e8f0;
 --r:18px;--om:0 1px 2px #0f172a0d,0 6px 18px #0f172a12;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,system-ui,Arial,sans-serif;background:var(--fons);color:var(--txt);font-size:16.5px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
/* capçalera */
header{background:linear-gradient(120deg,var(--g1,#1e3a8a),var(--g2,#2563eb) 55%,var(--g3,#0ea5e9));color:#fff;position:sticky;top:0;z-index:20;box-shadow:0 4px 14px #1e3a8a40}
.hd{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-weight:900;font-size:19px;letter-spacing:.2px;display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo .tt{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.logo .tt small{font-size:13px;font-weight:700;opacity:.85}
@media(max-width:520px){.logo{font-size:16px}.logo #hola{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}}
.benv .tema{margin:4px 0 0;font-weight:900;color:var(--blau2)}
.pill{background:#ffffff26;border:1px solid #ffffff40;padding:5px 12px;border-radius:999px;font-weight:800;white-space:nowrap}
nav{max-width:960px;margin:0 auto;padding:0 10px 8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:transparent;color:#dbeafe;padding:7px 13px;border-radius:999px;font-weight:800;cursor:pointer;white-space:nowrap;font-size:15px}
nav button.on{background:#fff;color:var(--blau2)}
nav a.surt{display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-weight:900;font-size:15px;padding:5px 12px;border-radius:999px;border:2px solid #ffffff66;white-space:nowrap;margin-right:4px}
nav a.surt:hover,nav a.surt:focus-visible{background:#ffffff26;border-color:#fff;outline:none}
.surt-gran{display:block;text-align:center;margin-top:16px;color:var(--suau);font-weight:800;text-decoration:none}
.surt-gran:hover{color:var(--blau2)}
main{max-width:960px;margin:0 auto;padding:18px 16px 40px}
/* elements bàsics */
h2.sec{font-size:21px;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
h2.sec:first-child{margin-top:4px}
.box{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--om);margin-bottom:14px}
.btn{border:0;border-radius:12px;padding:11px 18px;font-weight:800;font-size:15.5px;cursor:pointer;background:var(--blau);color:#fff;box-shadow:0 3px 0 var(--blau2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blau2)}
.btn.sec{background:#fff;color:var(--fosc);box-shadow:0 0 0 2px var(--vora) inset,0 3px 0 var(--vora)}
.btn.verd{background:var(--verd);box-shadow:0 3px 0 #15803d}
.btn.verm{background:var(--verm);box-shadow:0 3px 0 #991b1b}
.btn:disabled{opacity:.45;cursor:default}
.fila{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.prog{color:var(--suau);font-size:14.5px;font-weight:700}
/* hero */
.hero{background:linear-gradient(135deg,#fff,#eff6ff);border-radius:22px;padding:20px 22px;box-shadow:var(--om);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.hero .av{width:66px;height:66px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);display:flex;align-items:center;justify-content:center;font-size:32px;flex:none}
.hero h1{margin:0;font-size:24px}
.hero p{margin:2px 0 0;color:var(--suau)}
.hero .stats{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.mini{background:#fff;border:2px solid var(--vora);border-radius:14px;padding:6px 12px;text-align:center;min-width:78px}
.mini b{display:block;font-size:20px;line-height:1.2}
.mini small{color:var(--suau);font-weight:700;font-size:12px}
.continua{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--groc-cl);border:2px solid #fcd34d;border-radius:16px;padding:12px 16px;cursor:pointer}
.continua b{flex:1}
/* graella de temes */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--om);transition:transform .15s,box-shadow .15s;position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile:hover{transform:translateY(-3px);box-shadow:0 10px 24px #0f172a1f}
.tile .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px}
.tile b{font-size:16.5px;line-height:1.25}
.tile small{color:var(--suau);font-weight:600}
.tile .peu{margin-top:auto;display:flex;align-items:center;gap:8px}
.barra{flex:1;height:8px;background:#eef2f7;border-radius:6px;overflow:hidden}
.barra i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#22c55e,#16a34a)}
.pc{font-size:13px;font-weight:800;color:var(--suau);min-width:34px;text-align:right}
.segell{position:absolute;top:12px;right:12px;font-size:20px}
.num{position:absolute;top:14px;right:14px;font-size:12px;font-weight:900;color:#94a3b8}
.etq{display:inline-block;font-size:11.5px;font-weight:900;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:#eef2ff;color:#4338ca}
.etq.ap{background:#ecfdf5;color:#047857}
/* pantalla tema */
.cap-tema{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.cap-tema .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;flex:none}
.cap-tema h2{margin:0;font-size:22px;line-height:1.2}
.passos{display:flex;gap:8px;margin:12px 0 16px}
.passos button{flex:1;border:0;background:#fff;border-radius:14px;padding:10px 6px;font-weight:800;cursor:pointer;color:var(--suau);box-shadow:var(--om);font-size:15px}
.passos button.on{background:var(--fosc);color:#fff}
.passos button.fet::after{content:" ✓";color:#22c55e}
.idea{background:var(--verd-cl);border:2px solid #86efac;border-radius:14px;padding:12px 16px;font-weight:800}
.idea small{display:block;font-size:11.5px;letter-spacing:.6px;color:#15803d;font-weight:900}
.truc{background:var(--groc-cl);border:2px solid #fcd34d;border-radius:14px;padding:12px 16px;margin-top:12px}
.compte{background:var(--verm-cl);border-left:6px solid var(--verm);border-radius:0 14px 14px 0;padding:10px 14px;margin-top:12px}
ul.pts{padding-left:0;list-style:none;margin:14px 0 0}
ul.pts li{position:relative;padding:8px 0 8px 30px;border-bottom:1px dashed var(--vora)}
ul.pts li:last-child{border-bottom:0}
ul.pts li::before{content:"";position:absolute;left:6px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--blau)}
/* targetes */
.flash{perspective:1000px;height:240px;cursor:pointer;margin:12px auto;max-width:540px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flash.gir .in{transform:rotateY(180deg)}
.flash .cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:20px;font-weight:800;box-shadow:0 10px 26px #0f172a22}
.flash .davant{background:#fff;border:3px solid #bfdbfe}
.flash .darrere{background:linear-gradient(135deg,#2563eb,#7c3aed);color:#fff;transform:rotateY(180deg);font-weight:700;font-size:18.5px}
.flash .cara small{position:absolute;bottom:12px;font-size:12.5px;font-weight:700;opacity:.6}
.punts-fc{display:flex;justify-content:center;gap:6px;margin-top:4px}
.punts-fc i{width:9px;height:9px;border-radius:50%;background:#cbd5e1}
.punts-fc i.on{background:var(--blau);transform:scale(1.3)}
/* test */
.pregunta{font-size:19px;font-weight:800;margin:8px 0 12px;line-height:1.35}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid var(--vora);background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;font-size:16.5px;cursor:pointer;transition:border-color .12s,background .12s;color:var(--txt)}
.opt .ll{width:30px;height:30px;border-radius:9px;background:#f1f5f9;display:flex;align-items:center;justify-content:center;font-weight:900;flex:none;color:var(--suau)}
.opt:hover:not(:disabled){border-color:#93c5fd;background:#f8fbff}
.opt.ok{background:var(--verd-cl);border-color:#22c55e}.opt.ok .ll{background:#22c55e;color:#fff}
.opt.ko{background:var(--verm-cl);border-color:#ef4444}.opt.ko .ll{background:#ef4444;color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;background:#eff6ff;border:2px solid #bfdbfe}
.fb.ok{background:var(--verd-cl);border-color:#86efac}.fb.ko{background:#fff7ed;border-color:#fdba74}
.barra-test{height:10px;background:#e2e8f0;border-radius:6px;overflow:hidden;margin:6px 0 4px}
.barra-test i{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb);transition:width .3s}
.gran{font-size:56px;text-align:center;line-height:1}
.valor{display:flex;justify-content:center;gap:12px;margin-top:10px}
.valor button{border:2px solid var(--vora);background:#fff;border-radius:16px;padding:10px 14px;font-size:30px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.valor button small{font-size:12.5px;font-weight:800;color:var(--suau)}
.valor button.on{border-color:var(--blau);background:#eff6ff}
/* jocs */
.chip{display:inline-block;border:2px solid #cbd5e1;border-radius:12px;padding:9px 14px;margin:5px;cursor:pointer;background:#fff;font-weight:800;user-select:none;transition:.12s}
.chip:hover{border-color:#93c5fd}
.chip.sel{background:var(--fosc);border-color:var(--fosc);color:#fff}
.chip.ok{background:var(--verd);border-color:var(--verd);color:#fff;cursor:default}
.chip.ko{animation:tremola .35s;border-color:#ef4444}
@keyframes tremola{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pila{display:flex;flex-direction:column-reverse;gap:5px;margin:12px 0}
.pila div{border-radius:12px;padding:10px 14px;font-weight:800;animation:apareix .3s}
@keyframes apareix{from{opacity:0;transform:translateY(8px)}}
.col2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.mh{display:none}table.an{font-size:14px}.col2{grid-template-columns:1fr}.hero .stats{margin-left:0}}
.cub{border:3px dashed #cbd5e1;border-radius:16px;min-height:110px;padding:10px;cursor:pointer;background:#f8fafc}
.cub:hover{border-color:#93c5fd;background:#f0f7ff}
.cub h4{margin:0 0 8px}
textarea{width:100%;font:inherit;padding:12px 14px;border-radius:14px;border:2px solid var(--vora);resize:vertical;background:#fcfdff}
textarea:focus,input:focus{outline:none;border-color:#93c5fd;box-shadow:0 0 0 4px #bfdbfe66}
label.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;cursor:pointer;padding:8px 10px;border-radius:10px;background:#fff;border:2px solid var(--vora)}
label.chk input{width:20px;height:20px;margin-top:2px;flex:none;accent-color:var(--verd)}
details summary{cursor:pointer;font-weight:800;color:var(--blau2)}
/* benvinguda */
.benv{max-width:460px;margin:30px auto;text-align:center}
.benv .gran{font-size:70px}
.benv input{width:100%;font:inherit;font-size:20px;font-weight:800;text-align:center;padding:14px;border-radius:16px;border:3px solid var(--vora);margin:14px 0}
/* analítica */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--om)}
.kpi small{color:var(--suau);font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px}
.kpi b{display:block;font-size:26px;line-height:1.2;margin-top:2px}
.kpi span{font-size:13px;color:var(--suau);font-weight:700}
table.an{width:100%;border-collapse:collapse;font-size:15px}
table.an th{text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--suau);padding:8px 6px;border-bottom:2px solid var(--vora)}
table.an td{padding:9px 6px;border-bottom:1px solid #f1f5f9;vertical-align:middle}
.semaf{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.valoracio{background:linear-gradient(135deg,#eef2ff,#f5f3ff);border:2px solid #c7d2fe;border-radius:18px;padding:16px 18px}
.valoracio h3{margin:0 0 6px}
.llista-err li{margin:6px 0}
.modal{position:fixed;inset:0;background:#0f172a80;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{max-width:420px;text-align:center}
.peu-pag{text-align:center;color:#94a3b8;font-size:13px;margin:26px 0 8px}
.confeti{position:fixed;top:-20px;font-size:22px;z-index:60;pointer-events:none;animation:cau 1.8s linear forwards}
@keyframes cau{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}

.perfils{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.perfil{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--vora);background:#fff;border-radius:16px;padding:10px 14px;cursor:pointer;font-family:inherit;font-size:16px;color:var(--txt)}
.perfil:hover{border-color:#93c5fd;background:#f8fbff}.perfil.on{border-color:var(--blau)}
.perfil small{display:block;color:var(--suau);font-weight:700}
.av2{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#60a5fa,#a78bfa);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;text-transform:uppercase}
/* arcade */
.arc{position:fixed;inset:0;z-index:80;background:radial-gradient(circle at 50% 40%,#1e1b4b,#020617 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;animation:arcIn .25s ease-out;overflow:hidden}
@keyframes arcIn{from{opacity:0;transform:scale(1.15)}}
.arc canvas{position:absolute;inset:0;width:100%;height:100%}
.arc .flash{position:absolute;inset:0;background:#fff;animation:flash .5s ease-out forwards;pointer-events:none}
@keyframes flash{from{opacity:.9}to{opacity:0}}
.arc .t1{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(22px,7vw,46px);color:#facc15;text-shadow:4px 4px 0 #b91c1c,0 0 24px #facc15aa;text-align:center;line-height:1.35;animation:bota .6s cubic-bezier(.3,1.6,.5,1) both,pampalluga 1s steps(2) .6s infinite}
@keyframes bota{from{transform:translateY(-120px) scale(.4)}}
@keyframes pampalluga{50%{color:#fde68a}}
.arc .t2{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(12px,3.4vw,18px);color:#a5f3fc;margin-top:22px;text-align:center;line-height:1.8}
.arc .t3{position:relative;font-family:'Press Start 2P',monospace;font-size:clamp(28px,9vw,54px);color:#fff;margin-top:14px;text-shadow:0 0 18px #38bdf8}
.arc .estr{position:relative;font-size:clamp(34px,10vw,56px);margin-top:10px;letter-spacing:6px}
.arc .estr span{display:inline-block;animation:estr .45s cubic-bezier(.3,1.8,.5,1) both;filter:drop-shadow(0 0 10px #facc15)}
@keyframes estr{from{transform:scale(0) rotate(-180deg)}}
.arc .t4{position:relative;font-family:'Press Start 2P',monospace;font-size:11px;color:#94a3b8;margin-top:26px;animation:pampalluga2 1.2s steps(2) infinite}
@keyframes pampalluga2{50%{opacity:0}}
.arc .rec{position:relative;font-family:'Press Start 2P',monospace;font-size:12px;color:#020617;background:#4ade80;padding:8px 12px;margin-top:16px;transform:rotate(-3deg);animation:bota .5s .9s both}
.nivell{margin-top:14px;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#f5f3ff,#eef2ff);border:2px solid #c4b5fd;border-radius:16px;padding:12px 16px;cursor:pointer}
.nivell .nic{font-size:38px;line-height:1;flex:none}
.nivell b{display:block;font-size:17px}
.nivell small{color:var(--suau);font-weight:700}
.nivell .barra{margin:6px 0 4px;height:10px}
.nivell .barra i{background:linear-gradient(90deg,#a78bfa,#7c3aed)}
.rangs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.rang{border:2px solid var(--vora);border-radius:14px;padding:10px 8px;text-align:center;background:#fff}
.rang span{display:block;font-size:30px;line-height:1.1}
.rang b{display:block;font-size:14px}
.rang small{color:var(--suau);font-weight:700;font-size:12px}
.rang.bloc{opacity:.45;filter:grayscale(1)}
.rang.ara{border-color:#7c3aed;background:#f5f3ff;box-shadow:0 0 0 3px #ddd6fe}
.arc.niv{background:radial-gradient(circle at 50% 40%,#3b0764,#020617 75%)}
.arc.niv .t1{color:#e9d5ff;text-shadow:4px 4px 0 #7c3aed,0 0 24px #c084fcaa}
.arc.niv .nic{position:relative;font-size:clamp(64px,20vw,110px);margin-top:12px;animation:estr .6s cubic-bezier(.3,1.8,.5,1) .3s both;filter:drop-shadow(0 0 18px #c084fc)}
.vol{display:flex;align-items:center;gap:4px;background:#ffffff26;border:1px solid #ffffff40;border-radius:999px;padding:2px 10px 2px 4px;flex:none}
.so-btn{background:none;border:0;color:#fff;font-size:17px;cursor:pointer;padding:3px 4px;line-height:1}
.vol input{width:76px;accent-color:#fff;cursor:pointer;margin:0}
.vol b{font-size:13px;min-width:9px;text-align:center}
@media(max-width:520px){.vol input{width:54px}.vol{padding-right:7px}}
body.tremola main{animation:tremola .4s}
.arc.ko{background:radial-gradient(circle at 50% 40%,#3b0a0a,#0b0202 75%)}
.arc.ko .t1{color:#f87171;text-shadow:4px 4px 0 #450a0a,0 0 20px #ef444466;animation:cau1 .7s cubic-bezier(.5,1.8,.5,1) both,parpelleja 1.4s steps(2) .8s infinite}
@keyframes cau1{from{transform:translateY(-140px) rotate(-8deg);opacity:0}}
@keyframes parpelleja{50%{opacity:.55}}
.arc.ko .t3{color:#fca5a5;text-shadow:none}
.arc.ko .cor{position:relative;font-size:clamp(44px,13vw,70px);margin-top:8px;animation:trenca 1.1s ease-in .4s both}
@keyframes trenca{0%{transform:scale(0)}35%{transform:scale(1.2)}55%{transform:scale(1) rotate(0)}70%{transform:rotate(-12deg)}85%{transform:rotate(10deg)}100%{transform:rotate(0)}}
.arc.ko .t2{color:#fde68a}
.pluja{position:absolute;top:-30px;width:3px;height:22px;background:linear-gradient(#94a3b800,#94a3b8aa);animation:plou linear infinite}
@keyframes plou{to{transform:translateY(110vh)}}
/* estrelles: d'on venen + animació arcade */
.vola{position:fixed;z-index:90;pointer-events:none;font-family:'Press Start 2P',monospace;font-size:15px;color:#facc15;text-shadow:2px 2px 0 #92400e,0 0 12px #fde047;white-space:nowrap;transition:transform .75s cubic-bezier(.5,-.4,.6,1),opacity .75s ease-in;will-change:transform}
.vola.puja{animation:vpop .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes vpop{from{transform:scale(.2)}}
.espurna{position:fixed;z-index:89;pointer-events:none;width:6px;height:6px;background:#facc15;box-shadow:0 0 6px #fde047;transition:transform .5s ease-out,opacity .5s ease-out}
#punts.boing{animation:boing .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{30%{transform:scale(1.35) rotate(-6deg);background:#facc15;color:#422006}}
.combo{position:fixed;left:50%;top:22%;z-index:91;pointer-events:none;transform:translateX(-50%);font-family:'Press Start 2P',monospace;font-size:clamp(20px,6vw,34px);color:#fb923c;text-shadow:3px 3px 0 #7c2d12,0 0 18px #fdba74;text-align:center;animation:combo 1.3s ease-out forwards;line-height:1.4}
.combo small{display:block;font-size:.42em;color:#fde68a}
@keyframes combo{0%{transform:translateX(-50%) scale(.3);opacity:0}15%{transform:translateX(-50%) scale(1.15);opacity:1}30%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{transform:translateX(-50%) translateY(-40px);opacity:0}}
.estrelles{margin-top:14px;background:linear-gradient(135deg,#fffbeb,#fef3c7);border:2px solid #fcd34d;border-radius:16px;padding:12px 16px;cursor:pointer}
.estrelles h4{margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;font-size:16px}
.estrelles h4 small{color:var(--suau);font-weight:700;font-size:12.5px}
.font{display:grid;grid-template-columns:26px minmax(90px,150px) 1fr 44px;gap:8px;align-items:center;margin:5px 0;font-weight:800;font-size:14.5px}
.font .ic2{font-size:19px;text-align:center}
.font .bf{height:12px;background:#fde68a66;border-radius:6px;overflow:hidden}
.font .bf i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#fbbf24,#f59e0b);transform-origin:left;animation:creix .9s cubic-bezier(.3,1.2,.5,1) both}
@keyframes creix{from{transform:scaleX(0)}}
.font b{text-align:right}
#popEst{position:fixed;top:64px;right:max(12px,calc(50% - 468px));z-index:30;width:min(440px,calc(100vw - 24px));animation:popIn .22s cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 10px 24px #0f172a33)}
#popEst .estrelles{margin:0}
#popEst .comvas{margin-top:8px}
.comvas{background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--om)}
.comvas .prog{color:#c7d2fe}
.cv-cap{display:flex;gap:12px;align-items:center}
.cv-ic{font-size:34px;line-height:1;animation:estr .5s cubic-bezier(.3,1.8,.5,1) both}
.cv-cap b{display:block;font-family:'Press Start 2P',monospace;font-size:13px;color:#facc15;line-height:1.5}
.cv-cap small{display:block;color:#e0e7ff;font-weight:700;font-size:13.5px}
.cv-fila{display:grid;grid-template-columns:110px 150px 1fr;gap:8px;align-items:center;margin:6px 0;font-weight:800;font-size:14px}
.cv-fila b{color:#fde68a}
.cv-pista{position:relative;height:16px;background:#ffffff1a;border-radius:8px}
.cv-pista i{position:absolute;top:3px;width:10px;height:10px;border-radius:50%;background:#e0e7ff99}
.cv-pista i.jo{top:0;width:16px;height:16px;background:#facc15;box-shadow:0 0 10px #facc15;z-index:1;animation:estr .6s .2s both}
@media(max-width:520px){.cv-fila{grid-template-columns:96px 1fr;}.cv-fila .cv-pista{grid-column:1/-1}}
@keyframes popIn{from{transform:translateY(-10px) scale(.92);opacity:0}}
.estrelles.mini2{padding:8px 14px}
.mini2 .f1{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.mini2 .f1 b{font-size:16px;white-space:nowrap}
.mini2 .xs{display:flex;gap:5px;flex-wrap:nowrap;flex:1;min-width:0;overflow:hidden}
.mini2 .xs span{background:#fff;border:1.5px solid #fcd34d;border-radius:999px;padding:1px 9px;font-weight:800;font-size:13.5px;white-space:nowrap}
.mini2 .f1 small{color:var(--suau);font-weight:800;white-space:nowrap}
.mini2 .f2{margin-top:4px;font-size:12.5px;font-weight:700;color:#92400e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.com-guanyar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.com-guanyar span{background:#fff;border:1.5px solid #fcd34d;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:800}
@media(prefers-reduced-motion:reduce){.vola,.espurna,.combo,#punts.boing,.font .bf i{animation:none!important;transition:none!important}}
</style>

<body>
<header>
 <div class="hd">
  <div class="logo" onclick="vista('inici')"><span id="logoic">📚</span><span class="tt"><span id="hola"></span><small id="qui"></small></span></div>
  <span class="vol" title="Volum dels sons (0-5)"><button class="so-btn" id="so" onclick="canviaSo()" aria-label="Silenci">🔊</button><input type="range" id="volum" min="0" max="5" step="1" value="3" aria-label="Volum" oninput="posaVol(+this.value)"><b id="volN">3</b></span><span class="pill" id="punts" onclick="obreEstrelles(event)" style="cursor:pointer">⭐ 0</span>
 </div>
 <nav id="nav">
  <a class="surt" href="../../" title="Tornar al menú de tots els mons">🚪 Mons</a>
  <button data-v="inici" onclick="vista('inici')">🏠 Inici</button>
  <button data-v="temes" onclick="vista('temes')">📖 Temes</button>
  <button data-v="jocs" onclick="vista('jocs')">🎮 Jocs</button>
  <button data-v="obertes" onclick="vista('obertes')">✍️ Obertes</button>
  <button data-v="analitica" onclick="vista('analitica')">📊 Com vaig</button>
  <button data-v="usuari" onclick="benvinguda()">👥 Canviar d'usuari</button>
 </nav>
</header>
<main id="app"></main>
<div class="peu-pag" id="peu"></div>

<script>
/*DADES*/
const CL=(ASSIG.clau||"bn_"+ASSIG.id)+"_";
["--g1","--g2","--g3"].forEach((v,i)=>document.documentElement.style.setProperty(v,ASSIG.color[i]));
document.getElementById("peu").innerHTML=ASSIG.peu;document.getElementById("logoic").textContent=ASSIG.ic;

// ====================== ESTAT ======================
const BUIT=()=>({nom:"",punts:0,temes:{},jocs:{},ob:{},examens:[],temps:0,dies:[],ultim:null,fonts:{},ftema:{},fjoc:{}});
let S=BUIT(),PER={},ACT="";
try{PER=JSON.parse(localStorage.getItem(CL+"perfils")||"{}")||{};ACT=localStorage.getItem(CL+"actiu")||""}catch(e){}
try{const v=localStorage.getItem(CL+"v3");if(v&&!Object.keys(PER).length){const o=Object.assign(BUIT(),JSON.parse(v));if(o.nom){PER[o.nom]=o;ACT=o.nom}}}catch(e){}
if(ACT&&PER[ACT])S=Object.assign(BUIT(),PER[ACT]);
function guarda(){if(!S.nom)return;PER[S.nom]=S;try{localStorage.setItem(CL+"perfils",JSON.stringify(PER));localStorage.setItem(CL+"actiu",S.nom)}catch(e){}}
function desa(){guarda();pintaCap()}
// ---- registre d'activitat per al panell admin (Supabase: només escriptura; llegir-ho només pot l'admin) ----
const BN_LOG={url:"https://xbtlgjucvrdcmkgmxvzy.supabase.co/rest/v1/bn_log",key:"sb_publishable_0qCYDBqe_j5w9_ifCXeeyw_s76eEjzb"};
const SESSIO=Math.random().toString(36).slice(2,12);let APARELL="",TPEND=0;
try{APARELL=localStorage.getItem("bn_aparell")||"";if(!APARELL){APARELL=Math.random().toString(36).slice(2,12);localStorage.setItem("bn_aparell",APARELL)}}catch(e){APARELL="?"}
function registra(event,detall){if(!S.nom||/^file:/.test(location.protocol)||window.BN_NO_LOG)return;
 try{fetch(BN_LOG.url,{method:"POST",keepalive:true,headers:{"apikey":BN_LOG.key,"Content-Type":"application/json","Prefer":"return=minimal"},
  body:JSON.stringify({assig:ASSIG.id,nom:S.nom.slice(0,40),sessio:SESSIO,aparell:APARELL,event,detall:detall||{}})}).catch(()=>{})}catch(e){}}
function buidaTemps(){if(TPEND>0){registra("temps",{s:TPEND,punts:S.punts,fonts:S.fonts||{}});TPEND=0}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")buidaTemps()});
addEventListener("pagehide",buidaTemps);
function existeix(n){return Object.keys(PER).some(x=>x.toLowerCase()===n.toLowerCase())}
function suggeriments(n){n=Object.keys(PER).find(x=>x.toLowerCase()===n.toLowerCase())||n;const r=[];for(let k=2;r.length<2&&k<99;k++)if(!existeix(n+k))r.push(n+k);
 ["Pro","Crack","Star","Max","Top"].forEach(a=>{if(r.length<5&&!existeix(n+a))r.push(n+a)});return r}
function entra(nom){const k=Object.keys(PER).find(x=>x.toLowerCase()===nom.toLowerCase());if(k)S=Object.assign(BUIT(),PER[k]);else{S=BUIT();S.nom=nom.charAt(0).toUpperCase()+nom.slice(1)}marcaDia();desa();registra("entra",{nou:!k,punts:S.punts,fonts:S.fonts||{},aprovats:T.filter(t=>(millor(t.id)||0)>=50).length,temes:T.length});vista("inici")}
function avui(){return new Date().toISOString().slice(0,10)}
function marcaDia(){const d=avui();if(!S.dies.includes(d)){S.dies.push(d);desa()}}
function ET(id){return S.temes[id]||(S.temes[id]={fitxa:false,fc:0,intents:[],fallades:{},valoracio:null})}
// ---- nivells i rangs: es calculen amb les mateixes ⭐ dels tests, jocs i preguntes obertes ----
const NIVELLS=[[0,"Aprenent","🐣"],[10,"Explorador","🧭"],[25,"Investigador","🔍"],[45,"Savi","📜"],[70,"Expert","🎓"],[100,"Mestre","🧠"],[140,"Campió","🏅"],[190,"Heroi","🦸"],[250,"Llegenda","👑"],[330,"Llegenda d'or","🌟"]];
function nivell(p){let i=0;while(i<NIVELLS.length-1&&p>=NIVELLS[i+1][0])i++;const [min,nom,ic]=NIVELLS[i],seg=NIVELLS[i+1];
 return {n:i+1,nom,ic,min,seg,falten:seg?seg[0]-p:0,pc:seg?Math.round((p-min)*100/(seg[0]-min)):100}}
let NIVPEND=null;
function suma(n){const a=nivell(S.punts).n;S.punts+=n;if(nivell(S.punts).n>a)NIVPEND=nivell(S.punts);
 // d'on surt cada estrella: temes (i quin), jocs (i quin), examen, obertes, combo
 S.fonts=S.fonts||{};S.ftema=S.ftema||{};S.fjoc=S.fjoc||{};const [f,id]=FONT;S.fonts[f]=(S.fonts[f]||0)+n;
 if(f==="temes"&&id)S.ftema[id]=(S.ftema[id]||0)+n;if(f==="jocs"&&id)S.fjoc[id]=(S.fjoc[id]||0)+n;
 desa();if(n>0)volaEstrella(n)}
// ---- animació arcade de cada estrella guanyada: surt d'on has tocat i vola fins al comptador ----
let FONT=["temes"],ULTX=innerWidth/2,ULTY=innerHeight/2,COMBO=0;
document.addEventListener("pointerdown",e=>{ULTX=e.clientX;ULTY=e.clientY},true);
function volaEstrella(n){try{
 const dest=document.getElementById("punts").getBoundingClientRect(),x0=ULTX,y0=ULTY;
 const d=document.createElement("div");d.className="vola puja";d.textContent=`+${n} ⭐`;d.style.left=(x0-24)+"px";d.style.top=(y0-28)+"px";document.body.appendChild(d);
 for(let i=0;i<8;i++){const e=document.createElement("i");e.className="espurna";e.style.left=x0+"px";e.style.top=y0+"px";document.body.appendChild(e);const a=Math.PI*2*i/8,r=26+Math.random()*16;
  requestAnimationFrame(()=>{e.style.transform=`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(.3)`;e.style.opacity="0"});setTimeout(()=>e.remove(),550)}
 setTimeout(()=>{d.classList.remove("puja");d.style.transform=`translate(${dest.left+dest.width/2-x0}px,${dest.top+dest.height/2-y0+14}px) scale(.55)`;d.style.opacity=".2"},380);
 setTimeout(()=>{d.remove();const pl=document.getElementById("punts");pl.classList.remove("boing");void pl.offsetWidth;pl.classList.add("boing");so("coin")},1130);
}catch(e){}}
// ratxa d'encerts seguits als tests: COMBO ×3, ×5 (+1 ⭐ de regal), ×10 (+2 ⭐)…
function ratxa(ok){if(!ok){COMBO=0;return}COMBO++;if(COMBO<3)return;
 const premi=COMBO%10===0?2:COMBO%5===0?1:0;
 const d=document.createElement("div");d.className="combo";d.innerHTML=`COMBO ×${COMBO}!${premi?`<small>+${premi} ⭐ DE REGAL</small>`:COMBO===3?`<small>3 SEGUIDES! CONTINUA…</small>`:""}`;
 document.body.appendChild(d);setTimeout(()=>d.remove(),1350);if(premi){so("super");setTimeout(()=>{const f=FONT;FONT=["combo"];suma(premi);FONT=f},500)}}
const FONTS=[["temes","📖","Tests dels temes"],["jocs","🎮","Jocs"],["examen","🏆","Examen sorpresa"],["obertes","✍️","Preguntes obertes"],["combo","🔥","Combos (ratxes)"]];
// el resum d'estrelles només surt quan toques el comptador de dalt a la dreta
// ---- «Com vas»: ràpid i bé? + comparativa anònima amb els altres nens (cap nom) ----
let COMP=null,COMPT=0;
function elMeu(){const g=resumGlobal(),min=S.temps/60;return {punts:S.punts,encert:g.encert,ritme:min>=2?Math.round(S.punts*10/min):null}}
function carregaComp(cb){if(/^file:/.test(location.protocol)){cb&&cb();return}if(COMP&&Date.now()-COMPT<120000){cb&&cb();return}
 fetch(BN_LOG.url.replace("/bn_log","/rpc/bn_comparativa"),{method:"POST",headers:{"apikey":BN_LOG.key,"Content-Type":"application/json"},body:JSON.stringify({p_assig:ASSIG.id})})
  .then(r=>r.ok?r.json():null).then(d=>{COMP=Array.isArray(d)?d:null;COMPT=Date.now();cb&&cb()}).catch(()=>{cb&&cb()})}
function veredicte(){const m=elMeu();if(m.encert===null)return {ic:"🚀",t:"Encara no has fet cap test",s:"Fes-ne un i et diré si vas ràpid i bé."};
 const alt=(COMP||[]).slice(),ij=alt.findIndex(r=>r.punts===m.punts);if(ij>=0)alt.splice(ij,1);
 const altres=alt.filter(r=>r.temps_s>=120).map(r=>Math.round(r.punts*10/(r.temps_s/60)));
 // ràpid = més ràpid que almenys la meitat dels altres nens (si n'hi ha 2 o més); si no, 6 ⭐ cada 10 min
 const be=m.encert>=70,rap=m.ritme!==null&&(altres.length>=2?altres.filter(x=>x<m.ritme).length*2>=altres.length:m.ritme>=6);
 if(m.ritme===null)return be?{ic:"🎯",t:"Vas bé!",s:`Encertes el ${m.encert}%. Estudia una mica més i et diré si també vas ràpid.`}:{ic:"📚",t:"Cal repassar",s:`Encertes el ${m.encert}%. Llegeix bé les fitxes abans dels tests.`};
 if(be&&rap)return {ic:"🚀",t:"Vas ràpid i bé!",s:`Encertes el ${m.encert}% i guanyes ${m.ritme} ⭐ cada 10 minuts. Crack!`};
 if(be)return {ic:"🐢",t:"Vas bé, però a poc a poc",s:`Encertes el ${m.encert}%, molt bé! Guanyes ${m.ritme} ⭐ cada 10 min: prova de fer més tests seguits.`};
 if(rap)return {ic:"⚡",t:"Vas ràpid, però amb errors",s:`Guanyes ${m.ritme} ⭐ cada 10 min, però encertes el ${m.encert}%. Llegeix amb calma!`};
 return {ic:"💪",t:"Ves a poc a poc i repassa",s:`Encertes el ${m.encert}%. Torna a la fitxa i a les targetes abans del test.`}}
function cartaComVas(){const v=veredicte(),m=elMeu();
 let h=`<div class="comvas"><div class="cv-cap"><span class="cv-ic">${v.ic}</span><div><b>${v.t}</b><small>${v.s}</small></div></div>`;
 const R=(COMP||[]).filter(r=>r.punts>0||r.tests>0);
 if(R.length>=2){const altres=R.slice();let i=altres.findIndex(r=>r.punts===m.punts);if(i>=0)altres.splice(i,1);
  const n=altres.length+1,pos=altres.filter(r=>r.punts>m.punts).length+1,med=["🥇","🥈","🥉"][pos-1]||"🏅";
  const pct=(vals,mv)=>vals.length&&mv!==null?Math.round(vals.filter(x=>x<mv).length*100/vals.length):null;
  const enc=altres.filter(r=>r.encert!==null).map(r=>r.encert),rit=altres.filter(r=>r.temps_s>=120).map(r=>Math.round(r.punts*10/(r.temps_s/60)));
  const pe=pct(enc,m.encert),pr=pct(rit,m.ritme);
  const punts=(vals,mv,fmt)=>{const all=[...vals.map(v=>[v,0]),[mv,1]].filter(x=>x[0]!==null),mx=Math.max(1,...all.map(x=>x[0]));return `<div class="cv-pista">${all.map(([v,jo])=>`<i class="${jo?"jo":""}" style="left:${Math.round(v*96/mx)}%" title="${jo?"Tu":""}"></i>`).join("")}</div>`};
  h+=`<div class="cv-comp"><p class="prog" style="margin:10px 0 4px">Comparat amb els altres ${n-1} nens que fan ${ASSIG.nom} (sense noms):</p>
  <div class="cv-fila"><span>${med} Estrelles</span><b>${pos}r de ${n}</b>${punts(altres.map(r=>r.punts),m.punts)}</div>
  ${pe!==null?`<div class="cv-fila"><span>🎯 Encert</span><b>millor que el ${pe}%</b>${punts(enc,m.encert)}</div>`:""}
  ${pr!==null?`<div class="cv-fila"><span>⚡ Rapidesa</span><b>més ràpid que el ${pr}%</b>${punts(rit,m.ritme)}</div>`:""}
  <p class="prog" style="margin:6px 0 0;font-size:12.5px">🟡 ets tu · ⚪ els altres nens (ningú veu el nom de ningú)</p></div>`}
 else if(!/^file:/.test(location.protocol))h+=`<p class="prog" style="margin:8px 0 0">${COMP===null?"La comparativa amb els altres nens encara no està activada.":"Encara no hi ha prou nens per comparar-te. Aviat!"}</p>`;
 return h+`</div>`}
function obreEstrelles(e){if(e)e.stopPropagation();let d=document.getElementById("popEst");if(d){d.remove();return}
 d=document.createElement("div");d.id="popEst";const pinta=()=>{d.innerHTML=cartaEstrelles(false)+cartaComVas()};pinta();document.body.appendChild(d);carregaComp(()=>{if(d.isConnected)pinta()});
 d.onclick=()=>{d.remove();vista("analitica")};setTimeout(()=>document.addEventListener("click",function tanca(ev){if(!d.contains(ev.target)){d.remove()}document.removeEventListener("click",tanca,true)},true),0)}
function cartaEstrelles(gran){
 const fo=S.fonts||{},tot=FONTS.reduce((a,[k])=>a+(fo[k]||0),0),abans=Math.max(0,S.punts-tot),mx=Math.max(1,...FONTS.map(([k])=>fo[k]||0),abans);
 const fila=(ic,nom,v)=>`<div class="font"><span class="ic2">${ic}</span><span>${nom}</span><div class="bf"><i style="width:${Math.round(v*100/mx)}%"></i></div><b>${v}</b></div>`;
 if(!gran){ // versió compacta de l'inici: 2 files
  const xips=FONTS.filter(([k])=>fo[k]).map(([k,ic,nom])=>`<span title="${nom}">${ic} ${fo[k]}</span>`).join("")+(abans?`<span title="D'abans">⏳ ${abans}</span>`:"");
  return `<div class="estrelles mini2" onclick="vista('analitica')"><div class="f1"><b>⭐ ${S.punts} estrelles</b><span class="xs">${xips||`<span>Fes el primer test! ✨</span>`}</span><small>→</small></div><div class="f2">✅ test +1 · 🎮 joc +1 · ✍️ idea +1 · 🔥 combo ×5 +1 · ×10 +2</div></div>`}
 let h=`<div class="estrelles" ${gran?"":`onclick="vista('analitica')"`}><h4>⭐ On guanyes les estrelles <small>${S.punts} en total${gran?"":" · toca per veure-ho tot"}</small></h4>`;
 h+=FONTS.filter(([k])=>gran||fo[k]).map(([k,ic,nom])=>fila(ic,nom,fo[k]||0)).join("")+(abans?fila("⏳","D'abans",abans):"");
 if(!S.punts)h+=`<p class="prog" style="margin:4px 0 0">Encara cap estrella. Fes el primer test i mira com volen! ✨</p>`;
 if(gran){
  const tt=T.filter(t=>(S.ftema||{})[t.id]).sort((a,b)=>S.ftema[b.id]-S.ftema[a.id]).slice(0,5),jj=ASSIG.jocs.filter(j=>(S.fjoc||{})[j.id]).sort((a,b)=>S.fjoc[b.id]-S.fjoc[a.id]).slice(0,5);
  if(tt.length)h+=`<p style="margin:10px 0 2px"><b>Temes que més ⭐ t'han donat:</b></p>`+tt.map(t=>fila(t.ic,t.titol,S.ftema[t.id])).join("");
  if(jj.length)h+=`<p style="margin:10px 0 2px"><b>Jocs que més ⭐ t'han donat:</b></p>`+jj.map(j=>fila(j.ic,j.titol,S.fjoc[j.id])).join("");
 }
 h+=`<div class="com-guanyar"><span>✅ +1 per encert als tests</span><span>🎮 +1 per encert als jocs</span><span>✍️ +1 per idea a les obertes</span><span>🔥 combo ×5: +1 de regal</span><span>🔥 combo ×10: +2</span></div></div>`;
 return h}
// el «LEVEL UP» surt quan s'acaba el test o el joc (no a mitja pregunta)
function mostraNivell(){if(!NIVPEND)return;if(document.querySelector(".arc")){setTimeout(mostraNivell,400);return}
 const v=NIVPEND;NIVPEND=null;so("super");window.NIVELLS_MOSTRATS=(window.NIVELLS_MOSTRATS||0)+1;
 const d=document.createElement("div");d.className="arc niv";

// Cada pregunta fallada entra a la capsa 0 (es pot repassar avui mateix).

function diaMes(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}

 if(!ok){S.rep[k]={tid,q:txt,c:0,prox:REPAS?diaMes(1):avui()};desa();return}
 if(!REPAS||!r)return;
 const c=r.c+1;if(c>=REP_DIES.length){delete S.rep[k];S.apresos=(S.apresos||0)+1}else S.rep[k]={...r,c,prox:diaMes(REP_DIES[c])};desa()}

 <h2 class="sec">❌ Preguntes que més falla</h2><div class="box"><p class="prog" style="margin:0 0 8px">🔁 Al repàs: <b>${repTots().length}</b> preguntes pendents (${repPendents().length} per avui) · 🏅 apreses del tot: <b>${S.apresos||0}</b></p>${errs.length?`<ol class="llista-err">${errs.slice(0,8).map(([q,c,t])=>`<li>${q} <span class="etq">${t.ic} ${t.titol}</span> <b>×${c}</b></li>`).join("")}</ol>`:`<p class="prog" style="margin:0">Encara cap error registrat. 👌</p>`}</div>
 <h2 class="sec">✍️ Preguntes obertes</h2><div class="box">${obN?`<table class="an"><tr><th>Pregunta</th><th>Tema</th><th>Idees</th></tr>${OB.map((o,n)=>n in S.ob?`<tr style="cursor:pointer" onclick="obertes(${n})"><td>${o.q.length>80?o.q.slice(0,78)+"…":o.q}</td><td>${o.t}</td><td><span class="semaf" style="background:${color(S.ob[n])}"></span><b>${S.ob[n]}%</b></td></tr>`:"").join("")}</table>`:`<p class="prog" style="margin:0">Encara no n'ha fet cap.</p>`}</div>
 <h2 class="sec">🎮 Jocs i examen</h2><div class="box"><table class="an"><tr><th>Joc</th><th>Vegades</th><th>Millor</th><th>Últim</th></tr>${JOCS.map(([id,ic,t])=>{const r=S.jocs[id]||[];return `<tr><td>${ic} ${t}</td><td>${r.length}</td><td>${r.length?Math.max(...r)+"%":"—"}</td><td>${r.length?r[r.length-1]+"%":"—"}</td></tr>`}).join("")}</table></div>
 <p class="prog" style="text-align:center">Cada nom té el seu progrés, guardat en aquest navegador i aquest aparell. Data: ${new Date().toLocaleDateString("ca-ES")}.</p>
 <div class="fila"><button class="btn sec" onclick="benvinguda()">👥 Canviar d'usuari</button><button class="btn verm" onclick="demanaReset()">🗑️ Esborrar el progrés</button></div>`;
}
function demanaReset(){
 const m=document.createElement("div");m.className="modal";
 m.innerHTML=`<div class="box"><div class="gran">⚠️</div><h3>Esborrar tot el progrés de ${S.nom}?</h3><p class="prog">Només s'esborra el progrés de ${S.nom}; els altres noms no es toquen. No es pot desfer.</p><div class="fila"><button class="btn sec" id="no">No, deixa-ho</button><button class="btn verm" id="si">Sí, esborra-ho</button></div></div>`;
 document.body.appendChild(m);
 m.querySelector("#no").onclick=()=>m.remove();
 m.querySelector("#si").onclick=()=>{delete PER[S.nom];S=BUIT();try{localStorage.setItem(CL+"perfils",JSON.stringify(PER));localStorage.removeItem(CL+"actiu")}catch(e){}m.remove();pintaCap();benvinguda()};
}

pintaCap();pintaSo();vista("inici");
</script>
