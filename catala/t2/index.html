// ====================== SO I EFECTES ARCADE ======================
// Motor d'àudio v2: tot es sintetitza en directe (no hi ha fitxers de so).
// Cadena: veus → bus d'efectes (SB) o de música (MB) → volum general (MG) → compressor → altaveus.
// Una part de cada bus passa per una reverberació suau (sala petita) i un eco curt, perquè soni més ple i menys "pitet".
// volum dels sons 0-5 (0 = silenci)
// ===== SO ALS MÒBILS (motor/eines/so-mobil.js · el mateix codi als mons i a la portada; tot.py el copia a index.html) =====
// Els navegadors només deixen engegar el so dins d'un gest de l'usuari, i en pantalles tàctils «pointerdown» NO compta:
// només pointerup, touchend, click i keydown. Per això hi ha UN sol AudioContext per pàgina (bnSo.context()) i es
// desbloqueja al primer d'aquests gestos: resume() + un buffer buit d'1 mostra (el truc d'iOS). Si el mòbil el posa en
// pausa («suspended» o «interrupted»: una trucada, canviar d'app…), es torna a engegar en tornar a la pàgina o al toc següent.
// IPHONE EN SILENCI (n2429, comprovat amb prova-so.html en un iPhone): amb el mòbil en silenci, Web Audio calla del tot encara
// que el context estigui «running», i navigator.audioSession no hi fa res. Un element <audio> sí que sona, i mentre n'hi ha un
// sonant, Web Audio també. Per això, a l'iPhone/iPad, al primer toc s'engega un <audio> de silenci en bucle (fet aquí mateix,
// sense fitxers) i s'atura quan la pàgina no es veu o quan el so de l'app està apagat (bnSo.sessio(false)).
const bnSo=(()=>{let ctx=null,armat=false,tocat=false,volOn=true,mut=null;const pendents=[],EV=["pointerup","touchend","click","keydown"],OP={capture:true,passive:true};
 const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
 const resum=c=>{try{const p=c.resume();if(p&&p.catch)p.catch(()=>{})}catch(e){}};
 function context(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ctx=new C()}catch(e){return null}
   try{ctx.addEventListener("statechange",()=>{if(ctx.state!=="running"&&ctx.state!=="closed")arma()})}catch(e){}}
  return ctx}
 // mig segon de silenci en WAV (8 kHz, mono): l'<audio> que fa que l'iPhone deixi sonar Web Audio en mode silenci
 function silenci(){const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
 const calMut=()=>IOS&&volOn&&document.visibilityState==="visible";
 function engegaMut(){if(!calMut())return;try{
   if(!mut){mut=new Audio(silenci());mut.loop=true;mut.preload="auto";mut.setAttribute("playsinline","");mut.setAttribute("x-webkit-airplay","deny");mut.disableRemotePlayback=true}
   if(mut.paused){const p=mut.play();if(p&&p.catch)p.catch(()=>arma())}}catch(e){}}
 function aturaMut(){try{if(mut&&!mut.paused)mut.pause()}catch(e){}}
 function gest(){const c=context();
  if(c){if(c.state!=="running")resum(c);try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0)}catch(e){}}
  engegaMut();
  if(!tocat){tocat=true;pendents.splice(0).forEach(f=>{try{f()}catch(e){}})}
  const mutOk=!calMut()||(mut&&!mut.paused);
  if((!c||c.state==="running")&&mutOk)desarma();else if(c&&c.state!=="running"){try{c.resume().then(()=>{if(c.state==="running"&&(!calMut()||(mut&&!mut.paused)))desarma()},()=>{})}catch(e){}}}
 function arma(){if(armat)return;armat=true;EV.forEach(t=>addEventListener(t,gest,OP))}
 function desarma(){if(!armat)return;armat=false;EV.forEach(t=>removeEventListener(t,gest,OP))}
 function torna(){if(ctx&&ctx.state!=="running"&&ctx.state!=="closed"){resum(ctx);arma()}if(tocat&&calMut()){engegaMut();if(mut&&mut.paused)arma()}}
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")torna();else aturaMut()});
 addEventListener("pageshow",torna);
 addEventListener("pagehide",aturaMut);
 arma();
 return {
  context, // el context compartit de la pàgina (el crea si encara no hi és)
  quanSigui(f){if(tocat)f();else pendents.push(f)}, // f s'executa dins del primer gest (o ara mateix, si ja n'hi ha hagut un)
  // so de l'app engegat o apagat: a l'iPhone, engegat = que soni encara que el mòbil estigui en silenci; apagat = res de fons
  sessio(on){volOn=!!on;try{if(navigator.audioSession)navigator.audioSession.type=on?"playback":"auto"}catch(e){}
   if(!on)aturaMut();else if(tocat){engegaMut();if(IOS&&mut&&mut.paused)arma()}}
 }})();

let AC=null,MG=null,SB=null,MB=null,REV=null,ECO=null,VOL=3,VOLant=3;
try{const v=localStorage.getItem("bn_vol");if(v!==null)VOL=Math.max(0,Math.min(5,+v||0));else if(localStorage.getItem("bn_so")==="0")VOL=0}catch(e){}
bnSo.sessio(VOL>0); // a l'iPhone, que soni encara que el mòbil estigui en silenci (si el so de l'app està engegat)
const GVOL=[0,.12,.27,.45,.7,1];
function impuls(seg,caiguda){const n=AC.sampleRate*seg|0,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,caiguda)}return b}
let SOROLL=null;function soroll(){if(!SOROLL){const n=AC.sampleRate|0;SOROLL=AC.createBuffer(1,n,AC.sampleRate);const d=SOROLL.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}return SOROLL}
function guany(v){const g=AC.createGain();g.gain.value=v;return g}
function audio(){if(!AC){AC=bnSo.context();if(!AC)throw new Error("sense Web Audio"); // context compartit, desbloquejat al primer toc (so-mobil.js)
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.22;
  MG=guany(GVOL[VOL]);MG.connect(comp).connect(AC.destination);
  REV=AC.createConvolver();REV.buffer=impuls(1.8,3);REV.connect(guany(.9)).connect(MG);
  ECO=AC.createDelay(1);ECO.delayTime.value=.21;const fb=guany(.3),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;ECO.connect(lp).connect(fb).connect(ECO);lp.connect(guany(.5)).connect(MG);
  SB=guany(1);SB.connect(MG);SB.connect(guany(.22)).connect(REV);SB.connect(guany(.12)).connect(ECO);
  MB=guany(0);MB.connect(MG);MB.connect(guany(.35)).connect(REV);MB.connect(guany(.2)).connect(ECO);}
 if(AC.state!=="running"&&AC.state!=="closed")try{AC.resume().catch(()=>{})}catch(e){}return AC}

function posaVol(v){VOL=v;if(v)VOLant=v;try{localStorage.setItem("bn_vol",v)}catch(e){}bnSo.sessio(v>0);if(MG)MG.gain.setTargetAtTime(GVOL[v],AC.currentTime,.05);pintaSo();if(v){audio();so("clic")}}
function canviaSo(){posaVol(VOL?0:(VOLant||3))}
// una veu: oscil·lador amb envolupant (atac ràpid, caiguda exponencial), filtre opcional, lliscament de to i vibrato
function veu(f,t0,d,o={}){const{tipus="triangle",vol=.12,atac=.006,dest=SB,filtre=0,q=1,cap=0,vib=0,det=0}=o;
 const t=AC.currentTime+t0,os=AC.createOscillator(),g=AC.createGain();os.type=tipus;os.frequency.setValueAtTime(f,t);if(det)os.detune.value=det;
 if(cap)os.frequency.exponentialRampToValueAtTime(Math.max(20,cap),t+d);
 if(vib){const l=AC.createOscillator(),lg=guany(vib);l.frequency.value=5.5;l.connect(lg).connect(os.frequency);l.start(t+Math.min(.15,d/3));l.stop(t+d+.05)}
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+atac);g.gain.setTargetAtTime(0,t+atac,d/4.5);
 let sortida=g;if(filtre){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.Q.value=q;fl.frequency.setValueAtTime(filtre*3,t);fl.frequency.exponentialRampToValueAtTime(filtre,t+Math.min(.25,d));g.connect(fl);sortida=fl}
 os.connect(g);sortida.connect(dest);os.start(t);os.stop(t+d+.3)}
// compatibilitat amb el codi antic (nota = una veu simple)
function nota(f,t0,d,tipus="square",vol=.12,dest){veu(f,t0,d,{tipus,vol:vol*.8,dest:dest||SB,filtre:tipus==="square"||tipus==="sawtooth"?3200:0})}
// timbres
const pluck=(f,t0,d,v=.1,dest)=>{veu(f,t0,d,{tipus:"triangle",vol:v,dest});veu(f,t0,d*.6,{tipus:"square",vol:v*.35,filtre:2400,dest,det:6})};
const campana=(f,t0,d,v=.08,dest)=>{veu(f,t0,d,{tipus:"sine",vol:v,dest});veu(f*2,t0,d*.45,{tipus:"sine",vol:v*.35,dest});veu(f*3.01,t0,d*.2,{tipus:"sine",vol:v*.12,dest})};
const metall=(f,t0,d,v=.07,dest)=>{veu(f,t0,d,{tipus:"sawtooth",vol:v,filtre:1800,q:2,dest,vib:d>.4?f*.012:0});veu(f,t0,d,{tipus:"square",vol:v*.5,filtre:1400,det:-8,dest})};

 s.buffer=soroll();fl.type=tipus;fl.Q.value=q;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(fl).connect(g).connect(dest);s.start(t);s.stop(t+d+.05)}

// ---- MÚSICA DE FONS (opcional, apagada per defecte) ----
// Música tranquil·la per estudiar, generada en directe: acords suaus, baix, arpegi de campanetes i un ritme molt fluix.
// Cada món té la seva tonalitat i el seu tempo (surten de l'id). S'abaixa sola quan parla la veu (🔊 Escolta) o surt una pantalla arcade.
let MUS=false,MUSt=null,MUSpas=0,MUSseg=0,MUSduck=1;
try{MUS=localStorage.getItem("bn_musica")==="1"}catch(e){}
const MUSPROG=[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17],[0,4,7,14],[9,12,16,21],[2,5,9,12],[7,11,14,19]]; // I · vi · IV · V · I · vi · ii · V
const musHash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const MUSCFG=(()=>{const h=musHash(typeof ASSIG!=="undefined"?ASSIG.id:"bn");return{arrel:[60,62,65,57,58,63][h%6],tempo:84+h%5*4}})();
const mf=n=>440*Math.pow(2,(n-69)/12);
function musPas(t){// un pas = una corxera
 const p=MUSpas,compas=(p>>3)%8,b=p%8,ac=MUSPROG[compas],r=MUSCFG.arrel,dur=60/MUSCFG.tempo/2,o=t-AC.currentTime;
 if(b===0)ac.forEach((n,i)=>veu(mf(r+n-12),o,dur*8.2,{tipus:i%2?"sine":"triangle",vol:.028,atac:.25,dest:MB}));
 if(b===0||b===3||b===6)veu(mf(r+ac[0]-24),o,dur*(b===6?2:3),{tipus:"triangle",vol:b===0?.09:.06,atac:.01,filtre:500,dest:MB});
 const pat=[0,2,1,3,2,1,3,2],seed=(musHash(compas*13+b+(p>>6))%10);
 if(seed<7)campana(mf(r+ac[pat[b]]+12),o,dur*3,b%2?.018:.026,MB);
 if(b%2===1)sorollet(o,.05,{vol:.012,tipus:"highpass",f0:7000,f1:9000,dest:MB});

function triaVeu(lang){if(!("speechSynthesis" in window))return null;VEUS=speechSynthesis.getVoices();const L=lang||VEU_LANG,l=L.slice(0,2);

 u.onend=u.onerror=()=>{if(PARLANT===btn)calla()};PARLANT=btn;btn.classList.add("parla");btn.firstChild.textContent="⏹";if(AC)abaixaMus(true);speechSynthesis.speak(u);registraEscolta()}

const BUIDES=new Set("aquest aquesta aquests aquestes perque quan com amb sense sobre entre també molt mes menys tots totes cada altre altres seva seves seus quan durant despres abans pero porque cuando sobre entre tambien mucho todos todas otra otro otras otros".split(" "));

const BUIDES_N=new Set([...BUIDES].map(normT));
const obNet=t=>normT(String(t).replace(/<[^>]+>/g," ")).replace(/[^a-z0-9 ]/g," ");
const obParaules=t=>obNet(t).split(/\s+/).filter(Boolean);
const obArrels=t=>new Set(obParaules(t).filter(w=>w.length>=4).map(w=>w.slice(0,5)));
function ideaDetectada(punt,text,enunciat){const t=obArrels(text),e=obArrels(enunciat||"");
 // mates: si el punt clau porta nombres de 2 xifres o més (1.001, 144, 72…) que no surten a l'enunciat, val si el text els porta tots
 const nums=x=>(normT(String(x).replace(/<[^>]+>/g,"")).match(/\d+(?:[.,]\d{3})*/g)||[]).map(n=>n.replace(/[.,]/g,""));
 const en=new Set(nums(enunciat||"")),np=[...new Set(nums(punt).filter(n=>n.length>=2&&!en.has(n)))];if(np.length){const nt=new Set(nums(text));if(np.every(n=>nt.has(n)))return true}
 const totes=[...new Set(obParaules(punt).filter(w=>w.length>=5&&!BUIDES_N.has(w)).map(w=>w.slice(0,5)))];
 let claus=totes.filter(w=>!e.has(w));if(!claus.length)claus=totes;if(!claus.length)return false;
 return claus.filter(w=>t.has(w)).length>=Math.max(1,Math.ceil(claus.length*OB_IDEA))}
// quina part del text a són seqüències de 4 paraules que també són a b (0 a 1)
const obQuatre=t=>{const w=obParaules(t),s=new Set();for(let i=0;i+3<w.length;i++)s.add(w.slice(i,i+4).join(" "));return s};
function obCopia(a,b){const x=obQuatre(a),y=obQuatre(b);if(!x.size)return 0;let n=0;x.forEach(s=>{if(y.has(s))n++});return n/x.size}
// vocabulari del món: per distingir paraules reals de tecles a l'atzar (es calcula un sol cop)
let OB_VOCAB=null;function obVocab(){if(!OB_VOCAB){OB_VOCAB=obArrels(JSON.stringify([T,OB]));BUIDES_N.forEach(w=>OB_VOCAB.add(w.slice(0,5)))}return OB_VOCAB}

 const rar=w.filter(x=>/^[a-z]{3,}$/.test(x)&&(!/[aeiouy]/.test(x)||/(.)\1\1/.test(x)||/asdf|qwer|zxcv|hjkl/.test(x)));if(rar.length*100/w.length>30)return "sense";
 const g=w.filter(x=>x.length>=4&&/^[a-z]+$/.test(x)),v=obVocab(),k=g.filter(x=>v.has(x.slice(0,5))).length;if(g.length&&(!k||k*100/g.length<OB_CONEGUDES))return "sense";
 if(obCopia(text,o.q)>=OB_COPIA)return "enunciat";
 if(obCopia(text,o.m)>=OB_COPIA||obCopia(text,o.p.join(". "))>=OB_COPIA)return "copia";
 return null}

// ✍️ triple combo (issue #14): obertes bones seguides el mateix dia i al mateix món. Bona = puntua, com a mínim el 60 % de les idees
// i explicada amb frases (obFrases). ×3 +3 ⭐, ×6 +5 ⭐ (i torna a 0), fins a OB_COMBO_MAX al dia. Si no arriba al 60 %, la ratxa torna a 0.
const OB_COMBO_PC=60,OB_COMBO_PREMIS={3:3,6:5},OB_COMBO_MAX=8,OB_PARAULES_IDEA=4;
const OB_CONNECTORS=new Set("es son perque que quan per aixo llavors tambe pero i o te tenen hi ha com amb fa fan si no porque cuando entonces tambien y tiene tienen hay como con hace hacen por para and but because is are".split(" ").map(normT));

 if(pag){e.ocp=(e.ocp||0)+pag;const f=FONT;FONT=["triple"];suma(pag);FONT=f}

 e.oc=oc>=6?0:oc;desa();return pag}

// i es pot recuperar en un altre dispositiu. Sense PIN tot funciona igual, però només en aquest dispositiu.
const SB_RPC=BN_LOG.url.replace("/bn_log","/rpc/");
function rpc(f,body,keep){return fetch(SB_RPC+f,{method:"POST",keepalive:!!keep,headers:{"apikey":BN_LOG.key,"Content-Type":"application/json"},body:JSON.stringify(body)})
 .then(async r=>{const t=await r.text();if(!r.ok){const m=/massa intents/.test(t)?"bloc":/pin incorrecte/.test(t)?"pin":/pin no valid/.test(t)?"pinfmt":/nom no permes/.test(t)?"nom":"xarxa";throw m}const j=t?JSON.parse(t):null;if(j==="pin"||(j&&typeof j==="object"&&j.codi==="pin")||(f==="bn_progres_desa"&&j===-3))throw "pin";if(j==="bloc"||(j&&typeof j==="object"&&j.codi==="bloc"))throw "bloc";return j})}

// però en entrar es demana l'«actualització de seguretat» (pantallaNouPin).
const PIN_NOU=/^\d{4}[A-Z]$/,PIN_VELL=/^\d{4}$/,PIN_EX="4587R";
// neteja el que s'escriu: primer 4 xifres, després 1 lletra, sempre en MAJÚSCULES (encara que el teclat no ho estigui)
function netPin(v){let o="";for(const c of String(v).toUpperCase()){if(o.length<4){if(/\d/.test(c))o+=c}else if(/[A-Z]/.test(c)){o+=c;break}}return o}

 // encara no s'ha baixat el núvol: primer es baixa i es fusiona (si falla, no es puja res). En tancar la pàgina no hi ha temps: no es puja
 if(!NUV_LLEST){if(keep)return Promise.resolve();const n=S.nom;return nuvolBaixa(n,p).then(()=>{if(S.nom!==n)return;NUV_LLEST=true;return nuvolPuja()}).catch(()=>{})}

// FUSIONA dos progressos (dispositiu i núvol) sense perdre mai res: números → el més alt, llistes → la més llarga
// (dies: unió), sí/no → sí si algun és sí, textos → del més recent. Així un dispositiu nou (buit) no esborra el progrés d'un altre.
function fusiona(a,b){const nouA=(a&&a.mod||0)>=(b&&b.mod||0);
 const f=(x,y,k)=>{if(x===undefined||x===null)return y;if(y===undefined||y===null)return x;
  if(k==="est"&&typeof x==="object"&&typeof y==="object"&&x.d!==y.d)return String(x.d||"")>String(y.d||"")?x:y; // comptadors d'un altre dia: es queda el del dia més nou
  if(k==="dies"&&Array.isArray(x)&&Array.isArray(y))return [...new Set([...x,...y])].sort();
  if(k==="vigilia_dies"&&Array.isArray(x)&&Array.isArray(y))return [...new Set([...x,...y].filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))].sort();
  if(k==="vigilia_mod"&&typeof x==="object"&&typeof y==="object"){const o={};new Set([...Object.keys(x),...Object.keys(y)]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).forEach(d=>{const ax=x[d],by=y[d];o[d]=!ax?by:!by?ax:(+ax.ts||0)>=(+by.ts||0)?ax:by});return o}
  if(Array.isArray(x)||Array.isArray(y))return (Array.isArray(x)?x:[]).length>=(Array.isArray(y)?y:[]).length?x:y;
  if(typeof x==="number"&&typeof y==="number")return Math.max(x,y);
  if(typeof x==="boolean"||typeof y==="boolean")return !!(x||y);
  if(typeof x==="object"&&typeof y==="object"){const o={};new Set([...Object.keys(x),...Object.keys(y)]).forEach(kk=>o[kk]=f(x[kk],y[kk],kk));return o}
  return nouA?x:y};
 const r=f(a||{},b||{},"");if(Array.isArray(r.vigilia_dies)){const vm=r.vigilia_mod&&typeof r.vigilia_mod==="object"?r.vigilia_mod:{};r.vigilia_dies=[...new Set(r.vigilia_dies.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&!(vm[d]&&vm[d].on===0)))].sort().slice(0,2)}
 r.nom=(a&&a.nom)||(b&&b.nom)||"";r.mod=Math.max(a&&a.mod||0,b&&b.mod||0);return Object.assign(BUIT(),r)}
// REINICI des de l'admin (supabase/bn_admin_reinicia.sql): el núvol torna «reinici» (ms de l'últim esborrat d'aquest món o de tots).
// Si és més nou que el que coneix aquest dispositiu (S.reinici), PRIMER es buida aquí el progrés d'aquest món (es queden el nom i l'id)
// i només després es fusiona amb el núvol. Si no, fusiona() (que agafa sempre el més alt) faria tornar el progrés esborrat.
function aplicaReinici(r){const ri=+(r&&r.reinici)||0;if(ri<=(+S.reinici||0))return false;
 const n=S.nom,id=S.id;S=BUIT();S.nom=n;if(id)S.id=id;S.reinici=ri;S.mod=Date.now();guarda();return true}
// fusiona el que torna bn_progres_llegeix: reinici → progrés desat al núvol → registre reconstruït
function fusionaNuvol(r){const n=S.nom,reini=aplicaReinici(r);
 if(r&&r.estat)S=fusiona(S,Object.assign({},r.estat,{mod:r.mod}));
 if(r&&r.log)S=fusiona(S,Object.assign({},r.log,{mod:0})); // el registre reconstrueix estrelles, temps, temes i jocs encara que es perdi el dispositiu
 S.nom=n;return reini}
// baixa el progrés del núvol i el fusiona amb el d'aquest dispositiu
function nuvolBaixa(nom,pin){if(MODE_TAST)return Promise.resolve(false);return rpc("bn_progres_llegeix",{p_nom:nom,p_pin:pin,p_assig:ASSIG.id}).then(r=>{
 if(!r)return false;const abans=JSON.stringify([S.punts,S.temes,S.ob,S.jocs,S.temps]);
 const reini=fusionaNuvol(r);if(!reini&&!r.estat&&!r.log)return false;
 S.mod=Date.now();guarda();pintaCap();
 return reini||JSON.stringify([S.punts,S.temes,S.ob,S.jocs,S.temps])!==abans})}

document.addEventListener("keydown",e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const tg=e.target,enCamp=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
 // 1) Elements amb role="button" i tabindex="0" (tiles, xips, targetes, files de taula…)
 if(!enCamp&&(e.key==="Enter"||e.key===" ")&&tg&&tg.getAttribute&&tg.getAttribute("role")==="button"&&tg.tagName!=="BUTTON"){
  e.preventDefault();tg.click();return;
 }
 // 2) Tancar popups / pantalles superposades amb Escape o Enter/Espai a .arc
 if(e.key==="Escape"){
  const pt=document.getElementById("popTastWrap");if(pt){e.preventDefault();tancaConvidaPin();return}
  const pop=document.getElementById("popEst");if(pop){e.preventDefault();tancaEstrelles();const bt=document.getElementById("punts");if(bt)bt.focus();return}
  const arc=document.querySelector(".arc");if(arc){e.preventDefault();arc.click();return}
  const nitAc=document.getElementById("btNitAcabo");if(nitAc){e.preventDefault();nitAc.click();return}
  const desc=document.getElementById("dSalta");if(desc){e.preventDefault();desc.click();return}
 }
 const arc=document.querySelector(".arc");
 if(arc&&(e.key==="Enter"||e.key===" ")){e.preventDefault();arc.click();return}
 if(enCamp||document.querySelector(".descans"))return;
 // 3) Si la pissarra està oberta o hi ha el taller de mates amb el seu propi teclat, no interferir
 const pis=document.getElementById("pisCapa");if(pis&&pis.classList.contains("on"))return;
 if(document.querySelector(".mx-tec"))return;
 // 4) Targetes (flashcards): Espai / ↑ / ↓ gira; ← / → passa targeta
 const fl=document.querySelector("#zona .flash");
 if(fl){
  if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();fl.click();return}
  if(e.key==="ArrowLeft"){const b=document.getElementById("fcAnt");if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(e.key==="ArrowRight"){const b=document.getElementById("fcSeg");if(b&&!b.disabled){e.preventDefault();b.click()}return}
 }
 // 5) Tests, Exàmens i Repàs: 1/2/3 o A/B/C selecciona opció; Enter o → avança; P demana pista
 const k=e.key.toUpperCase();
 const idx={"1":0,"2":1,"3":2,"A":0,"B":1,"C":2}[k];
 if(idx!==undefined){
  const germs=[...document.querySelectorAll(".opt.germ:not(:disabled)")];
  if(germs[idx]){e.preventDefault();germs[idx].click();return}
  const opts=[...document.querySelectorAll(".opt:not(.germ):not(:disabled):not(.fora)")];
  if(opts[idx]){e.preventDefault();opts[idx].click();return}
 }
 if(k==="P"){
  const bp=document.getElementById("pista");if(bp&&bp.offsetParent!==null){e.preventDefault();bp.click();return}
 }
 if(e.key==="Enter"||e.key==="ArrowRight"){
  const sg=document.getElementById("seg")||document.getElementById("exSeg")||document.getElementById("jgSeg");
  if(sg&&!sg.disabled){e.preventDefault();sg.click();return}
 }
 if(e.key==="ArrowLeft"){
  const ant=document.getElementById("exAnt");
  if(ant&&!ant.disabled){e.preventDefault();ant.click();return}
 }
});

(function(){if(!("serviceWorker" in navigator))return;const loc=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);if(loc?/[?&]sw\b/.test(location.search):location.protocol==="https:"){navigator.serviceWorker.register("../../sw.js").catch(()=>{});return}if(loc){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches)caches.keys().then(ks=>ks.filter(k=>k.indexOf("bn-")===0).forEach(k=>caches.delete(k))).catch(()=>{})}})();
pintaCap();pintaSo();
(function(){const usp=new URLSearchParams(location.search),jP=usp.get("joc"),tP=usp.get("tema"),vP=usp.get("vista"),tastP=usp.get("tast")==="1",directe=MODE_DEMO||jP||tP!==null||vP;
 if(!SENSE_NUVOL()){
  try{const mem=JSON.parse(localStorage.getItem("bn_mons_tancats")||"[]");if(Array.isArray(mem)&&mem.includes(ASSIG.id))MON_TANCAT=true}catch(e){}
  const sincronitzaEstatWeb=()=>{
   if(SENSE_NUVOL())return;ULT_ESTAT_WEB=Date.now();
   rpc("bn_estat_web",{}).then(r=>{
    if(!r||typeof r!=="object")return;
    if(r.horari&&typeof r.horari==="object"){HOR_SRV=r.horari;if(!MODE_TAST&&!tastP)try{localStorage.setItem("bn_horari_web",JSON.stringify(r.horari))}catch(e){}}
    if(Array.isArray(r.mons_tancats)){
     if(!MODE_TAST&&!tastP)try{localStorage.setItem("bn_mons_tancats",JSON.stringify(r.mons_tancats))}catch(e){}
     const tancat=r.mons_tancats.includes(ASSIG.id);
     if(tancat&&!MON_TANCAT){MON_TANCAT=true;const mn=document.getElementById("modalNit");if(mn)mn.remove();pintaAvisNit();pantallaMonTancat();return}
     if(!tancat&&MON_TANCAT){MON_TANCAT=false;document.querySelectorAll("#nav button").forEach(b=>b.disabled=false);if(tastP)activaTast(true);vista("inici")}
    }
    aplicaSuau();comprovaAvisNit();
   }).catch(()=>{});
  };
  sincronitzaEstatWeb();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&Date.now()-ULT_ESTAT_WEB>20000)sincronitzaEstatWeb()});
  setInterval(()=>{if(document.visibilityState==="visible")sincronitzaEstatWeb()},120000);
  carregaVigilia();
  if(MON_TANCAT){pantallaMonTancat();return}
 }
 let G="",tastMem=false;try{G=localStorage.getItem("bn_jugador")||""}catch(e){}try{tastMem=sessionStorage.getItem("bn_tast")==="1"}catch(e){}
 if(!directe&&(tastP||(!G&&!S.nom&&tastMem))){activaTast(true);vista("inici");return}
 if(directe&&!S.nom){S=BUIT();S.nom=G||"Demo";pintaCap()}
 if(!directe&&G&&(pinDe(G)||SENSE_NUVOL())&&(!S.nom||S.nom.toLowerCase()!==G.toLowerCase())&&potNouNom(G)){entra(G);return}
 // el nen ja era l'actiu d'aquest món: baixa i fusiona el núvol igualment (un altre aparell pot haver avançat) (n2522)
 if(!directe&&S.nom)sincronitzaEntrada();
 carregaPuntsMons();
 if(S.nom&&jP){joc(jP);return}
 if(S.nom&&tP!==null&&T[+tP]){obre(+tP);return}
 if(S.nom&&vP){vista(vP);return}
 vista("inici")})();
