window.BN_ACT={arrel:"../../"};
// ===== ACTUALITZACIÓ AUTOMÀTICA (motor/eines/actualitza.js · el mateix codi a la portada i als mons; tot.py el copia a index.html) =====
// Cada pàgina porta escrita la versió amb què es va generar (VER: la hi posa motor/tot.py). En obrir la pàgina es pregunta
// al servidor quina versió hi ha publicada (versio.json, sense passar per cap memòria cau). Si no coincideixen, el que es veu
// és una còpia vella (memòria cau del navegador o del service worker). Llavors: s'esborren les còpies guardades de l'app
// (memòria cau «bn-…»), es demana al service worker que s'actualitzi i es torna a carregar la pàgina, UN sol cop per versió.
// MAI s'esborra el progrés, el nom ni el PIN (són a localStorage i no es toquen). Sense connexió, o obrint el fitxer a
// l'ordinador (file://), no fa res.
// En tornar a l'app després de més de 10 minuts amagada: a la portada recarrega sola; dins d'un món, com que el nen pot
// estar a mig test, només surt un avís amb un botó per actualitzar quan vulgui.
(function(){
 const C=window.BN_ACT||{},ARREL=C.arrel||"./",VER="1db8d30217",KR="bn_act_recarrega",DEU=6e5;
 if(location.protocol==="file:"||VER.indexOf("__")===0||!window.fetch)return;
 let fet=0,amagat=0;
 const quan=f=>document.body?f():document.addEventListener("DOMContentLoaded",f);
 // esborra la memòria cau de l'app i fa que el service worker es descarregui de nou (màxim 3 s)
 const neteja=()=>Promise.race([Promise.all([
   window.caches?caches.keys().then(ks=>Promise.all(ks.filter(k=>k.indexOf("bn-")===0).map(k=>caches.delete(k)))).catch(()=>{}):0,
   navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.update().catch(()=>{})))).catch(()=>{}):0]),
  new Promise(r=>setTimeout(r,3000))]);
 function avis(txt,boto){quan(()=>{let a=document.getElementById("bnAct");
  if(!a){a=document.createElement("div");a.id="bnAct";a.setAttribute("role","status");
   a.style.cssText="position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:10px 14px;border-radius:14px;background:#0b1033f2;border:2px solid #facc15;color:#fff;font:800 14px/1.3 Nunito,system-ui,sans-serif;box-shadow:0 8px 24px #0009";
   document.body.appendChild(a)}
  a.innerHTML="";const t=document.createElement("span");t.textContent=txt;a.appendChild(t);
  if(boto){const b=document.createElement("button");b.type="button";b.textContent="Actualitza";
   b.style.cssText="font:900 13px Nunito,system-ui,sans-serif;color:#1e1b4b;background:#facc15;border:0;border-radius:999px;padding:8px 12px;cursor:pointer";
   b.onclick=()=>recarrega(boto,true);a.appendChild(b)}})}
 // l'adreça sense el «v=…» (la resta de paràmetres, com ?demo, es queden tal qual)
 const senseV=q=>q.replace(/([?&])v=[^&]*(&|$)/,(m,a,b)=>b?a:"").replace(/^\?$/,"");
 function recarrega(v,aMa){
  // una sola vegada per versió (si el servidor encara no serveix la nova, no entra en bucle); amb el botó, sempre
  if(!aMa){if(new RegExp("[?&]v="+v+"(&|$)").test(location.search))return;try{if(sessionStorage.getItem(KR)===v)return;sessionStorage.setItem(KR,v)}catch(e){}}
  avis("🔄 Versió nova de Bona Nota! Actualitzant…");
  const q=senseV(location.search);neteja().then(()=>location.replace(location.pathname+q+(q?"&":"?")+"v="+v+location.hash))}
 // un cop és la versió bona, treu el «?v=…» de l'adreça
 function netejaAdreca(){try{const q=senseV(location.search);if(q!==location.search)history.replaceState(history.state,"",location.pathname+q+location.hash)}catch(e){}}
 function comprova(auto){fet=Date.now();
  fetch(ARREL+"versio.json?t="+fet,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(!d||!d.v)return;
   if(d.v===VER){netejaAdreca();return}
   if(auto)recarrega(d.v);else avis("✨ Hi ha una versió nova de Bona Nota.",d.v)}).catch(()=>{})}
 comprova(true);
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){amagat=Date.now();return}
  if(amagat&&Date.now()-amagat>DEU&&Date.now()-fet>DEU)comprova(!!C.tornaAuto)});
 window.bnActualitza=()=>comprova(true); // per provar-ho a mà des de la consola
})();

}
/* ---- botó escolta (llegir en veu alta) ---- */

body.suau .arc.sup .raigs,body.suau .arc.sup .orbita,body.suau .arc.sup .sstar,body.suau .arc.sup .sstar span::after{animation:none!important}

.ex-rel.poc{color:#dc2626;animation:parpEx 1s steps(2) infinite}@keyframes parpEx{50%{opacity:.4}}
.ex-sel{background:var(--fosc)!important;border-color:var(--fosc)!important;color:#fff!important}.ex-sel .ll{background:#fff!important;color:var(--fosc)!important}

.pla-dia{margin-top:14px;background:linear-gradient(135deg,#f8fafc,#eef2ff);border:2px solid #c7d2fe;border-radius:16px;padding:12px 16px}
.pla-dia.vigilia{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-color:#60a5fa}

.avis-bon-us.temps{background:linear-gradient(135deg,#fffbeb,#fef3c7);color:#78350f;border:2px solid #fcd34d}

.avis-global-wrap{max-width:920px;margin:10px auto -8px;padding:0 16px}.avis-global-wrap:empty{display:none;margin:0}
.descans.nit-modal{z-index:86;background:linear-gradient(160deg,#0f172a,#1e1b4b 55%,#312e81);color:#e0e7ff}
.descans.nit-modal p{color:#c7d2fe}.descans.nit-modal .nit-suau{margin:6px 0 18px;font-size:14px;color:#a5b4fc;font-weight:700}
/* ====================== ICONES, MASCOTA I MOVIMENT (v2) ====================== */
.ico{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
nav i{display:inline-flex}nav i .ico{width:19px;height:19px}
nav button,nav a.surt{transition:background .25s,color .25s,transform .15s}
nav button:active{transform:scale(.92)}
nav button.on i{animation:icBota .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes icBota{30%{transform:translateY(-4px) scale(1.18)}}
.passos button{display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .25s,color .25s,transform .15s}
.passos button .ico{width:19px;height:19px}.passos button.on .ico{--icFons:var(--fosc)}
.passos button:active{transform:scale(.95)}
.so-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:28px;border-radius:999px;transition:background .2s,transform .15s}
.so-btn .ico{width:20px;height:20px}.so-btn:active{transform:scale(.88)}
.mus-btn{opacity:.6}.mus-btn.on{opacity:1;background:#ffffff33}
.mus-btn.on .ico{animation:musBalla 1.3s ease-in-out infinite;transform-origin:50% 80%}
@keyframes musBalla{25%{transform:rotate(-10deg) translateY(-1px)}75%{transform:rotate(10deg) translateY(-1px)}}
/* mascota */
.masc{overflow:visible;display:inline-block}
.masc .mc{transform-box:fill-box;transform-origin:50% 100%;animation:mRespira 3.2s ease-in-out infinite}
@keyframes mRespira{50%{transform:translateY(-3px) scaleY(1.015)}}
.masc .mu{transform-box:fill-box;transform-origin:center;animation:mParpella 4.2s infinite}
@keyframes mParpella{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.masc .mbD{transform-box:fill-box;transform-origin:0% 100%}
.m-hola .mbD{animation:mSaluda 1.4s ease-in-out infinite}
@keyframes mSaluda{0%,100%{transform:rotate(0)}25%{transform:rotate(-22deg)}75%{transform:rotate(14deg)}}
.masc .mst{transform-box:fill-box;transform-origin:center;animation:mEstrella 2.6s ease-in-out infinite}
@keyframes mEstrella{50%{transform:rotate(25deg) scale(1.15)}}
.m-feli .mc{animation:mSalta .7s cubic-bezier(.3,0,.6,1) infinite}
.m-feli .mo{transform-box:fill-box;transform-origin:center;animation:mOmbra .7s cubic-bezier(.3,0,.6,1) infinite}
@keyframes mSalta{0%,100%{transform:translateY(0) scale(1.04,.96)}15%{transform:translateY(0) scale(.97,1.03)}50%{transform:translateY(-14px)}}
@keyframes mOmbra{50%{transform:scale(.7);opacity:.08}}
.m-feli .mbE{transform-box:fill-box;transform-origin:100% 100%;animation:mBrac .35s ease-in-out infinite alternate}
.m-feli .mbD{animation:mBrac2 .35s ease-in-out infinite alternate}
@keyframes mBrac{to{transform:rotate(14deg)}}@keyframes mBrac2{to{transform:rotate(-14deg)}}
.m-trist .mc{animation:mTrist 2.4s ease-in-out infinite}
@keyframes mTrist{50%{transform:translateY(2px) rotate(-3deg)}}
.m-trist .ml{animation:mLlagrima 1.8s ease-in infinite}
@keyframes mLlagrima{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(22px);opacity:0}}
.masc-benv{display:flex;justify-content:center;animation:mEntra .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes mEntra{from{transform:translateY(30px) scale(.5);opacity:0}}
.arc .masc-arc{position:relative;margin-bottom:6px;animation:mEntra .6s cubic-bezier(.3,1.6,.5,1) .15s both;filter:drop-shadow(0 6px 18px #0008)}
/* entrada de pantalles: el contingut nou apareix suau i esglaonat */
#app>*,#zona>*{animation:vEntra .34s cubic-bezier(.2,.9,.3,1) both}
#app>*:nth-child(2),#zona>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3),#zona>*:nth-child(3){animation-delay:.08s}
#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(5){animation-delay:.16s}#app>*:nth-child(n+6){animation-delay:.2s}
@keyframes vEntra{from{opacity:0;transform:translateY(10px)}}
.grid>.tile{animation:vEntra .4s cubic-bezier(.2,.9,.3,1) both}
.grid>.tile:nth-child(2){animation-delay:.04s}.grid>.tile:nth-child(3){animation-delay:.08s}.grid>.tile:nth-child(4){animation-delay:.12s}.grid>.tile:nth-child(5){animation-delay:.16s}.grid>.tile:nth-child(n+6){animation-delay:.2s}
.tile .ic{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.tile:hover .ic{transform:scale(1.12) rotate(-8deg)}
.tile:active{transform:scale(.97)}
.continua{transition:transform .2s,box-shadow .2s}.continua:hover{transform:translateY(-2px);box-shadow:0 8px 20px #f59e0b33}
.continua>span:first-child,.nivell .nic{display:inline-block;animation:icFlota 3s ease-in-out infinite}
@keyframes icFlota{50%{transform:translateY(-4px) rotate(4deg)}}
.hero .av{animation:avBota 4s ease-in-out infinite;box-shadow:0 6px 16px #6366f155}
@keyframes avBota{50%{transform:translateY(-4px)}}
.cap-tema .ic{animation:mEntra .5s cubic-bezier(.3,1.6,.5,1) both}
.barra i,.barra-test i{transition:width .6s cubic-bezier(.3,1.2,.5,1)}
.barra i{animation:creix .9s cubic-bezier(.3,1.2,.5,1) both;transform-origin:left}
/* respostes del test */
.opt{transition:border-color .15s,background .15s,transform .12s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.ok{animation:optOk .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes optOk{40%{transform:scale(1.03)}}
.opt.ok .ll{animation:llOk .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes llOk{40%{transform:scale(1.35) rotate(-10deg)}}
.opt.ko{animation:tremola .35s}
.fb{animation:vEntra .3s ease-out both}
.chip{transition:transform .12s,background .15s,border-color .15s,color .15s}
.chip:active{transform:scale(.94)}.chip.ok{animation:optOk .45s cubic-bezier(.3,1.8,.5,1)}
.flash:active .in{transform:scale(.98)}.flash.gir:active .in{transform:rotateY(180deg) scale(.98)}
.punts-fc i{transition:transform .25s,background .25s}
.btn{transition:transform .08s,filter .15s}.btn:hover:not(:disabled){filter:brightness(1.06)}
.kpi{animation:vEntra .4s cubic-bezier(.2,.9,.3,1) both}
.kpis>.kpi:nth-child(2){animation-delay:.05s}.kpis>.kpi:nth-child(3){animation-delay:.1s}.kpis>.kpi:nth-child(4){animation-delay:.15s}.kpis>.kpi:nth-child(n+5){animation-delay:.2s}
/* figures: barres que creixen */
svg .fgB{transform-box:fill-box;transform-origin:50% 100%;animation:fgCreix .7s cubic-bezier(.3,1.3,.5,1) both}
@keyframes fgCreix{from{transform:scaleY(0)}}
svg .fgL{stroke-dasharray:900;stroke-dashoffset:900;animation:fgLinia 1.2s ease-out .4s forwards}
@keyframes fgLinia{to{stroke-dashoffset:0}}
svg .fgP{animation:vEntra .3s ease-out both}

 {id:"conjunt",ic:"📏",col:"#2563eb",titol:"El conjunt dels enters: ordre, valor absolut i oposat",font:"Llibre · secció 2 (pàg. 68-69)",
  idea:"ℤ = negatius + zero + positius. A la recta numèrica, el que està més a la dreta sempre és més gran.",
  pts:["<b>ℤ</b> té tres grups: els naturals (positius), el <b>zero</b> (ni positiu ni negatiu) i els negatius.",
   "Qualsevol positiu és més gran que el zero, i el zero és més gran que qualsevol negatiu.",
   "Entre negatius, és més gran el que té el valor absolut més petit: −1 > −2 > −7 > −15.",
   "<b>Valor absolut</b>: el nombre sense el signe, entre barres. |−7| = 7 i |+4| = 4. És la distància fins al zero.",
   "<b>Oposat</b>: mateix valor absolut i signe contrari. L'oposat de +5 és −5. A la recta, és el seu simètric respecte del zero."],
  truc:"A la recta, la DRETA guanya. I entre negatius: qui deu menys, és més ric (−2 > −9).",
  compte:"−9 és més petit que −2, encara que 9 sigui més gran que 2. I no confonguis el valor absolut (treure el signe) amb l'oposat (canviar el signe).",
  fc:[["El zero és positiu o negatiu?","Ni positiu ni negatiu."],["Quin és més gran, −15 o −7?","−7"],["|−11| = ?","11"],["Oposat de +8?","−8"],["Valor absolut i oposat de −13?","13 i +13."],["Com s'escriu el conjunt dels enters?","Amb la lletra ℤ."]],
  q:[["El zero és…",["positiu","negatiu","ni positiu ni negatiu"],2,"El zero separa els positius dels negatius."],
     ["Quin és més gran, −15 o −7?",["−15","−7","Són iguals"],1,"−7 és més a la dreta a la recta."],
     ["Quant val |−11|?",["−11","11","0"],1,"El valor absolut és el nombre sense signe."],
     ["Quin és l'oposat de +8?",["−8","8","1/8"],0,"Mateix valor absolut i signe contrari."],
     ["Ordena de més petit a més gran: −6, 0, +3, −1, −12.",["−12, −6, −1, 0, +3","−1, −6, −12, 0, +3","0, −1, +3, −6, −12"],0,"De l'esquerra a la dreta de la recta."],
     ["Què és el valor absolut d'un enter?",["La distància que el separa del zero, sense signe","El mateix nombre amb el signe canviat","El nombre més gran de la recta"],0,"|−7| = 7: és a 7 passos del zero."],
     ["Quins dos enters oposats estan separats per 12 unitats a la recta?",["−6 i +6","−12 i +12","0 i 12"],0,"Cadascun és a 6 passos del zero: 6 + 6 = 12."],
     ["Quina frase és certa?",["El zero és més petit que qualsevol negatiu","Qualsevol positiu és més gran que el zero","−2 és més petit que −9"],1,"Positius > 0 > negatius."]]},
 {id:"sumes",ic:"➕",col:"#16a34a",titol:"Sumes i restes d'enters",font:"Llibre · secció 3 (pàg. 70-71)",
  idea:"Signes iguals: sumes i poses el mateix signe. Signes diferents: restes i poses el signe del que té el valor absolut més gran.",
  pts:["<b>Mateix signe</b>: sumes els valors absoluts i copies el signe. 5 + 3 = +8 · −4 − 8 = −12.",
   "<b>Signe diferent</b>: restes els valors absoluts i poses el signe del més gran. −3 + 10 = +7 · +5 − 8 = −3.",
   "A la recta: −7 + 4 = −3 → vas 7 a l'esquerra i en tornes 4 a la dreta.",
   "<b>Pas a pas</b>: 2 − 7 + 6 − 3 → −5 → +1 → −2.",
   "<b>Agrupant per signes</b>: positius 2 + 6 = 8; negatius 7 + 3 = 10 → 8 − 10 = −2.",
   "Pots canviar l'ordre si cada nombre conserva el seu signe: −7 + 4 = +4 − 7 = −3."],
  truc:"Iguals: sumo i copio. Diferents: resto i mana el gran.",
  compte:"−4 − 8 no és −4 ni +4. Els dos són pèrdues, així que s'ajunten: −12.",
  fc:[["−9 + 4 = ?","−5"],["−4 − 8 = ?","−12"],["−3 + 10 = ?","+7"],["+5 − 8 = ?","−3"],["2 − 7 + 6 − 3 = ?","−2"],["Signes diferents: quin signe poso?","El del que té el valor absolut més gran."]],
  q:[["−4 − 8 = ?",["−12","+12","−4"],0,"Signes iguals: sumo i copio el signe."],
     ["−3 + 10 = ?",["−7","+7","+13"],1,"Signes diferents: 10 − 3 = 7, mana el 10 (positiu)."],
     ["+5 − 8 = ?",["+3","−13","−3"],2,"8 − 5 = 3, mana el 8 (negatiu)."],
     ["−9 + 4 = ?",["−5","+5","−13"],0,"9 − 4 = 5, mana el 9 (negatiu)."],
     ["2 − 7 + 6 − 3 = ?",["−2","+2","+18"],0,"Positius 8, negatius 10: 8 − 10 = −2."],
     ["−11 + 8 = ?",["+3","−3","−19"],1,"11 − 8 = 3, mana l'11 (negatiu)."],
     ["Amb signes diferents, quin signe té el resultat?",["El del nombre que té el valor absolut més gran","Sempre negatiu","El del primer nombre"],0,"Resto i mana el gran."],
     ["−6 + 19 − 15 + 23 − 12 = ?",["+9","−9","+75"],0,"Positius: 19 + 23 = 42. Negatius: 6 + 15 + 12 = 33. 42 − 33 = 9."],
     ["A les 7 h fa −4 °C i fins al migdia puja 9 graus. Quina temperatura fa al migdia?",["+5 °C","−13 °C","+13 °C"],0,"−4 + 9 = +5."]]},
 {id:"parentesis",ic:"🧾",col:"#ca8a04",titol:"Sumes i restes amb parèntesis",font:"Llibre · secció 4 (pàg. 72-74)",
  idea:"Mira els dos signes, el de fora i el de dins del parèntesi: si són iguals, queda +; si són diferents, queda −.",
  pts:["Ingresso un taló de 5 € → +(+5) = +5. M'arriba una factura de 5 € → +(−5) = −5.",
   "Entrego un taló de 5 € → −(+5) = −5. <b>Em perdonen una factura</b> de 5 € → −(−5) = +5.",
   "Parèntesi amb un <b>+</b> davant: els signes de dins queden igual. +(5 − 8 + 6) = 5 − 8 + 6.",
   "Parèntesi amb un <b>−</b> davant: <b>tots</b> els signes de dins canvien. −(5 − 8 + 6) = −5 + 8 − 6.",
   "Dues maneres: calcular primer dins del parèntesi, o treure'l i després calcular. Han de donar el mateix: 11 − (5 − 8 − 6 + 3) = 17.",
   "Amb <b>corxeres</b> [ ], comences pels parèntesis de dins i vas cap a fora: 15 − [12 − (6 − 11) + (3 − 9)] = 4."],
  truc:"Signes iguals → +. Signes diferents → −. Que et perdonin un deute és bo, per això −(−5) = +5.",
  compte:"A −(5 − 8 + 6) el menys canvia tots els signes de dins, no només el del primer nombre.",
  fc:[["−(−5) = ?","+5"],["+(−5) = ?","−5"],["−(+5) = ?","−5"],["Treu el parèntesi: −(5 − 8 + 6)","−5 + 8 − 6"],["12 − (−3 + 10) = ?","5"],["Amb corxeres, per on comences?","Pels parèntesis de dins."]],
  q:[["Quant val −(−7)?",["−7","+7","0"],1,"Signes iguals → +. És com si et perdonessin una factura."],
     ["Quant val +(−5)?",["+5","−5","0"],1,"Signes diferents → −. M'arriba una factura."],
     ["Treu el parèntesi: −(5 − 8 + 6).",["−5 + 8 − 6","−5 − 8 + 6","5 + 8 − 6"],0,"El menys de davant canvia tots els signes."],
     ["12 − (−3 + 10) = ?",["5","19","−1"],0,"Dins: −3 + 10 = 7 → 12 − 7 = 5."],
     ["−(7 + 4) + 14 = ?",["3","−25","25"],0,"−11 + 14 = 3."],
     ["11 − (5 − 8 − 6 + 3) = ?",["17","5","−17"],0,"Dins dona −6 → 11 − (−6) = 11 + 6 = 17."],
     ["Quina història explica que −(−5) = +5?",["Em perdonen una factura de 5 €","M'arriba una factura de 5 €","Entrego un taló de 5 €"],0,"Que et treguin un deute és bo: guanyes."],
     ["15 − [12 − (6 − 11) + (3 − 9)] = ?",["4","26","−4"],0,"Parèntesis: −5 i −6 → 15 − [12 + 5 − 6] = 15 − 11 = 4."],
     ["Si el parèntesi té un + davant, què passa amb els signes de dins?",["Queden igual","Canvien tots","Només canvia el primer"],0,"+(5 − 8 + 6) = 5 − 8 + 6."]]},
 {id:"multdiv",ic:"✖️",col:"#7c3aed",titol:"Multiplicació i divisió d'enters",font:"Llibre · secció 5 (pàg. 75-76)",
  idea:"Regla dels signes: si els dos nombres tenen el mateix signe, el resultat és positiu; si tenen signe diferent, és negatiu. Per dividir, igual.",
  pts:["(+) · (+) = + → (+3) · (+7) = +21 · (−) · (−) = + → (−4) · (−5) = +20.",
   "(+) · (−) = − → (+4) · (−5) = −20 · (−) · (+) = − → (−3) · (+7) = −21.",
   "Per <b>dividir</b>, la mateixa regla: (+20) : (−4) = −5 · (−20) : (−5) = +4.",
   "(−4) · (−5) = +20 perquè és com si t'<b>anul·lessin</b> quatre factures de 5 €: guanyes 20 €.",
   "Amb tres factors, de dos en dos: (−6) · (+5) · (−7) = (−30) · (−7) = +210.",
   "La multiplicació és <b>associativa</b> (pots agrupar com vulguis); la divisió no. I una divisió d'enters no sempre dona un enter: (+21) : (−4)."],
  truc:"Signes IGUALS → MÉS. Signes DIFERENTS → MENYS. Amb molts factors, compta els menys: parell → +, senar → −.",
  compte:"La regla dels signes és per multiplicar i dividir, no per sumar. −3 − 5 = −8 (dues pèrdues), no +8.",
  fc:[["(−7) · (+3) = ?","−21"],["(−36) : (−9) = ?","+4"],["(−4) · (−5) = ?","+20"],["(+20) : (−4) = ?","−5"],["(−2) · (−3) · (−5) = ?","−30 (tres menys: senar)"],["Per què (−4) · (−5) és positiu?","Com si t'anul·lessin 4 factures de 5 €: guanyes 20 €."]],
  q:[["(−7) · (+3) = ?",["+21","−21","−10"],1,"Signes diferents → negatiu."],
     ["(−36) : (−9) = ?",["−4","+4","+27"],1,"Signes iguals → positiu."],
     ["(+20) : (−4) = ?",["+5","−5","−16"],1,"Signes diferents → negatiu."],
     ["(−4) · (−5) = ?",["+20","−20","−9"],0,"Menys per menys, més."],
     ["(−6) · (+5) · (−7) = ?",["+210","−210","−8"],0,"(−30) · (−7) = +210: dos menys, parell → +."],
     ["(−2) · (−3) · (−5) = ?",["+30","−30","−10"],1,"Tres signes menys: senar → negatiu."],
     ["Quina propietat té la multiplicació i NO la divisió?",["És associativa: pots agrupar els factors com vulguis","Sempre dona un resultat negatiu","Només funciona amb positius"],0,"(+24) : [(−6) : (−2)] = +8, però [(+24) : (−6)] : (−2) = +2."],
     ["Quina té la regla dels signes?",["La multiplicació i la divisió","La suma i la resta","Totes quatre operacions"],0,"Per sumar i restar no: −3 − 5 = −8."],
     ["(+3) · (−5) · (+2) = ?",["−30","+30","0"],0,"Un sol signe menys: senar → negatiu. 3 · 5 · 2 = 30."]]},
 {id:"combinades",ic:"🪜",col:"#db2777",titol:"Operacions combinades",font:"Llibre · secció 6 (pàg. 77)",
  idea:"Primer els parèntesis, després les multiplicacions i divisions, i al final les sumes i restes.",
  pts:["<b>1r</b> parèntesis (els de dins primer) · <b>2n</b> multiplicacions i divisions · <b>3r</b> sumes i restes.",
   "Exemple del llibre: 20 − (9 − 12) · (+4) → 20 − (−3) · (+4) → 20 − (−12) → 20 + 12 = <b>32</b>.",
   "Un altre: (−20) : (10 − 6) − (−3) · (−3) → (−20) : 4 − (+9) → −5 − 9 = <b>−14</b>.",
   "La divisió i la multiplicació es fan totes dues abans de la resta.",
   "✚ Això el llibre no ho diu: diverses multiplicacions i divisions seguides es fan d'esquerra a dreta, i les potències van just després dels parèntesis."],
  truc:"PA · MU · SU: PArèntesis, MUltiplicacions (i divisions), SUmes (i restes).",
  compte:"A 20 − (−3) · (+4) no pots fer primer 20 − (−3) = 23. La multiplicació va abans: (−3) · (+4) = −12, i llavors 20 − (−12) = 32.",
  fc:[["Què vol dir PA · MU · SU?","PArèntesis, MUltiplicacions i divisions, SUmes i restes."],["20 − (9 − 12) · (+4) = ?","32"],["5 · (−4) + 2 · (−3) = ?","−26"],["(−15) : (5 − 8) + 4 = ?","9"],["(−20) : (10 − 6) − (−3) · (−3) = ?","−14"],["Què va abans, la resta o la divisió?","La divisió."]],
  q:[["20 − (9 − 12) · (+4) = ?",["92","8","32"],2,"9 − 12 = −3 → (−3) · (+4) = −12 → 20 + 12 = 32."],
     ["Què es fa primer en una operació combinada?",["Els parèntesis","Les sumes","Les multiplicacions"],0,"PA · MU · SU."],
     ["5 · (−4) + 2 · (−3) = ?",["−26","+26","−14"],0,"−20 + (−6) = −26."],
     ["(−15) : (5 − 8) + 4 = ?",["9","1","−1"],0,"5 − 8 = −3 → (−15) : (−3) = +5 → 5 + 4 = 9."],
     ["(−20) : (10 − 6) − (−3) · (−3) = ?",["−14","+4","−5"],0,"(−20) : 4 = −5 i (−3) · (−3) = +9 → −5 − 9 = −14."],
     ["A 20 − (−3) · (+4), quin és el primer pas?",["(−3) · (+4) = −12","20 − (−3) = 23","20 · 4 = 80"],0,"La multiplicació va abans que la resta."],
     ["6 − 4 · (−3) = ?",["−6","18","+6"],1,"4 · (−3) = −12 → 6 − (−12) = 6 + 12 = 18."],
     ["L'Arnau té 25 €, paga 3 entrades de 7 € i després li donen 10 €. Quina expressió ho diu?",["(25 − 3) · 7 + 10","25 − 3 · 7 + 10","25 − 3 − 7 + 10"],1,"25 − 21 + 10 = 14 €."],
     ["(−18) : (−3) + (−2) · (+5) = ?",["−4","+16","+4"],0,"(−18) : (−3) = +6 i (−2) · (+5) = −10 → 6 − 10 = −4."]]},
 {id:"potencies",ic:"⚡",col:"#ea580c",titol:"Potències i arrels d'enters",font:"Llibre · secció 7 (pàg. 78-79)",
  idea:"Base negativa: exponent parell → positiu; exponent senar → negatiu. Un positiu té dues arrels quadrades (+ i −); un negatiu, cap.",
  pts:["Una potència és una multiplicació abreujada: (−2)<sup>3</sup> = (−2) · (−2) · (−2). La a és la <b>base</b> i la n, l'<b>exponent</b>.",
   "Base positiva → sempre positiu: (+5)<sup>3</sup> = +125. Base negativa: (−2)<sup>4</sup> = +16, però (−2)<sup>5</sup> = −32.",
   "<b>El parèntesi mana</b>: (−3)<sup>2</sup> = +9, però −3<sup>2</sup> = −(3 · 3) = −9.",
   "Propietats: a<sup>m</sup> · a<sup>n</sup> = a<sup>m+n</sup> · a<sup>m</sup> : a<sup>n</sup> = a<sup>m−n</sup> · (a · b)<sup>n</sup> = a<sup>n</sup> · b<sup>n</sup>. Ex.: (−5)<sup>7</sup> : (−5)<sup>4</sup> = (−5)<sup>3</sup> = −125.",
   "√+16 → (+4)<sup>2</sup> = 16 i (−4)<sup>2</sup> = 16: dues arrels. Per conveni, √+16 = +4 i −√+16 = −4.",
   "√−16 <b>no existeix</b>: el quadrat d'un nombre mai és negatiu. √20 no és entera, però 4 &lt; √20 &lt; 5.",
   "⚠ A la pàg. 79 (ajuda de l'F25) el llibre diu «+4 &lt; √20 + 5»: sembla una errada d'impremta per «+4 &lt; √20 &lt; +5». Pregunta-ho al profe."],
  truc:"Menys parell, positiu; menys senar, negatiu. I: sense parèntesi, el menys no s'eleva.",
  compte:"−3² = −9 però (−3)² = +9. I l'arrel d'una suma no és la suma de les arrels: √(36 + 64) = 10, però √36 + √64 = 14.",
  fc:[["(−2)³ = ?","−8"],["(−3)² i −3²?","+9 i −9"],["(−1)¹⁰ = ?","+1"],["√+81 = ?","+9"],["√−25 = ?","No existeix."],["Entre quins enters és √45?","Entre 6 i 7."]],
  q:[["(−2)³ = ?",["+8","−8","−6"],1,"Base negativa i exponent senar → negatiu."],
     ["(−3)² = ?",["−9","+6","+9"],2,"(−3) · (−3) = +9."],
     ["−3² = ?",["−9","+9","−6"],0,"Sense parèntesi, el menys no s'eleva: −(3 · 3)."],
     ["(−2)⁴ = ?",["−16","+16","−8"],1,"Exponent parell → positiu."],
     ["Quant val √−16?",["−4","+4","No existeix"],2,"El quadrat d'un nombre mai és negatiu."],
     ["Quantes arrels quadrades té +16?",["Dues: +4 i −4","Una: +4","Cap"],0,"(+4)² = 16 i (−4)² = 16."],
     ["(−5)⁷ : (−5)⁴ = ?",["(−5)³ = −125","(−5)¹¹","(+5)³ = +125"],0,"Mateixa base: es resten els exponents. Exponent senar → negatiu."],
     ["Entre quins dos enters positius consecutius és √45?",["Entre 6 i 7","Entre 4 i 5","Entre 22 i 23"],0,"6² = 36 i 7² = 49."],
     ["(−1)¹⁰ = ?",["+1","−1","−10"],0,"Exponent parell → positiu."]]}
];

 {t:"Ordre, valor absolut i oposat",q:"Explica la diferència entre el valor absolut i l'oposat d'un nombre enter. Posa un exemple de cadascun.",

 {t:"Sumes i restes",q:"Calcula 2 − 7 + 6 − 3 de les dues maneres del llibre (pas a pas i agrupant per signes) i comprova que donen el mateix.",

 {t:"Sumes i restes",q:"A les 7 h el termòmetre marca −4 °C. Fins al migdia puja 9 graus i a la nit baixa 7 graus. Quina temperatura fa al migdia i a la nit? Escriu una sola expressió per a tot el dia.",

 {t:"Parèntesis",q:"Explica amb talons i factures per què −(−5) = +5 i per què −(+5) = −5.",

 {t:"Parèntesis",q:"Calcula 11 − (5 − 8 − 6 + 3) de dues maneres: primer calculant dins del parèntesi i després treient-lo.",

 {t:"Regla dels signes",q:"Explica la regla dels signes per multiplicar i per dividir. Posa un exemple de multiplicació per a cada cas i explica amb factures per què (−4) · (−5) dona positiu.",

// Motor d'àudio v2: tot es sintetitza en directe (no hi ha fitxers de so).
// Cadena: veus → bus d'efectes (SB) o de música (MB) → volum general (MG) → compressor → altaveus.
// Una part de cada bus passa per una reverberació suau (sala petita) i un eco curt, perquè soni més ple i menys "pitet".
// volum dels sons 0-5 (0 = silenci)
// ===== SO ALS MÒBILS (motor/eines/so-mobil.js · el mateix codi als mons i a la portada; tot.py el copia a index.html) =====
// Els navegadors només deixen engegar el so dins d'un gest de l'usuari, i en pantalles tàctils «pointerdown» NO compta:
// només pointerup, touchend, click i keydown. Per això hi ha UN sol AudioContext per pàgina (bnSo.context()) i es
// desbloqueja al primer d'aquests gestos: resume() + un buffer buit d'1 mostra (el truc d'iOS). Si el mòbil el posa en
// pausa («suspended» o «interrupted»: una trucada, canviar d'app…), es torna a engegar en tornar a la pàgina o al toc següent.
// IPHONE EN SILENCI (n2429, comprovat amb prova-so.html en un iPhone): amb el mòbil en silenci, Web Audio calla del tot encara
// que el context estigui «running», i navigator.audioSession no hi fa res. Un element <audio> sí que sona, i mentre n'hi ha un
// sonant, Web Audio també. Per això, a l'iPhone/iPad, al primer toc s'engega un <audio> de silenci en bucle (fet aquí mateix,
// sense fitxers) i s'atura quan la pàgina no es veu o quan el so de l'app està apagat (bnSo.sessio(false)).
const bnSo=(()=>{let ctx=null,armat=false,tocat=false,volOn=true,mut=null;const pendents=[],EV=["pointerup","touchend","click","keydown"],OP={capture:true,passive:true};
 const IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
 const resum=c=>{try{const p=c.resume();if(p&&p.catch)p.catch(()=>{})}catch(e){}};
 function context(){if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ctx=new C()}catch(e){return null}
   try{ctx.addEventListener("statechange",()=>{if(ctx.state!=="running"&&ctx.state!=="closed")arma()})}catch(e){}}
  return ctx}
 // mig segon de silenci en WAV (8 kHz, mono): l'<audio> que fa que l'iPhone deixi sonar Web Audio en mode silenci
 function silenci(){const sr=8000,n=sr/2,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
  return URL.createObjectURL(new Blob([b],{type:"audio/wav"}))}
 const calMut=()=>IOS&&volOn&&document.visibilityState==="visible";
 function engegaMut(){if(!calMut())return;try{
   if(!mut){mut=new Audio(silenci());mut.loop=true;mut.preload="auto";mut.setAttribute("playsinline","");mut.setAttribute("x-webkit-airplay","deny");mut.disableRemotePlayback=true}
   if(mut.paused){const p=mut.play();if(p&&p.catch)p.catch(()=>arma())}}catch(e){}}
 function aturaMut(){try{if(mut&&!mut.paused)mut.pause()}catch(e){}}
 function gest(){const c=context();
  if(c){if(c.state!=="running")resum(c);try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0)}catch(e){}}
  engegaMut();
  if(!tocat){tocat=true;pendents.splice(0).forEach(f=>{try{f()}catch(e){}})}
  const mutOk=!calMut()||(mut&&!mut.paused);
  if((!c||c.state==="running")&&mutOk)desarma();else if(c&&c.state!=="running"){try{c.resume().then(()=>{if(c.state==="running"&&(!calMut()||(mut&&!mut.paused)))desarma()},()=>{})}catch(e){}}}
 function arma(){if(armat)return;armat=true;EV.forEach(t=>addEventListener(t,gest,OP))}
 function desarma(){if(!armat)return;armat=false;EV.forEach(t=>removeEventListener(t,gest,OP))}
 function torna(){if(ctx&&ctx.state!=="running"&&ctx.state!=="closed"){resum(ctx);arma()}if(tocat&&calMut()){engegaMut();if(mut&&mut.paused)arma()}}
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")torna();else aturaMut()});
 addEventListener("pageshow",torna);
 addEventListener("pagehide",aturaMut);
 arma();
 return {
  context, // el context compartit de la pàgina (el crea si encara no hi és)
  quanSigui(f){if(tocat)f();else pendents.push(f)}, // f s'executa dins del primer gest (o ara mateix, si ja n'hi ha hagut un)
  // so de l'app engegat o apagat: a l'iPhone, engegat = que soni encara que el mòbil estigui en silenci; apagat = res de fons
  sessio(on){volOn=!!on;try{if(navigator.audioSession)navigator.audioSession.type=on?"playback":"auto"}catch(e){}
   if(!on)aturaMut();else if(tocat){engegaMut();if(IOS&&mut&&mut.paused)arma()}}
 }})();

let AC=null,MG=null,SB=null,BG=null,MB=null,REV=null,ECO=null,VOL=3,VOLant=3;
try{const v=localStorage.getItem("bn_vol");if(v!==null)VOL=Math.max(0,Math.min(5,+v||0));else if(localStorage.getItem("bn_so")==="0")VOL=0}catch(e){}
bnSo.sessio(VOL>0); // a l'iPhone, que soni encara que el mòbil estigui en silenci (si el so de l'app està engegat)
const GVOL=[0,.12,.27,.45,.7,1];
function impuls(seg,caiguda){const n=AC.sampleRate*seg|0,b=AC.createBuffer(2,n,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,caiguda)}return b}
let SOROLL=null;function soroll(){if(!SOROLL){const n=AC.sampleRate|0;SOROLL=AC.createBuffer(1,n,AC.sampleRate);const d=SOROLL.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}return SOROLL}
function guany(v){const g=AC.createGain();g.gain.value=v;return g}
function audio(){if(!AC){AC=bnSo.context();if(!AC)throw new Error("sense Web Audio"); // context compartit, desbloquejat al primer toc (so-mobil.js)
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-16;comp.knee.value=12;comp.ratio.value=4;comp.attack.value=.004;comp.release.value=.22;
  MG=guany(GVOL[VOL]);MG.connect(comp).connect(AC.destination);
  REV=AC.createConvolver();REV.buffer=impuls(1.8,3);REV.connect(guany(.9)).connect(MG);
  ECO=AC.createDelay(1);ECO.delayTime.value=.21;const fb=guany(.3),lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;ECO.connect(lp).connect(fb).connect(ECO);lp.connect(guany(.5)).connect(MG);
  SB=guany(1);SB.connect(MG);SB.connect(guany(.22)).connect(REV);SB.connect(guany(.12)).connect(ECO);
  BG=guany(1);BG.connect(guany(.92)).connect(MG);BG.connect(guany(.26)).connect(REV);BG.connect(guany(.1)).connect(ECO);
  MB=guany(0);MB.connect(MG);MB.connect(guany(.35)).connect(REV);MB.connect(guany(.2)).connect(ECO);}
 if(AC.state!=="running"&&AC.state!=="closed")try{AC.resume().catch(()=>{})}catch(e){}return AC}
function pintaSo(){const b=document.getElementById("so"),r=document.getElementById("volum"),n=document.getElementById("volN"),m=document.getElementById("soMenu");if(b)b.innerHTML=icSo(VOL);if(r)r.value=VOL;if(n)n.textContent=VOL;
 if(m){m.innerHTML=icSo(VOL)+(typeof MUS!=="undefined"&&MUS&&VOL?`<span class="so-mus" aria-hidden="true">♪</span>`:"");m.title=VOL?`So: volum ${VOL} de 5${typeof MUS!=="undefined"&&MUS?" · música engegada":""} (toca per canviar-ho)`:"So apagat (toca per canviar-ho)"}pintaMus()}
// panell del so: s'obre amb el botó 🔊 i es tanca tocant fora o amb Escape
function obreSo(e){if(e)e.stopPropagation();const p=document.getElementById("soPan"),b=document.getElementById("soMenu");if(!p)return;const obre=p.hidden;p.hidden=!obre;if(b)b.setAttribute("aria-expanded",obre);if(obre){const r=document.getElementById("volum");if(r)r.focus({preventScroll:true})}}
function tancaSo(){const p=document.getElementById("soPan"),b=document.getElementById("soMenu");if(p&&!p.hidden){p.hidden=true;if(b)b.setAttribute("aria-expanded","false")}}
addEventListener("click",e=>{const v=document.querySelector("header .vol");if(v&&!v.contains(e.target))tancaSo()});
addEventListener("keydown",e=>{if(e.key==="Escape"){const p=document.getElementById("soPan");if(p&&!p.hidden){tancaSo();const b=document.getElementById("soMenu");if(b)b.focus()}}});
// en baixar la pàgina, la capçalera s'encongeix (ordinador; al mòbil el CSS no ho aplica)
addEventListener("scroll",()=>{const h=document.querySelector("header");if(h)h.classList.toggle("petit",(window.scrollY||0)>60)},{passive:true});
function posaVol(v){VOL=v;if(v)VOLant=v;try{localStorage.setItem("bn_vol",v)}catch(e){}bnSo.sessio(v>0);if(MG)MG.gain.setTargetAtTime(GVOL[v],AC.currentTime,.05);pintaSo();if(v){audio();so("clic")}}
function canviaSo(){posaVol(VOL?0:(VOLant||3))}
// una veu: oscil·lador amb envolupant (caiguda exponencial o ADSR amb sus/rel), filtre opcional, lliscament de to i vibrato
function veu(f,t0,d,o={}){const{tipus="triangle",vol=.12,atac=.006,dest=SB,filtre=0,filtreIni=0,q=1,cap=0,vib=0,det=0,sus=0,rel=.22}=o;
 const t=AC.currentTime+t0,os=AC.createOscillator(),g=AC.createGain();os.type=tipus;os.frequency.setValueAtTime(f,t);if(det)os.detune.value=det;
 if(cap)os.frequency.exponentialRampToValueAtTime(Math.max(20,cap),t+d);
 if(vib){const l=AC.createOscillator(),lg=guany(vib);l.frequency.value=5.2;l.connect(lg).connect(os.frequency);l.start(t+Math.min(.22,d/2.5));l.stop(t+d+rel+.1)}
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+atac);
 if(sus>0){const tS=Math.min(t+d,t+atac+Math.min(.09,d*.35));g.gain.linearRampToValueAtTime(vol*sus,tS);g.gain.setValueAtTime(vol*sus,Math.max(tS,t+d));g.gain.exponentialRampToValueAtTime(.0001,t+d+rel)}
 else g.gain.setTargetAtTime(0,t+atac,d/4.5);
 let sortida=g;if(filtre){const fl=AC.createBiquadFilter();fl.type="lowpass";fl.Q.value=q;fl.frequency.setValueAtTime(filtreIni||filtre*3,t);fl.frequency.exponentialRampToValueAtTime(filtre,t+Math.min(.25,d));g.connect(fl);sortida=fl}
 os.connect(g);sortida.connect(dest);os.start(t);os.stop(t+d+(sus>0?rel+.08:.3))}
// compatibilitat amb el codi antic (nota = una veu simple)
function nota(f,t0,d,tipus="square",vol=.12,dest){veu(f,t0,d,{tipus,vol:vol*.8,dest:dest||SB,filtre:tipus==="square"||tipus==="sawtooth"?3200:0})}
// timbres
const pluck=(f,t0,d,v=.1,dest)=>{veu(f,t0,d,{tipus:"triangle",vol:v,dest});veu(f,t0,d*.6,{tipus:"square",vol:v*.35,filtre:2400,dest,det:6})};
const campana=(f,t0,d,v=.08,dest)=>{veu(f,t0,d,{tipus:"sine",vol:v,dest});veu(f*2,t0,d*.45,{tipus:"sine",vol:v*.35,dest});veu(f*3.01,t0,d*.2,{tipus:"sine",vol:v*.12,dest})};
const metall=(f,t0,d,v=.07,dest)=>{veu(f,t0,d,{tipus:"sawtooth",vol:v,filtre:1800,q:2,dest,vib:d>.4?f*.012:0});veu(f,t0,d,{tipus:"square",vol:v*.5,filtre:1400,det:-8,dest})};
// timbres cinematogràfics v3 (ADSR amb sustain, cos càlid i percussió orquestral per a celebracions del Boss)
const metallPro=(f,t0,d,v=.065,dest=BG)=>{const r=Math.min(.26,Math.max(.1,d*.35));veu(f,t0,d,{tipus:"sawtooth",vol:v,atac:.018,sus:.72,rel:r,filtre:1750,filtreIni:2650,q:1.3,det:-7,vib:d>.35?f*.009:0,dest});veu(f,t0,d,{tipus:"sawtooth",vol:v*.85,atac:.02,sus:.7,rel:r,filtre:1650,filtreIni:2450,q:1.2,det:7,dest});veu(f/2,t0,d,{tipus:"triangle",vol:v*.48,atac:.015,sus:.78,rel:r,dest})};
const corda=(f,t0,d,v=.055,dest=BG)=>{const r=Math.min(.42,Math.max(.18,d*.35));veu(f,t0,d,{tipus:"sawtooth",vol:v*.55,atac:.055,sus:.78,rel:r,filtre:1600,filtreIni:1950,q:.8,det:-10,dest});veu(f,t0,d,{tipus:"sawtooth",vol:v*.55,atac:.06,sus:.78,rel:r,filtre:1600,filtreIni:1950,q:.8,det:10,dest});veu(f,t0,d,{tipus:"triangle",vol:v*.6,atac:.045,sus:.82,rel:r,dest})};
const timbala=(f,t0,v=.16,dest=BG)=>{veu(f*1.38,t0,.26,{tipus:"sine",vol:v,atac:.004,cap:f,dest});veu(f,t0,.12,{tipus:"triangle",vol:v*.38,atac:.003,filtre:520,dest});sorollet(t0,.055,{vol:v*.22,tipus:"bandpass",f0:380,f1:190,q:1.4,dest})};
const plat=(t0,d=1.2,v=.055,dest=BG)=>{sorollet(t0,d,{vol:v,tipus:"highpass",f0:5400,f1:7800,q:.7,dest});sorollet(t0,d*.75,{vol:v*.45,tipus:"bandpass",f0:8200,f1:6200,q:2.2,dest})};
const brillant=(f,t0,d,v=.05,dest=BG)=>{veu(f,t0,d,{tipus:"sine",vol:v,atac:.005,dest});veu(f*2,t0,d*.55,{tipus:"sine",vol:v*.34,atac:.005,dest});veu(f*4,t0,d*.22,{tipus:"sine",vol:v*.09,atac:.005,dest})};
function sorollet(t0,d,o={}){const{vol=.08,tipus="bandpass",f0=800,f1=3000,q=1.2,dest=SB}=o;const t=AC.currentTime+t0,s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();
 s.buffer=soroll();if(d>.95)s.loop=true;fl.type=tipus;fl.Q.value=q;fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+d);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0005,t+d);s.connect(fl).connect(g).connect(dest);s.start(t);s.stop(t+d+.05)}
const cop=(t0,v=.18,dest)=>{veu(150,t0,.22,{tipus:"sine",vol:v,cap:45,dest})};

// ---- MÚSICA DE FONS (opcional, apagada per defecte) ----
// Música tranquil·la per estudiar, generada en directe: acords suaus, baix, arpegi de campanetes i un ritme molt fluix.
// Cada món té la seva tonalitat i el seu tempo (surten de l'id). S'abaixa sola quan parla la veu (🔊 Escolta) o surt una pantalla arcade.
let MUS=false,MUSt=null,MUSpas=0,MUSseg=0,MUSduck=1;
try{MUS=localStorage.getItem("bn_musica")==="1"}catch(e){}
const MUSPROG=[[0,4,7,11],[9,12,16,19],[5,9,12,16],[7,11,14,17],[0,4,7,14],[9,12,16,21],[2,5,9,12],[7,11,14,19]]; // I · vi · IV · V · I · vi · ii · V
const musHash=s=>[...String(s)].reduce((a,c)=>(a*31+c.charCodeAt(0))>>>0,7);
const MUSCFG=(()=>{const h=musHash(typeof ASSIG!=="undefined"?ASSIG.id:"bn");return{arrel:[60,62,65,57,58,63][h%6],tempo:84+h%5*4}})();
const mf=n=>440*Math.pow(2,(n-69)/12);
function musPas(t){// un pas = una corxera
 const p=MUSpas,compas=(p>>3)%8,b=p%8,ac=MUSPROG[compas],r=MUSCFG.arrel,dur=60/MUSCFG.tempo/2,o=t-AC.currentTime;
 if(b===0)ac.forEach((n,i)=>veu(mf(r+n-12),o,dur*8.2,{tipus:i%2?"sine":"triangle",vol:.028,atac:.25,dest:MB}));
 if(b===0||b===3||b===6)veu(mf(r+ac[0]-24),o,dur*(b===6?2:3),{tipus:"triangle",vol:b===0?.09:.06,atac:.01,filtre:500,dest:MB});
 const pat=[0,2,1,3,2,1,3,2],seed=(musHash(compas*13+b+(p>>6))%10);
 if(seed<7)campana(mf(r+ac[pat[b]]+12),o,dur*3,b%2?.018:.026,MB);
 if(b%2===1)sorollet(o,.05,{vol:.012,tipus:"highpass",f0:7000,f1:9000,dest:MB});
 if(b===0||b===4)veu(110,o,.16,{tipus:"sine",vol:.05,cap:42,dest:MB});
 MUSpas++}
function musBucle(){if(!AC||document.hidden)return;const dur=60/MUSCFG.tempo/2;if(MUSseg<AC.currentTime)MUSseg=AC.currentTime+.08;while(MUSseg<AC.currentTime+.25){musPas(MUSseg);MUSseg+=dur}}
function musVol(){if(MB)MB.gain.setTargetAtTime(MUS&&!document.hidden?.5*MUSduck:0,AC.currentTime,.4)}
function musEngega(){if(!MUS)return;audio();if(!MUSt){MUSseg=0;MUSt=setInterval(musBucle,60);musBucle()}musVol()}
function musAtura(){if(MUSt){clearInterval(MUSt);MUSt=null}if(MB)musVol()}
function canviaMusica(){MUS=!MUS;try{localStorage.setItem("bn_musica",MUS?"1":"0")}catch(e){}if(MUS){musEngega();if(!VOL)posaVol(VOLant||3)}else musAtura();pintaMus()}
function pintaMus(){const m=document.getElementById("soMenu");if(m&&!m.querySelector(".so-mus")!==!(MUS&&VOL)&&typeof icSo==="function")m.innerHTML=icSo(VOL)+(MUS&&VOL?`<span class="so-mus" aria-hidden="true">♪</span>`:"");const b=document.getElementById("mus");if(b){b.innerHTML=ICO.musica;b.classList.toggle("on",MUS);b.title=MUS?"Música de fons: engegada (toca per apagar-la)":"Música de fons: apagada (toca per engegar-la)";b.setAttribute("aria-pressed",MUS)}}
function abaixaMus(on){MUSduck=on?.25:1;if(AC)musVol()}
let MUSarc=null;function abaixaMusUnMoment(seg){abaixaMus(true);clearTimeout(MUSarc);MUSarc=setTimeout(()=>abaixaMus(!!PARLANT),seg*1000)}
document.addEventListener("visibilitychange",()=>{if(!AC)return;if(document.hidden)musVol();else if(MUS)musVol()});

function focs(cv){const c=cv.getContext("2d");let W,H;const mida=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};mida();
 const P=[],cols=["#facc15","#f472b6","#38bdf8","#4ade80","#fb923c","#a78bfa","#fff"];
 const esclat=(x,y)=>{const col=cols[Math.random()*cols.length|0];for(let i=0;i<46;i++){const a=Math.PI*2*i/46,v=2+Math.random()*4.5;P.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,v:1,col,m:3+Math.random()*3})}};
 let fr=0,viu=true;const pas=()=>{if(!viu)return;fr++;c.fillStyle="#02061733";c.fillRect(0,0,W,H);
  if(fr%18===1&&fr<200)esclat(W*(.15+Math.random()*.7),H*(.15+Math.random()*.45));
  for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.985;p.v-=.012;if(p.v<=0){P.splice(i,1);continue}c.globalAlpha=p.v;c.fillStyle=p.col;c.fillRect(p.x|0,p.y|0,p.m,p.m)}
  c.globalAlpha=1;requestAnimationFrame(pas)};pas();return()=>{viu=false}}

// FUSIONA dos progressos (dispositiu i núvol) sense perdre mai res: números → el més alt, llistes → la més llarga
// (dies: unió), sí/no → sí si algun és sí, textos → del més recent. Així un dispositiu nou (buit) no esborra el progrés d'un altre.
function fusiona(a,b){const nouA=(a&&a.mod||0)>=(b&&b.mod||0);
 const f=(x,y,k)=>{if(x===undefined||x===null)return y;if(y===undefined||y===null)return x;
  if(k==="est"&&typeof x==="object"&&typeof y==="object"&&x.d!==y.d)return String(x.d||"")>String(y.d||"")?x:y; // comptadors d'un altre dia: es queda el del dia més nou
  if(k==="dies"&&Array.isArray(x)&&Array.isArray(y))return [...new Set([...x,...y])].sort();
  if(k==="vigilia_dies"&&Array.isArray(x)&&Array.isArray(y))return [...new Set([...x,...y].filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)))].sort();
  if(k==="vigilia_mod"&&typeof x==="object"&&typeof y==="object"){const o={};new Set([...Object.keys(x),...Object.keys(y)]).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).forEach(d=>{const ax=x[d],by=y[d];o[d]=!ax?by:!by?ax:(+ax.ts||0)>=(+by.ts||0)?ax:by});return o}
  if(Array.isArray(x)||Array.isArray(y))return (Array.isArray(x)?x:[]).length>=(Array.isArray(y)?y:[]).length?x:y;
  if(typeof x==="number"&&typeof y==="number")return Math.max(x,y);
  if(typeof x==="boolean"||typeof y==="boolean")return !!(x||y);
  if(typeof x==="object"&&typeof y==="object"){const o={};new Set([...Object.keys(x),...Object.keys(y)]).forEach(kk=>o[kk]=f(x[kk],y[kk],kk));return o}
  return nouA?x:y};
 const r=f(a||{},b||{},"");if(Array.isArray(r.vigilia_dies)){const vm=r.vigilia_mod&&typeof r.vigilia_mod==="object"?r.vigilia_mod:{};r.vigilia_dies=[...new Set(r.vigilia_dies.filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)&&!(vm[d]&&vm[d].on===0)))].sort().slice(0,2)}
 r.nom=(a&&a.nom)||(b&&b.nom)||"";r.mod=Math.max(a&&a.mod||0,b&&b.mod||0);return Object.assign(BUIT(),r)}
// REINICI des de l'admin (supabase/bn_admin_reinicia.sql): el núvol torna «reinici» (ms de l'últim esborrat d'aquest món o de tots).
// Si és més nou que el que coneix aquest dispositiu (S.reinici), PRIMER es buida aquí el progrés d'aquest món (es queden el nom i l'id)
// i només després es fusiona amb el núvol. Si no, fusiona() (que agafa sempre el més alt) faria tornar el progrés esborrat.
function aplicaReinici(r){const ri=+(r&&r.reinici)||0;if(ri<=(+S.reinici||0))return false;
 const n=S.nom,id=S.id;S=BUIT();S.nom=n;if(id)S.id=id;S.reinici=ri;S.mod=Date.now();guarda();return true}
// fusiona el que torna bn_progres_llegeix: reinici → progrés desat al núvol → registre reconstruït
function fusionaNuvol(r){const n=S.nom,reini=aplicaReinici(r);
 if(r&&r.estat)S=fusiona(S,Object.assign({},r.estat,{mod:r.mod}));
 if(r&&r.log)S=fusiona(S,Object.assign({},r.log,{mod:0})); // el registre reconstrueix estrelles, temps, temes i jocs encara que es perdi el dispositiu
 S.nom=n;return reini}

// ====================== ACCESSIBILITAT I DRECERES DE TECLAT ======================
document.addEventListener("keydown",e=>{
 if(e.altKey||e.ctrlKey||e.metaKey)return;
 const tg=e.target,enCamp=tg&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName)||tg.isContentEditable);
 // 1) Elements amb role="button" i tabindex="0" (tiles, xips, targetes, files de taula…)
 if(!enCamp&&(e.key==="Enter"||e.key===" ")&&tg&&tg.getAttribute&&tg.getAttribute("role")==="button"&&tg.tagName!=="BUTTON"){
  e.preventDefault();tg.click();return;
 }
 // 2) Tancar popups / pantalles superposades amb Escape o Enter/Espai a .arc
 if(e.key==="Escape"){
  const pt=document.getElementById("popTastWrap");if(pt){e.preventDefault();tancaConvidaPin();return}
  const pop=document.getElementById("popEst");if(pop){e.preventDefault();tancaEstrelles();const bt=document.getElementById("punts");if(bt)bt.focus();return}
  const arc=document.querySelector(".arc");if(arc){e.preventDefault();arc.click();return}
  const nitAc=document.getElementById("btNitAcabo");if(nitAc){e.preventDefault();nitAc.click();return}
  const desc=document.getElementById("dSalta");if(desc){e.preventDefault();desc.click();return}
 }
 const arc=document.querySelector(".arc");
 if(arc&&(e.key==="Enter"||e.key===" ")){e.preventDefault();arc.click();return}
 if(enCamp||document.querySelector(".descans"))return;
 // 3) Si la pissarra està oberta o hi ha el taller de mates amb el seu propi teclat, no interferir
 const pis=document.getElementById("pisCapa");if(pis&&pis.classList.contains("on"))return;
 if(document.querySelector(".mx-tec"))return;
 // 4) Targetes (flashcards): Espai / ↑ / ↓ gira; ← / → passa targeta
 const fl=document.querySelector("#zona .flash");
 if(fl){
  if(e.key===" "||e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();fl.click();return}
  if(e.key==="ArrowLeft"){const b=document.getElementById("fcAnt");if(b&&!b.disabled){e.preventDefault();b.click()}return}
  if(e.key==="ArrowRight"){const b=document.getElementById("fcSeg");if(b&&!b.disabled){e.preventDefault();b.click()}return}
 }
 // 5) Tests, Exàmens i Repàs: 1/2/3 o A/B/C selecciona opció; Enter o → avança; P demana pista
 const k=e.key.toUpperCase();
 const idx={"1":0,"2":1,"3":2,"A":0,"B":1,"C":2}[k];
 if(idx!==undefined){
  const germs=[...document.querySelectorAll(".opt.germ:not(:disabled)")];
  if(germs[idx]){e.preventDefault();germs[idx].click();return}
  const opts=[...document.querySelectorAll(".opt:not(.germ):not(:disabled):not(.fora)")];
  if(opts[idx]){e.preventDefault();opts[idx].click();return}
 }
 if(k==="P"){
  const bp=document.getElementById("pista");if(bp&&bp.offsetParent!==null){e.preventDefault();bp.click();return}
 }
 if((e.key==="Enter"&&!(tg&&tg.tagName==="BUTTON"&&tg.id!=="seg"&&tg.id!=="exSeg"&&tg.id!=="jgSeg"))||e.key==="ArrowRight"){
  const sg=document.getElementById("seg")||document.getElementById("exSeg")||document.getElementById("jgSeg");
  if(sg&&!sg.disabled){e.preventDefault();sg.click();return}
 }
 if(e.key==="ArrowLeft"){
  const ant=document.getElementById("exAnt");
  if(ant&&!ant.disabled){e.preventDefault();ant.click();return}
 }
});
