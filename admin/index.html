<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Bona Nota</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23facc15'/><path d='m16 6 3 6.2 6.8 1-4.9 4.8 1.2 6.8L16 21.6l-6.1 3.2 1.2-6.8L6.2 13.2l6.8-1z' fill='%231e1b4b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== Bona Nota · panell d'admin =====================
   Tot amb variables: colors, espais (4/8/12/16/24/32), radis (8/12) i ombres, per al tema clar i el fosc. */
:root{
 --bg:#f5f6fa;--card:#fff;--card2:#f8fafc;--text:#0f172a;--muted:#4a5568;--soft:#64748b;--border:#e3e7ef;--border2:#cbd3e1;--grid:#eef1f6;
 --primary:#4f46e5;--primary-h:#4338ca;--primary-soft:#eef2ff;--on-primary:#fff;
 --ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;--info:#1d4ed8;--info-bg:#eff6ff;--info-bd:#bfdbfe;
 --logo:#facc15;--heat:79,70,229;
 --d90b:#15803d;--d90t:#fff;--d70b:#bbf7d0;--d70t:#14532d;--d50b:#fde68a;--d50t:#78350f;--d0b:#fecaca;--d0t:#7f1d1d;--dfxb:#e2e8f0;--dfxt:#334155;
 --sh1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);--sh2:0 12px 32px -12px rgba(15,23,42,.28);--focus:0 0 0 3px rgba(79,70,229,.3);
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r1:8px;--r2:12px;--menu:248px;--dalt:0px;
 color-scheme:light}
[data-tema="fosc"]{
 --bg:#0b1120;--card:#111827;--card2:#0f172a;--text:#e5e7eb;--muted:#a7b0c0;--soft:#94a3b8;--border:#1f2a3c;--border2:#334155;--grid:#1c2638;
 --primary:#818cf8;--primary-h:#a5b4fc;--primary-soft:#1e1b4b;--on-primary:#0b1120;
 --ok:#4ade80;--ok-bg:#052e1a;--warn:#fbbf24;--warn-bg:#3a2905;--bad:#f87171;--bad-bg:#3b0d0d;--info:#93c5fd;--info-bg:#0c1d3a;--info-bd:#1e3a6e;
 --heat:129,140,248;
 --d90b:#22c55e;--d90t:#052e16;--d70b:#14532d;--d70t:#bbf7d0;--d50b:#713f12;--d50t:#fde68a;--d0b:#7f1d1d;--d0t:#fecaca;--dfxb:#1f2a3c;--dfxt:#cbd5e1;
 --sh1:0 1px 2px rgba(0,0,0,.45);--sh2:0 12px 32px -12px rgba(0,0,0,.75);--focus:0 0 0 3px rgba(129,140,248,.4);
 color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:96px}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body.demo{--dalt:34px}
h1,h2,h3,h4{line-height:1.25}
a{color:var(--primary)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.salta{position:absolute;left:-9999px;top:8px;z-index:400;background:var(--card);color:var(--text);padding:8px 12px;border-radius:var(--r1);box-shadow:var(--sh2)}
.salta:focus{left:12px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.muted{color:var(--muted)}
/* franja del mode demo */
.demo-bar{position:fixed;top:0;left:0;right:0;height:34px;z-index:90;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:13px;border-bottom:1px solid var(--border)}
.demo-bar a{color:inherit}
/* ---- menú lateral ---- */
.menu{position:fixed;top:var(--dalt);bottom:0;left:0;width:var(--menu);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:50;overflow-y:auto;overflow-x:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.logo-m{width:32px;height:32px;flex:none}
.logo-t span{color:var(--muted);font-weight:600}
.menu nav{display:flex;flex-direction:column;gap:2px;padding:8px 10px}
.nav-b{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r1);color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.nav-b:hover{background:var(--card2);color:var(--text)}
.nav-b[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.nav-b:focus-visible{outline:2px solid var(--primary)}
.menu .sub{display:flex;flex-direction:column;margin:2px 0 6px 30px;border-left:1px solid var(--border)}
.menu .sub button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;color:var(--muted);border-radius:0 6px 6px 0}
.menu .sub button:hover{color:var(--text);background:var(--card2)}
.menu .sub button:focus-visible{outline:2px solid var(--primary)}
.menu-peu{margin-top:auto;padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.menu-peu small{color:var(--soft);font-size:11.5px;padding:6px 12px 2px}
.principal{margin-left:var(--menu);min-width:0;padding-top:var(--dalt)}
/* ---- capçalera ---- */
.cap{position:sticky;top:var(--dalt);z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.cap h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.filtres-g{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.act{display:flex;align-items:center;gap:10px}
.act small{color:var(--muted);font-size:12.5px;white-space:nowrap}
main{padding:24px;max-width:1640px}
/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:13.5px;line-height:1.3;border-radius:var(--r1);padding:8px 14px;border:1px solid transparent;cursor:pointer;background:var(--primary);color:var(--on-primary);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--primary-h)}
.btn.sec{background:var(--card);color:var(--text);border-color:var(--border2)}
.btn.sec:hover{background:var(--card2)}
.btn.perill{background:var(--bad);color:#fff;border-color:var(--bad)}
[data-tema="fosc"] .btn.perill{color:#1f0606}
.btn.perill-sec{background:var(--card);color:var(--bad);border-color:var(--bad)}
.btn.perill-sec:hover{background:var(--bad-bg)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn.petit{padding:6px 10px;font-size:13px}
.btn.ample{width:100%}
.btn-ic{all:unset;box-sizing:border-box;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r1);color:var(--muted);cursor:pointer}
.btn-ic:hover{background:var(--card2);color:var(--text)}
.btn-ic:focus-visible{outline:2px solid var(--primary)}
.btn-ic:disabled{opacity:.45;cursor:not-allowed}
.btn-ic.perill:hover{color:var(--bad);background:var(--bad-bg)}
.linkb{all:unset;cursor:pointer;color:var(--primary);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.linkb:hover{text-decoration:underline}
.linkb:focus-visible{outline:2px solid var(--primary);border-radius:4px}
input,select{font:inherit;font-size:13.5px;color:var(--text);background:var(--card);border:1px solid var(--border2);border-radius:var(--r1);padding:7px 10px;min-height:36px;max-width:100%}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:var(--focus)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--border);border-radius:var(--r1);padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--sh1)}
.seg button:focus-visible{outline:2px solid var(--primary)}
.cerca{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);border-radius:var(--r1);background:var(--card);padding:0 10px;min-height:36px;flex:1;min-width:180px;max-width:360px}
.cerca:focus-within{border-color:var(--primary);box-shadow:var(--focus)}
.cerca input{border:0;box-shadow:none!important;padding:7px 0;min-height:34px;flex:1;min-width:0;background:transparent}
.cerca .ic{color:var(--soft)}
/* ---- targetes i graella ---- */
.graella{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c-12{grid-column:span 12}.c-8{grid-column:span 8}.c-6{grid-column:span 6}.c-4{grid-column:span 4}
@media (max-width:1099px){.c-8,.c-6,.c-4{grid-column:span 12}}
.targeta{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh1);padding:16px 20px;min-width:0}
.targeta>h2,.seccio-t{display:flex;align-items:center;gap:8px;margin:0 0 4px;font-size:15.5px;font-weight:600}
.targeta>h2 .ic{color:var(--soft)}
.targeta .sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.seccio{scroll-margin-top:96px}
.grup{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
.grup:first-of-type{margin-top:8px}
.eines-t{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.eines-t .esp{flex:1}
/* xifres clau */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
@media (min-width:1200px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh1);padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi-t{font-size:12.5px;font-weight:500;color:var(--muted)}
.kpi-v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.kpi-p{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:22px}
.kpi-s{font-size:12.5px;color:var(--muted)}
.kpi.avis{border-color:var(--warn)}
.kpi.avis .kpi-v{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}.pill.neutre{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.vs{font-size:12px;color:var(--muted)}
.xip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.xa{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.xa i{width:8px;height:8px;border-radius:50%;flex:none}
.pc{font-weight:600}.pc.ok{color:var(--ok)}.pc.warn{color:var(--warn)}.pc.bad{color:var(--bad)}
/* etiquetes per tipus d'esdeveniment */
.ev{display:inline-flex;align-items:center;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.ev-entra{background:#e0e7ff;color:#3730a3}.ev-fitxa{background:#e0f2fe;color:#075985}.ev-targetes{background:#cffafe;color:#155e75}
.ev-test{background:#ede9fe;color:#5b21b6}.ev-joc{background:#fce7f3;color:#9d174d}.ev-examen{background:#fee2e2;color:#991b1b}
.ev-oberta{background:#ffedd5;color:#9a3412}.ev-valora{background:#dcfce7;color:#166534}.ev-temps{background:#f1f5f9;color:#334155}
[data-tema="fosc"] .ev-entra{background:#1e1b4b;color:#c7d2fe}[data-tema="fosc"] .ev-fitxa{background:#082f49;color:#bae6fd}[data-tema="fosc"] .ev-targetes{background:#083344;color:#a5f3fc}
[data-tema="fosc"] .ev-test{background:#2e1065;color:#ddd6fe}[data-tema="fosc"] .ev-joc{background:#500724;color:#fbcfe8}[data-tema="fosc"] .ev-examen{background:#450a0a;color:#fecaca}
[data-tema="fosc"] .ev-oberta{background:#431407;color:#fed7aa}[data-tema="fosc"] .ev-valora{background:#052e16;color:#bbf7d0}[data-tema="fosc"] .ev-temps{background:#1e293b;color:#cbd5e1}
/* taules: es desplacen de costat dins de la targeta; capçalera enganxada */
.taula-w{overflow:auto;border:1px solid var(--border);border-radius:var(--r1);background:var(--card)}
.taula-w.alta{max-height:max(420px,calc(100vh - 230px))}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
th{position:sticky;top:0;z-index:1;background:var(--card2);color:var(--muted);font-weight:600;font-size:12px;text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
td.num,td.nw{white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right}
td.cur{max-width:520px}
th button.ord{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:inherit}
th button.ord:hover{color:var(--text)}
th button.ord:focus-visible{outline:2px solid var(--primary);border-radius:4px}
th button.ord .ic{width:14px;height:14px;opacity:.55}
th[aria-sort="ascending"] button.ord .ic,th[aria-sort="descending"] button.ord .ic{opacity:1;color:var(--primary)}
tr.clic{cursor:pointer}
tr.clic:hover td{background:var(--primary-soft)}
tr.clic:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
tr.det td{background:var(--card2)}
.mini{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.mini .b{width:64px;height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.mini .b i{display:block;height:100%;background:var(--primary);border-radius:99px}
.mini .b i.bad{background:var(--bad)}
.q-t{font-weight:600}
.q-s{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.q-s .ok{color:var(--ok);font-weight:600}.q-s .pa{color:var(--bad);font-weight:600}
/* avatars: els sprites de pixel art del rànquing (../sprites.js) */
.av{position:relative;display:inline-block;flex:none;width:30px;height:30px;border-radius:50%;background:var(--av,#64748b);box-shadow:0 0 0 1px rgba(15,23,42,.18)}
.av-cl{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#1d16311a 0 25%,transparent 0 50%) 0 0/8px 8px,var(--av,#64748b)}
.av-cl .spr{display:block;width:84%;height:auto;shape-rendering:crispEdges}
.av.g{width:68px;height:68px}.av.g .av-cl{background-size:14px 14px}
.av.p{width:22px;height:22px}
.nen{display:inline-flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.nen-b{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:600}
.nen-c{display:inline-flex;align-items:center;gap:8px}
.nen-b:hover>span:last-child{text-decoration:underline}
.nen-b:focus-visible{outline:2px solid var(--primary);border-radius:6px}
.punt{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
/* estats: esquelets, buit, avisos, toasts, diàlegs */
.esq{background:linear-gradient(90deg,var(--grid) 25%,var(--card2) 40%,var(--grid) 60%);background-size:400% 100%;animation:esq 1.4s ease infinite;border-radius:var(--r1)}
@keyframes esq{0%{background-position:100% 50%}100%{background-position:0 50%}}
.esq-kpi{height:108px;border-radius:var(--r2)}.esq-t{height:14px;width:160px;margin:18px 0 10px}.esq-g{height:320px;border-radius:var(--r2)}.esq-f{height:42px;margin:8px 0}
.buit{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--muted);padding:32px 16px}
.buit .ic{width:30px;height:30px;color:var(--soft);margin-bottom:4px}
.buit b{color:var(--text);font-weight:600}
.avis{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--info-bd);border-radius:var(--r2);padding:14px 16px;background:var(--info-bg);color:var(--text)}
.avis>.ic{color:var(--info);margin-top:2px}
.avis p{margin:0 0 8px}
.avis.err{border-color:var(--bad);background:var(--bad-bg)}.avis.err>.ic{color:var(--bad)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--card);border:1px solid var(--border);padding:2px 6px;border-radius:6px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--card);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--ok);box-shadow:var(--sh2);border-radius:var(--r1);padding:10px 14px;display:flex;gap:8px;align-items:center;max-width:380px;font-weight:500;animation:entra .2s ease}
.toast .ic{color:var(--ok)}
.toast.avis-t{border-left-color:var(--warn)}.toast.avis-t .ic{color:var(--warn)}
.toast.err-t{border-left-color:var(--bad)}.toast.err-t .ic{color:var(--bad)}
@keyframes entra{from{transform:translateY(8px);opacity:0}}
#errG{display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:310}
dialog{border:0;border-radius:var(--r2);padding:0;width:min(500px,calc(100vw - 32px));background:var(--card);color:var(--text);box-shadow:var(--sh2)}
dialog::backdrop{background:rgba(15,23,42,.55)}
.dlg-c{padding:20px 24px}
.dlg-c h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:17px}
.dlg-c h2 .ic{color:var(--bad)}
.dlg-c p{margin:0 0 10px;color:var(--muted)}
.dlg-c ul{margin:0 0 10px;padding-left:20px}
.dlg-c label{display:block;font-weight:600;font-size:13px;margin:6px 0 6px}
.dlg-c input,.dlg-c select{width:100%}
.dlg-p{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 24px;border-top:1px solid var(--border);background:var(--card2);border-radius:0 0 var(--r2) var(--r2)}
.dlg-c .irreversible{display:flex;gap:8px;align-items:center;color:var(--bad);font-weight:600;font-size:13px;margin:12px 0 0}
/* fitxa del nen */
.perfil{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.perfil h2{font-size:22px;margin:0;font-weight:700}
.xips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pestanyes{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:24px 0 16px;overflow-x:auto}
.pestanyes button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.pestanyes button:hover{color:var(--text)}
.pestanyes button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.pestanyes button:focus-visible{outline:2px solid var(--primary);border-radius:4px}
.perill-z{border:1px solid var(--bad);border-radius:var(--r2);background:var(--card);margin-top:32px;overflow:hidden}
.perill-z>h2{display:flex;align-items:center;gap:8px;margin:0;padding:14px 20px;color:var(--bad);font-size:15.5px;background:var(--bad-bg)}
.perill-z>p{margin:0;padding:10px 20px 0;color:var(--muted);font-size:13px}
.pz-fila{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.pz-fila:first-of-type{border-top:0}
.pz-fila b{display:block;font-weight:600}

// l'examen de mates (eines/exercicis-mates.js) registra «nota» sobre 10 en lloc de «pc»
const pcExam=d=>d.pc!=null?d.pc:d.nota!=null?Math.round(d.nota*10):null;
const REP_EXT={mx:"Taller",mapa:"MAPA",err:"Troba l'error",err_gen:"Troba l'error"};
const extRepas=x=>String(x).split(",").map(p=>{const [t,v]=p.split(":");return `${REP_EXT[t]||t} ${v||""}`.trim()}).join(", ");
function descriu(l){const d=l.detall||{};switch(l.event){
 case"entra":return d.nou?"Perfil nou creat":`Entra · ${d.punts??0} estrelles · ${d.aprovats??0}/${d.temes??"?"} temes aprovats`;
 case"fitxa":return `Llegeix la fitxa: <b>${esc(d.titol||d.tema)}</b>${d.s?` · ${fmtT(d.s)}${d.fi?" · fins al final":""}`:""}`;
 case"targetes":return `Targetes de <b>${esc(d.titol||d.tema)}</b>: ${d.vistes}/${d.n} vistes · ${d.girs||0} girs · ${fmtT(d.s)}`;
 case"test":return `Test de <b>${esc(d.titol||d.tema)}</b>: ${d.bones}/${d.n} · ${cpc(d.pc)}${d.pistes?` · ${pl(d.pistes,"pista","pistes")}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"joc":if(d.joc==="boss")return `Boss <b>${esc(d.titol||"del món")}</b>: ${d.guanya?"guanyat":"perdut"}${d.enc!=null?` · ${d.enc} encerts, ${d.err} errors`:""}${d.guanya&&d.cors!=null?` · ${pl(d.cors,"cor","cors")}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
   if(d.joc==="repas")return `Repàs dels errors: ${cpc(d.pc)}${d.apr?` · ${pl(d.apr,"error après","errors apresos")}`:""}${d.ext?` · ${esc(extRepas(d.ext))}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
   return `Joc <b>${esc(d.titol||d.joc)}</b>: ${cpc(d.pc)}${d.enc!=null?` · ${d.enc} encerts, ${d.err} errors`:""}${d.mode&&d.joc==="mapa43"?` · ${esc(d.mode)}`:""}${d.pistes?` · ${pl(d.pistes,"pista","pistes")}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"examen":return `${d.joc==="examreal"?"Examen de veritat":d.joc==="examen"?"Examen sorpresa":"Examen de mates"}: ${d.nota!=null?`<b>${esc(String(d.nota).replace(".",","))}</b> sobre 10`:cpc(d.pc)}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"oberta":if(d.mode==="control")return `Quadern · punts de control (${esc(d.tema||"")}): ${cpc(d.pc)} bé a la primera${d.pasos?` (${esc(d.pasos)})`:""}`;
   if(d.mode==="foto")return `Foto del quadern (${esc(d.tema||"")}): ${d.ok?(d.correcte?"tot correcte":"hi ha trobat un error"):`no s'ha pogut corregir (${esc(d.error||"?")})`}`;
   return `Pregunta oberta (${esc(d.tema||"")}): ${cpc(d.pc)} de les idees clau${d.s?` · ${fmtT(d.s)}`:""}`;
 case"valora":return `Valora <b>${esc(d.titol||d.tema)}</b>: ${esc(d.v)}`;
 case"temps":return `${fmtT(d.s)} estudiant`;
 default:return esc(JSON.stringify(d))}}
function nens(ls){ls=ls||LOGS;const m={};ls.forEach(l=>{const k=clauNen(l);const n=m[k]||(m[k]={nom:l.nom,assigs:new Set(),ses:new Set(),ap:new Set(),ult:l.ts,temps:0,tests:[],jocs:0,exam:[],punts:{},fonts:{},fts:{}});
 n.assigs.add(l.assig);n.ses.add(l.sessio);n.ap.add(l.aparell);if(l.ts>n.ult)n.ult=l.ts;const d=l.detall||{};
 if(l.event==="temps")n.temps+=d.s||0;if(l.event==="test")n.tests.push(d.pc);if(l.event==="joc")n.jocs++;if(l.event==="examen"&&pcExam(d)!=null)n.exam.push(pcExam(d));
 if(d.punts!=null&&(n.punts[l.assig]==null||d.punts>n.punts[l.assig]))n.punts[l.assig]=d.punts;
 if(d.fonts&&(!n.fts[l.assig]||l.ts>n.fts[l.assig])){n.fonts[l.assig]={f:d.fonts,p:d.punts||0};n.fts[l.assig]=l.ts}});
 return Object.entries(m).map(([k,n])=>({k,...n})).sort((a,b)=>b.ult.localeCompare(a.ult))}

const TAULES={};
function taula(id,cols,rows,o={}){TAULES[id]={cols,rows,k:o.k||(cols.find(c=>c.ord!==false)||{}).k,desc:o.desc!==false,fila:o.fila,etiqueta:o.etiqueta||""};

 const obert=a=>Object.prototype.hasOwnProperty.call(st,a)?!!st[a]:assigs.length===1,desa=()=>{try{localStorage.setItem(clau,JSON.stringify(st))}catch(e){}};
 return {
  eines:()=>assigs.length>1?`<div class="dm-eines"><span>${pl(assigs.length,"món","mons")} · toca un món per veure'n el detall</span><div class="dm-bts"><button class="btn sec petit" type="button" data-dm="obre">${ic("avall")}Desplega-ho tot</button><button class="btn sec petit" type="button" data-dm="tanca">${ic("amunt")}Plega-ho tot</button></div></div>`:"",
  // a: món · meta: línia petita sota el nom · mig: columna del mig (opcional) · dreta: columna de la dreta (barra o resum) · cos: el que surt en desplegar
  bloc:(a,meta,mig,dreta,cos)=>`<details class="dm-as" data-a="${esc(a)}" style="--mc:${colAssig(a)}"${obert(a)?" open":""}>
   <summary class="dm-cap" title="Toca per ${obert(a)?"plegar":"desplegar"} ${esc(nomAssig(a))}"><span class="dm-xev">${ic("avall")}</span>
    <span class="dm-tit"><span class="dm-nom">${esc(nomAssig(a))}</span><span class="dm-meta">${meta}</span></span>
    <span class="dm-avs" aria-hidden="true">${mig||""}</span><span class="dm-prog">${dreta||""}</span></summary>
   <div class="dm-cos">${cos}</div></details>`,
  lliga:el=>{if(!el)return;
   el.querySelectorAll("details.dm-as").forEach(d=>d.addEventListener("toggle",()=>{st[d.dataset.a]=d.open;const c=d.querySelector(".dm-cap");if(c)c.title=`Toca per ${d.open?"plegar":"desplegar"} ${nomAssig(d.dataset.a)}`;desa()}));
   el.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{const o=b.dataset.dm==="obre";el.querySelectorAll("details.dm-as").forEach(d=>{d.open=o;st[d.dataset.a]=o});desa()})}}}
function tDomini(dom){if(!dom.length){$("#tDom").innerHTML=buit("diana","Encara no hi ha activitat de temes en aquest període.");return}
 // tots els temes de cada assignatura, en l'ordre del món (de preguntes.json), encara que ningú no els hagi fet
 const temesDe=a=>{const m=new Map();Object.entries(PREG||{}).forEach(([k,v])=>{const [as,t]=k.split("/");if(as===a&&!t.startsWith("j-")&&!m.has(t))m.set(t,v.tema)});
  dom.filter(x=>x.assig===a).forEach(x=>{if(!m.has(x.tema))m.set(x.tema,x.titol||x.tema)});return [...m.entries()]};
 const estat=c=>!c?"no":c.millor==null?"fitxa":c.millor>=70?"aprovat":"suspes";
 const COL={aprovat:"var(--ok)",suspes:"var(--bad)",fitxa:"var(--soft)"};
 // cada món es pot plegar i desplegar (plegables); l'estat es recorda en aquest navegador (bn_admin_dm)
 const assigs=[...new Set(dom.map(x=>x.assig))],PL=plegables("bn_admin_dm",assigs);
 let h=PL.eines();
 assigs.forEach(a=>{const ds=dom.filter(x=>x.assig===a),temes=temesDe(a),
   noms=[...new Map(ds.map(x=>[x.nom.trim().toLowerCase(),x.nom])).values()].sort((x,y)=>x.localeCompare(y,"ca"));
  const cel=(n,t)=>ds.find(x=>x.tema===t&&x.nom.trim().toLowerCase()===n.trim().toLowerCase());
  const res=noms.map(n=>{const c={aprovat:0,suspes:0,fitxa:0,no:0};temes.forEach(([t])=>c[estat(cel(n,t))]++);const N=temes.length;
   return `<button type="button" class="dm-nen" data-n="${esc(n)}" title="Filtra el tauler només per a ${esc(n)}"><span class="dn"><span class="nen">${avatar(n,"p")}<span>${esc(n)}</span></span><span>${c.aprovat}/${N}</span></span>
    <span class="dm-bar">${["aprovat","suspes","fitxa"].map(k=>c[k]?`<i style="width:${c[k]*100/N}%;background:${COL[k]}"></i>`:"").join("")}</span>
    <small>${c.aprovat} aprovats · ${c.suspes} per millorar · ${c.fitxa} només llegits · ${c.no} sense obrir</small></button>`}).join("");
  const files=temes.map(([t,tit])=>`<tr><td class="tm">${esc(tit)}</td>${noms.map(n=>{const c=cel(n,t),e=estat(c);
   const tip=c?`${n} · ${tit}\n${c.intents} intents de test · millor ${c.millor??"—"}% · última ${c.ultima??"—"}%${c.valoracio?` · diu «${c.valoracio}»`:""}${c.segons_estudi?` · ${Math.round(c.segons_estudi/60)} min de fitxa/targetes`:""}`:`${n} · ${tit}: encara no l'ha obert`;
   return `<td title="${esc(tip)}">${e==="no"?`<span class="dm-c buit">·</span>`:e==="fitxa"?`<span class="dm-c bfx" aria-label="només ha llegit la fitxa">F</span>`:`<span class="dm-c ${bandPc(c.millor)}">${c.millor}${c.intents>1?`<small> ×${c.intents}</small>`:""}</span>`}</td>`}).join("")}</tr>`).join("");
  // resum del món per a la capçalera plegable: tots els nens junts
  const tot={aprovat:0,suspes:0,fitxa:0,no:0};noms.forEach(n=>temes.forEach(([t])=>tot[estat(cel(n,t))]++));const TT=Math.max(1,temes.length*noms.length),pc=Math.round(tot.aprovat*100/TT);
  const avs=noms.slice(0,5).map(n=>avatar(n,"p")).join("")+(noms.length>5?`<span class="mes">+${noms.length-5}</span>`:"");
  h+=PL.bloc(a,`${pl(temes.length,"tema","temes")} · ${pl(noms.length,"nen","nens")}${tot.suspes?` · ${tot.suspes} per millorar`:""}`,avs,
    `<span class="dm-bar" aria-hidden="true">${["aprovat","suspes","fitxa"].map(k=>tot[k]?`<i style="width:${tot[k]*100/TT}%;background:${COL[k]}"></i>`:"").join("")}</span>
     <small><span>${noms.length===1?`<b>${tot.aprovat}/${temes.length}</b> temes aprovats`:`<b>${tot.aprovat}/${TT}</b> aprovats entre tots`}</span><span>${pc}%</span></small>`,
    `<div class="dm-res">${res}</div>
   <div class="taula-w"><table class="dm-t"><thead><tr><th scope="col" class="tm">Tema</th>${noms.map(n=>`<th scope="col"><span class="nen" style="justify-content:center">${avatar(n,"p")}${esc(n)}</span></th>`).join("")}</tr></thead><tbody>${files}</tbody></table></div>`)});
 $("#tDom").innerHTML=h+`<div class="llegenda"><span>Millor nota:</span><span>0</span><span class="bands" aria-hidden="true"><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b0"></i><i class="b50"></i><i class="b50"></i><i class="b70"></i><i class="b70"></i><i class="b90"></i></span><span>100</span>
  <span class="q"><i class="b0"></i>menys de 50</span><span class="q"><i class="b50"></i>50-69</span><span class="q"><i class="b70"></i>70-89 (aprovat)</span><span class="q"><i class="b90"></i>90-100</span><span class="q"><i class="bfx"></i>F = només fitxa</span><span>· = sense obrir</span><span>×3 = intents</span></div>`;
 $("#tDom").querySelectorAll(".dm-nen").forEach(x=>x.onclick=()=>{TF.nom=x.dataset.n;pinta();scrollTo(0,0)});
 PL.lliga($("#tDom"))}
function tFallades(fall){if(!fall.length){$("#tFal").innerHTML=buit("creu","Encara no hi ha preguntes fallades registrades en aquest període.","Es compten des del 4-11-2026.");return}
 const net=t=>String(t||"").replace(/<[^>]+>/g,"");
 const rows=fall.map(f=>{const q=PREG[f.assig+"/"+f.qid]||null,parany=q&&f.opcio_parany!=null&&q.o[+f.opcio_parany]!=null?net(q.o[+f.opcio_parany]):null;
  return {assig:f.assig,qid:f.qid,text:q?net(q.t):`Pregunta ${f.qid}`,tema:q?q.tema:"",bona:q?net(q.o[q.c]):null,parany,pct:+f.pct_error,errors:+f.errors,intents:+f.intents,nens:+f.nens,nf:+f.nens_fallen,seg:f.segons!=null?+f.segons:null}});
 // un bloc plegable per món (com al Domini per tema), amb la seva taula ordenable; l'estat es recorda (bn_admin_fal)
 const cols=[
  {k:"text",t:"Pregunta",cls:"cur",h:r=>`<span class="q-t">${esc(r.text)}</span><span class="q-s">${r.tema?esc(r.tema)+" · ":""}bona: <span class="ok">${esc(r.bona??"?")}</span>${r.parany?` · parany: <span class="pa">${esc(r.parany)}</span>`:""} · id ${esc(r.qid)}</span>`},
  {k:"pct",t:"% d'error",num:true,h:r=>mini(r.pct,100,"bad",r.pct+"%")},
  {k:"errors",t:"Errors",num:true,h:r=>`${r.errors} <span class="muted">de ${r.intents}</span>`},{k:"nf",t:"Nens que la fallen",num:true,h:r=>`${r.nf} <span class="muted">de ${r.nens}</span>`},
  {k:"seg",t:"Segons",num:true,h:r=>r.seg==null?"—":fmtD(r.seg)}];
 // ordre dels mons: el que té més errors, primer
 const assigs=[...new Set(rows.map(r=>r.assig))].sort((x,y)=>rows.filter(r=>r.assig===y).reduce((t,r)=>t+r.errors,0)-rows.filter(r=>r.assig===x).reduce((t,r)=>t+r.errors,0)),PL=plegables("bn_admin_fal",assigs);
 $("#tFal").innerHTML=PL.eines()+assigs.map(a=>{const rs=rows.filter(r=>r.assig===a),err=rs.reduce((t,r)=>t+r.errors,0),int=rs.reduce((t,r)=>t+r.intents,0),
   pitjor=[...rs].sort((x,y)=>y.pct-x.pct||y.errors-x.errors)[0],parany=rs.filter(r=>r.parany).length,pc=int?Math.round(err*100/int):0;
  return PL.bloc(a,`${pl(rs.length,"pregunta","preguntes")} · ${pl(err,"error","errors")}${parany?` · ${parany} amb parany`:""}`,
   `<span class="pill ${pc>=50?"bad":pc>=30?"warn":"neutre"}" title="Errors sobre intents de les preguntes d'aquest món">${pc}% d'error</span>`,
   `<span class="dm-bar" aria-hidden="true"><i style="width:${pitjor.pct}%;background:var(--bad)"></i></span>
    <small><span class="dm-pit" title="${esc(pitjor.text)}">Pitjor: <b>${esc(pitjor.text)}</b></span><span>${pitjor.pct}%</span></small>`,
   taula("tFalT-"+a,cols,rs,{k:"errors",alta:true,etiqueta:`Preguntes més fallades · ${nomAssig(a)}`}))}).join("");
 PL.lliga($("#tFal"))}

function tMotivacio(){const el=$("#tMot");if(!el)return;const ls=LF(),m={};
 const fila=(k,nom)=>m[k]||(m[k]={nom,rep:0,apr:0,boss:0,guanyats:0,mis:0});

 nens(ls).forEach(n=>{const mis=Object.values(n.fonts).reduce((a,x)=>a+(+(x.f||{}).missio||0),0);if(mis)fila(n.k,n.nom).mis=mis});

 const num=(k,t)=>({k,t,num:true,v:r=>r[k]});
 el.innerHTML=`<div class="kpis" style="margin-bottom:12px">${kp("Errors apresos",sum("apr"),pl(sum("rep"),"repàs fet","repassos fets"))}${kp("Boss guanyats",sum("guanyats"),`de ${pl(sum("boss"),"intent","intents")}`)}${kp("Estrelles de missions",sum("mis"),"acumulat")}</div>`+
