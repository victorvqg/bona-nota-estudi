<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Bona Nota</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--groc:#facc15;--fons:#0b1033;--panell:#141a4a;--vora:#ffffff1f;--txt:#e2e8f0;--suau:#a5b4fc}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,Arial,sans-serif;color:var(--txt);background:radial-gradient(1000px 600px at 50% -10%,#3b2a8c,#1a1660 40%,var(--fons) 75%) fixed,var(--fons);min-height:100vh}
a{color:var(--groc)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--vora);background:#0b103399;backdrop-filter:blur(8px);position:sticky;top:0;z-index:5}
.top h1{font-family:'Press Start 2P',monospace;font-size:15px;color:var(--groc);margin:0;text-shadow:2px 2px 0 #b91c1c}
.top .esp{flex:1}
.btn{font:inherit;font-weight:900;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:linear-gradient(180deg,#22d3ee,#0284c7);color:#fff;box-shadow:0 4px 0 #0c4a6e}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0c4a6e}
.btn.sec{background:#ffffff14;box-shadow:none;border:1px solid var(--vora)}
select,input{font:inherit;font-weight:700;background:#0b1033;color:var(--txt);border:1px solid var(--vora);border-radius:10px;padding:9px 12px}
main{max-width:1200px;margin:0 auto;padding:20px}
.login{max-width:380px;margin:12vh auto 0;background:var(--panell);border:1px solid var(--vora);border-radius:22px;padding:30px;box-shadow:0 30px 60px -20px #000c;text-align:center}
.login h2{font-family:'Press Start 2P',monospace;font-size:16px;color:var(--groc);margin:10px 0 22px;line-height:1.6}
.login input{width:100%;margin-bottom:12px;padding:13px 14px}
.login .btn{width:100%;padding:14px}
.err{color:#fca5a5;font-weight:800;min-height:1.3em;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panell);border:1px solid var(--vora);border-radius:16px;padding:14px 16px}
.kpi small{color:var(--suau);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.6px}
.kpi b{display:block;font-size:28px;font-weight:900;color:#fff;margin-top:4px}
.pest{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pest button{font:inherit;font-weight:900;background:#ffffff10;color:var(--txt);border:1px solid var(--vora);border-radius:999px;padding:8px 16px;cursor:pointer}
.pest button.on{background:var(--groc);color:#1e1b4b;border-color:var(--groc)}
.caixa{background:var(--panell);border:1px solid var(--vora);border-radius:18px;overflow:hidden}
.filtres{display:flex;gap:8px;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--vora)}
.filtres input{flex:1;min-width:160px}
.taula{overflow:auto;max-height:70vh}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:#1c2360;text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--suau);padding:10px 12px;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid #ffffff10;vertical-align:top}
tr.clic{cursor:pointer}tr.clic:hover td{background:#ffffff0a}
.nom{font-weight:900;color:#fff}
.xip{display:inline-block;border-radius:999px;padding:2px 9px;font-weight:800;font-size:12px;background:#ffffff14;margin:1px 2px 1px 0;white-space:nowrap}
.pc{font-weight:900}.v{color:#4ade80}.t{color:#fbbf24}.r{color:#f87171}
.ev-entra{background:#1d4ed855}.ev-fitxa{background:#0ea5e955}.ev-test{background:#7c3aed66}.ev-joc{background:#db277755}.ev-examen{background:#dc262666}.ev-oberta{background:#ea580c55}.ev-valora{background:#16a34a55}.ev-temps{background:#47556966}.ev-targetes{background:#0891b255}
.sessio{border-top:1px solid var(--vora);padding:14px 16px}
.sessio h3{margin:0 0 8px;font-size:15px}
.gestio{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--vora)}
.btn.perill{background:#7f1d1d;border-color:#ef4444;box-shadow:none}
#gest{flex-basis:100%}.gest-f{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.gest-f input{flex:1;min-width:180px}
.gest-n{color:var(--suau);font-weight:700;font-size:13px;margin:6px 0 0}
.avis-ok{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#14532d;border:2px solid #4ade80;color:#fff;font-weight:900;padding:12px 18px;border-radius:14px;z-index:99}
.est-assig{margin:6px 0 12px}
.fest{display:grid;grid-template-columns:minmax(150px,200px) 1fr 44px;gap:8px;align-items:center;margin:4px 0;font-weight:800;font-size:14px}
.bfe{height:10px;background:#ffffff14;border-radius:6px;overflow:hidden}.bfe i{display:block;height:100%;background:linear-gradient(90deg,#fbbf24,#f59e0b);border-radius:6px}
.fest b{text-align:right;color:#fde68a}
.sessio h3 small{color:var(--suau);font-weight:700}
.linia{display:flex;gap:10px;font-size:14px;padding:3px 0}
.linia time{color:var(--suau);font-weight:800;min-width:46px}
.buit{padding:30px;text-align:center;color:var(--suau);font-weight:800}
.det-cap{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--vora);flex-wrap:wrap}
.det-cap h2{margin:0;font-size:22px}
/* ---- tauler ---- */
.tf{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.tf label{font-weight:900;color:var(--suau);font-size:13px}
.kpi .dl{font-size:13px;font-weight:900;margin-left:6px}.dl.up{color:#4ade80}.dl.dn{color:#f87171}.dl.eq{color:var(--suau)}
.kpi em{display:block;font-style:normal;color:var(--suau);font-weight:700;font-size:12px;margin-top:2px}
.graella{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,520px),1fr));gap:14px;margin-bottom:14px}
.pan{background:var(--panell);border:1px solid var(--vora);border-radius:18px;padding:14px 16px;min-width:0}
.pan h3{margin:0 0 4px;font-size:16px}.pan .sub{color:var(--suau);font-weight:700;font-size:12.5px;margin:0 0 10px}
.pan.ample{grid-column:1/-1}
.cv{position:relative;height:260px}
.calor{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10.5px;font-weight:800;color:var(--suau)}
.calor i{display:block;aspect-ratio:1;border-radius:3px;background:#ffffff0d}.calor span{text-align:center}
.dom{overflow:auto}
.dm-as{margin:14px 0 18px}.dm-as h4{margin:0 0 8px;font-size:16px}
.dm-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:0 0 10px}
.dm-nen{background:#0b1033;border:1px solid var(--vora);border-radius:12px;padding:8px 10px;cursor:pointer}.dm-nen:hover{border-color:#a5b4fc}
.dm-nen b{display:flex;justify-content:space-between;font-size:14px}.dm-nen small{color:var(--suau);font-weight:700;font-size:12px}
.dm-bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:#ffffff14;margin:5px 0 3px}.dm-bar i{display:block;height:100%}
.dm-t{width:auto;border-collapse:separate;border-spacing:0 3px;font-size:13.5px}
.dm-t th{position:static;background:none;text-transform:none;letter-spacing:0;font-size:13px;color:#fff;padding:4px 6px;text-align:center;white-space:nowrap}
.dm-t th:first-child{text-align:left;color:var(--suau)}
.dm-t td{padding:3px 6px;border:0;text-align:center;vertical-align:middle}.dm-t td.tm{text-align:left;font-weight:800;color:#e2e8f0;min-width:200px}
.dm-t tr:hover td{background:#ffffff08}
.dm-c{display:inline-block;min-width:46px;border-radius:8px;padding:4px 6px;font-weight:900;color:#0b1033}.dm-c.buit{background:transparent;color:#ffffff33}.dm-c.fx{background:#ffffff14;color:#cbd5e1}
.dm-lleg{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;font-weight:800;color:var(--suau);margin-top:6px}.dm-lleg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.fq{display:grid;grid-template-columns:1fr 150px;gap:6px 12px;padding:9px 0;border-top:1px solid #ffffff10;font-size:14px}
.fq:first-of-type{border-top:0}.fq b{color:#fff}.fq small{color:var(--suau);font-weight:700;display:block;margin-top:2px}
.fq .bar{height:9px;background:#ffffff14;border-radius:6px;overflow:hidden;margin-top:4px}.fq .bar i{display:block;height:100%;background:linear-gradient(90deg,#f97316,#ef4444)}
.fq .ok{color:#4ade80}.fq .pa{color:#fca5a5}
.al{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid #ffffff10;font-weight:700;font-size:14px}.al:first-child{border-top:0}
.al .g3{color:#f87171}.al .g2{color:#fbbf24}.al .g1{color:var(--suau)}
.cst{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:8px;align-items:center;margin:5px 0;font-weight:800;font-size:14px}
.cst .bfe i{background:linear-gradient(90deg,#22d3ee,#0284c7)}
.avis-sql{background:#7c2d12;border:2px solid #fb923c;border-radius:14px;padding:12px 16px;font-weight:800;margin-bottom:14px}
details.pend summary{cursor:pointer;color:var(--suau);font-weight:800;padding:6px 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
</head>
<body>
<div class="top"><h1>🔐 ADMIN · BONA NOTA</h1><small id="vadm" style="color:var(--suau);font-weight:800;font-size:12px"></small><span class="esp"></span><span id="eines" hidden>
 <select id="dies"><option value="1">Avui</option><option value="7" selected>7 dies</option><option value="30">30 dies</option><option value="365">Tot el curs</option></select>
 <button class="btn sec" id="refresca">↻ Actualitza</button> <button class="btn sec" id="surt">Surt</button></span>
 <a href="../" class="btn sec" style="text-decoration:none">← Inici</a></div>
<main id="app"></main>
<div id="errG" class="avis-sql" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;z-index:99"></div>

<script>
window.addEventListener("error",e=>{const b=document.getElementById("errG");if(b){b.style.display="block";b.textContent="⚠️ Error del tauler (envia-ho a Claude): "+(e.message||e)+(e.lineno?" · línia "+e.lineno:"")}});
window.addEventListener("unhandledrejection",e=>{const b=document.getElementById("errG");if(b){b.style.display="block";b.textContent="⚠️ Error del tauler (envia-ho a Claude): "+((e.reason&&e.reason.message)||e.reason)}});
const VERSIO_ADMIN="5-11 12:50";
const API="https://xbtlgjucvrdcmkgmxvzy.supabase.co/rest/v1/rpc/bn_admin_logs",KEY="sb_publishable_0qCYDBqe_j5w9_ifCXeeyw_s76eEjzb";
const ASSIGS={socials:"🌍 Socials (clima)",biogeo:"🔭 Bio i Geo",castellano:"📝 Castellano",comarques:"🗺️ Comarques",divisibilitat:"➗ Mates (divisibilitat)"};
const app=document.getElementById("app"),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CRED=null,LOGS=[],VISTA="tauler",FILTRE={q:"",assig:"",event:""};
try{CRED=JSON.parse(sessionStorage.getItem("bn_admin")||"null")}catch(e){}

function login(msg){
 $("#eines").hidden=true;
 app.innerHTML=`<form class="login" id="fl"><div style="font-size:46px">🔐</div><h2>ZONA<br>ADMIN</h2>
 <input type="email" id="em" placeholder="Correu" autocomplete="username" required>
 <input type="password" id="pw" placeholder="Contrasenya" autocomplete="current-password" required>
 <button class="btn">Entra ▶</button><div class="err" id="err">${esc(msg||"")}</div></form>`;
 $("#fl").onsubmit=async e=>{e.preventDefault();$("#err").textContent="Comprovant…";
  CRED={e:$("#em").value.trim(),p:$("#pw").value};if(await carrega()){try{sessionStorage.setItem("bn_admin",JSON.stringify(CRED))}catch(e){}}};
}
let IDS={};const idDe=k=>IDS[k]?`<span class="xip" title="Número d'identificació">#${IDS[k]}</span>`:`<span class="xip" title="Encara sense PIN" style="opacity:.6">sense PIN</span>`;
async function carrega(){
 try{const r=await fetch(API,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_email:CRED.e,p_pass:CRED.p,p_dies:+$("#dies").value})});
  if(!r.ok){CRED=null;sessionStorage.removeItem("bn_admin");login(r.status===404?"El panell encara no està activat a la base de dades.":"Correu o contrasenya incorrectes.");return false}
  LOGS=await r.json();try{const ri=await fetch(API.replace("bn_admin_logs","bn_admin_ids"),{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify({p_email:CRED.e,p_pass:CRED.p})});IDS={};if(ri.ok)(await ri.json()).forEach(x=>IDS[x.k]=x.id)}catch(e){}
  $("#eines").hidden=false;pinta();return true;
 }catch(e){login("No hi ha connexió. Torna-ho a provar.");return false}
}

const fmtT=s=>{s=Math.round(s||0);const h=Math.floor(s/3600),m=Math.round((s%3600)/60);return h?`${h} h ${m} min`:`${m} min`};
const dataH=ts=>new Date(ts).toLocaleString("ca-ES",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const hora=ts=>new Date(ts).toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"});
const cpc=pc=>`<span class="pc ${pc>=80?"v":pc>=50?"t":"r"}">${pc}%</span>`;
const clauNen=l=>l.nom.trim().toLowerCase();
function descriu(l){const d=l.detall||{};switch(l.event){
 case"entra":return d.nou?"Perfil nou creat ✨":`Entra · ⭐ ${d.punts??0} · ${d.aprovats??0}/${d.temes??"?"} temes aprovats`;
 case"fitxa":return `Llegeix la fitxa: <b>${esc(d.titol||d.tema)}</b>${d.s?` · ${fmtT(d.s)}${d.fi?" · fins al final ✅":""}`:""}`;
 case"targetes":return `Targetes de <b>${esc(d.titol||d.tema)}</b>: ${d.vistes}/${d.n} vistes · ${d.girs||0} girs · ${fmtT(d.s)}`;
 case"test":return `Test de <b>${esc(d.titol||d.tema)}</b>: ${d.bones}/${d.n} · ${cpc(d.pc)}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"joc":return `Joc <b>${esc(d.titol||d.joc)}</b>: ${cpc(d.pc)}${d.enc!=null?` · ${d.enc} encerts, ${d.err} errors`:""}${d.mode&&d.joc==="mapa43"?` · ${esc(d.mode)}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"examen":return `🏆 ${d.joc==="examreal"?"Examen de veritat":"Examen sorpresa"}: ${cpc(d.pc)}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"oberta":if(d.mode==="control")return `📒 Quadern · punts de control (${esc(d.tema||"")}): ${cpc(d.pc)} bé a la primera${d.pasos?` (${esc(d.pasos)})`:""}`;
   if(d.mode==="foto")return `📷 Foto del quadern (${esc(d.tema||"")}): ${d.ok?(d.correcte?"tot correcte":"hi ha trobat un error"):`no s'ha pogut corregir (${esc(d.error||"?")})`}`;
   return `Pregunta oberta (${esc(d.tema||"")}): ${cpc(d.pc)} de les idees clau${d.s?` · ${fmtT(d.s)}`:""}`;
 case"valora":return `Valora <b>${esc(d.titol||d.tema)}</b>: ${esc(d.v)}`;
 case"temps":return `⏱ ${fmtT(d.s)} estudiant`;
 default:return esc(JSON.stringify(d))}}
const xipEv=e=>`<span class="xip ev-${esc(e)}">${esc(e)}</span>`;

function nens(){const m={};LOGS.forEach(l=>{const k=clauNen(l);const n=m[k]||(m[k]={nom:l.nom,assigs:new Set(),ses:new Set(),ap:new Set(),ult:l.ts,temps:0,tests:[],jocs:0,exam:[],punts:{},fonts:{},fts:{}});
 n.assigs.add(l.assig);n.ses.add(l.sessio);n.ap.add(l.aparell);if(l.ts>n.ult)n.ult=l.ts;const d=l.detall||{};
 if(l.event==="temps")n.temps+=d.s||0;if(l.event==="test")n.tests.push(d.pc);if(l.event==="joc")n.jocs++;if(l.event==="examen")n.exam.push(d.pc);
 if(d.punts!=null&&(n.punts[l.assig]==null||d.punts>n.punts[l.assig]))n.punts[l.assig]=d.punts;
 if(d.fonts&&(!n.fts[l.assig]||l.ts>n.fts[l.assig])){n.fonts[l.assig]={f:d.fonts,p:d.punts||0};n.fts[l.assig]=l.ts}});
 return Object.entries(m).map(([k,n])=>({k,...n})).sort((a,b)=>b.ult.localeCompare(a.ult))}
const mitj=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;

function pinta(){
 if(VISTA==="tauler")return pintaTauler();
 const N=nens(),ses=new Set(LOGS.map(l=>l.sessio)).size,temps=LOGS.filter(l=>l.event==="temps").reduce((a,l)=>a+(l.detall.s||0),0),tests=LOGS.filter(l=>l.event==="test").map(l=>l.detall.pc);
 app.innerHTML=`<div class="kpis">
  <div class="kpi"><small>Nens</small><b>${N.length}</b></div><div class="kpi"><small>Sessions</small><b>${ses}</b></div>
  <div class="kpi"><small>Temps d'estudi</small><b>${fmtT(temps)}</b></div><div class="kpi"><small>Tests fets</small><b>${tests.length}</b></div>
  <div class="kpi"><small>Nota mitjana tests</small><b>${tests.length?mitj(tests)+"%":"—"}</b></div><div class="kpi"><small>Registres</small><b>${LOGS.length}</b></div></div>
 ${pestanyes()}<div class="pest" style="display:none"><button data-v="nens" class="${VISTA==="nens"?"on":""}">👤 Nens</button><button data-v="sessions" class="${VISTA==="sessions"?"on":""}">🕹 Sessions</button><button data-v="log" class="${VISTA==="log"?"on":""}">📜 Log complet</button></div>
 <div class="caixa" id="cont"></div>`;
 lligaPest();
 const c=$("#cont");if(!LOGS.length){c.innerHTML=`<div class="buit">Encara no hi ha cap registre en aquest període.</div>`;return}
 if(VISTA==="nens")vistaNens(c,N);else if(VISTA==="sessions")vistaSessions(c,LOGS);else vistaLog(c);
}
function vistaNens(c,N){
 c.innerHTML=`<div class="taula"><table><thead><tr><th>Nom</th><th>Assignatures</th><th>Última vegada</th><th>Sessions</th><th>Temps</th><th>Tests</th><th>Mitjana</th><th>Jocs</th><th>Examen (millor)</th><th>⭐ Punts</th><th>Dispositius</th></tr></thead><tbody>
 ${N.map(n=>`<tr class="clic" data-k="${esc(n.k)}"><td class="nom">${esc(n.nom)} ${idDe(n.k)}</td><td>${[...n.assigs].map(a=>`<span class="xip">${esc(ASSIGS[a]||a)}</span>`).join("")}</td><td>${dataH(n.ult)}</td><td>${n.ses.size}</td><td>${fmtT(n.temps)}</td><td>${n.tests.length}</td><td>${n.tests.length?cpc(mitj(n.tests)):"—"}</td><td>${n.jocs}</td><td>${n.exam.length?cpc(Math.max(...n.exam)):"—"}</td><td>${Object.entries(n.punts).map(([a,p])=>`${esc((ASSIGS[a]||a).split(" ")[0])} ${p}`).join(" · ")||"—"}</td><td>${n.ap.size}</td></tr>`).join("")}</tbody></table></div>`;
 c.querySelectorAll("tr.clic").forEach(tr=>tr.onclick=()=>detall(tr.dataset.k));
}
function blocSessions(ls){const g={};ls.forEach(l=>(g[l.sessio]=g[l.sessio]||[]).push(l));
 return Object.values(g).map(a=>a.sort((x,y)=>x.ts.localeCompare(y.ts))).sort((a,b)=>b[0].ts.localeCompare(a[0].ts)).map(a=>{
  const t=a.filter(l=>l.event==="temps").reduce((s,l)=>s+(l.detall.s||0),0);
  return `<div class="sessio"><h3><span class="nom">${esc(a[0].nom)}</span> · ${esc(ASSIGS[a[0].assig]||a[0].assig)} <small>· ${dataH(a[0].ts)} → ${hora(a[a.length-1].ts)} · ${fmtT(t)} · ${a.length} accions</small></h3>
  ${a.map(l=>`<div class="linia"><time>${hora(l.ts)}</time><span>${descriu(l)}</span></div>`).join("")}</div>`}).join("")}
function vistaSessions(c,ls){c.innerHTML=`<div class="taula">${blocSessions(ls)}</div>`}
function vistaLog(c){

 const ratxa=s=>{let n=0,d=new Date(avui);if(!s.has(iso(d)))d.setDate(d.getDate()-1);while(s.has(iso(d))){n++;d.setDate(d.getDate()-1)}return n};

 $("#tCst").innerHTML=L.length?L.map(x=>`<div class="cst"><span style="color:${colorNen(x.nom)}">${esc(x.nom)}</span><div class="bfe"><i style="width:${Math.round(x.dies.size*100/mx)}%"></i></div><span>${x.dies.size} dies · ${Math.round(x.min)} min${ratxa(x.dies)>1?` · 🔥 ${ratxa(x.dies)}`:""}</span></div>`).join(""):`<div class="buit">Sense activitat en aquest període.</div>`}
function tDomini(dom){if(!dom.length){$("#tDom").innerHTML=`<div class="buit">Encara no hi ha activitat de temes en aquest període.</div>`;return}
 // tots els temes de cada assignatura, en l'ordre del món (de preguntes.json), encara que ningú no els hagi fet
 const temesDe=a=>{const m=new Map();Object.entries(PREG||{}).forEach(([k,v])=>{const [as,t]=k.split("/");if(as===a&&!t.startsWith("j-")&&!m.has(t))m.set(t,v.tema)});
  dom.filter(x=>x.assig===a).forEach(x=>{if(!m.has(x.tema))m.set(x.tema,x.titol||x.tema)});return [...m.entries()]};
 const estat=c=>!c?"no":c.millor==null?"fitxa":c.millor>=70?"aprovat":"suspes";
 const COL={aprovat:"#4ade80",suspes:"#f87171",fitxa:"#64748b",no:"#ffffff14"};
 let h="";
 [...new Set(dom.map(x=>x.assig))].forEach(a=>{const ds=dom.filter(x=>x.assig===a),temes=temesDe(a),
   noms=[...new Map(ds.map(x=>[x.nom.trim().toLowerCase(),x.nom])).values()].sort((x,y)=>x.localeCompare(y,"ca"));
  const cel=(n,t)=>ds.find(x=>x.tema===t&&x.nom.trim().toLowerCase()===n.trim().toLowerCase());
  // resum per nen: barra apilada aprovats / suspesos / només fitxa / sense fer
  const res=noms.map(n=>{const c={aprovat:0,suspes:0,fitxa:0,no:0};temes.forEach(([t])=>c[estat(cel(n,t))]++);const N=temes.length;
   return `<div class="dm-nen" data-n="${esc(n)}" title="Toca per veure-ho tot només d'aquest nen"><b><span style="color:${colorNen(n)}">${esc(n)}</span><span>${c.aprovat}/${N}</span></b>
    <div class="dm-bar">${["aprovat","suspes","fitxa"].map(k=>c[k]?`<i style="width:${c[k]*100/N}%;background:${COL[k]}"></i>`:"").join("")}</div>
    <small>${c.aprovat} aprovats · ${c.suspes} per millorar · ${c.fitxa} només llegits · ${c.no} sense obrir</small></div>`}).join("");
  // taula: una fila per tema (nom sencer, en horitzontal) i una columna per nen
  const files=temes.map(([t,tit])=>`<tr><td class="tm">${esc(tit)}</td>${noms.map(n=>{const c=cel(n,t),e=estat(c);
   const tip=c?`${n} · ${tit}\n${c.intents} intents de test · millor ${c.millor??"—"}% · última ${c.ultima??"—"}%${c.valoracio?` · diu «${c.valoracio}»`:""}${c.segons_estudi?` · ${Math.round(c.segons_estudi/60)} min de fitxa/targetes`:""}`:`${n} · ${tit}: encara no l'ha obert`;
   return `<td title="${esc(tip)}">${e==="no"?`<span class="dm-c buit">·</span>`:e==="fitxa"?`<span class="dm-c fx">📖</span>`:`<span class="dm-c" style="background:${colPc(c.millor)}">${c.millor}${c.intents>1?`<small style="font-weight:800;opacity:.7"> ×${c.intents}</small>`:""}</span>`}</td>`}).join("")}</tr>`).join("");
  h+=`<div class="dm-as"><h4>${esc(ASSIGS[a]||a)} <span class="xip">${temes.length} temes</span></h4><div class="dm-res">${res}</div>
   <div style="overflow:auto"><table class="dm-t"><thead><tr><th>Tema</th>${noms.map(n=>`<th style="color:${colorNen(n)}">${esc(n)}</th>`).join("")}</tr></thead><tbody>${files}</tbody></table></div></div>`});
 $("#tDom").innerHTML=h+`<div class="dm-lleg"><span><i style="background:#4ade80"></i>90-100</span><span><i style="background:#a3e635"></i>70-89</span><span>(aprovat = 70 o més)</span><span><i style="background:#fbbf24"></i>50-69</span><span><i style="background:#f87171"></i>menys de 50</span><span>📖 només ha llegit la fitxa</span><span>· sense obrir</span><span>×3 = intents</span></div>`;
 $("#tDom").querySelectorAll(".dm-nen").forEach(x=>x.onclick=()=>{TF.nom=x.dataset.n;pintaTauler();scrollTo(0,0)})}
