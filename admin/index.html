<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · Bona Nota</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23facc15'/><path d='m16 6 3 6.2 6.8 1-4.9 4.8 1.2 6.8L16 21.6l-6.1 3.2 1.2-6.8L6.2 13.2l6.8-1z' fill='%231e1b4b'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================== Bona Nota · panell d'admin =====================
   Tot amb variables: colors, espais (4/8/12/16/24/32), radis (8/12) i ombres, per al tema clar i el fosc. */
:root{
 --bg:#f5f6fa;--card:#fff;--card2:#f8fafc;--text:#0f172a;--muted:#4a5568;--soft:#64748b;--border:#e3e7ef;--border2:#cbd3e1;--grid:#eef1f6;
 --primary:#4f46e5;--primary-h:#4338ca;--primary-soft:#eef2ff;--on-primary:#fff;
 --ok:#15803d;--ok-bg:#dcfce7;--warn:#b45309;--warn-bg:#fef3c7;--bad:#b91c1c;--bad-bg:#fee2e2;--info:#1d4ed8;--info-bg:#eff6ff;--info-bd:#bfdbfe;
 --logo:#facc15;--heat:79,70,229;
 --d90b:#15803d;--d90t:#fff;--d70b:#bbf7d0;--d70t:#14532d;--d50b:#fde68a;--d50t:#78350f;--d0b:#fecaca;--d0t:#7f1d1d;--dfxb:#e2e8f0;--dfxt:#334155;
 --sh1:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.07);--sh2:0 12px 32px -12px rgba(15,23,42,.28);--focus:0 0 0 3px rgba(79,70,229,.3);
 --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r1:8px;--r2:12px;--menu:248px;--dalt:0px;
 color-scheme:light}
[data-tema="fosc"]{
 --bg:#0b1120;--card:#111827;--card2:#0f172a;--text:#e5e7eb;--muted:#a7b0c0;--soft:#94a3b8;--border:#1f2a3c;--border2:#334155;--grid:#1c2638;
 --primary:#818cf8;--primary-h:#a5b4fc;--primary-soft:#1e1b4b;--on-primary:#0b1120;
 --ok:#4ade80;--ok-bg:#052e1a;--warn:#fbbf24;--warn-bg:#3a2905;--bad:#f87171;--bad-bg:#3b0d0d;--info:#93c5fd;--info-bg:#0c1d3a;--info-bd:#1e3a6e;
 --heat:129,140,248;
 --d90b:#22c55e;--d90t:#052e16;--d70b:#14532d;--d70t:#bbf7d0;--d50b:#713f12;--d50t:#fde68a;--d0b:#7f1d1d;--d0t:#fecaca;--dfxb:#1f2a3c;--dfxt:#cbd5e1;
 --sh1:0 1px 2px rgba(0,0,0,.45);--sh2:0 12px 32px -12px rgba(0,0,0,.75);--focus:0 0 0 3px rgba(129,140,248,.4);
 color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:96px}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
body.demo{--dalt:34px}
h1,h2,h3,h4{line-height:1.25}
a{color:var(--primary)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.salta{position:absolute;left:-9999px;top:8px;z-index:400;background:var(--card);color:var(--text);padding:8px 12px;border-radius:var(--r1);box-shadow:var(--sh2)}
.salta:focus{left:12px}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-4px}
.muted{color:var(--muted)}
/* franja del mode demo */
.demo-bar{position:fixed;top:0;left:0;right:0;height:34px;z-index:90;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--warn-bg);color:var(--warn);font-weight:600;font-size:13px;border-bottom:1px solid var(--border)}
.demo-bar a{color:inherit}
/* ---- menú lateral ---- */
.menu{position:fixed;top:var(--dalt);bottom:0;left:0;width:var(--menu);background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:50;overflow-y:auto;overflow-x:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:18px 18px 14px;font-weight:700;font-size:15px;white-space:nowrap}
.logo-m{width:32px;height:32px;flex:none}
.logo-t span{color:var(--muted);font-weight:600}
.menu nav{display:flex;flex-direction:column;gap:2px;padding:8px 10px}
.nav-b{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r1);color:var(--muted);font-weight:600;cursor:pointer;white-space:nowrap}
.nav-b:hover{background:var(--card2);color:var(--text)}
.nav-b[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.nav-b:focus-visible{outline:2px solid var(--primary)}
.menu .sub{display:flex;flex-direction:column;margin:2px 0 6px 30px;border-left:1px solid var(--border)}
.menu .sub button{all:unset;cursor:pointer;padding:5px 12px;font-size:13px;color:var(--muted);border-radius:0 6px 6px 0}
.menu .sub button:hover{color:var(--text);background:var(--card2)}
.menu .sub button:focus-visible{outline:2px solid var(--primary)}
.menu-peu{margin-top:auto;padding:10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.menu-peu small{color:var(--soft);font-size:11.5px;padding:6px 12px 2px}
.principal{margin-left:var(--menu);min-width:0;padding-top:var(--dalt)}
/* ---- capçalera ---- */
.cap{position:sticky;top:var(--dalt);z-index:30;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.cap h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.filtres-g{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.act{display:flex;align-items:center;gap:10px}
.act small{color:var(--muted);font-size:12.5px;white-space:nowrap}
main{padding:24px;max-width:1640px}
/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:600;font-size:13.5px;line-height:1.3;border-radius:var(--r1);padding:8px 14px;border:1px solid transparent;cursor:pointer;background:var(--primary);color:var(--on-primary);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--primary-h)}
.btn.sec{background:var(--card);color:var(--text);border-color:var(--border2)}
.btn.sec:hover{background:var(--card2)}
.btn.perill{background:var(--bad);color:#fff;border-color:var(--bad)}
[data-tema="fosc"] .btn.perill{color:#1f0606}
.btn.perill-sec{background:var(--card);color:var(--bad);border-color:var(--bad)}
.btn.perill-sec:hover{background:var(--bad-bg)}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn.petit{padding:6px 10px;font-size:13px}
.btn.ample{width:100%}
.btn-ic{all:unset;box-sizing:border-box;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:var(--r1);color:var(--muted);cursor:pointer}
.btn-ic:hover{background:var(--card2);color:var(--text)}
.btn-ic:focus-visible{outline:2px solid var(--primary)}
.btn-ic:disabled{opacity:.45;cursor:not-allowed}
.btn-ic.perill:hover{color:var(--bad);background:var(--bad-bg)}
.linkb{all:unset;cursor:pointer;color:var(--primary);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.linkb:hover{text-decoration:underline}
.linkb:focus-visible{outline:2px solid var(--primary);border-radius:4px}
input,select{font:inherit;font-size:13.5px;color:var(--text);background:var(--card);border:1px solid var(--border2);border-radius:var(--r1);padding:7px 10px;min-height:36px;max-width:100%}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:var(--focus)}
.seg{display:inline-flex;background:var(--card2);border:1px solid var(--border);border-radius:var(--r1);padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:5px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--text);box-shadow:var(--sh1)}
.seg button:focus-visible{outline:2px solid var(--primary)}
#difModes{flex-wrap:wrap;max-width:100%}
.cerca{display:flex;align-items:center;gap:8px;border:1px solid var(--border2);border-radius:var(--r1);background:var(--card);padding:0 10px;min-height:36px;flex:1;min-width:180px;max-width:360px}
.cerca:focus-within{border-color:var(--primary);box-shadow:var(--focus)}
.cerca input{border:0;box-shadow:none!important;padding:7px 0;min-height:34px;flex:1;min-width:0;background:transparent}
.cerca .ic{color:var(--soft)}
/* ---- targetes i graella ---- */
.graella{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c-12{grid-column:span 12}.c-8{grid-column:span 8}.c-6{grid-column:span 6}.c-4{grid-column:span 4}
@media (max-width:1099px){.c-8,.c-6,.c-4{grid-column:span 12}}
.targeta{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh1);padding:14px 16px;min-width:0}
.targeta-cap{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 10px}
.targeta-cap-t{display:inline-flex;align-items:center;gap:7px;min-width:0;flex-wrap:wrap}
.targeta>h2,.targeta-cap>h2,.targeta-cap-t>h2,.seccio-t{display:inline-flex;align-items:center;gap:7px;margin:0;font-size:15px;font-weight:600}
.targeta>h2{margin-bottom:8px}
.targeta>h2 .ic,.targeta-cap>h2 .ic,.targeta-cap-t>h2 .ic{color:var(--soft)}
.targeta .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.btn-ajuda{all:unset;box-sizing:border-box;cursor:pointer;display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;border:1px solid var(--border2);background:var(--card2);color:var(--muted);font-size:11.5px;font-weight:700;font-style:italic;font-family:Georgia,serif;line-height:1;flex:none}
.btn-ajuda:hover,.btn-ajuda[aria-expanded="true"]{background:var(--primary-soft);color:var(--primary);border-color:var(--primary)}
.btn-ajuda:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.ajuda-box{margin:0 0 12px;padding:8px 12px;border-radius:var(--r1);background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:12.5px;line-height:1.45}
.seccio{scroll-margin-top:96px}
.grup{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:16px 0 8px}
.grup:first-of-type{margin-top:6px}
.eines-t{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.eines-t .esp{flex:1}
/* xifres clau (màx 6 a Inici, màx 4 a la resta; sense subtítols) */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.kpis.kpis-6{grid-template-columns:repeat(6,minmax(0,1fr))}
.kpis.kpis-4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1199px){.kpis.kpis-6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.kpis.kpis-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);box-shadow:var(--sh1);padding:11px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi-t{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi-v{font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;font-variant-numeric:tabular-nums}
.kpi-p{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:20px;margin-top:2px}
.kpi-s{font-size:12px;color:var(--muted)}
.kpi.avis{border-color:var(--warn)}
.kpi.avis .kpi-v{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;line-height:1.55;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.info{background:var(--info-bg);color:var(--info)}.pill.neutre{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.pill-mon{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600;line-height:1.55;white-space:nowrap;background:var(--mb,var(--card2));color:var(--mt,var(--text));border:1px solid var(--mbd,var(--border))}
.pill-mon i{width:7px;height:7px;border-radius:50%;background:var(--mc,#64748b);flex:none}
.vs{font-size:11.5px;color:var(--muted)}
.xip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;background:var(--card2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.xa{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.xa i{width:8px;height:8px;border-radius:50%;flex:none}
.pc{font-weight:600;font-variant-numeric:tabular-nums}.pc.ok{color:var(--ok)}.pc.warn{color:var(--warn)}.pc.bad{color:var(--bad)}
/* etiquetes per tipus d'esdeveniment */
.ev{display:inline-flex;align-items:center;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ev-entra{background:#e0e7ff;color:#3730a3}.ev-fitxa{background:#e0f2fe;color:#075985}.ev-targetes{background:#cffafe;color:#155e75}
.ev-test{background:#ede9fe;color:#5b21b6}.ev-joc{background:#fce7f3;color:#9d174d}.ev-examen{background:#fee2e2;color:#991b1b}
.ev-oberta{background:#ffedd5;color:#9a3412}.ev-valora{background:#dcfce7;color:#166534}.ev-temps{background:#f1f5f9;color:#334155}
[data-tema="fosc"] .ev-entra{background:#1e1b4b;color:#c7d2fe}[data-tema="fosc"] .ev-fitxa{background:#082f49;color:#bae6fd}[data-tema="fosc"] .ev-targetes{background:#083344;color:#a5f3fc}
[data-tema="fosc"] .ev-test{background:#2e1065;color:#ddd6fe}[data-tema="fosc"] .ev-joc{background:#500724;color:#fbcfe8}[data-tema="fosc"] .ev-examen{background:#450a0a;color:#fecaca}
[data-tema="fosc"] .ev-oberta{background:#431407;color:#fed7aa}[data-tema="fosc"] .ev-valora{background:#052e16;color:#bbf7d0}[data-tema="fosc"] .ev-temps{background:#1e293b;color:#cbd5e1}
/* taules compactes (~36 px d'alçada de fila, màx 8 cols, cerca local i CSV) */
.tb-bloc{display:flex;flex-direction:column;gap:8px;min-width:0}
.tb-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tb-bar .cerca{min-height:32px;max-width:260px;min-width:140px;padding:0 8px}
.tb-bar .cerca input{min-height:30px;padding:4px 0;font-size:12.5px}
.tb-bar .tb-meta{margin-left:auto;display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.taula-w{overflow:auto;border:1px solid var(--border);border-radius:var(--r1);background:var(--card)}
.taula-w.alta{max-height:max(380px,calc(100vh - 240px))}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;z-index:1;background:var(--card2);color:var(--muted);font-weight:600;font-size:11.5px;text-align:left;padding:7px 10px;height:32px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:5px 10px;height:36px;border-bottom:1px solid var(--border);vertical-align:middle}
td.num,td.nw{white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.cur{max-width:520px}
th button.ord{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:inherit}
th button.ord:hover{color:var(--text)}
th button.ord:focus-visible{outline:2px solid var(--primary);border-radius:4px}
th button.ord .ic{width:14px;height:14px;opacity:.55}
th[aria-sort="ascending"] button.ord .ic,th[aria-sort="descending"] button.ord .ic{opacity:1;color:var(--primary)}
tr.clic{cursor:pointer}
tr.clic:hover td{background:var(--primary-soft)}
tr.clic:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
tr.det td{background:var(--card2)}
.mini{display:inline-flex;align-items:center;gap:8px;justify-content:flex-end}
.mini .b{width:64px;height:6px;border-radius:99px;background:var(--grid);overflow:hidden}
.mini .b i{display:block;height:100%;background:var(--primary);border-radius:99px}
.mini .b i.bad{background:var(--bad)}
.q-t{font-weight:600}
.q-s{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.q-s .ok{color:var(--ok);font-weight:600}.q-s .pa{color:var(--bad);font-weight:600}
/* avatars: els sprites de pixel art del rànquing (../sprites.js) */
.av{position:relative;display:inline-block;flex:none;width:30px;height:30px;border-radius:50%;background:var(--av,#64748b);box-shadow:0 0 0 1px rgba(15,23,42,.18)}
.av-cl{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;background:repeating-conic-gradient(#1d16311a 0 25%,transparent 0 50%) 0 0/8px 8px,var(--av,#64748b)}
.av-cl .spr{display:block;width:84%;height:auto;shape-rendering:crispEdges}
/* insígnia del perfil arcade que el nen ha triat a /perfil/ (bn_aspectes), a la cantonada del cercle */
.av .av-sk{position:absolute;right:-6px;bottom:-4px;width:16px;height:16px;border-radius:5px;background:#1d1631;border:1px solid #facc15;display:grid;place-items:center;z-index:1}
.av .av-sk .spr{width:11px;display:block;shape-rendering:crispEdges}
.av.g{width:68px;height:68px}.av.g .av-cl{background-size:14px 14px}
.av.p{width:22px;height:22px}
.nen{display:inline-flex;align-items:center;gap:10px;font-weight:600;min-width:0}
.nen-b{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-weight:600}
.nen-c{display:inline-flex;align-items:center;gap:8px}
.nen-b:hover>span:last-child{text-decoration:underline}
.nen-b:focus-visible{outline:2px solid var(--primary);border-radius:6px}
.punt{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
/* estats: esquelets, buit, avisos, toasts, diàlegs */
.esq{background:linear-gradient(90deg,var(--grid) 25%,var(--card2) 40%,var(--grid) 60%);background-size:400% 100%;animation:esq 1.4s ease infinite;border-radius:var(--r1)}
@keyframes esq{0%{background-position:100% 50%}100%{background-position:0 50%}}
.esq-kpi{height:108px;border-radius:var(--r2)}.esq-t{height:14px;width:160px;margin:18px 0 10px}.esq-g{height:320px;border-radius:var(--r2)}.esq-f{height:42px;margin:8px 0}
.buit{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--muted);padding:32px 16px}
.buit .ic{width:30px;height:30px;color:var(--soft);margin-bottom:4px}
.buit b{color:var(--text);font-weight:600}
.avis{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--info-bd);border-radius:var(--r2);padding:14px 16px;background:var(--info-bg);color:var(--text)}
.avis>.ic{color:var(--info);margin-top:2px}
.avis p{margin:0 0 8px}
.avis.err{border-color:var(--bad);background:var(--bad-bg)}.avis.err>.ic{color:var(--bad)}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;background:var(--card);border:1px solid var(--border);padding:2px 6px;border-radius:6px}
.toasts{position:fixed;right:16px;bottom:16px;z-index:300;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
.toast{pointer-events:auto;background:var(--card);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--ok);box-shadow:var(--sh2);border-radius:var(--r1);padding:10px 14px;display:flex;gap:8px;align-items:center;max-width:380px;font-weight:500;animation:entra .2s ease}
.toast .ic{color:var(--ok)}
.toast.avis-t{border-left-color:var(--warn)}.toast.avis-t .ic{color:var(--warn)}
.toast.err-t{border-left-color:var(--bad)}.toast.err-t .ic{color:var(--bad)}
@keyframes entra{from{transform:translateY(8px);opacity:0}}
#errG{display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:310}
dialog{border:0;border-radius:var(--r2);padding:0;width:min(500px,calc(100vw - 32px));background:var(--card);color:var(--text);box-shadow:var(--sh2)}
dialog::backdrop{background:rgba(15,23,42,.55)}
.dlg-c{padding:20px 24px}
.dlg-c h2{display:flex;align-items:center;gap:10px;margin:0 0 10px;font-size:17px}
.dlg-c h2 .ic{color:var(--bad)}
.dlg-c p{margin:0 0 10px;color:var(--muted)}
.dlg-c ul{margin:0 0 10px;padding-left:20px}
.dlg-c label{display:block;font-weight:600;font-size:13px;margin:6px 0 6px}
.dlg-c input,.dlg-c select{width:100%}
.dlg-p{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:12px 24px;border-top:1px solid var(--border);background:var(--card2);border-radius:0 0 var(--r2) var(--r2)}
.dlg-c .irreversible{display:flex;gap:8px;align-items:center;color:var(--bad);font-weight:600;font-size:13px;margin:12px 0 0}
/* fitxa del nen */
.fitxa-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.fitxa-sel{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.fitxa-sel label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.fitxa-sel select{min-width:165px;max-width:250px}
.perfil{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.perfil h2{font-size:21px;margin:0;font-weight:700}
.xips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pestanyes{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:16px 0 14px;overflow-x:auto;max-width:100%}
.pestanyes.compacta{margin:0 0 14px}
.filtres-loc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.cp-det{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0 16px}
.cp-det div,.cp-det dd,.cp-det dt{min-width:0}
.cp-det div{padding:8px 10px;border-radius:var(--r1);background:var(--card2);border:1px solid var(--border);font-size:12.5px}
.cp-det b{display:block;font-size:15px;margin-top:2px;font-variant-numeric:tabular-nums}
.obe-txt{margin:8px 0 0;padding:10px 12px;border-radius:var(--r1);background:var(--card2);border:1px solid var(--border);font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.pestanyes button{all:unset;cursor:pointer;padding:9px 13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.pestanyes button:hover{color:var(--text)}
.pestanyes button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.pestanyes button:focus-visible{outline:2px solid var(--primary);border-radius:4px}
.perill-z{border:1px solid var(--bad);border-radius:var(--r2);background:var(--card);margin-top:0;overflow:hidden}
.perill-z>h2{display:flex;align-items:center;gap:8px;margin:0;padding:14px 20px;color:var(--bad);font-size:15.5px;background:var(--bad-bg)}
.perill-z>p{margin:0;padding:10px 20px 0;color:var(--muted);font-size:13px}
.pz-fila{display:flex;align-items:center;gap:16px;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border);flex-wrap:wrap}
.pz-fila:first-of-type{border-top:0}
.pz-fila b{display:block;font-weight:600}
.pz-fila p{margin:2px 0 0;color:var(--muted);font-size:13px;max-width:640px}
.pz-fila .btn{flex:none}
#gest{padding:0 20px 14px}
.nodemo{font-size:12px;color:var(--muted);display:block;text-align:right;margin-top:4px}
/* sessions (línia de temps) i estrelles */
.ses{padding:12px 0;border-top:1px solid var(--border)}
.ses:first-child{border-top:0}
.ses h3{font-size:14px;margin:0 0 6px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-weight:600}
.ses h3 small{color:var(--muted);font-weight:500}
.lin{display:flex;gap:12px;font-size:13.5px;padding:3px 0}
.lin time{color:var(--muted);min-width:44px;flex:none}
.fest{display:grid;grid-template-columns:minmax(140px,210px) minmax(60px,1fr) 52px;gap:10px;align-items:center;margin:6px 0;font-size:13.5px}

.bfe{height:8px;background:var(--grid);border-radius:99px;overflow:hidden}

.est-assig{margin:4px 0 18px}

/* fitxa: pestanya «Al núvol» (bn_admin_fitxa) i targeta «Nens nous» de la vista Nens (bn_admin_altes) */

.nv-perfil{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}

.nv-f{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px}

td.tmn{min-width:180px}td.tfa{min-width:230px}td.trq{min-width:230px}
td.tfa .nv-f{max-width:340px}td.trq .nv-q{max-width:460px}

/* tauler: alertes, calor, domini, constància, gràfics */
.al{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--border)}
.al:first-child{border-top:0}
.al>.ic{color:var(--soft);margin-top:2px}
.al .txt{flex:1;min-width:0}
.al .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
details.mes summary{cursor:pointer;color:var(--muted);font-weight:600;padding:10px 0 4px}
.cv{position:relative;height:280px}
.calor-w{overflow-x:auto}
.calor{display:grid;grid-template-columns:28px repeat(24,minmax(12px,1fr));gap:3px;font-size:11px;color:var(--muted);min-width:520px}
.calor i{display:block;aspect-ratio:1;border-radius:3px;background:var(--grid)}
.calor span{text-align:center;line-height:1.6}

.llegenda{display:flex;align-items:center;gap:8px 14px;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap}

.llegenda .bands i{flex:1}
.llegenda .q{display:inline-flex;align-items:center;gap:5px}
.llegenda .q i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dm-eines{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.dm-eines>span{color:var(--muted);font-size:13px}
.dm-bts{display:flex;gap:8px;flex-wrap:wrap}
.dm-as{border:1px solid var(--border);border-radius:var(--r2);background:var(--card);margin:0 0 10px;overflow:hidden;transition:border-color .15s,box-shadow .15s}
.dm-as[open]{border-color:var(--border2);box-shadow:var(--sh1)}
.dm-cap{list-style:none;cursor:pointer;position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto minmax(170px,260px);align-items:center;gap:14px;padding:12px 16px 12px 18px;user-select:none;-webkit-user-select:none}
.dm-cap::-webkit-details-marker{display:none}

.dm-cap:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.dm-as[open]>.dm-cap{background:var(--card2);border-bottom:1px solid var(--border)}
.dm-xev{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r1);color:var(--soft);transition:transform .2s ease}
.dm-cap:hover .dm-xev{color:var(--text)}
.dm-as:not([open]) .dm-xev{transform:rotate(-90deg)}
.dm-tit{display:flex;flex-direction:column;min-width:0}
.dm-nom{font-weight:700;font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.dm-avs{display:flex;align-items:center;padding-left:6px}
.dm-avs .av{margin-left:-6px;box-shadow:0 0 0 2px var(--card)}
.dm-as[open] .dm-avs .av{box-shadow:0 0 0 2px var(--card2)}
.dm-avs .mes{margin-left:6px;font-size:12px;font-weight:600;color:var(--muted)}
.dm-prog{display:flex;flex-direction:column;gap:5px;min-width:0}
.dm-prog .dm-bar{margin:0}
.dm-prog small{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}
.dm-prog small b{color:var(--text);font-weight:700}
.dm-pit{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-cos{padding:14px 16px 16px}
@media (max-width:767px){.dm-cap{grid-template-columns:auto minmax(0,1fr);row-gap:8px;padding:12px 14px 12px 16px}.dm-avs{display:none}.dm-prog{grid-column:1/-1}.dm-cos{padding:12px}}
.dm-res{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin:0 0 12px}
.dm-nen{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card2);border:1px solid var(--border);border-radius:var(--r1);padding:10px 12px;display:block}
.dm-nen:hover{border-color:var(--primary)}
.dm-nen:focus-visible{outline:2px solid var(--primary)}
.dm-nen .dn{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600}
.dm-nen small{color:var(--muted);font-size:12px}
.dm-bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--grid);margin:8px 0 4px}
.dm-bar i{display:block;height:100%}
.dm-t td,.dm-t th{text-align:center}
.dm-t td.tm,.dm-t th.tm{text-align:left;min-width:220px;white-space:normal}
.dm-c{display:inline-block;min-width:44px;border-radius:6px;padding:2px 6px;font-weight:600;font-size:12.5px}
.dm-c small{font-weight:500;opacity:.8}
.b90{background:var(--d90b);color:var(--d90t)}.b70{background:var(--d70b);color:var(--d70t)}.b50{background:var(--d50b);color:var(--d50t)}.b0{background:var(--d0b);color:var(--d0t)}.bfx{background:var(--dfxb);color:var(--dfxt)}
.dm-c.buit{color:var(--soft);background:transparent}
.cst{display:grid;grid-template-columns:minmax(110px,160px) minmax(60px,1fr) auto;gap:10px;align-items:center;margin:8px 0;font-size:13.5px}
.cst .r{color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
/* benestar (n2540, supabase/bn_admin_benestar.sql): semàfor per nen, motius, mons i dates d'examen */
.bs-avis,.fr-nota{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;padding:8px 12px;border-radius:var(--r1);background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:12.5px}
.bs-avis .ic,.fr-nota .ic{width:16px;height:16px;margin-top:1px;color:var(--soft)}
.bs-res{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 10px;font-size:13px;color:var(--muted)}
.bs-l,.bs-m,.bs-vg,.bs-ll{list-style:none;margin:0;padding:0}
.bs-l{border:1px solid var(--border);border-radius:var(--r1)}
.bs-f{display:grid;grid-template-columns:92px minmax(150px,210px) minmax(0,1fr);gap:8px 16px;align-items:start;padding:10px 14px;border-top:1px solid var(--border)}
.bs-f:first-child{border-top:0}
.bs-sem{justify-self:start;margin-top:4px}
.bs-sem i{width:8px;height:8px;border-radius:50%;background:currentColor}
.bs-n{min-width:0;padding-top:2px}
.bs-n .nen,.bs-n .nen-b{max-width:100%}
.bs-n .nen-b>span:last-child,.bs-n .nen>span:last-child{overflow-wrap:anywhere}
.bs-m{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.bs-x{display:inline-flex;align-items:baseline;gap:7px;max-width:100%;border-radius:var(--r1);padding:4px 10px;font-size:13px;font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.bs-x>i{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none;transform:translateY(-1px)}
.bs-x.vermell{background:var(--bad-bg);color:var(--bad)}.bs-x.groc{background:var(--warn-bg);color:var(--warn)}.bs-x.blau{background:var(--info-bg);color:var(--info)}
.bs-x.bo{background:var(--ok-bg);color:var(--ok)}.bs-x.context{background:var(--card2);color:var(--muted);border:1px solid var(--border)}
.bs-x.res{background:transparent;color:var(--muted);padding-left:0}
.bs-mons{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.bs-mon{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;border:1px solid var(--border);border-radius:var(--r1);background:var(--card);padding:12px 14px 12px 18px;overflow:hidden}
.bs-mon::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mc,#94a3b8)}
.bs-mon h4{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0;font-size:14px;font-weight:700}
.bs-mon h4>span:first-child{min-width:0;overflow-wrap:anywhere}
.bs-mon p{margin:0;color:var(--muted);font-size:12.5px}
.bs-vg{display:flex;flex-direction:column;gap:4px}
.bs-vg li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12.5px;color:var(--muted)}
.bs-ex{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px;padding-top:10px;border-top:1px solid var(--border)}
.bs-ex label{width:100%;font-size:12.5px;font-weight:600;color:var(--text)}
.bs-ex input{flex:1 1 140px;min-width:0;max-width:190px}
.bs-ll{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px 24px;padding:6px 0 4px;font-size:12.5px;color:var(--muted)}
.bs-ll b{color:var(--text);font-weight:600}
#tBen .grup{margin-top:22px}
@media (max-width:767px){.bs-f{grid-template-columns:auto minmax(0,1fr);padding:10px 12px}.bs-m{grid-column:1/-1}.bs-sem{margin-top:3px}.bs-ll{grid-template-columns:minmax(0,1fr)}.bs-mons{grid-template-columns:minmax(0,1fr)}}
/* combos i repàs (M3) i errors pendents de la colla (M4) · supabase/bn_admin_fonts_rep.sql: xifres amb el color de la font, gràfic i plegables */
.fr-k .kpi-t{display:flex;align-items:center;gap:6px}
.fr-k .kpi-t .punt{width:10px;height:10px;border-radius:3px}
#tCom .grup,#tRep .grup{margin-top:22px}
.fr-altres .cv{height:240px;margin:6px 0 14px}
.fr-altres .fest{grid-template-columns:minmax(150px,230px) minmax(60px,1fr) 52px}
.fr-l{display:none;font-size:11.5px;font-weight:500;color:var(--muted)}
/* al mòbil, cada tema dels errors pendents és un bloc: el títol i les preguntes a tota l'amplada, i les tres xifres en una fila */

 #tRep .taula-w table,#tRep .taula-w tbody{display:block}#tRep .taula-w thead{display:none}

 #tRep .taula-w tr:last-child{border-bottom:0}
 #tRep .taula-w td{padding:0;border:0;text-align:left;min-width:0}#tRep .taula-w td.tmn,#tRep .taula-w td.tfa{grid-column:1/-1}
 #tRep .fr-l{display:block}#tRep td .mini{justify-content:flex-start}}

.xm-c{flex:1;min-width:0}

.xm-t{margin:2px 0 0;font-size:14.5px;overflow-wrap:anywhere}
.xm-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.xm-a{display:flex;align-items:center;gap:6px;flex:none}

.xm-v .ic{width:15px;height:15px}
.xm.esb .xm-t,.xm.esb>.av{opacity:.6}
.xt{font-weight:700;border-radius:3px;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.xt.P{background:var(--primary-soft);color:var(--primary)}.xt.J{background:var(--warn-bg);color:var(--warn)}

.sw{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;min-height:32px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}

.sw i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(15,23,42,.35);transition:transform .15s}

.sw:disabled{opacity:.55;cursor:not-allowed}
.xs{display:flex;align-items:center;gap:8px 12px;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap}

 if(LOGS_DIES===DIES)return LOGS;

  const r=await fetch(API,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:cosL});

  while(Array.isArray(L)&&L.length>0&&L.length%1000===0&&L.length<20000){
   try{const rp=await fetch(`${API}?limit=1000&offset=${L.length}`,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:cosL});
    if(!rp.ok)break;const pag=await rp.json();if(!Array.isArray(pag)||!pag.length||pag[0].id===L[0].id)break;L.push(...pag);if(pag.length<1000)break}catch(e){break}}
  LOGS=Array.isArray(L)?L:[];LOGS_DIES=d;return LOGS;
 })();
 LOGS_PROM={d,p};p.catch(()=>{if(LOGS_PROM&&LOGS_PROM.p===p)LOGS_PROM=null});return p;
}

function llegeixUrl(){
 const sp=new URLSearchParams(location.search);
 const p=sp.get("p");if(p&&DIES_DE_P[p])DIES=DIES_DE_P[p];
 let v=(sp.get("v")||"").trim().toLowerCase(),id=(sp.get("id")||"").trim()||null,tab=(sp.get("tab")||"").trim().toLowerCase()||null;
 if(v==="fitxa"&&id){v="nens"}
 if(!VISTES_OK.has(v))v="inici";
 VISTA=v;ELEM=id;FITXA=v==="nens"&&id?id:null;
 TAB=FITXA?(FITXA_TABS[tab]||"tb-resum"):(tab||TABS_DEF[v]||null);
}
function escriuUrl(push){
 const sp=new URLSearchParams();if(DEMO)sp.set("demo","1");
 if(VISTA&&VISTA!=="inici")sp.set("v",VISTA);
 if(ELEM&&(VISTA==="nens"||VISTA==="mons"))sp.set("id",ELEM);
 const defT=TABS_DEF[VISTA]||null;
 if(TAB&&TAB!==defT&&!ELEM)sp.set("tab",TAB);
 else if(TAB&&ELEM){const sl=FITXA_SLUG[TAB]||TAB;if(sl&&sl!=="resum"&&sl!=="tb-resum")sp.set("tab",sl)}
 if(DIES!==7&&VISTA!=="config")sp.set("p",P_DE_DIES[DIES]||"7d");
 const qs=sp.toString(),url=location.pathname+(qs?"?"+qs:"");
 if(url!==location.pathname+location.search){try{history[push?"pushState":"replaceState"](null,"",url)}catch(e){}}
}
function navega(v,o={}){
 if(!VISTES_OK.has(v))v="inici";
 const canviSeccio=v!==VISTA;
 if(canviSeccio){TF.assig="";TF.nom=""}
 tancaPanell();
 VISTA=v;ELEM=o.id||null;FITXA=v==="nens"&&ELEM?ELEM:null;
 TAB=FITXA?(FITXA_TABS[o.tab]||"tb-resum"):(o.tab||(ELEM?null:TABS_DEF[v]||null));
 escriuUrl(o.push!==false);
 return pinta().then(()=>{if(o.scroll!==false)scrollTo(0,0)});
}

// l'examen de mates (eines/exercicis-mates.js) registra «nota» sobre 10 en lloc de «pc»
const pcExam=d=>d.pc!=null?d.pc:d.nota!=null?Math.round(d.nota*10):null;
const REP_EXT={mx:"Taller",mapa:"MAPA",err:"Troba l'error",err_gen:"Troba l'error"};
const extRepas=x=>String(x).split(",").map(p=>{const [t,v]=p.split(":");return `${REP_EXT[t]||t} ${v||""}`.trim()}).join(", ");
function descriu(l){const d=l.detall||{};switch(l.event){
 case"entra":return d.nou?"Perfil nou creat":`Entra · ${d.punts??0} estrelles · ${d.aprovats??0}/${d.temes??"?"} temes aprovats`;
 case"fitxa":return `Llegeix la fitxa: <b>${esc(d.titol||d.tema)}</b>${d.s?` · ${fmtT(d.s)}${d.fi?" · fins al final":""}`:""}`;
 case"targetes":return `Targetes de <b>${esc(d.titol||d.tema)}</b>: ${d.vistes}/${d.n} vistes · ${d.girs||0} girs · ${fmtT(d.s)}`;
 case"test":return `Test de <b>${esc(d.titol||d.tema)}</b>: ${d.bones}/${d.n} · ${cpc(d.pc)}${d.pistes?` · ${pl(d.pistes,"pista","pistes")}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"joc":if(d.joc==="boss")return `Boss <b>${esc(d.titol||"del món")}</b>: ${d.guanya?"guanyat":"perdut"}${d.enc!=null?` · ${d.enc} encerts, ${d.err} errors`:""}${d.guanya&&d.cors!=null?` · ${pl(d.cors,"cor","cors")}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
   if(d.joc==="repas")return `Repàs dels errors: ${cpc(d.pc)}${d.apr?` · ${pl(d.apr,"error après","errors apresos")}`:""}${d.ext?` · ${esc(extRepas(d.ext))}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
   return `Joc <b>${esc(d.titol||d.joc)}</b>: ${cpc(d.pc)}${d.enc!=null?` · ${d.enc} encerts, ${d.err} errors`:""}${d.mode&&d.joc==="mapa43"?` · ${esc(d.mode)}`:""}${d.pistes?` · ${pl(d.pistes,"pista","pistes")}`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"examen":return `${d.joc==="examreal"?"Examen de veritat":d.joc==="examen"?"Examen sorpresa":"Examen de mates"}: ${d.nota!=null?`<b>${esc(String(d.nota).replace(".",","))}</b> sobre 10`:cpc(d.pc)}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"oberta":if(d.mode==="control")return `Quadern · punts de control (${esc(d.tema||"")}): ${cpc(d.pc)} bé a la primera${d.pasos?` (${esc(d.pasos)})`:""}`;
   if(d.mode==="foto")return `Foto del quadern (${esc(d.tema||"")}): ${d.ok?(d.correcte?"tot correcte":"hi ha trobat un error"):`no s'ha pogut corregir (${esc(d.error||"?")})`}`;
   return `Pregunta oberta (${esc(d.tema||"")})${d.mode==="practica"?" · pràctica":""}: ${cpc(d.pc)} de les idees clau${d.rebutjat?` · ${pl(d.rebutjat,"intent rebutjat","intents rebutjats")}`:""}${d.enganxat?` · ha intentat enganxar`:""}${d.s?` · ${fmtT(d.s)}`:""}`;
 case"valora":return `Valora <b>${esc(d.titol||d.tema)}</b>: ${esc(d.v)}`;
 case"temps":return `${fmtT(d.s)} estudiant`;
 default:return esc(JSON.stringify(d))}}
// [estrelles-pures] orígens de les estrelles (issue #13). Les fonts són comptadors que només pugen dins d'un món (un reinici
// n'esborra els registres), així que es queda el màxim de cada clau: l'últim registre pot ser d'un dispositiu nou que encara no ho sap tot.
function afegeixFonts(dest,l){const d=l.detall||{};if(d.fonts==null&&d.punts==null)return;const x=dest[l.assig]||(dest[l.assig]={f:{},p:0});
 if(d.punts!=null)x.p=Math.max(x.p,+d.punts||0);
 if(d.fonts&&typeof d.fonts==="object")Object.entries(d.fonts).forEach(([k,v])=>{if(typeof v==="number")x.f[k]=Math.max(x.f[k]||0,v)})}
// fonts de tots els nens (sumant el màxim de cada nen i món) i ritme: estrelles i segons de cada activitat que porta «est» i «s»
function resumFonts(ls){const per={},fonts={},ritme={};
 ls.forEach(l=>{const k=(l.nom||"").trim().toLowerCase();afegeixFonts(per[k]||(per[k]={}),l);const d=l.detall||{};
  if(["test","joc","examen","oberta"].includes(l.event)&&typeof d.est==="number"&&typeof d.s==="number"&&d.s>0){const r=ritme[l.event]||(ritme[l.event]={est:0,s:0});r.est+=d.est;r.s+=d.s}});
 Object.values(per).forEach(p=>Object.values(p).forEach(x=>Object.entries(x.f).forEach(([f,v])=>{fonts[f]=(fonts[f]||0)+v})));
 return {fonts,ritme}}
// [/estrelles-pures]
function ratxaDeDies(s){if(!s||!s.size)return 0;let n=0,d=diaMad();if(!s.has(d))d=sumaD(d,-1);while(s.has(d)){n++;d=sumaD(d,-1)}return n}
function nens(ls){ls=ls||LOGS;const m={};ls.forEach(l=>{const k=clauNen(l);const n=m[k]||(m[k]={nom:l.nom,assigs:new Set(),ses:new Set(),ap:new Set(),diesSet:new Set(),ult:l.ts,temps:0,tests:[],jocs:0,exam:[],punts:{},fonts:{}});
 n.assigs.add(l.assig);n.ses.add(l.sessio);n.ap.add(l.aparell);if(l.ts)n.diesSet.add(diaMad(l.ts));if(l.ts>n.ult)n.ult=l.ts;const d=l.detall||{};
 if(l.event==="temps")n.temps+=d.s||0;if(l.event==="test")n.tests.push(d.pc);if(l.event==="joc")n.jocs++;if(l.event==="examen"&&pcExam(d)!=null)n.exam.push(pcExam(d));
 if(d.punts!=null&&(n.punts[l.assig]==null||d.punts>n.punts[l.assig]))n.punts[l.assig]=d.punts;
 afegeixFonts(n.fonts,l)});
 return Object.entries(m).map(([k,n])=>({k,...n,dies:n.diesSet.size,ratxa:ratxaDeDies(n.diesSet)})).sort((a,b)=>b.ult.localeCompare(a.ult))}
const mitj=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;

// ====================== COMPONENT ÚNIC DE TAULA (màx 8 columnes, ~36 px, ordenació, cerca local i CSV) ======================
const TAULES={};
const netTxt=s=>String(s??"").replace(/<[^>]+>/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/\s+/g," ").trim();
function taula(id,cols,rows,o={}){
 const prev=TAULES[id],cs=(cols||[]).slice(0,8);
 TAULES[id]={cols:cs,rows:rows||[],k:o.k||(cs.find(c=>c.ord!==false)||{}).k,desc:o.desc!==false,q:prev&&o.manteQ?prev.q:"",fila:o.fila,etiqueta:o.etiqueta||"Taula",alta:!!o.alta,eines:o.eines!==false,csvNom:o.csvNom||id};
 const T=TAULES[id],rs=taulaFiles(T);
 const bar=T.eines?`<div class="tb-bar"><label class="cerca">${ic("cerca")}<span class="sr">Cerca a ${esc(T.etiqueta)}</span><input type="search" class="tb-q" data-tq="${esc(id)}" placeholder="Filtra…" value="${esc(T.q)}"></label><span class="tb-meta"><span class="tb-cnt">${pl(rs.length,"fila","files")}</span><button class="btn sec petit" type="button" data-tcsv="${esc(id)}">${ic("baixar")}CSV</button></span></div>`:"";
 return `<div class="tb-bloc" id="${esc(id)}" data-taula="${esc(id)}">${bar}<div class="taula-w${T.alta?" alta":""}" role="region" aria-label="${esc(T.etiqueta)}" tabindex="0">${taulaHTML(id,rs)}</div></div>`;
}
function taulaTextFila(T,r){return T.cols.map(c=>c.q?c.q(r):c.h?netTxt(c.h(r)):String(r[c.k]??"")).join(" ").toLowerCase()}
function taulaFiles(T){
 const q=(T.q||"").trim().toLowerCase();
 const rs=q?T.rows.filter(r=>taulaTextFila(T,r).includes(q)):[...T.rows];
 const c=T.cols.find(x=>x.k===T.k);
 if(c){const v=r=>c.v?c.v(r):r[c.k];rs.sort((a,b)=>{const x=v(a),y=v(b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;const r=(typeof x==="number"&&typeof y==="number")?x-y:String(x).localeCompare(String(y),"ca",{numeric:true});return T.desc?-r:r})}
 return rs;
}
function taulaHTML(id,rs0){const T=TAULES[id],rs=rs0||taulaFiles(T);
 if(!rs.length)return buit("cerca","Cap fila coincideix amb el filtre.");
 return `<table><thead><tr>${T.cols.map(x=>x.ord===false?`<th scope="col" class="${x.num?"num":""}">${x.t}</th>`
  :`<th scope="col" class="${x.num?"num":""}" aria-sort="${x.k===T.k?(T.desc?"descending":"ascending"):"none"}"><button type="button" class="ord" data-k="${x.k}">${x.t}${ic(x.k===T.k?(T.desc?"avall":"amunt"):"ordena")}</button></th>`).join("")}</tr></thead>
  <tbody>${rs.map(r=>`<tr${T.fila?T.fila(r):""}>${T.cols.map(x=>`<td class="${x.num?"num":""}${x.cls?" "+x.cls:""}">${x.h?x.h(r):esc(r[x.k]??"")}</td>`).join("")}</tr>`).join("")}</tbody></table>`}
function refrescaTaula(id){const bl=document.getElementById(id),T=TAULES[id];if(!bl||!T)return;const rs=taulaFiles(T),w=bl.querySelector(".taula-w")||bl,cnt=bl.querySelector(".tb-cnt");
 w.innerHTML=taulaHTML(id,rs);if(cnt)cnt.textContent=pl(rs.length,"fila","files")}
document.addEventListener("click",e=>{
 const b=e.target.closest("th button.ord");
 if(b){const bl=b.closest("[data-taula]")||b.closest(".taula-w"),id=bl&&bl.id,T=id&&TAULES[id];if(!T)return;const k=b.dataset.k;
  if(T.k===k)T.desc=!T.desc;else{T.k=k;T.desc=!!(T.cols.find(c=>c.k===k)||{}).num}refrescaTaula(id);const nb=bl.querySelector(`th button[data-k="${k}"]`);if(nb)nb.focus();return}
 const csv=e.target.closest("button[data-tcsv]");
 if(csv){const id=csv.dataset.tcsv,T=TAULES[id];if(!T)return;const rs=taulaFiles(T);
  const cap=T.cols.map(c=>netTxt(c.t)||c.k);
  const cos=rs.map(r=>T.cols.map(c=>c.csv?c.csv(r):c.h?netTxt(c.h(r)):r[c.k]??""));
  baixaCSV(T.csvNom,[cap,...cos]);return}
});

function faprDe(n){

  const p=Promise.all([
   preguntes(),
   rpcT("bn_admin_domini",{p_assig:null,p_nom:n.nom}).catch(e=>({__err:e})),
   rpcT("bn_admin_fallades",{p_assig:null,p_nom:n.nom}).catch(e=>({__err:e})),
   rpcR("bn_admin_fonts_dia",{p_periode:PERIODE[DIES]||"7d",p_assig:null,p_nom:n.nom}).catch(e=>({__err:e}))
  ]);
  FAPR={k:n.k,d:DIES,p};
 }
 return FAPR.p;
}

function gActivitat(act){const dies=[...new Set(act.map(a=>a.dia))].sort(),noms=[...new Set(act.map(a=>a.nom))].sort((a,b)=>a.localeCompare(b,"ca"));
 if(!dies.length){const c=$("#gAct");if(c)c.parentNode.innerHTML=buit("calendari","Sense activitat en aquest període.");return}
 const o=GOPC();o.scales.x.stacked=true;o.scales.x.grid={display:false};o.scales.y.stacked=true;o.scales.y.title={display:true,text:"minuts",color:cssV("--muted")};
 o.plugins={tooltip:{callbacks:{label:it=>`${it.dataset.label}: ${it.raw} min`}}};
 nouG("gAct",{type:"bar",data:{labels:dies.map(d=>diaC(d+"T12:00")),datasets:noms.map(n=>({label:n,backgroundColor:colorNen(n),borderRadius:3,data:dies.map(d=>{const x=act.find(a=>a.dia===d&&a.nom===n);return x?+x.minuts:0})}))},options:o})}
function tCalor(cal){const mx=Math.max(1,...cal.map(c=>(+c.minuts)+c.accions)),D=["dl","dt","dc","dj","dv","ds","dg"];
 let h=`<div class="calor-w"><div class="calor" role="img" aria-label="Mapa de calor de l'activitat per hora i dia"><span></span>${[...Array(24)].map((_,i)=>`<span class="${i%6?"h3":""}">${i%3?"":i}</span>`).join("")}`;
 for(let dw=1;dw<=7;dw++){h+=`<span class="dw">${D[dw-1]}</span>`;for(let hh=0;hh<24;hh++){const c=cal.find(x=>x.dw===dw&&x.h===hh),v=c?(+c.minuts)+c.accions:0;

 $("#tCal").innerHTML=h+`</div></div><div class="llegenda"><span>0</span><span class="esc" aria-hidden="true"></span><span>${fmtD(Math.round(mx))} (minuts + accions en una hora)</span></div>`}

  // a: món · meta: línia petita sota el nom · mig: columna del mig (opcional) · dreta: columna de la dreta (barra o resum) · cos: el que surt en desplegar
  bloc:(a,meta,mig,dreta,cos)=>`<details class="dm-as" data-a="${esc(a)}" style="--mc:${colAssig(a)}"${obert(a)?" open":""}>
   <summary class="dm-cap" title="Toca per ${obert(a)?"plegar":"desplegar"} ${esc(nomAssig(a))}"><span class="dm-xev">${ic("avall")}</span>

    <span class="dm-avs" aria-hidden="true">${mig||""}</span><span class="dm-prog">${dreta||""}</span></summary>
   <div class="dm-cos">${cos}</div></details>`,
  lliga:el=>{if(!el)return;
