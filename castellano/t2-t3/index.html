window.BN_ACT={arrel:"../../"};
// ===== ACTUALITZACIÓ AUTOMÀTICA (motor/eines/actualitza.js · el mateix codi a la portada i als mons; tot.py el copia a index.html) =====
// Cada pàgina porta escrita la versió amb què es va generar (VER: la hi posa motor/tot.py). En obrir la pàgina es pregunta
// al servidor quina versió hi ha publicada (versio.json, sense passar per cap memòria cau). Si no coincideixen, el que es veu
// és una còpia vella (memòria cau del navegador o del service worker). Llavors: s'esborren les còpies guardades de l'app
// (memòria cau «bn-…»), es demana al service worker que s'actualitzi i es torna a carregar la pàgina, UN sol cop per versió.
// MAI s'esborra el progrés, el nom ni el PIN (són a localStorage i no es toquen). Sense connexió, o obrint el fitxer a
// l'ordinador (file://), no fa res.
// En tornar a l'app després de més de 10 minuts amagada: a la portada recarrega sola; dins d'un món, com que el nen pot
// estar a mig test, només surt un avís amb un botó per actualitzar quan vulgui.
(function(){
 const C=window.BN_ACT||{},ARREL=C.arrel||"./",VER="d66eea402e",KR="bn_act_recarrega",DEU=6e5;
 if(location.protocol==="file:"||VER.indexOf("__")===0||!window.fetch)return;
 let fet=0,amagat=0;
 const quan=f=>document.body?f():document.addEventListener("DOMContentLoaded",f);
 // esborra la memòria cau de l'app i fa que el service worker es descarregui de nou (màxim 3 s)
 const neteja=()=>Promise.race([Promise.all([
   window.caches?caches.keys().then(ks=>Promise.all(ks.filter(k=>k.indexOf("bn-")===0).map(k=>caches.delete(k)))).catch(()=>{}):0,
   navigator.serviceWorker?navigator.serviceWorker.getRegistrations().then(rs=>Promise.all(rs.map(r=>r.update().catch(()=>{})))).catch(()=>{}):0]),
  new Promise(r=>setTimeout(r,3000))]);
 function avis(txt,boto){quan(()=>{let a=document.getElementById("bnAct");
  if(!a){a=document.createElement("div");a.id="bnAct";a.setAttribute("role","status");
   a.style.cssText="position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9999;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);padding:10px 14px;border-radius:14px;background:#0b1033f2;border:2px solid #facc15;color:#fff;font:800 14px/1.3 Nunito,system-ui,sans-serif;box-shadow:0 8px 24px #0009";
   document.body.appendChild(a)}
  a.innerHTML="";const t=document.createElement("span");t.textContent=txt;a.appendChild(t);
  if(boto){const b=document.createElement("button");b.type="button";b.textContent="Actualitza";
   b.style.cssText="font:900 13px Nunito,system-ui,sans-serif;color:#1e1b4b;background:#facc15;border:0;border-radius:999px;padding:8px 12px;cursor:pointer";
   b.onclick=()=>recarrega(boto,true);a.appendChild(b)}})}
 // l'adreça sense el «v=…» (la resta de paràmetres, com ?demo, es queden tal qual)
 const senseV=q=>q.replace(/([?&])v=[^&]*(&|$)/,(m,a,b)=>b?a:"").replace(/^\?$/,"");
 function recarrega(v,aMa){
  // una sola vegada per versió (si el servidor encara no serveix la nova, no entra en bucle); amb el botó, sempre
  if(!aMa){if(new RegExp("[?&]v="+v+"(&|$)").test(location.search))return;try{if(sessionStorage.getItem(KR)===v)return;sessionStorage.setItem(KR,v)}catch(e){}}
  avis("🔄 Versió nova de Bona Nota! Actualitzant…");
  const q=senseV(location.search);neteja().then(()=>location.replace(location.pathname+q+(q?"&":"?")+"v="+v+location.hash))}
 // un cop és la versió bona, treu el «?v=…» de l'adreça
 function netejaAdreca(){try{const q=senseV(location.search);if(q!==location.search)history.replaceState(history.state,"",location.pathname+q+location.hash)}catch(e){}}
 function comprova(auto){fet=Date.now();
  fetch(ARREL+"versio.json?t="+fet,{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{if(!d||!d.v)return;
   if(d.v===VER){netejaAdreca();return}
   if(auto)recarrega(d.v);else avis("✨ Hi ha una versió nova de Bona Nota.",d.v)}).catch(()=>{})}
 comprova(true);
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){amagat=Date.now();return}
  if(amagat&&Date.now()-amagat>DEU&&Date.now()-fet>DEU)comprova(!!C.tornaAuto)});
 window.bnActualitza=()=>comprova(true); // per provar-ho a mà des de la consola
})();

@keyframes mBrac{to{transform:rotate(14deg)}}@keyframes mBrac2{to{transform:rotate(-14deg)}}

.arc .masc-arc{position:relative;margin-bottom:6px;animation:mEntra .6s cubic-bezier(.3,1.6,.5,1) .15s both;filter:drop-shadow(0 6px 18px #0008)}
/* entrada de pantalles: el contingut nou apareix suau i esglaonat */
#app>*,#zona>*{animation:vEntra .34s cubic-bezier(.2,.9,.3,1) both}
#app>*:nth-child(2),#zona>*:nth-child(2){animation-delay:.04s}#app>*:nth-child(3),#zona>*:nth-child(3){animation-delay:.08s}
#app>*:nth-child(4){animation-delay:.12s}#app>*:nth-child(5){animation-delay:.16s}#app>*:nth-child(n+6){animation-delay:.2s}
@keyframes vEntra{from{opacity:0;transform:translateY(10px)}}
.grid>.tile{animation:vEntra .4s cubic-bezier(.2,.9,.3,1) both}
.grid>.tile:nth-child(2){animation-delay:.04s}.grid>.tile:nth-child(3){animation-delay:.08s}.grid>.tile:nth-child(4){animation-delay:.12s}.grid>.tile:nth-child(5){animation-delay:.16s}.grid>.tile:nth-child(n+6){animation-delay:.2s}
.tile .ic{transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
.tile:hover .ic{transform:scale(1.12) rotate(-8deg)}
.tile:active{transform:scale(.97)}
.continua{transition:transform .2s,box-shadow .2s}.continua:hover{transform:translateY(-2px);box-shadow:0 8px 20px #f59e0b33}
.continua>span:first-child,.nivell .nic{display:inline-block;animation:icFlota 3s ease-in-out infinite}
@keyframes icFlota{50%{transform:translateY(-4px) rotate(4deg)}}
.hero .av{animation:avBota 4s ease-in-out infinite;box-shadow:0 6px 16px #6366f155}
@keyframes avBota{50%{transform:translateY(-4px)}}
.cap-tema .ic{animation:mEntra .5s cubic-bezier(.3,1.6,.5,1) both}
.barra i,.barra-test i{transition:width .6s cubic-bezier(.3,1.2,.5,1)}
.barra i{animation:creix .9s cubic-bezier(.3,1.2,.5,1) both;transform-origin:left}
/* respostes del test */
.opt{transition:border-color .15s,background .15s,transform .12s}

.opt.ok{animation:optOk .5s cubic-bezier(.3,1.8,.5,1)}

.opt.ok .ll{animation:llOk .5s cubic-bezier(.3,1.8,.5,1)}

.opt.ko{animation:tremola .35s}
.fb{animation:vEntra .3s ease-out both}

.chip:active{transform:scale(.94)}.chip.ok{animation:optOk .45s cubic-bezier(.3,1.8,.5,1)}

.punts-fc i{transition:transform .25s,background .25s}

<script>
const ASSIG={
 id:"castellano",
 nom:"Lengua Castellana", tema:"Temas 2 y 3", curs:"1r ESO", ic:"📝",
 color:["#7f1d1d","#dc2626","#f59e0b"],
 peu:"Bona Nota · Lengua Castellana 1.º ESO (Carmen de Burgos, Barcanova) · Temas 2 y 3: el texto, el sustantivo, la noticia, los géneros literarios, los determinantes y la b",
 blocs:[{titol:"📄 Tema 2 · El texto y el sustantivo",n:6},{titol:"📰 Tema 3 · La noticia, la literatura y los determinantes",n:9}],
 jocs:[
  {id:"fr-texto",grup:"✍️ Frases con huecos",tipus:"frases",ic:"📄",titol:"El texto y el diccionario",sub:"Propiedades, conectores, tipos y entradas",col:"#fee2e2",
   enunciat:"✍️ Completa las frases sobre el texto, sus tipos y el diccionario",
   items:[
    {f:"Un texto debe cumplir tres propiedades: adecuación, ___ y cohesión.",ok:"coherencia",no:["polisemia","ortografía","comedia"],per:{"polisemia":"La polisemia es tener varios significados: no es una propiedad del texto.","ortografía":"La ortografía es importante, pero no es una de las tres propiedades.","comedia":"La comedia es un género de teatro."},pista:"Tema definido y orden lógico (truco A-Co-Co).",ex:"Las tres propiedades del texto son adecuación, coherencia y cohesión."},
    {f:"Si escribes al director como si fuera tu colega, fallas la ___ del texto.",r:["adecuación"],pista:"Adaptarse a quién va dirigido (con tilde en la o).",ex:"La adecuación adapta el mensaje al destinatario y a la intención."},
    {f:"Los ___ sirven para unir y relacionar entre sí las partes del texto.",r:["conectores"],pista:"Son el pegamento de la cohesión (además, sin embargo…).",ex:"Los conectores dan cohesión porque relacionan las partes del texto."},
    {f:"Para explicar algo con otras palabras usamos «___», y para contrastar, «___».",ok:["es decir","sin embargo"],no:["además","para terminar"],per:{"además":"«Además» añade información; no explica ni contrasta.","para terminar":"«Para terminar» cierra el texto."},pista:"Primero reformular; después oponer dos ideas.",ex:"«Es decir» explica con otras palabras; «sin embargo» contrasta."},
    {f:"Una receta de cocina es un texto ___, y el pronóstico del tiempo es ___.",ok:["instructivo","predictivo"],no:["dialogado","lírico"],per:{"dialogado":"El dialogado es una conversación entre personas.","lírico":"Lírico es de la poesía: expresa sentimientos."},clau:["receta","pronóstico"],pista:"Uno enseña pasos y el otro anuncia qué pasará mañana.",ex:"Receta → instructivo; pronóstico meteorológico → predictivo."},
    {f:"Tu libro de Naturales informa: es ___; un artículo que quiere convencerte es ___.",ok:["expositivo","argumentativo"],no:["narrativo","predictivo"],per:{"narrativo":"El narrativo cuenta una historia.","predictivo":"El predictivo anuncia lo que pasará."},clau:["informa","convencerte"],pista:"Dar a conocer un tema frente a defender una opinión.",ex:"Expositivo = informa; argumentativo = da razones para convencer."},
    {mots:"Una entrevista es un texto dialogado.",no:["predictivo."],pista:"Dos personas intercambian preguntas y respuestas.",ex:"En el texto dialogado dos o más personas intercambian información."},
    {f:"En el diccionario, cada palabra definida es una ___ y cada significado numerado es una ___.",ok:["entrada","acepción"],no:["estrofa","acotación"],per:{"estrofa":"La estrofa es un grupo de versos.","acotación":"La acotación es una indicación del teatro."},pista:"Primero la palabra destacada; después el 1, 2, 3…",ex:"Entrada = palabra definida; acepción = cada uno de sus significados numerados."},
    {f:"Para buscar «corrían» en el diccionario debes escribir el infinitivo ___.",r:["correr"],pista:"Los verbos aparecen terminados en -ar, -er o -ir.",ex:"En el diccionario los verbos aparecen siempre en infinitivo: correr."},
    {f:"Para buscar el adjetivo «guapas» en el diccionario buscamos ___.",r:["guapo"],pista:"Devuélvelo al masculino singular.",ex:"Sustantivos y adjetivos figuran en masculino singular en el diccionario."},
    {f:"El alfabeto castellano tiene ___ letras; «ch» y «ll» son ___.",ok:["27","dígrafos"],no:["29","vocales"],per:{"29":"Antes contaban ch y ll, pero ahora el alfabeto tiene 27 letras.","vocales":"Ch y ll son consonantes: son dígrafos."},pista:"Pares de letras que representan un único sonido.",ex:"El alfabeto tiene 27 letras; ch y ll son dígrafos."},
    {f:"En «Siéntate en este banco», el ___ nos indica qué acepción de «banco» corresponde.",ok:"contexto",no:["plural","prefijo","verso"],per:{"plural":"«Banco» está en singular; lo que decide el significado es el contexto.","prefijo":"No hay prefijo: son las palabras de alrededor.","verso":"No es un poema."},clau:"Siéntate",pista:"Las demás palabras que rodean a «banco».",ex:"El contexto permite saber qué acepción de una palabra tiene sentido en la oración."}
   ],
   final:"¡Dominas el truco A-Co-Co, los 7 tipos de texto y cómo buscar cualquier palabra en el diccionario!"},
  {id:"fr-sustantivo",grup:"✍️ Frases con huecos",tipus:"frases",ic:"🏷️",titol:"Sustantivos, género y número",sub:"Clases, colectivos y falsos amigos con el catalán",col:"#fef3c7",
   enunciat:"✍️ Completa las frases del sustantivo, el género y el número",
   items:[
    {f:"Los nombres propios de lugar son ___ y los de persona son ___.",ok:["topónimos","antropónimos"],no:["colectivos","abstractos"],per:{"colectivos":"Colectivo es un grupo (rebaño), no un nombre propio.","abstractos":"Abstracto es lo que no se toca (amistad)."},pista:"Pirineos nombra un lugar; Raúl nombra a una persona.",ex:"Topónimos = lugares; antropónimos = personas (ambos con mayúscula)."},
    {f:"El colectivo de «abeja» es ___, y el de «barco» es ___.",ok:["enjambre","flota"],no:["panal","rebaño"],per:{"panal":"El panal es donde guardan la miel, no el grupo de abejas.","rebaño":"Rebaño es el grupo de ovejas."},pista:"El grupo de abejas y el conjunto de barcos.",ex:"Abeja → enjambre (el panal es donde guardan la miel); barco → flota."},
    {f:"Un conjunto de ovejas nombrado en singular es un ___.",r:["rebaño"],pista:"Lleva eñe y es el colectivo de oveja.",ex:"Oveja (individual) → rebaño (colectivo y concreto)."},
    {f:"Un «enjambre» se puede ver y oír: aunque sea colectivo, es un sustantivo ___.",ok:"concreto",no:["abstracto","propio","verbal"],per:{"abstracto":"Lo podemos ver y oír: es concreto.","propio":"No va en mayúscula: es común.","verbal":"Es un sustantivo, no un verbo."},clau:"ver y oír",pista:"Lo percibimos con los sentidos.",ex:"Ser colectivo no significa ser abstracto: un enjambre o un rebaño son concretos."},
    {f:"El femenino de «caballo» es ___, y forman el género con palabras distintas llamadas ___.",ok:["yegua","heterónimos"],no:["caballa","invariables"],per:{"caballa":"La caballa es un pez: el femenino de caballo es yegua.","invariables":"Invariable sería el pianista / la pianista: aquí la palabra cambia del todo."},pista:"Palabras de raíz totalmente diferente, como hombre/mujer.",ex:"Caballo y yegua son heterónimos."},
    {f:"El femenino de «actor» es ___, y el masculino singular de «baronesa» es ___.",ok:["actriz","barón"],no:["actora","barones"],per:{"actora":"«Actora» no existe: es actriz.","barones":"Barones es el plural; el masculino singular es barón."},pista:"Cuidado: sin tilde y con -es sería plural.",ex:"Actor → actriz; baronesa → barón (barones es el plural)."},
    {f:"En «el pianista / la pianista», el sustantivo es ___ y el género lo marca el artículo.",ok:"invariable",no:["colectivo","heterónimo","propio"],per:{"colectivo":"Colectivo es un grupo; aquí hablamos del género.","heterónimo":"Heterónimos son palabras distintas (caballo/yegua); pianista no cambia.","propio":"No lleva mayúscula: es común."},pista:"La palabra «pianista» no cambia de terminación.",ex:"Pianista, periodista o testigo son invariables en cuanto al género."},
    {f:"Ojo con el catalán: en castellano decimos «___ calor» y «___ costumbre».",ok:["el","la"],no:["los","las"],per:{"los":"Es un solo calor y una sola costumbre: singular.","las":"Singular: el calor, la costumbre."},pista:"Calor es masculino y costumbre es femenino.",ex:"En castellano: el calor, el olor; la costumbre."},
    {f:"Otros dos cambios respecto al catalán: decimos «___ diente» y «___ señal».",ok:["el","la"],no:["los","las"],per:{"los":"Es un solo diente: singular.","las":"Es una sola señal: singular."},pista:"Diente es masculino y señal es femenino.",ex:"En castellano: el diente (m.), la señal (f.) y la nariz (f.)."},
    {f:"El plural de «ley» es ___, y el plural de «la crisis» es «las ___».",ok:["leyes","crisis"],no:["leys","crisises"],per:{"leys":"Las terminadas en -y añaden -es: leyes.","crisises":"Crisis no cambia en plural: las crisis."},pista:"Una añade -es y la otra no varía en plural.",ex:"Ley → leyes; la crisis → las crisis (igual que el atlas → los atlas)."},
    {f:"El plural del sustantivo «jersey» se escribe ___.",r:["jerséis"],per:{"jerseys":"La forma correcta en castellano es jerséis.","jerseis":"Lleva tilde en la e: jerséis."},pista:"Termina en «-éis» con tilde en la e.",ex:"Jersey forma el plural jerséis (con tilde por ser aguda terminada en -s)."},
    {mots:"Unos gatos negros concuerdan en género.",no:["gatas"],pista:"Determinante, sustantivo y adjetivo van en masculino plural.",ex:"La concordancia obliga a compartir el mismo género y número."}
   ],
   final:"¡Muy bien! Ni los colectivos ni los falsos amigos con el catalán te pillarán por sorpresa."},
  {id:"fr-coma",grup:"✍️ Frases con huecos",tipus:"frases",ic:"✏️",titol:"Comas, punto y coma y cartas",sub:"Vocativo, aclaraciones y sujeto con verbo",col:"#dcfce7",
   enunciat:"✍️ Completa las reglas y ejemplos de la coma y el punto y coma",
   items:[
    {mots:"Nunca pongas coma entre sujeto y verbo.",no:["punto"],pista:"Son inseparables: «Laura ha venido» va sin coma.",ex:"El sujeto y el verbo nunca se separan con una coma."},
    {f:"En una enumeración simple («Compré leche, pan, fruta ___ huevos») no va coma antes del último elemento.",ok:"y",no:[", y","; y",": y"],per:{", y":"En castellano no se pone coma delante de la «y» final.","; y":"Ni coma ni punto y coma delante de la «y» final.",": y":"Los dos puntos no van delante de la «y»."},pista:"La conjunción une el último elemento sin coma delante.",ex:"En castellano no se escribe coma delante de la «y» final de una enumeración simple."},
    {f:"En «Mi abuelo, cansado del viaje, se fue a dormir», las comas encierran una ___.",r:["aclaración"],pista:"Explicación intercalada en medio de la oración (con tilde).",ex:"Las aclaraciones van siempre encerradas entre dos comas."},
    {f:"En «Por favor, Eduardo, acércame la sal», «Eduardo» va entre comas porque es un ___.",r:["vocativo"],pista:"El nombre de la persona a quien nos dirigimos.",ex:"El vocativo va siempre separado con comas."},
    {f:"En «Mi hermano llegará el lunes; yo___ el martes», ese signo sustituye al verbo «llegaré».",ok:",",no:[";",":","."],per:{";":"Ya hay un punto y coma antes; aquí la coma sustituye al verbo.",":":"Los dos puntos anuncian algo; aquí falta el verbo «llegaré».",".":"La oración no acaba aquí."},clau:"el martes",pista:"Ahorra repetir el verbo que ya ha aparecido.",ex:"La coma se usa para sustituir un verbo que se sobreentiende."},
    {id:"fs66hs0",f:"«Unos alumnos estudian en la biblioteca___ otros juegan en el patio.»",ok:";",no:[":","?","!"],per:{":":"Los dos puntos anuncian algo; aquí se separan dos oraciones relacionadas.","?":"No es una pregunta.","!":"No es una exclamación."},clau:"otros",pista:"Dos oraciones relacionadas, y la segunda empieza en minúscula.",ex:"El punto y coma separa dos oraciones muy relacionadas: pausa mayor que la coma y menor que el punto."},
    {id:"fmxjkpz",f:"«Llovía mucho; ___ salió de casa.»",ok:"nadie",no:["Nadie","NADIE"],per:{"Nadie":"Detrás del punto y coma va minúscula: la oración sigue.","NADIE":"No se escribe en mayúsculas; detrás del punto y coma, minúscula."},pista:"El punto y coma no cierra la oración.",ex:"Detrás del punto y coma la palabra siguiente va en minúscula."},
    {f:"En el saludo de una carta o correo escribimos «Querido Ángel___».",ok:":",no:[",",";","."],per:{",":"Coma en el saludo es un anglicismo: en castellano, dos puntos.",";":"El punto y coma no va en el saludo.",".":"El saludo no termina con punto."},clau:"Querido",pista:"Usar coma en el saludo es un anglicismo.",ex:"Tras el saludo de una carta o mensaje se escriben dos puntos (:)."},
    {id:"f1lny6ac",f:"«Estudió mucho___ sin embargo___ no aprobó.»",ok:[";",","],no:[":","."],per:{":":"Los dos puntos no van delante de «sin embargo».",".":"Si pones punto, «sin embargo» iría en mayúscula."},clau:"sin embargo",pista:"«Sin embargo» va entre signos: delante, una pausa mayor; detrás, una coma.",ex:"Los conectores como «es decir», «o sea» y «sin embargo» van seguidos de coma (y delante, punto y coma o coma)."},
    {f:"«A pesar de la lesión___ siguió jugando hasta el final.»",ok:",",no:[":","?","!"],per:{":":"No anuncia nada: solo separa la circunstancia.","?":"No es una pregunta.","!":"No es una exclamación."},clau:"A pesar de",pista:"Va tras una circunstancia colocada al principio.",ex:"Cuando anteponemos una circunstancia al principio de la frase, ponemos coma detrás."},
    {f:"En «Pero ___de dónde vienes?», detrás de «pero» no se pone coma.",ok:"¿",no:[", ¿","; ¿",": ¿"],per:{", ¿":"Detrás de «pero» no se pone coma antes de la pregunta.","; ¿":"Ni punto y coma: la pregunta empieza directamente.",": ¿":"Ni dos puntos: la pregunta empieza directamente."},pista:"Empieza directamente la pregunta.",ex:"No se escribe coma detrás de «pero» cuando precede a una pregunta o exclamación."},
    {f:"«Camarero___ un café, por favor.» Falta el signo tras la persona a la que llamamos.",ok:",",no:[";",".","?"],per:{";":"El vocativo se separa con coma, no con punto y coma.",".":"La oración no acaba aquí.","?":"No es una pregunta."},clau:"Camarero",pista:"«Camarero» es un vocativo al inicio de la frase.",ex:"El vocativo inicial va seguido de coma: «Camarero, un café, por favor.»"}
   ],
   final:"¡Perfecto! Sujeto y verbo sin coma, vocativo entre comas y saludo de carta con dos puntos."},
  {id:"fr-noticia-lit",grup:"✍️ Frases con huecos",tipus:"frases",ic:"📰",titol:"La noticia, la lírica y los relatos",sub:"Las 5 W, fake news, teatro y narrativa",col:"#e0f2fe",
   enunciat:"✍️ Completa las frases sobre la noticia, las noticias falsas y la literatura",
   items:[
    {f:"La noticia cuenta de forma ___ un hecho actual de interés público.",ok:"objetiva",no:["inventada","secreta","rimada"],per:{"inventada":"Si es inventada, es una noticia falsa.","secreta":"La noticia es pública: se publica para todos.","rimada":"La rima es de la poesía."},pista:"Cuenta los hechos sin opinar.",ex:"La noticia debe ser objetiva y apoyarse en fuentes fiables."},
    {f:"La ___ de la noticia resume los datos clave y responde a las 5 W.",r:["entradilla"],pista:"Va justo debajo del titular.",ex:"La entradilla responde a qué, quién, dónde, cuándo y por qué (las 5 W)."},
    {f:"En el ___ de la noticia los párrafos van ordenados de ___ a menos importante.",ok:["cuerpo","más"],no:["titular","menos"],per:{"titular":"El titular es una sola frase arriba; los párrafos están en el cuerpo.","menos":"Al revés: de más a menos importante, como un embudo."},pista:"Como un embudo: arriba lo esencial y abajo los detalles.",ex:"El cuerpo desarrolla más datos y el cómo, de más a menos interés."},
    {f:"Un titular exagerado pensado solo para que pinches y ganar dinero con anuncios es ___.",r:["clickbait","ciberanzuelo"],pista:"Término inglés del libro (o «ciberanzuelo»).",ex:"El clickbait o ciberanzuelo atrae visitas con titulares exagerados."},
    {f:"Ante un mensaje anónimo que grita «¡¡REENVÍALO!!», hay que contrastarlo en medios ___.",ok:"serios",no:["anónimos","falsos","secretos"],per:{"anónimos":"Si es anónimo, no podemos saber si es fiable.","falsos":"Contrastar en medios falsos no sirve de nada.","secretos":"Los medios fiables son públicos."},clau:"anónimo",pista:"Medios de comunicación fiables y contrastados.",ex:"Para combatir las noticias falsas hay que contrastar la información en medios serios."},
    {f:"Los tres grandes géneros son la ___ (poesía), la dramática (teatro) y la ___ (narrativa).",ok:["lírica","épica"],no:["noticia","receta"],per:{"noticia":"La noticia es periodismo, no un género literario.","receta":"La receta es un texto instructivo."},pista:"Emociones del autor frente a relatos con narrador.",ex:"Los tres grandes géneros literarios son lírica, dramática y épica."},
    {f:"La lírica ___ es anónima y oral, con versos cortos transmitidos de boca en boca.",ok:"popular",no:["culta","dramática","policíaca"],per:{"culta":"La culta tiene autor conocido y es escrita.","dramática":"Dramática es el teatro.","policíaca":"Policíaca es un tipo de novela."},clau:"anónima",pista:"Del pueblo, a diferencia de la lírica culta.",ex:"Lírica popular = anónima y oral; lírica culta = de autor conocido y escrita."},
    {f:"En el teatro, las ___ van entre paréntesis e indican gestos, vestuario o decorado.",r:["acotaciones"],pista:"Los actores no las dicen en voz alta.",ex:"Las acotaciones son las indicaciones escénicas del autor teatral."},
    {f:"Un cuento breve protagonizado por animales que deja una enseñanza es una ___.",r:["fábula"],pista:"Lleva tilde en la primera sílaba.",ex:"La fábula es un relato corto protagonizado por animales."},
    {f:"El ___ tiene dioses y héroes; en cambio, la ___ parte de algo real con elementos mágicos.",ok:["mito","leyenda"],no:["ensayo","comedia"],per:{"ensayo":"El ensayo da opiniones en prosa.","comedia":"La comedia es teatro con final feliz."},clau:["dioses","real"],pista:"El Minotauro frente a Sant Jordi o el Cid.",ex:"Mito = dioses y creencias; leyenda = hecho, personaje o lugar real + fantasía."},
    {f:"La ___ es una narración extensa en prosa dividida en capítulos.",r:["novela"],pista:"Mucho más larga y compleja que el cuento.",ex:"La novela es un relato extenso con varios personajes y dividido en capítulos."},
    {mots:"Bécquer escribió leyendas y Andersen recopiló cuentos.",no:["tragedias"],pista:"Recuerda los nombres de la página 83.",ex:"Bécquer escribió sus propias leyendas; Grimm, Perrault y Andersen recopilaron cuentos."}
   ],
   final:"¡Genial! Ya distingues entradilla y cuerpo, fake news y clickbait, y mito y leyenda."},
  {id:"fr-determinantes",grup:"✍️ Frases con huecos",tipus:"frases",ic:"👉",titol:"Artículos, demostrativos y numerales",sub:"El aula, este/ese/aquel, posesivos y cuantificadores",col:"#ede9fe",
   enunciat:"✍️ Completa las frases sobre los determinantes",
   items:[
    {mots:"El determinante va siempre delante del sustantivo.",no:["detrás"],pista:"Es el portero que presenta al nombre.",ex:"El determinante precede siempre al sustantivo; si va detrás, deja de ser determinante."},
    {f:"Por empezar con a- tónica, en singular decimos «___ aula» y en plural, «___ aulas».",ok:["el","las"],no:["la","los"],per:{"la":"Delante de «a» tónica se usa «el», aunque aula sea femenino: el aula.","los":"Aula es femenino: en plural, las aulas."},clau:"a- tónica",pista:"Aula sigue siendo un sustantivo femenino.",ex:"Con a- tónica femenina usamos el/un en singular (el aula), pero las/unas en plural (las aulas)."},
    {id:"f1r0ks18",f:"«Volvimos ___ colegio después ___ partido.»",ok:["al","del"],no:["a el","de el"],per:{"a el":"A + el se contrae: al.","de el":"De + el se contrae: del."},pista:"A + el y de + el se juntan en una sola palabra.",ex:"En castellano contraemos a + el = al y de + el = del."},
    {f:"En castellano los nombres propios de persona van sin artículo: «___ ha llegado».",ok:"Marta",no:["La Marta","Una Marta","El Marta"],per:{"La Marta":"En catalán se dice «la Marta», pero en castellano los nombres de persona van sin artículo.","Una Marta":"Sin artículo: Marta ha llegado.","El Marta":"Ni artículo ni masculino: Marta ha llegado."},pista:"Evita poner «la» delante como en catalán.",ex:"Los nombres de persona no llevan artículo delante en castellano."},
    {f:"Los demostrativos indican tres distancias: ___ (cerca), ___ (intermedia) y ___ (lejos).",ok:["este","ese","aquel"],no:["mi","algún"],per:{"mi":"«Mi» es posesivo, no demostrativo.","algún":"«Algún» es indefinido."},pista:"Aquí, ahí y allí.",ex:"Cercanía: este; distancia intermedia: ese; lejanía: aquel."},
    {f:"En «este libro», «este» es ___; en «el chico ese», va detrás y funciona como ___.",ok:["determinante","adjetivo"],no:["pronombre","verbo"],per:{"pronombre":"Va con un sustantivo («libro»): no es pronombre.","verbo":"No es una acción."},pista:"Fíjate en su posición respecto al sustantivo.",ex:"Delante del sustantivo es determinante; detrás del sustantivo es adjetivo."},
    {f:"«Detrás nuestro» es incorrecto; debemos decir «detrás de ___».",r:["nosotros","nosotras"],pista:"Los adverbios como «detrás» no llevan posesivo.",ex:"No se usan posesivos tras adverbios como detrás o debajo: se dice «detrás de nosotros»."},
    {f:"En «Ese chico, ___ padre es médico, vive aquí», falta un determinante relativo-posesivo.",r:["cuyo"],pista:"Palabra de cuatro letras que indica de quién es el padre.",ex:"Cuyo, cuya, cuyos y cuyas son determinantes relativo-posesivos."},
    {f:"El cardinal 23 se escribe en una sola palabra y con tilde: ___.",r:["veintitrés"],pista:"Hasta el 30 van unidos en una palabra.",ex:"Los cardinales hasta el 30 se escriben en una sola palabra; veintitrés lleva tilde."},
    {f:"Desde el 31 escribimos tres palabras con «y»: el 36 es «___».",r:["treinta y seis"],pista:"Con «y» griega en medio, nunca «i».",ex:"A partir del 31 se escriben separados con «y»: treinta y seis."},
    {f:"En «¿___ goles habéis marcado?», esa palabra delante de «goles» es el determinante interrogativo.",ok:"Cuántos",no:["habéis","marcado","Quién"],per:{"habéis":"«Habéis» es verbo, no determinante.","marcado":"«Marcado» es verbo.","Quién":"«Quién» no puede ir delante de un sustantivo."},clau:"goles",pista:"Va pegada delante del sustantivo «goles».",ex:"Solo «Cuántos» acompaña al sustantivo; «habéis marcado» es el verbo."},
    {f:"En «¿Quién viene hoy?», «quién» va sin sustantivo detrás y es un ___.",ok:"pronombre",no:["determinante","artículo","adjetivo"],per:{"determinante":"Un determinante va delante de un sustantivo, y aquí no hay ninguno.","artículo":"Los artículos son el, la, los, las, un…","adjetivo":"No acompaña a ningún sustantivo."},pista:"Sustituye a la persona por la que preguntas.",ex:"Sin sustantivo detrás, quién es pronombre interrogativo (y dónde es adverbio)."}
   ],
   final:"¡De diez! Tienes controlados artículos, demostrativos, posesivos y cuantificadores."},
  {id:"fr-polisemia-b",grup:"✍️ Frases con huecos",tipus:"frases",ic:"🅱️",titol:"Polisemia y reglas de la B",sub:"Verbos precisos y palabras donde el catalán engaña",col:"#ffedd5",
   enunciat:"✍️ Completa las frases de polisemia y ortografía de la B",
   items:[
    {f:"«Puente», «banco» y «canguro» son palabras ___ porque tienen varios significados.",ok:"polisémicas",no:["monosémicas","colectivas","compuestas"],per:{"monosémicas":"Mono- es «uno»: tienen varios significados, son polisémicas.","colectivas":"No nombran grupos.","compuestas":"No están formadas por dos palabras."},pista:"Poli- significa «muchos».",ex:"Una palabra polisémica tiene varios significados y el contexto elige cuál."},
    {f:"«Abrelatas», «rinoceronte» y «litio» tienen un solo significado: son ___.",ok:"monosémicas",no:["polisémicas","abstractas","interrogativas"],per:{"polisémicas":"Tienen un solo significado: son monosémicas.","abstractas":"Se pueden ver y tocar.","interrogativas":"No hacen preguntas."},pista:"Mono- significa «uno».",ex:"Las palabras monosémicas tienen un único significado."},
    {f:"Sustituye «hizo» por un verbo preciso: «Con la lana sobrante ___ una bufanda».",r:["tejió"],pista:"Del verbo tejer, en pasado y con tilde en la o.",ex:"Cambiamos el verbo comodín «hacer» por uno preciso: tejió una bufanda."},
    {f:"Sustituye «haré» por un verbo preciso: «El mes que viene ___ trece años».",r:["cumpliré"],pista:"En castellano los años se cumplen (en futuro).",ex:"En lugar de «hacer años», usamos el verbo preciso cumplir: cumpliré trece años."},
    {f:"Después de «m» va siempre «b»: el vehículo sanitario con sirena es una ___.",r:["ambulancia"],pista:"Se escribe con «mb»: am-bu-lan-cia.",ex:"Detrás de m siempre se escribe b: cambio, ambulancia, sombra."},
    {f:"Ayer nosotros ___ (estar) ensayando mientras tú ___ (cantar).",ok:["estábamos","cantabas"],no:["estávamos","cantavas"],per:{"estávamos":"El imperfecto en -aba va siempre con b: estábamos.","cantavas":"El imperfecto en -aba va siempre con b: cantabas."},clau:"Ayer",pista:"El imperfecto en -aba siempre lleva b (y nosotros lleva tilde).",ex:"El pretérito imperfecto de los verbos en -ar (-aba, -abas, -ábamos) va siempre con b."},
    {f:"Las tres excepciones de «-bir» van con «v»: ___ (el agua a 100 °C), ___ (la mesa) y ___ (en un piso).",ok:["hervir","servir","vivir"],no:["escribir","recibir"],per:{"escribir":"Escribir es con b: es de los verbos normales en -bir.","recibir":"Recibir es con b: no es excepción."},pista:"Mira la pista entre paréntesis detrás de cada hueco.",ex:"Se escriben con b los verbos en -bir (escribir, recibir) menos hervir, servir y vivir."},
    {f:"En catalán es «aprovat», pero en castellano viene de «prueba» y se escribe ___.",r:["aprobado"],pista:"Toda la familia de probar va con b.",ex:"Prueba → probar → aprobado → aprobación: siempre con b."},
    {f:"En catalán es «govern», pero en castellano se escribe ___.",r:["gobierno"],pista:"De la familia de gobernar, con b.",ex:"Gobierno y gobernar se escriben con b aunque en catalán lleven v."},
    {f:"En catalán es «envernissar», pero en castellano decimos ___ los muebles.",r:["barnizar"],pista:"Empieza por «bar-» y acaba en «-izar».",ex:"Barniz y barnizar van con b (igual que gabardina y jabalina)."},
    {f:"Las palabras que empiezan por «bu-», «bus-» y «bur-» llevan «b», como una ___ de jabón.",r:["burbuja"],pista:"Empieza por «bur-» y flota en el aire.",ex:"Se escriben con b las palabras que empiezan por bu-, bus- y bur- (buscar, burbuja)."},
    {mots:"Después de eme escribimos siempre be.",no:["uve."],pista:"Como en «cambio» o «ambulancia».",ex:"Regla sin excepciones: después de m siempre se escribe b."}
   ],
   final:"¡Brutal! Ya dominas los verbos precisos y todas las trampas de la B entre catalán y castellano."},
  {id:"fr-interferencias",grup:"✍️ Frases con huecos",tipus:"frases",ic:"🔀",titol:"¿Catalán o castellano?",sub:"Las trampas que vienen del catalán",col:"#fef9c3",
   enunciat:"🔀 Elige la forma correcta en castellano (¡cuidado con el catalán!)",
   items:[
    {f:"Me duele ___ diente de abajo.",ok:"el",no:["la","lo"],per:{"la":"En catalán es «la dent», pero en castellano diente es masculino: el diente.","lo":"«Lo» no acompaña a sustantivos masculinos: el diente."},pista:"En catalán es femenino; en castellano, no.",ex:"Catalán: la dent · Castellano: <b>el diente</b>."},
    {f:"Tengo ___ costumbre de leer antes de dormir.",ok:"la",no:["el","lo"],per:{"el":"En catalán es «el costum», pero en castellano costumbre es femenino.","lo":"Costumbre es femenino: la costumbre."},pista:"En castellano termina en -bre y es femenino.",ex:"Catalán: el costum · Castellano: <b>la costumbre</b>."},
    {f:"Para ___ postre hay flan.",ok:"el",no:["las","la"],per:{"las":"En catalán es «les postres», pero en castellano es masculino y singular: el postre.","la":"Postre es masculino: el postre."},pista:"En castellano es masculino singular.",ex:"Catalán: les postres · Castellano: <b>el postre</b>."},
    {f:"Para cruzar, espera ___ señal verde.",ok:"la",no:["el","lo"],per:{"el":"En catalán es «el senyal», pero en castellano señal es femenino.","lo":"Señal es femenino: la señal."},pista:"En castellano es femenino.",ex:"Catalán: el senyal · Castellano: <b>la señal</b>."},
    {f:"Me encanta ___ olor de las rosas.",ok:"el",no:["la","lo"],per:{"la":"En catalán es «l'olor» (femenino), pero en castellano olor es masculino.","lo":"Olor es masculino: el olor."},pista:"En castellano es masculino, como el calor.",ex:"Catalán: l'olor (f.) · Castellano: <b>el olor</b>."},
    {f:"Hace mucho calor; ___ calor de agosto es terrible.",ok:"el",no:["la","lo"],per:{"la":"En catalán es «la calor», pero en castellano calor es masculino.","lo":"Calor es masculino: el calor."},pista:"En castellano es masculino.",ex:"Catalán: la calor · Castellano: <b>el calor</b>."},
    {f:"___ ha llegado tarde a clase.",ok:"Marta",no:["La Marta","El Marta"],per:{"La Marta":"En catalán decimos «la Marta», pero en castellano los nombres de persona no llevan artículo.","El Marta":"Ni artículo ni masculino: Marta."},pista:"En castellano los nombres de persona van solos.",ex:"Catalán: la Marta · Castellano: <b>Marta</b>."},
    {f:"En el estuche tengo tres ___.",ok:"lápices",no:["lápiz","lapis"],per:{"lápiz":"En catalán «llapis» no cambia, pero en castellano el plural de lápiz es lápices.","lapis":"En castellano es lápiz, y el plural, lápices."},pista:"Lápiz termina en -z: el plural cambia la z por c.",ex:"Catalán: els llapis · Castellano: <b>los lápices</b>."},
    {f:"Ayer ___ dos años mi hermana pequeña.",ok:"cumplió",no:["hizo","fue"],per:{"hizo":"En catalán «va fer anys», pero en castellano los años se cumplen.","fue":"Los años se cumplen: cumplió."},pista:"Los años no se hacen: se…",ex:"Catalán: fer anys · Castellano: <b>cumplir años</b>."},
    {f:"Compré pan, leche ___ huevos.",ok:"y",no:[", y","i"],per:{", y":"En castellano no va coma delante de la «y» final de una enumeración.","i":"En castellano la conjunción es «y», no «i»."},pista:"Sin coma y con «y» griega.",ex:"Castellano: pan, leche <b>y</b> huevos (sin coma)."},
    {f:"Hoy he ___ un examen de Lengua.",ok:"aprobado",no:["aprovado","aprobat"],per:{"aprovado":"En catalán es «aprovat», pero en castellano es con b: aprobado (de prueba).","aprobat":"Esa es la palabra catalana: en castellano, aprobado."},pista:"Viene de «prueba», con b.",ex:"Catalán: aprovat · Castellano: <b>aprobado</b>."},
    {f:"Se ha roto ___ nariz de la estatua.",ok:"la",no:["el","lo"],per:{"el":"En catalán es «el nas», pero en castellano nariz es femenino.","lo":"Nariz es femenino: la nariz."},pista:"En castellano es femenino.",ex:"Catalán: el nas · Castellano: <b>la nariz</b>."}
   ],
   final:"Si te suena raro, piensa: ¿así lo diría en catalán? Entonces, ¡cuidado!"},
  {id:"fr-escucha",grup:"✍️ Frases con huecos",tipus:"frases",ic:"🔊",titol:"Escucha y puntúa",sub:"¿ ¡ al principio y ? ! al final",col:"#e0f2fe",escoltaAbans:true,
   enunciat:"🔊 Escucha la frase y pon los signos que faltan",
   items:[
    {f:"___Qué hora es___",ok:["¿","?"],no:["¡","!"],per:{"¡":"No hay emoción: pregunta la hora.","!":"Es una pregunta: cierra con ?."},clau:"Qué",pista:"La voz sube al final: es una pregunta.",ex:"En castellano la pregunta se abre con <b>¿</b> y se cierra con <b>?</b>."},
    {f:"___Qué suerte hemos tenido___",ok:["¡","!"],no:["¿","?"],per:{"¿":"No pregunta nada: expresa alegría.","?":"Es una exclamación: cierra con !."},pista:"Empieza como una pregunta, pero escucha la emoción.",ex:"La exclamación se abre con <b>¡</b> y se cierra con <b>!</b>."},
    {f:"___Vienes a la fiesta___",ok:["¿","?"],no:["¡","!"],per:{"¡":"Espera una respuesta (sí o no): es pregunta.","!":"Es una pregunta: cierra con ?."},pista:"¿Espera que le contesten sí o no?",ex:"Pregunta de sí o no: <b>¿…?</b>"},
    {f:"___Qué bien que has venido___",ok:["¡","!"],no:["¿","?"],per:{"¿":"No pregunta: expresa alegría.","?":"Es una exclamación: cierra con !."},pista:"¿Pregunta o alegría?",ex:"Expresa alegría: <b>¡…!</b>"},
    {f:"___Dónde has dejado las llaves___",ok:["¿","?"],no:["¡","!"],per:{"¡":"No es una emoción: busca las llaves.","!":"Es una pregunta: cierra con ?."},clau:"Dónde",pista:"Empieza con una palabra de pregunta.",ex:"«Dónde» pregunta por un lugar: <b>¿…?</b>"},
    {f:"___Cuidado, que te caes___",ok:["¡","!"],no:["¿","?"],per:{"¿":"No pregunta: avisa de un peligro.","?":"Es un aviso fuerte: cierra con !."},pista:"Es un aviso urgente.",ex:"Un aviso fuerte: <b>¡…!</b>"},
    {f:"Mañana lloverá todo el día___",ok:".",no:["?","!"],per:{"?":"No pregunta: informa.","!":"Lo dice con un tono normal, sin emoción."},pista:"¿El tono es normal, sube o grita?",ex:"Informa con tono normal: <b>.</b> (sin signos de apertura)."},
    {f:"Pero ___de dónde vienes___",ok:["¿","?"],no:["¡","!"],per:{"¡":"Es una pregunta: ¿de dónde…?","!":"Es una pregunta: cierra con ?."},clau:"dónde",pista:"La pregunta empieza después de «pero».",ex:"El signo de apertura va donde empieza la pregunta: Pero <b>¿</b>de dónde vienes<b>?</b>"},
    {f:"Si llegas tarde___",ok:"…",no:["?","."],per:{"?":"No pregunta nada.",".":"La oración no se acaba: queda a medias."},pista:"¿La frase se acaba o se queda colgada?",ex:"La oración queda a medias: <b>…</b>"},
    {f:"___Cuántos goles has marcado___",ok:["¿","?"],no:["¡","!"],per:{"¡":"Quiere saber un número: es pregunta.","!":"Es una pregunta: cierra con ?."},clau:"Cuántos",pista:"Quiere saber un número.",ex:"«Cuántos» pregunta una cantidad: <b>¿…?</b>"}
   ],
   final:"En castellano los signos van en pareja: ¿…? y ¡…!. El de apertura va donde empieza la pregunta o la exclamación."},
  {id:"fr-puntua",grup:"✍️ Frases con huecos",tipus:"frases",ic:"📝",titol:"Puntúa el texto",sub:"Cartas y textos con comas, ; y :",col:"#dcfce7",n:6,
   enunciat:"📝 Pon todos los signos que faltan en el texto",
   items:[
    {f:"Querida Ana___<br>Te escribo desde la playa___ hace un sol increíble___",ok:[":",";","."],no:[",","?"],per:{",":"Tras el saludo van dos puntos; la coma es un anglicismo."},pista:"Saludo, dos oraciones relacionadas y final.",ex:"Saludo con <b>:</b>, punto y coma entre dos oraciones relacionadas y punto final."},
    {f:"Por favor___ Eduardo___ acércame la sal___",ok:[",",",","."],no:[";",":"],clau:"Eduardo",pista:"Eduardo es la persona a quien hablamos.",ex:"El vocativo (<b>Eduardo</b>) va entre comas."},
    {f:"Mi abuelo___ cansado del viaje___ se fue a dormir___",ok:[",",",","."],no:[";",":"],pista:"«Cansado del viaje» es una aclaración.",ex:"La aclaración va entre dos comas; nunca coma entre sujeto y verbo."},
    {f:"En la mochila llevo tres cosas___ un libro___ una manzana y una botella___",ok:[":",",","."],no:[";","?"],per:{";":"Para presentar una lista, dos puntos."},pista:"Primero se anuncia una lista.",ex:"Dos puntos antes de la lista, coma entre elementos y sin coma delante de «y»."},
    {f:"Mi hermano llegará el lunes___ yo___ el martes___",ok:[";",",","."],no:[":","?"],pista:"La segunda coma sustituye al verbo «llegaré».",ex:"Punto y coma entre las dos oraciones y coma en lugar del verbo que se repite."},
    {f:"A pesar de la lluvia___ salimos a correr___ sin embargo___ volvimos empapados___",ok:[",",";",",","."],no:[":","?"],clau:"sin embargo",pista:"Una circunstancia al principio y un conector en medio.",ex:"Coma tras la circunstancia inicial, punto y coma antes de «sin embargo» y coma detrás."},
    {f:"___Has terminado los deberes___ Si no___ no saldrás a jugar___",ok:["¿","?",",","."],no:["¡","!"],pista:"Empieza con una pregunta.",ex:"Pregunta con <b>¿…?</b>, coma tras «Si no» y punto final."},
    {f:"Un abrazo muy fuerte___<br>Laura",ok:",",no:[":",";"],per:{":":"En la despedida de una carta va coma, no dos puntos.",";":"En la despedida de una carta va coma."},pista:"Es la despedida de la carta.",ex:"La despedida de una carta lleva coma: «Un abrazo muy fuerte, Laura»."}
   ],
   final:"Lee el texto en voz alta: donde haces una pausa corta va coma; si es mayor, punto y coma; y para anunciar algo, dos puntos."},
  {id:"fr-fragmentos",grup:"✍️ Frases con huecos",tipus:"frases",ic:"📜",titol:"¿Qué género es este texto?",sub:"Fragmentos para leer y escuchar",col:"#ede9fe",escoltaAbans:true,
   enunciat:"📜 Lee (o escucha) el fragmento y di de qué género es",
   items:[
    {f:"«Verde que te quiero verde,<br>las hojas del árbol duermen,<br>y en el silencio del bosque<br>la luna se mira y crece.»<br>👉 Es poesía ___.",escolta:"Verde que te quiero verde, las hojas del árbol duermen, y en el silencio del bosque la luna se mira y crece.",ok:"lírica",no:["épica","dramática"],per:{"épica":"No cuenta las hazañas de un héroe: expresa emociones.","dramática":"No hay personajes que dialoguen."},pista:"Versos cortos que expresan sentimientos.",ex:"Versos + sentimientos del autor = <b>lírica</b>."},
    {f:"«JUAN (asustado): ¿Quién anda ahí?<br>MARÍA (desde la puerta): Soy yo. Abre.»<br>👉 Es ___.",escolta:"Juan, asustado: ¿Quién anda ahí? María, desde la puerta: Soy yo. Abre.",ok:"teatro",no:["novela","poesía"],per:{"novela":"No hay narrador: los personajes hablan directamente.","poesía":"No está en verso: es un diálogo."},pista:"Mira los nombres en mayúscula y lo que va entre paréntesis.",ex:"Personajes + diálogo + <b>acotaciones</b> entre paréntesis = <b>teatro</b>."},
    {f:"«Una zorra vio unas uvas muy altas. Saltó y saltó, pero no las alcanzó. —Total, están verdes —dijo, y se fue.»<br>👉 Es una ___.",escolta:"Una zorra vio unas uvas muy altas. Saltó y saltó, pero no las alcanzó. Total, están verdes, dijo, y se fue.",ok:"fábula",no:["leyenda","noticia"],per:{"leyenda":"La leyenda parte de algo real con elementos mágicos; aquí hablan animales.","noticia":"La noticia cuenta un hecho real y actual."},clau:"zorra",pista:"¿Quién protagoniza la historia? ¿Deja una enseñanza?",ex:"Animales que actúan como personas + una enseñanza = <b>fábula</b>."},
    {f:"«Zeus, enfadado con los hombres, lanzó un rayo desde el Olimpo, y así nacieron las tormentas.»<br>👉 Es un ___.",escolta:"Zeus, enfadado con los hombres, lanzó un rayo desde el Olimpo, y así nacieron las tormentas.",ok:"mito",no:["cuento","ensayo"],per:{"cuento":"Aquí hay un dios que explica por qué pasa algo de la naturaleza.","ensayo":"El ensayo da opiniones, no cuenta historias de dioses."},clau:"Zeus",pista:"Hay un dios que explica algo de la naturaleza.",ex:"Dioses + explicación del mundo = <b>mito</b>."},
    {f:"«Cuentan que en el castillo de Montjuïc, las noches de luna llena, todavía se oyen los pasos de un caballero que murió allí.»<br>👉 Es una ___.",escolta:"Cuentan que en el castillo de Montjuïc, las noches de luna llena, todavía se oyen los pasos de un caballero que murió allí.",ok:"leyenda",no:["fábula","noticia"],per:{"fábula":"No hay animales ni enseñanza.","noticia":"No es un hecho actual comprobado: es una historia mágica."},clau:"castillo de Montjuïc",pista:"Un lugar real con algo mágico.",ex:"Lugar real + elemento fantástico = <b>leyenda</b>."},
    {f:"«Érase una vez una niña que vivía en el bosque con su abuela. Un día, al ir a por agua, encontró una llave de oro…»<br>👉 Es un ___.",escolta:"Érase una vez una niña que vivía en el bosque con su abuela. Un día, encontró una llave de oro.",ok:"cuento",no:["mito","teatro"],per:{"mito":"No hay dioses ni explica nada del mundo.","teatro":"Hay un narrador que cuenta: no es un diálogo."},clau:"Érase una vez",pista:"¿Cómo empieza?",ex:"«Érase una vez» + relato breve con narrador = <b>cuento</b>."},
    {f:"«Al final de la obra, los dos enamorados se casan, todos bailan en la plaza y cae el telón entre aplausos.»<br>👉 Es una ___.",escolta:"Al final de la obra, los dos enamorados se casan, todos bailan en la plaza y cae el telón entre aplausos.",ok:"comedia",no:["tragedia","drama"],per:{"tragedia":"La tragedia acaba mal; aquí acaba en fiesta.","drama":"El drama tiene un conflicto real y doloroso; aquí todo acaba bien."},clau:"se casan",pista:"¿Cómo acaba?",ex:"Final feliz = <b>comedia</b>."},

  {id:"fr-quefalla",grup:"✍️ Frases con huecos",tipus:"frases",ic:"🧩",titol:"¿Qué falla en el texto?",sub:"Adecuación, coherencia o cohesión",col:"#fee2e2",
   enunciat:"🧩 ¿Qué propiedad le falta a cada texto?",
   items:[
    {f:"Un alumno escribe al director: «Ey, tío, ¿qué pasa? Mañana no vengo, ¿vale?» Le falta ___.",ok:"adecuación",no:["coherencia","cohesión"],per:{"coherencia":"Se entiende y tiene un tema: el problema es el tono.","cohesión":"Las partes están bien unidas: el problema es a quién habla."},clau:"director",pista:"¿Habla bien a quien va dirigido?",ex:"Al director no se le habla como a un amigo: falta <b>adecuación</b>."},
    {f:"«Me gusta el fútbol. Las ballenas son mamíferos. Mañana es martes.» Le falta ___.",ok:"coherencia",no:["adecuación","cohesión"],per:{"adecuación":"El tono es correcto; el problema es que no habla de un solo tema.","cohesión":"Antes de unir, cada frase habla de una cosa distinta: falta un tema."},pista:"¿Habla de un solo tema?",ex:"Cada frase habla de algo distinto: falta <b>coherencia</b>."},
    {f:"«Llovía. Salimos. Nos mojamos. No llevábamos paraguas.» Mejor: «Llovía y, como no llevábamos paraguas, nos mojamos.» Le faltaba ___.",ok:"cohesión",no:["adecuación","coherencia"],per:{"adecuación":"El tono es correcto.","coherencia":"El tema es el mismo; faltaban conectores que unieran las ideas."},pista:"¿Qué palabras se han añadido?",ex:"Faltaban conectores (<b>y, como</b>): falta de <b>cohesión</b>."},
    {f:"En una redacción para clase escribes «xq no m mola». Le falta ___.",ok:"adecuación",no:["coherencia","cohesión"],per:{"coherencia":"Se entiende el tema; el problema es el registro.","cohesión":"El problema es escribir como en un chat."},pista:"¿Es el registro adecuado para clase?",ex:"En clase no se escribe como en un chat: falta <b>adecuación</b>."},
    {f:"«Primero, cocemos la pasta. Para terminar, compramos los ingredientes.» Le falta ___.",ok:"coherencia",no:["adecuación","cohesión"],per:{"adecuación":"El tono es correcto.","cohesión":"Hay conectores; el problema es el orden lógico."},clau:"Para terminar",pista:"¿Está en el orden lógico?",ex:"No se puede cocer antes de comprar: falta <b>coherencia</b> (orden lógico)."},
    {f:"«Juan tiene un perro. Juan pasea al perro. El perro de Juan es negro.» Le falta ___.",ok:"cohesión",no:["adecuación","coherencia"],per:{"adecuación":"El tono es correcto.","coherencia":"El tema es el mismo; el problema es repetir sin conectar."},pista:"¿Hay palabras que se repiten sin necesidad?",ex:"Mejor: «Juan tiene un perro negro y lo pasea». Falta <b>cohesión</b>."},
    {f:"Un científico explica la fotosíntesis a niños de 6 años con palabras muy técnicas. Le falta ___.",ok:"adecuación",no:["coherencia","cohesión"],per:{"coherencia":"Habla de un solo tema y en orden.","cohesión":"Las ideas están unidas; el problema es para quién habla."},clau:"niños de 6 años",pista:"¿Se adapta a quien le escucha?",ex:"No se adapta al público: falta <b>adecuación</b>."},
    {f:"«Mi gato es negro. Sin embargo, tiene cuatro patas.» Le falta ___.",ok:"cohesión",no:["adecuación","coherencia"],per:{"adecuación":"El tono es correcto.","coherencia":"El tema es el mismo; el conector no tiene sentido."},clau:"Sin embargo",pista:"¿Sobra o falla algún conector?",ex:"«Sin embargo» contrasta, y aquí no hay contraste: conector mal usado, falta <b>cohesión</b>."}
   ],
   final:"A-Co-Co: Adecuación (¿a quién le hablo?), Coherencia (¿de qué y en qué orden?), Cohesión (¿con qué lo uno?)."},
